name: SWH Ingest Verify

on:
  push:
  workflow_dispatch:
    inputs:
      trigger_save:
        description: "Fire best-effort Save-code-now POSTs before verifying"
        required: false
        default: "false"

permissions:
  contents: read

env:
  AI_SUITE_ORIGIN: https://github.com/baneeishaque/ai-suite
  AI_AGENT_RULES_ORIGIN: https://github.com/baneeishaque/ai-agent-rules
  VERIFY_SCRIPT: .agents/skills/software-heritage/ingest-verify/scripts/verify-ingest.py
  RESOLVE_SCRIPT: .agents/skills/software-heritage/ingest-verify/scripts/resolve-heads.bash
  RUN_VERIFY_SCRIPT: .agents/skills/software-heritage/ingest-verify/scripts/run-swh-verify.bash

jobs:
  verify-swh-ingest:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Resolve Expected Revisions
        id: heads
        run: bash "$RESOLVE_SCRIPT" ai-agent-rules

      - name: Verify SWH Ingest
        env:
          AI_SUITE_HEAD: ${{ steps.heads.outputs.AI_SUITE_HEAD }}
          AI_AGENT_RULES_HEAD: ${{ steps.heads.outputs.AI_AGENT_RULES_HEAD }}
          TRIGGER_SAVE: ${{ inputs.trigger_save }}
        run: bash "$RUN_VERIFY_SCRIPT"