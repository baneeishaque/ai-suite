    response: |-
      Two files created in `.vscode/`:

      **`.vscode/c_cpp_properties.json`** — tells VS Code IntelliSense to use GCC 16's compiler and include paths (so red squigglies match what GCC actually sees, not Clang).

      **`.vscode/tasks.json`** — registers a build task (`Cmd+Shift+B`) that runs:

      ```
      /opt/homebrew/bin/gcc-16 -O2 -lm -o diststego main.c
      ```

      To build manually in the terminal instead:

      ```
      /opt/homebrew/bin/gcc-16 -O2 -lm -o diststego main.c
      ```

      The important difference from Apple Clang: GCC needs `-lm` explicitly for `math.h` functions (Clang links `libm` automatically on macOS). Already covered in the tasks.json and the compile command.
