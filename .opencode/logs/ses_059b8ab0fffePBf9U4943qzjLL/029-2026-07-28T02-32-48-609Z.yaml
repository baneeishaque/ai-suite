      Sure. The `embed` equal-split vs `fill` per-carrier:

      **`embed`** (existing):  
      `fsize / N` bytes per carrier, regardless of carrier size. If carrier is too small → error. If carrier is huge → unused capacity wasted.

      **`fill`** (new):  
      Each carrier is filled to its pixel capacity (`w × h × 3 - header_overhead`) before moving to the next.  

      ```
      payload = read(file-to-embed)
      imgs = sort(list-pngs(carriers_folder))

      offset = 0
      for img in imgs:
          capacity = img.width * img.height * 3 - (16 + len(basename))
          chunk = min(capacity, remaining(payload, offset))
          embed(payload[offset..offset+chunk]) into img
          write stego PNG
          offset += chunk
          if offset >= len(payload): done

      if offset < len(payload): error("ran out of carriers")
      ```

