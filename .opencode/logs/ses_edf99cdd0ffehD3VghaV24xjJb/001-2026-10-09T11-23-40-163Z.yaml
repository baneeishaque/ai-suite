      ## Analysis: `#65.txt` — Build #65 `FAILURE`

      **Job:** `Compile_Test_2026.3/ecl_ice_dcg-2026.3-Compile-Test`, `release/2026.3.0`, agent `Exec1611_RNG-ZENG15W081_11_231`, JDK `21.0.7`, Tycho `4.0.5`.

      **Verdict: infra/config failure, not a test assertion. No test ran.**

      ### Root cause

      All 8 test modules fail identically at JVM launch:

      * `extracted/#65.txt:10159`: `Unrecognized VM option 'PermSize=256m'`
      * `extracted/#65.txt:10160-10161`:
        `Error: Could not create the Java Virtual Machine.`
        `Error: A fatal exception has occurred. Program will exit.`

      Forked command (`extracted/#65.txt:10158` and repeats at 10274,10398,10513,10628,10744,10860,10980):

      ```text
      java.exe ... -Xms512m -Xmx2048m -XX:PermSize=256m -XX:MaxPermSize=512m ...
      ```

      `-XX:PermSize / -XX:MaxPermSize` are Java 7 PermGen flags, removed in Java 8. Fatal on JDK 21. Exit code 1 → Tycho:

      > `An unexpected error occurred while launching the test runtime (process returned error code 1)`

      → `extracted/#65.txt:11026`: `BUILD FAILURE` after `Total time: 23:28 min`, `script returned exit code 1`, `Finished: FAILURE`.

      **Affected:** `swbinterface.tests`, `engine.tests`, `lvm.validation.constraints.test`, `mcop.core.tests`, `mcop.tc.test`, `mcop.cgg.tests`, `core.lvm.tests`, `condc.core.test`. Compile of ~29 prior modules succeeded.

      **Non-issues (ignore):** `Toolbase: not a registered Client user` (:130), `Failed to get git executable`, `surefire.timeout unknown parameter`, p2 `Unable to satisfy dependency` warnings.

      ### Fix plan

      1. **Find source:** in `ecl_ice_dcg.git` (and check `product_build.git` / `int_pipeline.git`):
         `grep -rn "PermSize\|MaxPermSize\|argLine" --include=pom.xml`
         Expected: parent/root `pom.xml` `<tycho-surefire-plugin><configuration><argLine>` with `-Xms512m -Xmx2048m -XX:PermSize=256m -XX:MaxPermSize=512m`.
      2. **Edit (config only, no product code):**
         * Minimal: delete both `-XX:PermSize=256m -XX:MaxPermSize=512m`, keep `-Xms512m -Xmx2048m`.
         * If Metaspace tuning wanted: replace with `-XX:MetaspaceSize=256m -XX:MaxMetaspaceSize=512m`.
         * Preserve JaCoCo `prepare-agent` + surefire `argLine` composition (`late-replacement` / `@{argLine}` pattern) so agent isn't dropped.
      3. **Reproduce/verify locally on JDK 21.0.7:**
         * `java -XX:PermSize=256m -version` → must fail (repro).
         * `java -Xms512m -Xmx2048m -version` → must pass.
         * `mvn -rf :com.bosch.dgs.ice.swbinterface.tests verify` or full build with `-e`.
      4. **Harden:** repo-wide grep for `PermSize` in pipelines/scripts/Dockerfiles; add CI lint rejecting it; remove dead `surefire.timeout` param if trivial.

      No local fix applied — source `pom.xml` is not in `/Users/dk/lab-data/distributed-steganography-c` (that dir only stores the log).
