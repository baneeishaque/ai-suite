    response: |
      On Windows use `findstr` / PowerShell — in the `ecl_ice_dcg` checkout root:

      cmd:
      ```bat
      findstr /S /N /I /C:"PermSize" pom.xml
      findstr /S /N /I /C:"MaxPermSize" *.xml
      findstr /S /N /I /C:"argLine" pom.xml
      ```

      PowerShell:
      ```powershell
      Get-ChildItem -Recurse -Filter pom.xml | Select-String -Pattern "PermSize|MaxPermSize|argLine"
      ```

      Fix the hit in `<tycho-surefire-plugin><configuration><argLine>` — delete `-XX:PermSize=256m -XX:MaxPermSize=512m`, keep `-Xms512m -Xmx2048m`.
