      # AI Scan for pull requests — complete breakdown

      This page documents **GitHub's "AI Scan"** feature (the URL slug is `ai-powered-security-detections`): an AI-based scanning engine that finds security vulnerabilities in **pull requests**, intended to *complement* CodeQL rather than replace it. It is in **public preview** and subject to change.

      ## 1. Core concept

      - CodeQL is a **high-precision static analysis** engine, but only supports a specific set of languages/queries.
      - Many repos use languages/frameworks CodeQL doesn't cover. AI Scan extends code-scanning coverage into those gaps **without new tools or configuration**.
      - The AI engine analyzes PR code directly; findings are **advisory** — they never block merges and do **not** appear as backlog alerts in the repo's security view (unlike CodeQL alerts, which do).

      ## 2. Licensing and billing

      - Requires **both** a GitHub Advanced Security (GHAS) license **and** a GitHub Copilot license (during public preview).
      - Usage **consumes AI credits**, billed under usage-based billing for organizations/enterprises.

      ## 3. Trigger conditions — when a scan runs

      AI Scan runs automatically only when **all** of these hold:

      1. Code scanning is enabled for the repository.
      2. The repository's **effective AI Scan setting** is enabled.
      3. An **eligible** pull request contains **qualifying changes** in a **supported language/framework not covered by CodeQL**.

      Trigger points: on **PR creation** and after **each new commit** — same cadence as CodeQL. These same conditions determine when *usage/billing begins*.

      ## 4. Independence from CodeQL

      - Does **not** require CodeQL default setup and does **not** depend on CodeQL's analysis state.
      - If CodeQL fails or is queued/waiting, AI Scan still runs.
      - Results post **as they are found**, so ordering vs. CodeQL results is nondeterministic (AI findings may appear before or after CodeQL's).

      ## 5. Analysis mechanics

      - Works directly on PR code — **no build system required** (a key contrast with compiled-language static analysis).
      - Uses tools like **code search** to gather extra repository context when deciding whether to flag an issue.
      - Uses **its own specialized prompts**; it deliberately ignores custom instruction files such as `/.github/copilot-instructions.md` or `/CLAUDE.md`.

      ## 6. How findings appear

      - Shown alongside CodeQL alerts on the PR's **Conversation** and **Files changed** tabs.
      - Each finding carries an **"AI" indicator** to distinguish it from CodeQL alerts.
      - Content: a description of the issue + explanation of the risk; **most** (not all) include a suggested remediation.
      - Where remediation exists, **Copilot Autofix** proposes the concrete code change (same behavior as for CodeQL alerts).
      - Each finding has a **thumbs up/down feedback** mechanism to improve detection quality over time.

      ## 7. Limitations

      - PR-only analysis — **no full-repository scans**.
      - Findings **cannot yet be used in rulesets** to enforce merge requirements.
      - Does **not run on PRs from forks** or PRs created by **Dependabot**.
      - Detection categories and supported languages may change as the feature evolves.
      - Like any AI tool, it can produce **false positives** (report via feedback).

      ## 8. Supported languages

      Targets gaps CodeQL doesn't cover, "including but not limited to":

      - **PHP**
      - **Shell/Bash**
      - **Terraform configuration (HCL)**
      - **Dockerfiles**
      - Framework gaps such as **JSP for Java** and **Blazor for C#**

      (Full CodeQL-supported list lives in the "Code scanning with CodeQL" docs.)

      ## 9. Detection categories

      | Category | What it covers |
      |---|---|
      | **String injection** | Unsafe string-built SQL, HTML, shell, JSON, YAML — missing/incorrect escaping or sanitization |
      | **Weak cryptography** | Weak algorithms, small keys, insecure randomness, missing encryption, weak password hashing |
      | **Broken access control** | Path traversal, CSRF gaps, user-driven open redirects |
      | **Sensitive data exposure** | Secrets, tokens, passwords, stack traces stored/logged/sent without adequate protection |
      | **Security misconfiguration** | Risky defaults/settings, e.g. disabling security controls, enabling debug features |
      | **Authentication failures** | Missing TLS or validation, insecure auth flows, missing rate limiting |
      | **Data integrity failures** | Unsafe deserialization, HTTP for sensitive actions, prototype pollution, executing untrusted content |
      | **Server-side request forgery (SSRF)** | Server fetches attacker-controlled URLs, hosts, or protocols |
      | **Supply chain risks** | Unpinned third-party actions/packages/images, downloads without integrity checks |

      ## 10. Enabling — three-level hierarchy

      Default state: **not allowed at enterprise level**, and **disabled** at org and repo levels. Flow:

      1. **Enterprise**: the **AI Scan** policy under "Code Security" must first *allow* organizations to enable it.
      2. **Organization**: the **AI Scan** setting under "Code scanning" enables it for eligible repos in the org **where code scanning is enabled**. Applies broadly to eligible repos.
      3. **Repository**:
         - Org-owned repo: an **"AI Scan for pull requests"** toggle lets repo admins **opt out**.
         - Eligible **public repo owned by a personal account**: the toggle **enables/disables** AI Scan directly.

      No model selection is needed. The org/repo `ai-scan` setting is manageable via the **REST API** (code scanning endpoints).

      ## 11. Mental model / practical implications

      - Treat it as a **PR-time, best-effort, advisory layer** that widens language coverage where CodeQL can't go — not a gate and not a backlog alert source.
      - You get coverage "for free" once enabled (if licensed), but it's **metered by AI credits**.
      - Expect **noise** (false positives) and **no enforcement capability** yet; the feedback button is the tuning loop.
      - Security-relevant blind spots remain: **fork PRs, Dependabot PRs, and whole-repo scans**.
