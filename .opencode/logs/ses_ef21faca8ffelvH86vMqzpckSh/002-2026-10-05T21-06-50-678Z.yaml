    response: |-
      ## GHAS in plain terms

      **GitHub Advanced Security (GHAS)** is GitHub's paid security add-on suite. It used to be one bundle; it's now sold as **two separate SKUs** (a legacy GHAS bundle still exists for volume/subscription customers):

      | Product | What it gives you |
      |---|---|
      | **GitHub Code Security** | Code scanning (CodeQL), CodeQL CLI, **Copilot Autofix**, **AI Scan**, security campaigns, Dependabot auto-triage rules, dependency review, security overview |
      | **GitHub Secret Protection** | Secret scanning, push protection, AI-detected secrets, custom patterns, delegated bypass/dismissal, security campaigns, security overview |

      Key licensing facts:

      - **Must be on GitHub Team or Enterprise plan** to buy either SKU.
      - **Free on all public repos**: code scanning, secret scanning, dependency review — no GHAS needed.
      - **Private/internal repos require the paid license** (and on GHE.com / GHES, everything is paid).
      - Billing is **per unique active committer** — anyone with a push to a repo with the feature enabled in the last 90 days; GitHub App bots don't count.
      - Two payment models: **metered** (pay for what you use, GHEC) or **volume/subscription** (prepaid licenses, Enterprise/GHES). Budgets can cap new enablement.
      - Note: AI Scan is a **Code Security** feature, so **Secret Protection alone won't unlock it**.

      ## What this means for you

      - **AI Scan requires BOTH a Code Security (GHAS) license AND a Copilot license.** With no Copilot license, you cannot use AI Scan today — full stop, regardless of GHAS.
      - If you have neither GHAS nor Copilot, you're looking at purchasing **two products**: Code Security + Copilot (Business/Enterprise for org-level features). Pricing is per committer/user/month — check <https://github.com/enterprise/advanced-security#pricing> for current numbers (commonly quoted around $30 Code Security / $19 Secret Protection / $49 legacy bundle, plus ~$19–39/user for Copilot Business/Enterprise — verify, these change).
      - Public repos on a personal account are the exception: CodeQL code scanning, secret scanning, and dependency review are **free**, and the AI Scan docs mention personal-account public repos being eligible — but the Copilot license requirement still applies.

      ## Free things you can use right now

      - **Dependabot alerts + security updates** — free on all repos, not part of GHAS.
      - **CodeQL code scanning** — free on public repos (needs Code Security for private).
      - **Secret scanning + push protection** — free on public repos (needs Secret Protection for private).
      - **Third-party scanners in CI** (Semgrep, Trivy, Snyk, etc.) — run them in Actions and fail the build; no license needed if you skip uploading SARIF to the Security tab.
      - **Free risk assessments** for Team/Enterprise orgs (secret leaks + up to 20 repos' code vulnerabilities).

      Bottom line: GHAS is the umbrella name; for AI Scan you specifically need **GitHub Code Security + Copilot**. Without Copilot, plan around CodeQL/Dependabot/third-party scanners instead.
