    response: |-
      **No.** BYOK doesn't change the licensing equation:

      1. **BYOK is a Copilot model-access feature, not a license.** Enterprise/org BYOK explicitly requires users to already have a **Copilot Business/Enterprise** subscription; local BYOK is client-side only and doesn't entitle you to any GitHub server-side feature.
      2. **AI Scan requires two licenses**: GitHub **Code Security** (GHAS) *and* a **Copilot** license. BYOK provides neither.
