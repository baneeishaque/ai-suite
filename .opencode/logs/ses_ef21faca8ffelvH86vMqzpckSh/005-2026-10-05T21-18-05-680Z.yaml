          ## Frequently Asked Questions

          -   ### Are Essentials and Team new plans?
              
              Essentials is the new name for Pro, and Team is the new name for Pro Plus. Existing subscriptions will automatically display the new plan name. No action is required.
              
          -   ### Will the plan renaming change my price?
              
              No. Essentials retains the current Pro price of $30 per developer per month, or $24 per developer per month when billed annually. Team retains the current Pro Plus price of $60 per developer per month, or $48 per developer per month when billed annually.
              
          -   ### What’s the difference between Essentials and Team?
              
              Essentials includes AI reviews for pull requests and the CLI, one-click fixes, learnings, coding-agent loops, built-in pre-merge checks, and limited Change Stack access. Team includes everything in Essentials, plus Triage, expanded Change Stack capabilities, custom pre-merge checks, finishing touches such as unit-test generation and merge-conflict resolution, post-merge actions, and higher limits for connections and multi-repository analysis.
              
          -   ### If reviews are unlimited, why are there hourly review limits?
              
              There is no total limit on the number of pull requests or repositories you can review. Each plan does include a per-developer hourly review allowance to manage bursts of activity. These allowances are subject to our [Fair Usage Policy](https://docs.coderabbit.ai/management/plans#fair-usage-limits-policy). Usage-based reviews can continue eligible reviews after the included allowance is reached.
              
