          233: pevers/*
          234: !pevers/*.zip
          235: ```
          236: 
          237: #### 1d — Analyze Change Dependencies
          238: 
          239: - **Shared Identifiers:** Group changes that modify the same functions,
          240:   classes, or constants across different files.
          241: - **Cross-File References:** If file A depends on a change in file B
          242:   (e.g., an import, a link, a `.gitignore` pattern), they MUST be in
          243:   the same atomic commit.
          244: - **Categorical Alignment:** Group changes by architectural layer (UI,
          245:   Logic, Docs) unless they are functionally coupled.
          246: 
          247: #### 1e — Workflow-First Priority
          248: 
          249: If changes involve CI/CD workflows (GitHub Actions, scripts), the agent
          250: **MUST** fix, test, and verify workflow functionality **BEFORE** arranging
          251: or executing commits. Pipeline stability takes precedence over
          252: documentation or stylistic refinements.
          253: 
          254: #### 1f — Present Complete Inventory
          255: 
          256: List **ALL changes** — staged, unstaged, AND untracked (not just
          257: violations or modifications to already-tracked files) — with their
          258: status. This gives the user full visibility and ensures no file is
          259: analyzed as an afterthought:
          260: 
          261: | # | File | Status | Action |
          262: |---|---|---|---|
          263: | 1 | `.gitignore` | Modified | 🔄 Update |
          264: | 2 | `src/main.java` | Modified | 🔄 Stage |
          265: | 3 | `README.md` | Untracked | ❓ Confirm with user |
          266: 
          267: ---
          268: 
          269: ### 1g — Redaction Pre-Check (Sensitive Content Audit)
          270: 
          271: Before any staging or logical grouping, audit all **new/untracked** and
          272: **modified** files for content that must be redacted per the
          273: [redaction-portability](../redaction-portability/SKILL.md) skill — especially
          274: prose-heavy files like skill `SKILL.md`, rule docs, and conversation logs.
          275: 
          276: **Scan for:**
          277: 
          278: 1. **Organization-specific Jira ticket IDs** (e.g., `PROJ-1234`) — replace with
          279:    `<TICKET-ID>` or `<TICKET-ID-PROJ>`.
          280: 2. **Internal repository URLs** (e.g., `github.com/<org>/<repo>`) — replace
          281:    `<org>/<repo>` with `<ORG>/<REPO>`.
          282: 3. **Cross-repo relative links** — `../` chains that escape the current repo's
          283:    root into a sibling directory (no `.gitmodules` registration). Run the
          284:    [detect-cross-repo-links.py](../redaction-portability/scripts/detect-cross-repo-links.py)
          285:    script from the redaction-portability skill.
          286: 4. **Literal organization names, internal codenames, hostnames, and usernames**
          287:    in prose — replace with canonical placeholders (`<corp>`, `<author>`, etc.).
          288: 5. **Project-specific skill names / paths** in base-published skills (e.g., a
          289:    composer row in a base skill referencing a project-specific skill in a
          290:    different repo).
          291: 
          292: **When to run this audit:**
          293: 
          294: - **Immediately after Step 1f** (Complete Inventory) — you have the full file
          295:   list, and no work has been wasted on grouping or staging content that will
          296:   need post-hoc redaction.
          297: - **Any time a new file is added** to the working tree mid-session (e.g.,
          298:   skill-factory generation, conversation export).
          299: 
          300: **Remediation workflow:**
          301: 
          302: 1. Read each flagged file, identify the violating strings.
          303: 2. Apply canonical placeholders per
          304:    [redaction-portability §2](../redaction-portability/SKILL.md#2-canonical-placeholder-vocabulary).
          305: 3. If the violation is a cross-repo link: either delete the link entirely or
          306:    replace with a name-only reference (see redaction-portability repair rules).
          307: 4. Re-run the audit to confirm zero remaining violations.
          308: 5. Only then proceed to Step 2 (Logical Grouping).
          309: 
          310: The redaction-portability skill **MUST** be cited as a dependency in any commit
          311: that touches skill or rule files, so downstream tooling knows to invoke the
          312: same audit.
          313: 
          314: ---
          315: 
          316: ### Step 2 — Logical Grouping (Arrangement)
          317: 
          318: Arrange detected changes into a proposed sequence of commits.
          319: 
          320: #### 2a — Independence Principle
          321: 
          322: Each commit must stand alone. If the repository were checked out at
          323: that commit, it should still build/function (or be logically coherent).
          324: 
          325: #### 2b — Atomic Principle
          326: 
          327: Never commit half of a logical change. If a file contains two unrelated
          328: changes, use **hunk-based staging** (Step 3).
          329: 
          330: #### 2c — Buildable State Priority
          331: 
          332: While atomicity is the goal, maintaining a buildable repository takes
          333: precedence. If a core infrastructure change (e.g., a signature change in
          334: a shared helper) breaks all consumers, the refactor and the resulting
          335: fixes in consumer files MUST be consolidated into a single commit.
          336: 
          337: #### 2d — The Commit Preview (Mandatory Verbose Display)
          338: 
          339: Present the proposed "Arranged Commits" using a structured format with
          340: **maximum detail**. For files with mixed concerns requiring hunk-based
          341: staging, the preview **MUST** include the specific git hunks.
          342: 
          343: **Mandates for writing the preview:**
          344: 
          345: 1. **`@@` Header Verification** — Before writing any `@@ -N,M +N,M @@` line,
          346:    run `git diff --unified=3 -- <file>` and copy the exact range header from
          347:    the actual output. Never estimate or compute from memory — wrong headers
          348:    make the preview useless for verification.
          349: 
          350: 2. **Fence Collision Handling** — When a diff hunk contains lines that are
          351:    themselves triple-backtick fenced code blocks (` ```text`, ` ```bash`,
          352:    and their closing ` ``` `), wrap the diff in **`~~~diff`** / **`~~~`**
          353:    instead of ` ```diff ` / ` ``` `. Backtick fences inside a backtick-fenced
          354:    block terminate the outer block prematurely, breaking the markdown preview.
          355:    The tilde fence (`~~~`) is only closed by another `~~~`, so inner backtick
          356:    blocks survive as literal content.
          357: 
          358: 3. **No Content Truncation** — All hunks MUST be shown in full. Lines of
          359:    context MUST NOT be replaced with `...` or any other truncation marker.
          360:    If the combined diff is too large for one conversation message, split the
          361:    preview across batches ($2g) and present one batch at a time.
          362: 
          363: 4. **Preview Artifact** — Write the full preview to
          364:    `scratch/commit-preview.md` (use
          365:    [`repo-scratch-output-capture`](../repo-scratch-output-capture/SKILL.md)
          366:    to ensure `scratch/` exists and is gitignored). The user can then refer to
          367:    specific line numbers when giving feedback. Present the summary in the
          368:    conversation as well.
          369: 
          370: Template:
          371: 
          372: ````markdown
          373: ## Arranged Commits Preview
          374: 
          375: ### Commit 1: [type](scope): [title]
          376: - **Files**: [file1.md], [file2.md]
          377: - **Message**:
          378:   ```
          379:   [type](scope): [title]
          380: 
          381:   [Body line 1]
          382:   [Body line 2]
          383:   ```
          384: - **Hunks/Preview**:
          385:   ```diff
          386:   [Show actual hunks for this commit — use ~~~diff/~~~ if hunks contain ```
          387:   ]
          388:   ```
          389: 
          390: ### Commit 2: [type](scope): [title]
          391: - **Files**: [file3.md]
          392: - **Message**:
          393:   ```
          394:   [type](scope): [title]
          395: 
          396:   [Body line 1]
          397:   ```
          398: ---
          399: Please say "start" to begin the sequential execution of these atomic
          400: commits.
          401: ````
          402: 
          403: #### 2d.1 — Iterative Preview Fixup
          404: 
          405: After presenting the commit preview, the user may give feedback by line
          406: number (e.g., "check line 98 — still broken"). Feedbacks typically
          407: point to one of these issues in the preview:
          408: 
          409: - Wrong `@@` header (fix by verifying against actual `git diff`)
          410: - Truncated content with `...` (restore full hunk)
          411: - Nested fenced code blocks breaking markdown (switch to `~~~diff`/`~~~`)
          412: - Missing context lines around changes (include the default 3-line context)
          413: 
          414: Fix, re-write the preview to `scratch/commit-preview.md`, and re-present.
          415: Loop until the user confirms the preview is correct. Do NOT begin execution
          416: until the user says "start".
          417: 
          418: #### 2d.2 — Post-Execution Preview Verification
          419: 
          420: After all arranged commits have been executed (or when resuming a session
          421: that may have previously generated a commit preview), verify completion
          422: by checking the preview against `git log`.
          423: 
          424: **Automated verification (preferred):**
          425: 
          426: Delegate to the
          427: [`git-commit-preview-verify`](../git/basic/edit/git-commit-preview-verify/SKILL.md)
          428: base skill:
          429: 
          430: ```bash
          431: python3 .agents/skills/git/basic/edit/git-commit-preview-verify/scripts/verify-commit-preview.py \
          432:     --preview scratch/commit-preview.md \
          433:     --format text
          434: ```
          435: 
          436: This parses the preview's `Commit N:` sections (any heading level),
          437: cross-references each commit title against `git log --oneline`, and
          438: reports done/pending status. Use `--format json` for machine-readable
          439: output.
          440: 
          441: **Manual verification (fallback):**
          442: 
          443: 1. Read `scratch/commit-preview.md` and extract each `Commit N:` title
          444: 2. Run `git log --oneline -20` and check for matching titles
          445: 3. Report which commits are done and which are pending
          446: 
          447: **Cleanup:**
          448: 
          449: Once all commits are verified as executed, delete the preview file:
          450: 
          451: ```bash
          452: # Automated (with verification gate)
          453: python3 .agents/skills/git/basic/edit/git-commit-preview-verify/scripts/verify-commit-preview.py \
          454:     --preview scratch/commit-preview.md \
          455:     --cleanup
          456: 
          457: # Manual
          458: trash scratch/commit-preview.md
          459: ```
          460: 
          461: The preview file MUST NOT be deleted until all commits are confirmed
          462: executed. If any commits are pending, the preview must be retained for
          463: the next session.
          464: 
          465: #### 2e — Commit Authorization
          466: 
          467: The agent **MUST NOT** proceed with any commit execution until the user
          468: explicitly says **"start"**. Other triggers like "commit" or "go" are
          469: insufficient.
          470: 
          471: #### 2f — Interleaving Mandate (Artifact + Registry Registration)
          472: 
          473: Whenever a commit introduces or renames an artifact **and** a shared index /
          474: registry file (e.g., `AGENTS-legacy.md` skills table, `.gitmodules`, CI
          475: workflow manifests) needs a corresponding row or entry for that artifact, the
          476: registry hunk MUST be **staged in the same commit** as the artifact itself —
          477: never batched into a separate "registration" commit at the end. This applies to:
          478: 
          479: - **New skills**: `AGENTS-legacy.md` row for the skill → same commit as the skill
          480:   `SKILL.md` / `scripts/` files.
          481: - **Submodule syncs**: `.gitmodules` URL change and any `AGENTS-legacy.md` row
          482:   referencing the submodule → same commit as the submodule pointer advance.
          483: - **Any artifact with a shared index entry**: treat the index row as part of the
          484:   artifact's definition, not as metadata to collect last.
          485: 
          486: When the registry file contains mixed hunks (some for this artifact, some
          487: unrelated): use `git add -p <registry>` to stage only the relevant hunk(s)
          488: alongside the artifact files; leave unrelated hunks unstaged for their own commits.
          489: 
          490: **When `git add -p` hunk boundaries don't align with row boundaries** (e.g.,
          491: two session rows land in the same hunk as an out-of-scope row), use the
          492: [`agents-md-stage-row.py`](../git-hunk-staging-primitives/scripts/agents-md-stage-row.py) script instead:
          493: 
          494: ```bash
          495: # Dry-run: preview alphabetical position
          496: python3 .agents/skills/git-hunk-staging-primitives/scripts/agents-md-stage-row.py \
          497:     --row "| My Skill | [path](path) | description |" \
          498:     --dry-run
          499: 
          500: # Stage exactly one row (default --mode staged: reads HEAD:AGENTS.md,
          501: # inserts row, updates index; working tree is NOT touched)
          502: python3 .agents/skills/git-hunk-staging-primitives/scripts/agents-md-stage-row.py \
          503:     --row "| My Skill | [path](path) | description |"
          504: ```
          505: 
          506: In default `--mode staged`, the script reads `HEAD:AGENTS.md` (not the working
          507: tree), inserts the row at the alphabetically correct position, writes a new
          508: blob via `git hash-object -w`, and updates the index via
          509: `git update-index --cacheinfo` — so only the new row is staged while all other
          510: working-tree changes remain unstaged.
          511: 
          512: The script also supports `--mode worktree` for the skill-factory registration
          513: case (AGENTS.md is clean and you just want the row written to the working tree
          514: for ordinary `git status` review and `git add`). See
          515: [`skill-factory/SKILL.md` §2.4](../skill-factory/SKILL.md) for the registration
          516: workflow.
          517: 
          518: Forbidden anti-pattern: "commit all artifacts first, then one final commit
          519: registers them all in AGENTS-legacy.md" — this makes individual commits incomplete
          520: (skill exists but is not discoverable) and destroys per-feature traceability.
          521: 
          522: See [Atomic Commit Construction Rules §3.1](../../../ai-agent-rules/git-atomic-commit-construction-rules.md#31-interleaving-mandate-artifact--registry-registration).
          523: 
          524: #### 2f.1 — Deferred Cross-Reference Hunk Pattern
          525: 
          526: When two new artifacts (X and Y) ship in **separate commits B and C**, and one or
          527: both files already contain a "Related Skills" / index row referencing the OTHER
          528: artifact in the working tree, the cross-reference row must be deferred to whichever
          529: commit lands the artifact it points to. Concretely: commit B (introduces X) MUST
          530: NOT carry a row that references Y — Y does not yet exist in the tree, and the row
          531: would dangle until commit C lands.
          532: 
          533: Three viable techniques, in order of preference:
          534: 
          535: 1. **`stage-file-excluding-lines.py`** (preferred — no working-tree mutation): write
          536:    a blob equal to the working tree minus the deferred row(s), stage it directly
          537:    via `git update-index --cacheinfo`, leave the working tree untouched. The
          538:    deferred rows are picked up cleanly by `git add <file>` for commit C.
          539: 
          540:    ```bash
          541:    python3 .agents/skills/git-hunk-staging-primitives/scripts/stage-file-excluding-lines.py \
          542:        --file .agents/skills/X/SKILL.md \
          543:        --exclude "../Y/SKILL.md" \
          544:        --dry-run
          545: 
          546:    python3 .agents/skills/git-hunk-staging-primitives/scripts/stage-file-excluding-lines.py \
          547:        --file .agents/skills/X/SKILL.md \
          548:        --exclude "../Y/SKILL.md"
          549:    ```
          550: 
          551:    When the deferred row belongs to a larger block (section header + table +
          552:    trailing blank), append **`--blank-context 1`** to also strip the contiguous
          553:    blank line after each match so no orphaned section header remains in the
          554:    staged blob:
          555: 
          556:    ```bash
          557:    python3 .agents/skills/git-hunk-staging-primitives/scripts/stage-file-excluding-lines.py \
          558:        --file .agents/skills/cra-reset-mocks-test-strategy/SKILL.md \
          559:        --exclude "## Composition" \
          560:        --exclude "Composition Mechanism" \
          561:        --exclude "mrt-component-test-strategy" \
          562:        --exclude "--- | ---" \
          563:        --blank-context 1
          564:    ```
          565: 
          566: 2. **Temporary edit + restore** (when the script is unavailable): edit the file to
          567:    remove the deferred row, `git add` it, commit B, then re-insert the row in the
          568:    working tree for commit C. Higher risk of forgetting the restore step; use only
          569:    as a fallback.
          570: 
          571: 3. **`git add -p`** (when hunk boundaries align with row boundaries): split the
          572:    hunk interactively. Often fails because Markdown table rows pack multiple
          573:    logical entries into a single hunk; falls back to technique 1 or 2.
          574: 
          575: **Forbidden anti-pattern**: staging the deferred row in commit B "to keep the file
          576: self-consistent" — the row points to an artifact that does not yet exist at
          577: commit B, breaking checkout-at-B build/lint and destroying per-commit
          578: traceability.
          579: 
          580: #### 2g — Batch-by-Batch Authorization (Long Sequences)
          581: 
          582: When the Arranged Commits sequence exceeds **5 commits**, split the preview
          583: into batches of at most 5 commits and request a separate `"start"` per batch:
          584: 
          585: 1. Present each batch in the full §2d verbose format before executing any
          586:    commit in that batch.
          587: 2. After each batch executes, emit a one-line summary `Batch N committed:
          588:    SHA1, SHA2, …` and present the next batch's preview.
          589: 3. The user MAY abort, reorder, or modify subsequent batches between
          590:    authorizations — do NOT pre-stage files for batches that have not yet
          591:    been authorized.
          592: 4. The first batch MUST include a top-level **Master Plan Table**
          593:    (`# | type(scope): title | files | batch`) so the user has a single-pane
          594:    view before authorizing batch 1.
          595: 
          596: See [Atomic Commit Construction Rules §3.2](../../../ai-agent-rules/git-atomic-commit-construction-rules.md#32-batch-by-batch-authorization-long-sequences).
          597: 
          598: #### 2h — Pre-Execution Safety Stash (Mandatory for ≥ 2 Commits)
          599: 
          600: Before executing the first commit of any sequence of two or more commits
          601: (including any batch governed by §2g), capture an apply-not-pop safety
          602: snapshot of the full working-tree state (tracked modifications, staged
          603: hunks, AND untracked files) and re-apply it immediately so execution
          604: proceeds against an unchanged tree. The snapshot persists across the
          605: entire sequence and is verified-then-dropped only at end-of-session.
          606: 
          607: Delegate the full three-phase protocol (Snapshot → Hold → Verify-and-
          608: Release) to [`git-pre-execution-safety-stash`](../git-pre-execution-safety-stash/SKILL.md):
          609: 
          610: - **Phase 1 — Snapshot** before the first commit: classify any
          611:   pre-existing stashes via [`git-stash-triage`](../git-stash-triage/SKILL.md),
          612:   push with `git stash push -u -m "safety: ..."`, immediately
          613:   `git stash apply` (NEVER `pop`), verify parity.
          614:   > **If `git stash apply` fails** due to live editor conflicts (VS Code,
          615:   > Copilot, Eclipse, IntelliJ rewriting files between push and apply),
          616:   > do NOT retry — follow the [Selective File Extraction from Stash
          617:   > (Phase 1g)](../git-pre-execution-safety-stash/SKILL.md#1g--stash-apply-conflict-recovery-via-selective-file-extraction)
          618:   > recovery path in `git-pre-execution-safety-stash`.
          619: - **Phase 2 — Hold** across the sequence: never drop, pop, or clear the
          620:   `safety:` entry mid-sequence; re-verify presence at batch boundaries.
          621: - **Phase 3 — Verify-and-Release** after the final commit: `git stash
          622:   apply` again, confirm the apply is a clean no-op against HEAD, then
          623:   ask the user explicitly before `git stash drop` per
          624:   [`git-operation-rules.md` §5](../../../ai-agent-rules/git-operation-rules.md).
          625: 
          626: See [Atomic Commit Construction Rules §3.3](../../../ai-agent-rules/git-atomic-commit-construction-rules.md#33-pre-execution-safety-stash-mandatory-for-multi-commit-sequences).
          627: 
          628: ---
          629: 
          630: ### Step 3 — Interactive Hunk-Based Staging
          631: 
          632: When a file contains mixed concerns, use interactive staging to
          633: partition changes.
          634: 
          635: #### 3a — Command
          636: 
          637: ```powershell
          638: git add -p <file>
          639: ```
          640: 
          641: #### 3b — Hunk-by-Hunk Evaluation
          642: 
          643: During interactive staging, evaluate and respond to each hunk
          644: individually (`y`, `n`, `s`, etc.). Do NOT batch responses. Every
          645: modified line must be evaluated: "Does this line belong to the
          646: *current* atomic goal?"
          647: 
          648: #### 3c — Granular Hygiene
          649: 
          650: If a grammatical fix is discovered while implementing a feature, it
          651: MUST be staged and committed separately unless it is part of the same
          652: logical chunk.
          653: 
          654: #### 3d — Verification After Staging
          655: 
          656: After staging each chunk, verify strictly atomic contents:
          657: 
          658: ```powershell
          659: git diff --cached
          660: ```
          661: 
          662: #### 3e — Discard Rejected Noise
          663: 
          664: After accepting the desired hunks and rejecting noise, discard the
          665: rejected changes from the working tree if they are unintentional:
          666: 
          667: ```powershell
          668: git checkout -- <file>
          669: ```
          670: 
          671: #### 3f — Mixed-Concern Noise Handling Workflow
          672: 
          673: When a file contains both functional changes AND unrelated noise
          674: (invisible characters, spurious whitespace, trailing `\r` differences),
          675: follow this workflow:
          676: 
          677: 1. **Attempt to fix the noise in the editor** — remove the spurious
          678:    whitespace or extra blank lines directly. This may resolve it.
          679: 2. **Re-check the diff** — run `git diff <file>`. If the noise persists
          680:    (e.g., invisible character differences that the editor cannot show),
          681:    fall back to hunk-based staging.
          682: 3. **Stage only functional hunks** — run `git add -p <file>`, accepting
          683:    (`y`) only the hunks that belong to the current atomic goal and
          684:    rejecting (`n`) the noise hunks.
          685: 4. **Discard the remaining noise** — run `git checkout -- <file>` to
          686:    revert the rejected noise from the working tree. This preserves the
          687:    staged functional changes.
          688: 5. **Verify staged state is clean** — run `git diff --cached <file>` to
          689:    confirm only functional changes are staged, then run `git status` to
          690:    confirm no unstaged changes remain.
          691: 
          692: **PowerShell caveat:** Piping input to `git add -p` is unreliable in
          693: PowerShell (standard pipe methods like `echo`, `Write-Output`, and
          694: string joins often fail to register). Preferred workaround:
          695: 
          696: - Accept the functional hunks manually or in a sequence where piping
          697:   works, then use `git checkout -- <file>` to discard whatever noise
          698:   remains unstaged.
          699: 
          700: #### 3g — Post-Edit Indent Verification & Repair
          701: 
          702: Markdown edits can silently shift continuation-line indent on unrelated
          703: lines near the edit site (common when tools re-emit fenced blocks or
          704: when an edit operation touches adjacent lines). A `git diff` that shows
          705: the correct content at the wrong indent is incomplete — staging it
          706: propagates whitespace drift into the commit.
          707: 
          708: Delegate detection and repair to the
          709: [`list-indent-consistency`](../general/list-indent-consistency/SKILL.md)
          710: base skill.
          711: 
          712: **Acceptance criterion:** run `detect-list-indent-drift.py` on the affected
          713: file(s); the script MUST exit 0 before `git add` is run.
          714: 
          715: See also: Common Pitfalls — `Indent drift after markdown edit silently staged`.
          716: 
          717: #### 3h — IDE Artifact Bulk Discard
          718: 
          719: IDE tooling (VS Code Java Language Server, Eclipse, IntelliJ) often
          720: auto-modifies project metadata files across **many** sub-projects at
          721: once — for example, adding `<filteredResources>` blocks to every
          722: Eclipse `.project` file. These changes **may** be noise — but some
          723: projects intentionally track IDE metadata for reproducible workspace
          724: setup. The agent **MUST NOT** assume these are discardable.
          725: 
          726: **Detection pattern:**
          727: 
          728: - `git diff --stat` shows a large number of identical-looking changes
          729:   (e.g., 50+ `.project` files each with exactly +11 lines)
          730: - The diff content is the same boilerplate repeated per file
          731: - The change was not initiated by the developer
          732: 
          733: **Common IDE artifact files to watch for:**
          734: 
          735: | Pattern | Source |
          736: |---|---|
          737: | `**/.project` | Eclipse / VS Code Java Language Server |
          738: | `**/.classpath` | Eclipse JDT |
          739: | `**/.settings/**` | Eclipse workspace preferences |
          740: | `**/*.iml` | IntelliJ IDEA module files |
          741: | `**/.idea/**` | IntelliJ IDEA project files |
          742: 
          743: **Tracked vs Untracked Pre-Check (Critical):**
          744: 
          745: Before discarding anything, the agent **MUST** distinguish between
          746: **tracked** (version-controlled) and **untracked** (new/generated)
          747: files in the affected area. This is critical because directories
          748: like `.settings/` often contain a **mix** of tracked files (e.g.,
          749: `org.eclipse.jdt.core.prefs` committed by the team) and untracked
          750: files (e.g., `org.eclipse.m2e.core.prefs` auto-generated by the
          751: JDT Language Server).
          752: 
          753: ```powershell
          754: # List tracked files under .settings/
          755: git ls-files .settings/
          756: 
          757: # List untracked files under .settings/
          758: git ls-files --others --exclude-standard .settings/
          759: 
          760: # For modified tracked files, show what changed
          761: git diff --stat HEAD -- .settings/
          762: ```
          763: 
          764: **⚠️ Never bulk-delete a directory that contains tracked files.**
          765: Using `Remove-Item ".settings" -Recurse -Force` when the directory
          766: contains tracked files will cause those files to appear as deleted
          767: in `git status`, requiring immediate restoration via
          768: `git checkout -- <file>`. Instead, remove only the specific
          769: untracked files.
          770: 
          771: **JDT Language Server + m2e Auto-Injection:**
          772: 
          773: When the JDT Language Server detects a `pom.xml`, it automatically
          774: imports the project as Maven-managed and injects:
          775: 
          776: - `org.eclipse.m2e.core.maven2Builder` into `.project` `<buildSpec>`
          777: - `org.eclipse.m2e.core.maven2Nature` into `.project` `<natures>`
          778: - `.settings/org.eclipse.m2e.core.prefs` (untracked)
          779: - `.settings/org.eclipse.core.resources.prefs` (untracked)
          780: 
          781: These are **not** from the VS Code Maven extension
          782: (`vscjava.vscode-maven`) — that extension provides the UI only.
          783: The `.project` modifications come from the **Eclipse JDT Language
          784: Server** (`eclipse.jdt.ls`) which bundles **m2e** internally.
          785: 
          786: **Mandatory User Confirmation Workflow:**
          787: 
          788: The agent **MUST** present suspected noise to the user and obtain
          789: explicit confirmation before discarding. Never silently discard
          790: changes to IDE metadata files — the project may rely on them.
          791: 
          792: 1. **Present the suspected noise** — Show the user a categorized
          793:    summary separating modified tracked files from untracked files,
          794:    and include the proposed discard steps:
          795: 
          796:    ````markdown
          797:    ## Suspected IDE Artifact Noise
          798: 
          799:    ### Modified Tracked Files
          800:    | File | Change | Source |
          801:    |---|---|---|
          802:    | `.project` | +17 lines (Maven builder/nature + filteredResources) | JDT LS / m2e auto-import |
          803: 
          804:    ### Untracked Files (IDE-generated)
          805:    | File | Content | Source |
          806:    |---|---|---|
          807:    | `.settings/org.eclipse.m2e.core.prefs` | m2e workspace config | JDT LS m2e import |
          808:    | `.settings/org.eclipse.core.resources.prefs` | Encoding `Cp1252` | Eclipse workspace |
          809:    | `.gitignore` | `/bin/` | Possibly auto-generated |
          810: 
          811:    ### Already-Tracked Files (will NOT be touched)
          812:    | File | Status |
          813:    |---|---|
          814:    | `.settings/org.eclipse.jdt.core.prefs` | ✅ Tracked, unchanged — preserved |
          815: 
          816:    **Proposed discard steps:**
          817:    ```powershell
          818:    # 1. Revert modified tracked file
          819:    git checkout -- .project
          820: 
          821:    # 2. Remove specific untracked files (NOT the whole directory)
          822:    Remove-Item ".settings/org.eclipse.m2e.core.prefs" -Force
          823:    Remove-Item ".settings/org.eclipse.core.resources.prefs" -Force
          824:    Remove-Item ".gitignore" -Force
          825: 
          826:    # 3. Verify
          827:    git status --short
          828:    ```
          829: 
          830:    **⚠️ Warning:** `.settings/org.eclipse.jdt.core.prefs` is tracked
          831:    and will be preserved. The discard targets only IDE-generated noise.
          832: 
          833:    Should I discard these changes? (yes / no / inspect further)
          834:    ````
          835: 
          836: 2. **Act on user feedback:**
          837:    - **"yes" / "discard"** — Execute the proposed discard steps
          838:      **exactly as presented**, then verify with `git status --short`.
          839:    - **"no" / "keep"** — Leave the changes in the working tree.
          840:      They may be staged as a separate commit (e.g.,
          841:      `chore: update Eclipse project metadata`) or left for later.
          842:    - **"inspect further"** — Show full diffs for additional files
          843:      so the user can distinguish intentional changes from noise.
          844:    - **Partial discard** — If the user identifies some files as
          845:      intentional and others as noise, discard only the confirmed
          846:      noise files individually.
          847: 
          848: 3. **Post-discard verification:**
          849: 
          850:    ```powershell
          851:    git status --short
          852:    git diff --stat HEAD
          853:    ```
          854: 
          855:    If any tracked file appears as deleted (accidentally removed),
          856:    restore it immediately:
          857: 
          858:    ```powershell
          859:    git checkout -- <accidentally-deleted-file>
          860:    ```
          861: 
          862: **Prevention:** Add IDE artifact patterns to `.gitignore` if the
          863: project does not require IDE metadata to be version-controlled. If
          864: the project *does* track them, coordinate with the team on which
          865: metadata files are shared vs personal before discarding.
          866: 
          867: #### 3h — Hunk-Stage Backup Cleanup (Sidecar Discipline)
          868: 
          869: Every `git add -p` session, every in-editor `e` (edit-hunk) action,
          870: and every programmatic `git apply` with a manually authored patch
          871: may leave a sidecar file on disk: `<file>.orig`, `<file>.bak`,
          872: `<file>.full.bak`, `<file>.rej`, `<file>.staging-tmp`, etc. These
          873: sidecars MUST be detected and disposed of before the commit lands,
          874: never absorbed into it.
          875: 
          876: Four-step protocol (Detect → Classify → Verify → Never-`add`):
          877: 
          878: 1. **Detect** after each `git add -p` and after any `e`/`apply`:
          879: 
          880:    ```powershell
          881:    git status --short | Select-String -Pattern '\.(orig|bak|full\.bak|rej|staging-tmp)$'
          882:    ```
          883: 
          884:    The output MUST be empty before the commit.
          885: 
          886: 2. **Classify** every detected sidecar:
          887:    - **Recoverable** — content the agent or user still needs (e.g., a
          888:      `.rej` requiring manual re-application, or a `.full.bak` from
          889:      an aborted edit). Move it OUT of the working tree (e.g., to
          890:      `<workspace-root>/../scratch/` or a personal-sandbox branch).
          891:    - **Disposable** — content already represented in the index, HEAD,
          892:      or another branch. Delete directly.
          893: 
          894: 3. **Verify** before committing: re-run the §3h detect command and
          895:    confirm zero matches. Sidecars MUST NOT be added to `.gitignore`
          896:    as a substitute for cleanup — that hides the symptom and lets the
          897:    next session re-encounter the same disposal decision blind.
          898: 
          899: 4. **NEVER `git add` a sidecar** "to clean up history later". The
          900:    commit itself is the disposal decision; once a sidecar reaches the
          901:    index, the only safe recovery is `git reset HEAD -- <sidecar>`
          902:    followed by the classification above.
          903: 
          904: This rule composes with §2h (Pre-Execution Safety Stash): the safety
          905: stash captures the pre-execution working tree once; the sidecar
          906: cleanup happens per `add -p` invocation inside that window.
          907: 
          908: See [Atomic Commit Construction Rules §4.3](../../../ai-agent-rules/git-atomic-commit-construction-rules.md#43-hunk-stage-backup-cleanup-sidecar-discipline).
          909: 
          910: #### 3i — Selective Hunk Extraction via Diff Patching
          911: 
          912: When `git add -p` hunk boundaries don't align with the logical boundary
          913: (common in Markdown table rows, contiguous prose sections, or adjacent
          914: list items), and the complementary `stage-file-excluding-lines.py` (§2f.1)
          915: is the wrong tool because you want to stage ONLY the matching content
          916: (rather than exclude it), use the `stage-hunk-from-diff.py` script:
          917: 
          918: This script reads the file's diff, parses it into hunks, keeps only
          919: hunks whose content matches one or more `--match` / `--match-regex`
          920: patterns, and stages them via `git apply --cached`. Non-matching hunks
          921: remain unstaged; the working tree is never modified.
          922: 
          923: ```bash
          924: # Dry-run: preview matched hunks without staging
          925: python3 .agents/skills/git-hunk-staging-primitives/scripts/stage-hunk-from-diff.py \
          926:     --file .agents/skills/foo/SKILL.md \
          927:     --match "blockquote" \
          928:     --check
          929: 
          930: # Stage only hunks containing a specific substring:
          931: python3 .agents/skills/git-hunk-staging-primitives/scripts/stage-hunk-from-diff.py \
          932:     --file .agents/skills/foo/SKILL.md \
          933:     --match "Phase 1g"
          934: 
          935: # Stage hunks matching ANY of multiple patterns:
          936: python3 .agents/skills/git-hunk-staging-primitives/scripts/stage-hunk-from-diff.py \
          937:     --file .agents/skills/foo/SKILL.md \
          938:     --match "stash-apply" \
          939:     --match "live editor"
          940: 
          941: # Stage hunks from a regex pattern:
          942: python3 .agents/skills/git-hunk-staging-primitives/scripts/stage-hunk-from-diff.py \
          943:     --file .agents/skills/foo/SKILL.md \
          944:     --match-regex "Phase\s+1[g-h]"
          945: 
          946: # Stage hunks from the staged diff (--cached) instead of the working tree:
          947: python3 .agents/skills/git-hunk-staging-primitives/scripts/stage-hunk-from-diff.py \
          948:     --file .agents/skills/foo/SKILL.md \
          949:     --match "submodule" \
          950:     --cached
          951: ```
          952: 
          953: **How it works:**
          954: 
          955: 1. Runs `git diff [--cached] -- <file>` to capture the full patch.
          956: 2. Parses the unified diff into a header (before the first `@@`) and a
          957:    list of hunks (each `@@ ... @@` block with its context and changes).
          958: 3. For each hunk, checks whether ANY of the `--match` substrings or
          959:    `--match-regex` patterns appear anywhere in the hunk text (context
          960:    lines, old lines, AND new lines).
          961: 4. Reconstructs a filtered patch from the header + matching hunks only.
          962: 5. Runs `git apply --cached` with the filtered patch to stage exactly
          963:    those hunks into the index. Non-matching hunks remain unstaged.
          964: 
          965: **Complementary primitives (delegated to base skill `git-hunk-staging-primitives`):**
          966: 
          967: | Script | Action | Used in |
          968: |---|---|---|
          969: | `stage-hunk-from-diff.py` | Stage ONLY matching hunks | §3i (this section) |
          970: | `stage-file-excluding-lines.py` | Stage file MINUS matching lines | §2f.1 |
          971: | `agents-md-stage-row.py` | Stage exactly one AGENTS.md row | §2f |
          972: | `stage-head-synthesize.py` | Stage HEAD with substitutions | §13 |
          973: | `stage-specific-hunks.py` | Stage specific hunk indices | §3i.1, §13 |
          974: | `git add -p` | Interactive hunk-by-hunk staging | §3a–§3f |
          975: 
          976: **Edge cases:**
          977: 
          978: - **Zero hunks matched:** exits with error. Use `--check` to preview.
          979: - **File has no diff:** exits with error (nothing to extract).
          980: - **Filtered patch wouldn't apply:** `--check` reveals the issue.
          981:   Common causes: the index has drifted from HEAD (e.g., some changes
          982:   already staged for this file). Use `--cached` to target staged
          983:   changes, or commit/reset the existing staged content first.
          984: 
          985: **See also:** `stage-hunk-from-diff.py --help` for full argument docs.
          986: 
          987: #### 3i.1 — Adjacent-Lines Isolation (git add -p Split Failure Fallback)
          988: 
          989: When `git add -p` presents a single hunk with multiple adjacent
          990: added or deleted lines and `s` (split) returns "Sorry, cannot split
          991: this hunk," the lines are too close (no intervening context line) for
          992: Git's hunk-split algorithm. `stage-hunk-from-diff.py` (§3i) stages
          993: the ENTIRE hunk when ANY line matches your filter — it cannot isolate
          994: individual adjacent lines within a hunk.
          995: 
          996: **Preferred fallback:** `stage-file-excluding-lines.py` (§2f.1) stages
          997: the file with the unwanted line(s) EXCLUDED, leaving the working tree
          998: untouched. The excluded line stays on disk and is picked up cleanly by
          999: `git add <file>` in the next commit.
          1000: 
          1001: **Example — two adjacent additions, each needs its own commit:**
          1002: 
          1003: ```bash
          1004: # Commit 1: stage the file minus the second addition
          1005: python3 .agents/skills/git-hunk-staging-primitives/scripts/stage-file-excluding-lines.py \
          1006:     --file <file> \
          1007:     --exclude "<content-of-second-line>"
          1008: 
          1009: git commit …   # only the first line change is committed
          1010: 
          1011: # Commit 2: HEAD now has the first line; working tree still has both.
          1012: # git add sees only the second line as a delta from HEAD:
          1013: git add <file>
          1014: git commit …   # only the second line change is committed
          1015: ```
          1016: 
          1017: **How it works** (re-stated for this use case, SSOT is §2f.1):
          1018: 
          1019: 1. Reads the CURRENT working-tree version of `<file>`.
          1020: 2. Removes every line matching `--exclude`.
          1021: 3. Writes the result as a new blob via `git hash-object -w`.
          1022: 4. Updates the index entry via `git update-index --cacheinfo`.
          1023: 5. Working tree is never modified — the excluded line persists on disk.
          1024: 
          1025: **Why prefer this over manual editing (Intermediate State Synthesis,
          1026: §13):**
          1027: 
          1028: - Zero working-tree mutation — no risk of forgetting the restore step.
          1029: - The index blob is computed from the exact working-tree content
          1030:   (minus matched lines) — no accidental whitespace drift from a
          1031:   manual copy.
          1032: - Audit trail: the script logs the excluded line content + blob SHA
          1033:   to stderr.
          1034: 
          1035: **When manual editing is still appropriate (fallback to §13):**
          1036: 
          1037: - The script is unavailable (no `.agents/` tree, or Python not on PATH).
          1038: - Lines to exclude span multiple non-adjacent positions (one
          1039:   `--exclude` call handles one line; for scattered exclusions, manual
          1040:   may be faster).
          1041: 
          1042: ---
          1043: 
          1044: ### Step 4 — Formatting & Structural Partitioning
          1045: 
          1046: Stylistic and structural changes MUST be explicitly separated from
          1047: functional commits.
          1048: 
          1049: #### 4a — Formatting & Stylistic Consolidation
          1050: 
          1051: **Target:** Purely aesthetic changes — indentation, whitespace,
          1052: Markdown header-level corrections, single blank line adjustments.
          1053: 
          1054: **Rule:** If multiple files require these adjustments, club them into a
          1055: single dedicated commit. Commit type: `style`.
          1056: 
          1057: **Trivial hunks:** A single blank-line insertion or removal (e.g.,
          1058: missing blank line before a code block in a skill doc) is a
          1059: formatting-only change. Use `git add -p` to isolate that hunk from any
          1060: functional changes in the same file, then commit it separately as a
          1061: `style:` commit. See
          1062: [`separate-content-from-formatting-commits`](../separate-content-from-formatting-commits/SKILL.md)
          1063: for complex cases (pervasive reformatting mixed with content changes).
          1064: 
          1065: #### 4b — Structural Refactor Isolation
          1066: 
          1067: **Target:** Functional-preserving reorganizations — alphabetical
          1068: reordering of methods, variables, or constants.
          1069: 
          1070: **Rule:** Isolate into dedicated commits. Commit type: `refactor`.
          1071: Large structural reorders should be committed per-file or
          1072: per-logical-group for clear "move" history.
          1073: 
          1074: #### 4c — Zero Mixture
          1075: 
          1076: Never mix formatting (4a) with structural refactors (4b) or functional
          1077: logic (Step 2). Use `git add -p` or Intermediate State Synthesis
          1078: (Step 12) to ensure absolute partitioning.
          1079: 
          1080: ---
          1081: 
          1082: ### Step 5 — Configuration Coupling
          1083: 
          1084: Tool configurations and metadata MUST be atomically linked to the code
          1085: they support.
          1086: 
          1087: - **Functional Pairing:** Updates to `.vscode/settings.json` (e.g.,
          1088:   cSpell words), `.lintrc`, or other config files MUST be staged and
          1089:   committed alongside the functional changes that necessitate them.
          1090: - **IDE Project Files:** Shared IDE config files (`.idea/` core XMLs,
          1091:   `.vscode/` shared settings) that establish project structure MUST be
          1092:   tracked. Personal settings (e.g., `workspace.xml`) MUST remain ignored.
          1093: - **Example:** If adding a new rule file introduces technical terms, the
          1094:   cSpell update for those terms MUST be part of the same atomic unit.
          1095: 
          1096: ---
          1097: 
          1098: ### Step 6 — Submodule Synchronization Protocol
          1099: 
          1100: When managing submodules, the main repository's history must remain descriptive and clear.
          1101: 
          1102: - **Submodule-First Discipline**: All submodule commits MUST be completed
          1103:   BEFORE handling any parent-repository work. Submodule work is highest
          1104:   priority; parent sync follows immediately after.
          1105: - **Synchronized Commits**: Every functional update in a submodule requiring a
          1106:   pointer update in the main repo MUST be coupled with its relevant main-repo
          1107:   configuration changes (e.g., CI scripts or IDE settings).
          1108: - **Orchestration**: Delegate metadata extraction to the
          1109:   **[Git Submodule Commit Details](../git-submodule-commit-details/SKILL.md)**
          1110:   skill to ensure zero-omission fidelity.
          1111: - **Commit Message Generation**: All submodule sync commits MUST follow the
          1112:   strict formatting, chronological ordering, and metadata requirements defined in
          1113:   **[Submodule Sync Commits](../../../ai-agent-rules/git-commit-message-rules.md#5-submodule-sync-commits-parent-repository)**.
          1114: - **Submodule History Integrity**: Before updating a submodule pointer in the
          1115:   parent repository, the changes *within* the submodule MUST be committed
          1116:   according to these exact atomic construction rules. A "dirty" or
          1117:   uncommitted submodule state is prohibited during a parent-repo sync.
          1118: 
          1119: ### Step 7 — Parent Sync Offer & Change Grouping
          1120: 
          1121: Immediately after finalizing all submodule commits, the agent MUST evaluate the
          1122: parent repository.
          1123: 
          1124: #### 7a — Parent State Analysis
          1125: 
          1126: 1. Check if the containing parent repo exists and tracks current dir as submodule.
          1127: 2. Verify parent's recorded SHA differs from submodule HEAD → stale pointer confirmed.
          1128: 
          1129: #### 7b — Related Parent Changes Detection
          1130: 
          1131: - **Inventory parent changes**: Run `git -C <parent-path> status` to list all
          1132:   modified/untracked files in the parent.
          1133: - **Determine coupling**: Are any parent changes **directly related** to the
          1134:   submodule commit (e.g., implementing the rule just added, updating CI to use
          1135:   the new submodule feature, docs that reference the new behavior)?
          1136:     - **Yes** → Group with the submodule SHA sync in a **single unified commit**.
          1137:     - **No** → Keep parent sync minimal (SHA-only), commit related changes
          1138:     separately afterward.
          1139: 
          1140: #### 7c — Arranged Commit Preview
          1141: 
          1142: Present the parent sync commit using full arranged commit format (§4). Include
          1143: both the submodule SHA delta and any grouped parent-side changes in the message body.
          1144: 
          1145: #### 7d — Execution Prompt
          1146: 
          1147: ```text
          1148: The parent repository needs a submodule SHA update. Execute sync?
          1149: ```
          1150: 
          1151: - On **"yes"** → Execute the presented commit immediately.
          1152: - On **"no"** or ambiguous → Do NOT commit; await explicit directive.
          1153: - **Never auto-push** — push offers come AFTER commit execution, never before.
          1154: 
          1155: #### 7e — Post-Sync Cleanup
          1156: 
          1157: If parent-side unrelated changes were detected but NOT grouped, they remain in
          1158: the parent working tree as separate atomic units. Arrange and commit them
          1159: independently following the standard protocol.
          1160: 
          1161: ---
          1162: 
          1163: ### Step 8 — Generated vs Custom File Splitting
          1164: 
          1165: When a file contains both standard API-generated content (e.g., from
          1166: gitignore.io) and user-defined custom rules, split into separate commits.
          1167: 
          1168: - **Commit A (Foundation):** Commit only the standard, API-generated
          1169:   portion first. Back up the full file, overwrite with the exact API
          1170:   content, and commit. This establishes a clean, reproducible baseline.
          1171: - **Commit B (Customization):** Commit the user-defined sections in a
          1172:   subsequent commit. This clearly distinguishes "standard boilerplate"
          1173:   from "project-specific logic."
          1174: - **User Modifications:** If the user has altered the API-generated
          1175:   portion, separate those alterations from the raw API import if
          1176:   possible, or document clearly as user-patches.
          1177: 
          1178: ---
          1179: 
          1180: ### Step 9 — Commit Message Quality Standards
          1181: 
          1182: Every commit message MUST meet these quality requirements:
          1183: 
          1184: | Requirement | Detail |
          1185: |---|---|
          1186: | **Specificity** | Avoid generic titles. List specific components (e.g., `add linux, macos, and windows gitignore rules` not `os-specific`) |
          1187: | **Anti-Repetition** | The body MUST NOT merely rephrase the title |
          1188: | **Context Enrichment** | Explain the 'Why' — especially for architectural or security decisions |
          1189: | **Atomic Rationale** | The body MUST state WHY these specific changes are grouped together. If multiple files, explain their functional coupling |
          1190: | **Constraint Documentation** | Mention constraints or external dependencies that influenced grouping |
          1191: | **Contextual Accuracy** | Use precise terms (e.g., "Supabase project-specific" not generic "project-specific") |
          1192: | **Body/Diff Congruence** | The message body MUST be a complete, accurate summary of ALL changes in the staged hunks. Any discrepancy requires an immediate corrected preview |
          1193: 
          1194: ---
          1195: 
          1196: ### Step 10 — Execution & Verification
          1197: 
          1198: #### 9a — Step-by-Step Execution
          1199: 
          1200: Execute commits one-by-one according to the approved arrangement.
          1201: **Chaining commands (e.g., `git add . && git commit`) is FORBIDDEN.**
          1202: Each command MUST be issued as a separate step so the user can inspect
          1203: intermediate state (`git status`, diff, preview) before authorizing the
          1204: next action. Chaining suppresses this verification window.
          1205: 
          1206: #### 9b — Recovery
          1207: 
          1208: If a mistake is made during staging:
          1209: 
          1210: - **Unstage:** `git reset <file>`
          1211: - **Selective discard:** `git checkout -p`
          1212: - **WARNING:** Never use `git reset --hard` for synchronization.
          1213:   Always prefer `git pull`.
          1214: 
          1215: #### 9c — Pull Before Push
          1216: 
          1217: Always `git pull` (or `git pull --rebase` upon explicit approval) before
          1218: pushing to incorporate latest remote changes.
          1219: 
          1220: #### 9d — Opaque Content Analysis
          1221: 
          1222: For files flagged as binary or large assets (LFS), verify internal
          1223: consistency by inspecting file contents (e.g., `cat -v` or hex dump) to
          1224: ensure the commit message accurately reflects the data being stored.
          1225: 
          1226: #### 9e — History Refinement Delegation
          1227: 
          1228: If existing commits need to be split or refined (e.g., to fix non-atomic
          1229: changes), delegate to the
          1230: [`git_history_refinement`](../git-history-refinement/SKILL.md) skill.
          1231: 
          1232: #### 9f — Stash Workflow for Rebase
          1233: 
          1234: If rebase fails due to unstaged changes:
          1235: 
          1236: ```powershell
          1237: git stash push -m "Descriptive message"
          1238: git pull --rebase origin <branch>
          1239: git stash pop
          1240: ```
          1241: 
          1242: If `git stash pop` creates conflicts, resolve manually, then:
          1243: 
          1244: ```bash
          1245: PAGER=cat git add <resolved-files>
          1246: PAGER=cat git stash drop
          1247: ```
          1248: 
          1249: > **Stash preservation rule:** `git stash drop`/`pop`/`clear` are destructive and require explicit per-stash user
