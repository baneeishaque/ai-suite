          129: 4. Creates `<repo>/scratch/<session-id>/` (mkdir parents, idempotent).
          130: 5. Prints `session_dir / "purpose_<ts>"` or
          131:    `session_dir / "purpose_<ref-name>_<ref-sha>"`.
