          114:   scratch root (flattens and collides across sessions).
          115: - Do NOT write timestamps into the ref variant NOR commit SHAs into the
          116:   timestamp variant — each variant is defined by its inclusion/exclusion.
          117: - Do NOT pass `--session-id` values deduced from artifact filenames, scratch
          118:   folders, or prior conversation context — session IDs change on fork. Omit the
          119:   flag (auto-discovery) or use an ID resolved in the current run.
          120: 
          121: ## Script Reference
