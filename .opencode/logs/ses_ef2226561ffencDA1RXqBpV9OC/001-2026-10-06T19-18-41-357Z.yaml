          1080: ---
          1081: 
          1082: ### Step 5 — Configuration Coupling
          1083: 
          1084: Tool configurations and metadata MUST be atomically linked to the code
          1085: they support.
          1086: 
          1087: - **Functional Pairing:** Updates to `.vscode/settings.json` (e.g.,
          1088:   cSpell words), `.lintrc`, or other config files MUST be staged and
          1089:   committed alongside the functional changes that necessitate them.
          1090: - **IDE Project Files:** Shared IDE config files (`.idea/` core XMLs,
          1091:   `.vscode/` shared settings) that establish project structure MUST be
          1092:   tracked. Personal settings (e.g., `workspace.xml`) MUST remain ignored.
          1093: - **Example:** If adding a new rule file introduces technical terms, the
          1094:   cSpell update for those terms MUST be part of the same atomic unit.
          1095: 
          1096: ---
