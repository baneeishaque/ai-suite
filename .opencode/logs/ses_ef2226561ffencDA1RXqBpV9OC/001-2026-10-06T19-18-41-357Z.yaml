          1098: ### Step 6 — Submodule Synchronization Protocol
          1099: 
          1100: When managing submodules, the main repository's history must remain descriptive and clear.
          1101: 
          1102: - **Submodule-First Discipline**: All submodule commits MUST be completed
          1103:   BEFORE handling any parent-repository work. Submodule work is highest
          1104:   priority; parent sync follows immediately after.
          1105: - **Synchronized Commits**: Every functional update in a submodule requiring a
          1106:   pointer update in the main repo MUST be coupled with its relevant main-repo
          1107:   configuration changes (e.g., CI scripts or IDE settings).
          1108: - **Orchestration**: Delegate metadata extraction to the
          1109:   **[Git Submodule Commit Details](../git-submodule-commit-details/SKILL.md)**
          1110:   skill to ensure zero-omission fidelity.
          1111: - **Commit Message Generation**: All submodule sync commits MUST follow the
          1112:   strict formatting, chronological ordering, and metadata requirements defined in
          1113:   **[Submodule Sync Commits](../../../ai-agent-rules/git-commit-message-rules.md#5-submodule-sync-commits-parent-repository)**.
          1114: - **Submodule History Integrity**: Before updating a submodule pointer in the
          1115:   parent repository, the changes *within* the submodule MUST be committed
          1116:   according to these exact atomic construction rules. A "dirty" or
          1117:   uncommitted submodule state is prohibited during a parent-repo sync.
          1118: 
          1119: ### Step 7 — Parent Sync Offer & Change Grouping
          1120: 
          1121: Immediately after finalizing all submodule commits, the agent MUST evaluate the
          1122: parent repository.
          1123: 
          1124: #### 7a — Parent State Analysis
          1125: 
          1126: 1. Check if the containing parent repo exists and tracks current dir as submodule.
          1127: 2. Verify parent's recorded SHA differs from submodule HEAD → stale pointer confirmed.
          1128: 
          1129: #### 7b — Related Parent Changes Detection
          1130: 
          1131: - **Inventory parent changes**: Run `git -C <parent-path> status` to list all
          1132:   modified/untracked files in the parent.
          1133: - **Determine coupling**: Are any parent changes **directly related** to the
          1134:   submodule commit (e.g., implementing the rule just added, updating CI to use
          1135:   the new submodule feature, docs that reference the new behavior)?
          1136:     - **Yes** → Group with the submodule SHA sync in a **single unified commit**.
          1137:     - **No** → Keep parent sync minimal (SHA-only), commit related changes
          1138:     separately afterward.
          1139: 
          1140: #### 7c — Arranged Commit Preview
          1141: 
          1142: Present the parent sync commit using full arranged commit format (§4). Include
          1143: both the submodule SHA delta and any grouped parent-side changes in the message body.
          1144: 
          1145: #### 7d — Execution Prompt
          1146: 
          1147: ```text
          1148: The parent repository needs a submodule SHA update. Execute sync?
          1149: ```
          1150: 
          1151: - On **"yes"** → Execute the presented commit immediately.
          1152: - On **"no"** or ambiguous → Do NOT commit; await explicit directive.
          1153: - **Never auto-push** — push offers come AFTER commit execution, never before.
          1154: 
          1155: #### 7e — Post-Sync Cleanup
          1156: 
          1157: If parent-side unrelated changes were detected but NOT grouped, they remain in
          1158: the parent working tree as separate atomic units. Arrange and commit them
          1159: independently following the standard protocol.
          1160: 
          1161: ---
          1162: 
          1163: ### Step 8 — Generated vs Custom File Splitting
          1164: 
          1165: When a file contains both standard API-generated content (e.g., from
          1166: gitignore.io) and user-defined custom rules, split into separate commits.
          1167: 
          1168: - **Commit A (Foundation):** Commit only the standard, API-generated
          1169:   portion first. Back up the full file, overwrite with the exact API
          1170:   content, and commit. This establishes a clean, reproducible baseline.
          1171: - **Commit B (Customization):** Commit the user-defined sections in a
          1172:   subsequent commit. This clearly distinguishes "standard boilerplate"
          1173:   from "project-specific logic."
          1174: - **User Modifications:** If the user has altered the API-generated
          1175:   portion, separate those alterations from the raw API import if
          1176:   possible, or document clearly as user-patches.
          1177: 
          1178: ---
          1179: 
          1180: ### Step 9 — Commit Message Quality Standards
          1181: 
          1182: Every commit message MUST meet these quality requirements:
          1183: 
          1184: | Requirement | Detail |
          1185: |---|---|
          1186: | **Specificity** | Avoid generic titles. List specific components (e.g., `add linux, macos, and windows gitignore rules` not `os-specific`) |
          1187: | **Anti-Repetition** | The body MUST NOT merely rephrase the title |
          1188: | **Context Enrichment** | Explain the 'Why' — especially for architectural or security decisions |
          1189: | **Atomic Rationale** | The body MUST state WHY these specific changes are grouped together. If multiple files, explain their functional coupling |
          1190: | **Constraint Documentation** | Mention constraints or external dependencies that influenced grouping |
          1191: | **Contextual Accuracy** | Use precise terms (e.g., "Supabase project-specific" not generic "project-specific") |
          1192: | **Body/Diff Congruence** | The message body MUST be a complete, accurate summary of ALL changes in the staged hunks. Any discrepancy requires an immediate corrected preview |
          1193: 
          1194: ---
          1195: 
          1196: ### Step 10 — Execution & Verification
          1197: 
          1198: #### 9a — Step-by-Step Execution
          1199: 
          1200: Execute commits one-by-one according to the approved arrangement.
          1201: **Chaining commands (e.g., `git add . && git commit`) is FORBIDDEN.**
          1202: Each command MUST be issued as a separate step so the user can inspect
          1203: intermediate state (`git status`, diff, preview) before authorizing the
          1204: next action. Chaining suppresses this verification window.
          1205: 
          1206: #### 9b — Recovery
          1207: 
          1208: If a mistake is made during staging:
          1209: 
          1210: - **Unstage:** `git reset <file>`
          1211: - **Selective discard:** `git checkout -p`
          1212: - **WARNING:** Never use `git reset --hard` for synchronization.
          1213:   Always prefer `git pull`.
          1214: 
          1215: #### 9c — Pull Before Push
          1216: 
          1217: Always `git pull` (or `git pull --rebase` upon explicit approval) before
          1218: pushing to incorporate latest remote changes.
          1219: 
          1220: #### 9d — Opaque Content Analysis
          1221: 
          1222: For files flagged as binary or large assets (LFS), verify internal
          1223: consistency by inspecting file contents (e.g., `cat -v` or hex dump) to
          1224: ensure the commit message accurately reflects the data being stored.
          1225: 
          1226: #### 9e — History Refinement Delegation
          1227: 
          1228: If existing commits need to be split or refined (e.g., to fix non-atomic
          1229: changes), delegate to the
          1230: [`git_history_refinement`](../git-history-refinement/SKILL.md) skill.
          1231: 
          1232: #### 9f — Stash Workflow for Rebase
          1233: 
          1234: If rebase fails due to unstaged changes:
          1235: 
          1236: ```powershell
