          1042: ---
          1043: 
          1044: ### Step 4 — Formatting & Structural Partitioning
          1045: 
          1046: Stylistic and structural changes MUST be explicitly separated from
          1047: functional commits.
          1048: 
          1049: #### 4a — Formatting & Stylistic Consolidation
          1050: 
          1051: **Target:** Purely aesthetic changes — indentation, whitespace,
          1052: Markdown header-level corrections, single blank line adjustments.
          1053: 
          1054: **Rule:** If multiple files require these adjustments, club them into a
          1055: single dedicated commit. Commit type: `style`.
          1056: 
          1057: **Trivial hunks:** A single blank-line insertion or removal (e.g.,
          1058: missing blank line before a code block in a skill doc) is a
          1059: formatting-only change. Use `git add -p` to isolate that hunk from any
          1060: functional changes in the same file, then commit it separately as a
          1061: `style:` commit. See
          1062: [`separate-content-from-formatting-commits`](../separate-content-from-formatting-commits/SKILL.md)
          1063: for complex cases (pervasive reformatting mixed with content changes).
          1064: 
          1065: #### 4b — Structural Refactor Isolation
          1066: 
          1067: **Target:** Functional-preserving reorganizations — alphabetical
          1068: reordering of methods, variables, or constants.
          1069: 
          1070: **Rule:** Isolate into dedicated commits. Commit type: `refactor`.
          1071: Large structural reorders should be committed per-file or
          1072: per-logical-group for clear "move" history.
          1073: 
          1074: #### 4c — Zero Mixture
          1075: 
          1076: Never mix formatting (4a) with structural refactors (4b) or functional
          1077: logic (Step 2). Use `git add -p` or Intermediate State Synthesis
          1078: (Step 12) to ensure absolute partitioning.
