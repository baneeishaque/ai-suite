          282: 3. **Cross-repo relative links** — `../` chains that escape the current repo's
          283:    root into a sibling directory (no `.gitmodules` registration). Run the
          284:    [detect-cross-repo-links.py](../redaction-portability/scripts/detect-cross-repo-links.py)
          285:    script from the redaction-portability skill.
          286: 4. **Literal organization names, internal codenames, hostnames, and usernames**
          287:    in prose — replace with canonical placeholders (`<corp>`, `<author>`, etc.).
          288: 5. **Project-specific skill names / paths** in base-published skills (e.g., a
          289:    composer row in a base skill referencing a project-specific skill in a
          290:    different repo).
          291: 
          292: **When to run this audit:**
          293: 
          294: - **Immediately after Step 1f** (Complete Inventory) — you have the full file
          295:   list, and no work has been wasted on grouping or staging content that will
          296:   need post-hoc redaction.
          297: - **Any time a new file is added** to the working tree mid-session (e.g.,
          298:   skill-factory generation, conversation export).
          299: 
          300: **Remediation workflow:**
          301: 
          302: 1. Read each flagged file, identify the violating strings.
          303: 2. Apply canonical placeholders per
          304:    [redaction-portability §2](../redaction-portability/SKILL.md#2-canonical-placeholder-vocabulary).
          305: 3. If the violation is a cross-repo link: either delete the link entirely or
          306:    replace with a name-only reference (see redaction-portability repair rules).
          307: 4. Re-run the audit to confirm zero remaining violations.
          308: 5. Only then proceed to Step 2 (Logical Grouping).
          309: 
          310: The redaction-portability skill **MUST** be cited as a dependency in any commit
          311: that touches skill or rule files, so downstream tooling knows to invoke the
          312: same audit.
          313: 
          314: ---
          315: 
          316: ### Step 2 — Logical Grouping (Arrangement)
          317: 
          318: Arrange detected changes into a proposed sequence of commits.
          319: 
          320: #### 2a — Independence Principle
          321: 
          322: Each commit must stand alone. If the repository were checked out at
          323: that commit, it should still build/function (or be logically coherent).
          324: 
          325: #### 2b — Atomic Principle
          326: 
          327: Never commit half of a logical change. If a file contains two unrelated
          328: changes, use **hunk-based staging** (Step 3).
          329: 
          330: #### 2c — Buildable State Priority
          331: 
          332: While atomicity is the goal, maintaining a buildable repository takes
          333: precedence. If a core infrastructure change (e.g., a signature change in
          334: a shared helper) breaks all consumers, the refactor and the resulting
          335: fixes in consumer files MUST be consolidated into a single commit.
          336: 
          337: #### 2d — The Commit Preview (Mandatory Verbose Display)
          338: 
          339: Present the proposed "Arranged Commits" using a structured format with
          340: **maximum detail**. For files with mixed concerns requiring hunk-based
          341: staging, the preview **MUST** include the specific git hunks.
          342: 
          343: **Mandates for writing the preview:**
          344: 
          345: 1. **`@@` Header Verification** — Before writing any `@@ -N,M +N,M @@` line,
          346:    run `git diff --unified=3 -- <file>` and copy the exact range header from
          347:    the actual output. Never estimate or compute from memory — wrong headers
          348:    make the preview useless for verification.
          349: 
          350: 2. **Fence Collision Handling** — When a diff hunk contains lines that are
          351:    themselves triple-backtick fenced code blocks (` ```text`, ` ```bash`,
          352:    and their closing ` ``` `), wrap the diff in **`~~~diff`** / **`~~~`**
          353:    instead of ` ```diff ` / ` ``` `. Backtick fences inside a backtick-fenced
          354:    block terminate the outer block prematurely, breaking the markdown preview.
          355:    The tilde fence (`~~~`) is only closed by another `~~~`, so inner backtick
          356:    blocks survive as literal content.
          357: 
          358: 3. **No Content Truncation** — All hunks MUST be shown in full. Lines of
          359:    context MUST NOT be replaced with `...` or any other truncation marker.
          360:    If the combined diff is too large for one conversation message, split the
          361:    preview across batches ($2g) and present one batch at a time.
          362: 
          363: 4. **Preview Artifact** — Write the full preview to
          364:    `scratch/commit-preview.md` (use
          365:    [`repo-scratch-output-capture`](../repo-scratch-output-capture/SKILL.md)
          366:    to ensure `scratch/` exists and is gitignored). The user can then refer to
          367:    specific line numbers when giving feedback. Present the summary in the
          368:    conversation as well.
          369: 
          370: Template:
          371: 
          372: ````markdown
          373: ## Arranged Commits Preview
          374: 
          375: ### Commit 1: [type](scope): [title]
          376: - **Files**: [file1.md], [file2.md]
          377: - **Message**:
          378:   ```
          379:   [type](scope): [title]
          380: 
          381:   [Body line 1]
          382:   [Body line 2]
          383:   ```
          384: - **Hunks/Preview**:
          385:   ```diff
          386:   [Show actual hunks for this commit — use ~~~diff/~~~ if hunks contain ```
          387:   ]
          388:   ```
          389: 
          390: ### Commit 2: [type](scope): [title]
          391: - **Files**: [file3.md]
          392: - **Message**:
          393:   ```
          394:   [type](scope): [title]
          395: 
          396:   [Body line 1]
          397:   ```
          398: ---
          399: Please say "start" to begin the sequential execution of these atomic
          400: commits.
          401: ````
          402: 
          403: #### 2d.1 — Iterative Preview Fixup
          404: 
          405: After presenting the commit preview, the user may give feedback by line
          406: number (e.g., "check line 98 — still broken"). Feedbacks typically
          407: point to one of these issues in the preview:
          408: 
          409: - Wrong `@@` header (fix by verifying against actual `git diff`)
          410: - Truncated content with `...` (restore full hunk)
          411: - Nested fenced code blocks breaking markdown (switch to `~~~diff`/`~~~`)
          412: - Missing context lines around changes (include the default 3-line context)
          413: 
          414: Fix, re-write the preview to `scratch/commit-preview.md`, and re-present.
          415: Loop until the user confirms the preview is correct. Do NOT begin execution
          416: until the user says "start".
          417: 
          418: #### 2d.2 — Post-Execution Preview Verification
          419: 
          420: After all arranged commits have been executed (or when resuming a session
          421: that may have previously generated a commit preview), verify completion
          422: by checking the preview against `git log`.
          423: 
          424: **Automated verification (preferred):**
          425: 
          426: Delegate to the
          427: [`git-commit-preview-verify`](../git/basic/edit/git-commit-preview-verify/SKILL.md)
          428: base skill:
          429: 
          430: ```bash
          431: python3 .agents/skills/git/basic/edit/git-commit-preview-verify/scripts/verify-commit-preview.py \
          432:     --preview scratch/commit-preview.md \
          433:     --format text
          434: ```
          435: 
          436: This parses the preview's `Commit N:` sections (any heading level),
          437: cross-references each commit title against `git log --oneline`, and
          438: reports done/pending status. Use `--format json` for machine-readable
          439: output.
          440: 
          441: **Manual verification (fallback):**
          442: 
          443: 1. Read `scratch/commit-preview.md` and extract each `Commit N:` title
          444: 2. Run `git log --oneline -20` and check for matching titles
          445: 3. Report which commits are done and which are pending
          446: 
          447: **Cleanup:**
          448: 
          449: Once all commits are verified as executed, delete the preview file:
          450: 
          451: ```bash
          452: # Automated (with verification gate)
          453: python3 .agents/skills/git/basic/edit/git-commit-preview-verify/scripts/verify-commit-preview.py \
          454:     --preview scratch/commit-preview.md \
          455:     --cleanup
          456: 
          457: # Manual
          458: trash scratch/commit-preview.md
          459: ```
          460: 
          461: The preview file MUST NOT be deleted until all commits are confirmed
          462: executed. If any commits are pending, the preview must be retained for
          463: the next session.
          464: 
          465: #### 2e — Commit Authorization
          466: 
          467: The agent **MUST NOT** proceed with any commit execution until the user
          468: explicitly says **"start"**. Other triggers like "commit" or "go" are
          469: insufficient.
          470: 
          471: #### 2f — Interleaving Mandate (Artifact + Registry Registration)
          472: 
          473: Whenever a commit introduces or renames an artifact **and** a shared index /
          474: registry file (e.g., `AGENTS-legacy.md` skills table, `.gitmodules`, CI
          475: workflow manifests) needs a corresponding row or entry for that artifact, the
          476: registry hunk MUST be **staged in the same commit** as the artifact itself —
          477: never batched into a separate "registration" commit at the end. This applies to:
          478: 
          479: - **New skills**: `AGENTS-legacy.md` row for the skill → same commit as the skill
          480:   `SKILL.md` / `scripts/` files.
          481: - **Submodule syncs**: `.gitmodules` URL change and any `AGENTS-legacy.md` row
          482:   referencing the submodule → same commit as the submodule pointer advance.
          483: - **Any artifact with a shared index entry**: treat the index row as part of the
          484:   artifact's definition, not as metadata to collect last.
          485: 
          486: When the registry file contains mixed hunks (some for this artifact, some
          487: unrelated): use `git add -p <registry>` to stage only the relevant hunk(s)
          488: alongside the artifact files; leave unrelated hunks unstaged for their own commits.
          489: 
          490: **When `git add -p` hunk boundaries don't align with row boundaries** (e.g.,
          491: two session rows land in the same hunk as an out-of-scope row), use the
          492: [`agents-md-stage-row.py`](../git-hunk-staging-primitives/scripts/agents-md-stage-row.py) script instead:
          493: 
          494: ```bash
          495: # Dry-run: preview alphabetical position
          496: python3 .agents/skills/git-hunk-staging-primitives/scripts/agents-md-stage-row.py \
          497:     --row "| My Skill | [path](path) | description |" \
          498:     --dry-run
          499: 
          500: # Stage exactly one row (default --mode staged: reads HEAD:AGENTS.md,
          501: # inserts row, updates index; working tree is NOT touched)
          502: python3 .agents/skills/git-hunk-staging-primitives/scripts/agents-md-stage-row.py \
          503:     --row "| My Skill | [path](path) | description |"
          504: ```
          505: 
          506: In default `--mode staged`, the script reads `HEAD:AGENTS.md` (not the working
          507: tree), inserts the row at the alphabetically correct position, writes a new
          508: blob via `git hash-object -w`, and updates the index via
          509: `git update-index --cacheinfo` — so only the new row is staged while all other
          510: working-tree changes remain unstaged.
          511: 
          512: The script also supports `--mode worktree` for the skill-factory registration
          513: case (AGENTS.md is clean and you just want the row written to the working tree
          514: for ordinary `git status` review and `git add`). See
          515: [`skill-factory/SKILL.md` §2.4](../skill-factory/SKILL.md) for the registration
          516: workflow.
          517: 
          518: Forbidden anti-pattern: "commit all artifacts first, then one final commit
          519: registers them all in AGENTS-legacy.md" — this makes individual commits incomplete
          520: (skill exists but is not discoverable) and destroys per-feature traceability.
          521: 
          522: See [Atomic Commit Construction Rules §3.1](../../../ai-agent-rules/git-atomic-commit-construction-rules.md#31-interleaving-mandate-artifact--registry-registration).
          523: 
          524: #### 2f.1 — Deferred Cross-Reference Hunk Pattern
          525: 
          526: When two new artifacts (X and Y) ship in **separate commits B and C**, and one or
          527: both files already contain a "Related Skills" / index row referencing the OTHER
          528: artifact in the working tree, the cross-reference row must be deferred to whichever
          529: commit lands the artifact it points to. Concretely: commit B (introduces X) MUST
          530: NOT carry a row that references Y — Y does not yet exist in the tree, and the row
          531: would dangle until commit C lands.
          532: 
          533: Three viable techniques, in order of preference:
          534: 
          535: 1. **`stage-file-excluding-lines.py`** (preferred — no working-tree mutation): write
          536:    a blob equal to the working tree minus the deferred row(s), stage it directly
          537:    via `git update-index --cacheinfo`, leave the working tree untouched. The
          538:    deferred rows are picked up cleanly by `git add <file>` for commit C.
          539: 
          540:    ```bash
          541:    python3 .agents/skills/git-hunk-staging-primitives/scripts/stage-file-excluding-lines.py \
          542:        --file .agents/skills/X/SKILL.md \
          543:        --exclude "../Y/SKILL.md" \
          544:        --dry-run
          545: 
          546:    python3 .agents/skills/git-hunk-staging-primitives/scripts/stage-file-excluding-lines.py \
          547:        --file .agents/skills/X/SKILL.md \
          548:        --exclude "../Y/SKILL.md"
          549:    ```
          550: 
          551:    When the deferred row belongs to a larger block (section header + table +
          552:    trailing blank), append **`--blank-context 1`** to also strip the contiguous
          553:    blank line after each match so no orphaned section header remains in the
          554:    staged blob:
          555: 
          556:    ```bash
          557:    python3 .agents/skills/git-hunk-staging-primitives/scripts/stage-file-excluding-lines.py \
          558:        --file .agents/skills/cra-reset-mocks-test-strategy/SKILL.md \
          559:        --exclude "## Composition" \
          560:        --exclude "Composition Mechanism" \
          561:        --exclude "mrt-component-test-strategy" \
          562:        --exclude "--- | ---" \
          563:        --blank-context 1
          564:    ```
          565: 
          566: 2. **Temporary edit + restore** (when the script is unavailable): edit the file to
          567:    remove the deferred row, `git add` it, commit B, then re-insert the row in the
          568:    working tree for commit C. Higher risk of forgetting the restore step; use only
          569:    as a fallback.
          570: 
          571: 3. **`git add -p`** (when hunk boundaries align with row boundaries): split the
          572:    hunk interactively. Often fails because Markdown table rows pack multiple
          573:    logical entries into a single hunk; falls back to technique 1 or 2.
          574: 
          575: **Forbidden anti-pattern**: staging the deferred row in commit B "to keep the file
          576: self-consistent" — the row points to an artifact that does not yet exist at
          577: commit B, breaking checkout-at-B build/lint and destroying per-commit
          578: traceability.
          579: 
          580: #### 2g — Batch-by-Batch Authorization (Long Sequences)
          581: 
          582: When the Arranged Commits sequence exceeds **5 commits**, split the preview
          583: into batches of at most 5 commits and request a separate `"start"` per batch:
          584: 
          585: 1. Present each batch in the full §2d verbose format before executing any
          586:    commit in that batch.
          587: 2. After each batch executes, emit a one-line summary `Batch N committed:
          588:    SHA1, SHA2, …` and present the next batch's preview.
          589: 3. The user MAY abort, reorder, or modify subsequent batches between
          590:    authorizations — do NOT pre-stage files for batches that have not yet
          591:    been authorized.
          592: 4. The first batch MUST include a top-level **Master Plan Table**
          593:    (`# | type(scope): title | files | batch`) so the user has a single-pane
          594:    view before authorizing batch 1.
          595: 
          596: See [Atomic Commit Construction Rules §3.2](../../../ai-agent-rules/git-atomic-commit-construction-rules.md#32-batch-by-batch-authorization-long-sequences).
          597: 
          598: #### 2h — Pre-Execution Safety Stash (Mandatory for ≥ 2 Commits)
          599: 
          600: Before executing the first commit of any sequence of two or more commits
          601: (including any batch governed by §2g), capture an apply-not-pop safety
          602: snapshot of the full working-tree state (tracked modifications, staged
          603: hunks, AND untracked files) and re-apply it immediately so execution
          604: proceeds against an unchanged tree. The snapshot persists across the
          605: entire sequence and is verified-then-dropped only at end-of-session.
          606: 
          607: Delegate the full three-phase protocol (Snapshot → Hold → Verify-and-
          608: Release) to [`git-pre-execution-safety-stash`](../git-pre-execution-safety-stash/SKILL.md):
          609: 
          610: - **Phase 1 — Snapshot** before the first commit: classify any
          611:   pre-existing stashes via [`git-stash-triage`](../git-stash-triage/SKILL.md),
          612:   push with `git stash push -u -m "safety: ..."`, immediately
          613:   `git stash apply` (NEVER `pop`), verify parity.
          614:   > **If `git stash apply` fails** due to live editor conflicts (VS Code,
          615:   > Copilot, Eclipse, IntelliJ rewriting files between push and apply),
          616:   > do NOT retry — follow the [Selective File Extraction from Stash
          617:   > (Phase 1g)](../git-pre-execution-safety-stash/SKILL.md#1g--stash-apply-conflict-recovery-via-selective-file-extraction)
          618:   > recovery path in `git-pre-execution-safety-stash`.
          619: - **Phase 2 — Hold** across the sequence: never drop, pop, or clear the
          620:   `safety:` entry mid-sequence; re-verify presence at batch boundaries.
          621: - **Phase 3 — Verify-and-Release** after the final commit: `git stash
          622:   apply` again, confirm the apply is a clean no-op against HEAD, then
          623:   ask the user explicitly before `git stash drop` per
          624:   [`git-operation-rules.md` §5](../../../ai-agent-rules/git-operation-rules.md).
          625: 
          626: See [Atomic Commit Construction Rules §3.3](../../../ai-agent-rules/git-atomic-commit-construction-rules.md#33-pre-execution-safety-stash-mandatory-for-multi-commit-sequences).
          627: 
          628: ---
          629: 
          630: ### Step 3 — Interactive Hunk-Based Staging
          631: 
          632: When a file contains mixed concerns, use interactive staging to
          633: partition changes.
          634: 
          635: #### 3a — Command
          636: 
          637: ```powershell
          638: git add -p <file>
          639: ```
          640: 
          641: #### 3b — Hunk-by-Hunk Evaluation
          642: 
          643: During interactive staging, evaluate and respond to each hunk
          644: individually (`y`, `n`, `s`, etc.). Do NOT batch responses. Every
          645: modified line must be evaluated: "Does this line belong to the
          646: *current* atomic goal?"
          647: 
          648: #### 3c — Granular Hygiene
          649: 
          650: If a grammatical fix is discovered while implementing a feature, it
          651: MUST be staged and committed separately unless it is part of the same
          652: logical chunk.
          653: 
          654: #### 3d — Verification After Staging
          655: 
          656: After staging each chunk, verify strictly atomic contents:
          657: 
          658: ```powershell
          659: git diff --cached
          660: ```
          661: 
          662: #### 3e — Discard Rejected Noise
          663: 
          664: After accepting the desired hunks and rejecting noise, discard the
          665: rejected changes from the working tree if they are unintentional:
          666: 
          667: ```powershell
          668: git checkout -- <file>
          669: ```
          670: 
          671: #### 3f — Mixed-Concern Noise Handling Workflow
          672: 
          673: When a file contains both functional changes AND unrelated noise
          674: (invisible characters, spurious whitespace, trailing `\r` differences),
          675: follow this workflow:
          676: 
          677: 1. **Attempt to fix the noise in the editor** — remove the spurious
          678:    whitespace or extra blank lines directly. This may resolve it.
          679: 2. **Re-check the diff** — run `git diff <file>`. If the noise persists
          680:    (e.g., invisible character differences that the editor cannot show),
          681:    fall back to hunk-based staging.
          682: 3. **Stage only functional hunks** — run `git add -p <file>`, accepting
          683:    (`y`) only the hunks that belong to the current atomic goal and
          684:    rejecting (`n`) the noise hunks.
          685: 4. **Discard the remaining noise** — run `git checkout -- <file>` to
          686:    revert the rejected noise from the working tree. This preserves the
          687:    staged functional changes.
          688: 5. **Verify staged state is clean** — run `git diff --cached <file>` to
          689:    confirm only functional changes are staged, then run `git status` to
          690:    confirm no unstaged changes remain.
          691: 
          692: **PowerShell caveat:** Piping input to `git add -p` is unreliable in
          693: PowerShell (standard pipe methods like `echo`, `Write-Output`, and
          694: string joins often fail to register). Preferred workaround:
          695: 
          696: - Accept the functional hunks manually or in a sequence where piping
          697:   works, then use `git checkout -- <file>` to discard whatever noise
          698:   remains unstaged.
          699: 
          700: #### 3g — Post-Edit Indent Verification & Repair
          701: 
          702: Markdown edits can silently shift continuation-line indent on unrelated
          703: lines near the edit site (common when tools re-emit fenced blocks or
          704: when an edit operation touches adjacent lines). A `git diff` that shows
          705: the correct content at the wrong indent is incomplete — staging it
          706: propagates whitespace drift into the commit.
          707: 
          708: Delegate detection and repair to the
          709: [`list-indent-consistency`](../general/list-indent-consistency/SKILL.md)
          710: base skill.
          711: 
          712: **Acceptance criterion:** run `detect-list-indent-drift.py` on the affected
          713: file(s); the script MUST exit 0 before `git add` is run.
          714: 
          715: See also: Common Pitfalls — `Indent drift after markdown edit silently staged`.
          716: 
          717: #### 3h — IDE Artifact Bulk Discard
          718: 
          719: IDE tooling (VS Code Java Language Server, Eclipse, IntelliJ) often
          720: auto-modifies project metadata files across **many** sub-projects at
          721: once — for example, adding `<filteredResources>` blocks to every
          722: Eclipse `.project` file. These changes **may** be noise — but some
          723: projects intentionally track IDE metadata for reproducible workspace
          724: setup. The agent **MUST NOT** assume these are discardable.
          725: 
          726: **Detection pattern:**
          727: 
          728: - `git diff --stat` shows a large number of identical-looking changes
          729:   (e.g., 50+ `.project` files each with exactly +11 lines)
          730: - The diff content is the same boilerplate repeated per file
          731: - The change was not initiated by the developer
          732: 
          733: **Common IDE artifact files to watch for:**
          734: 
          735: | Pattern | Source |
          736: |---|---|
          737: | `**/.project` | Eclipse / VS Code Java Language Server |
          738: | `**/.classpath` | Eclipse JDT |
          739: | `**/.settings/**` | Eclipse workspace preferences |
          740: | `**/*.iml` | IntelliJ IDEA module files |
          741: | `**/.idea/**` | IntelliJ IDEA project files |
          742: 
          743: **Tracked vs Untracked Pre-Check (Critical):**
          744: 
          745: Before discarding anything, the agent **MUST** distinguish between
          746: **tracked** (version-controlled) and **untracked** (new/generated)
          747: files in the affected area. This is critical because directories
          748: like `.settings/` often contain a **mix** of tracked files (e.g.,
          749: `org.eclipse.jdt.core.prefs` committed by the team) and untracked
          750: files (e.g., `org.eclipse.m2e.core.prefs` auto-generated by the
          751: JDT Language Server).
          752: 
          753: ```powershell
          754: # List tracked files under .settings/
          755: git ls-files .settings/
          756: 
          757: # List untracked files under .settings/
          758: git ls-files --others --exclude-standard .settings/
          759: 
          760: # For modified tracked files, show what changed
          761: git diff --stat HEAD -- .settings/
          762: ```
          763: 
          764: **⚠️ Never bulk-delete a directory that contains tracked files.**
          765: Using `Remove-Item ".settings" -Recurse -Force` when the directory
          766: contains tracked files will cause those files to appear as deleted
          767: in `git status`, requiring immediate restoration via
          768: `git checkout -- <file>`. Instead, remove only the specific
          769: untracked files.
          770: 
          771: **JDT Language Server + m2e Auto-Injection:**
          772: 
          773: When the JDT Language Server detects a `pom.xml`, it automatically
          774: imports the project as Maven-managed and injects:
          775: 
          776: - `org.eclipse.m2e.core.maven2Builder` into `.project` `<buildSpec>`
          777: - `org.eclipse.m2e.core.maven2Nature` into `.project` `<natures>`
          778: - `.settings/org.eclipse.m2e.core.prefs` (untracked)
          779: - `.settings/org.eclipse.core.resources.prefs` (untracked)
          780: 
          781: These are **not** from the VS Code Maven extension
          782: (`vscjava.vscode-maven`) — that extension provides the UI only.
          783: The `.project` modifications come from the **Eclipse JDT Language
          784: Server** (`eclipse.jdt.ls`) which bundles **m2e** internally.
          785: 
          786: **Mandatory User Confirmation Workflow:**
          787: 
          788: The agent **MUST** present suspected noise to the user and obtain
          789: explicit confirmation before discarding. Never silently discard
          790: changes to IDE metadata files — the project may rely on them.
          791: 
          792: 1. **Present the suspected noise** — Show the user a categorized
          793:    summary separating modified tracked files from untracked files,
          794:    and include the proposed discard steps:
          795: 
          796:    ````markdown
          797:    ## Suspected IDE Artifact Noise
          798: 
          799:    ### Modified Tracked Files
          800:    | File | Change | Source |
          801:    |---|---|---|
