          235: The following commands MUST NOT be issued by an AI agent unless the user has authorized them for the **specific stash
          236: ref(s)** in the same conversational turn:
          237: 
          238: - `git stash drop [<stash>]`
          239: - `git stash pop [<stash>]` — `pop` deletes the stash on success; treat as drop
          240: - `git stash clear` — destroys ALL stashes
          241: - `git reflog expire --expire=... refs/stash` — invisible destruction
          242: - `git gc --prune=now` while stash refs exist and are unreachable from another ref
          243: 
          244: "Cleanup" instructions (e.g., "cleanup full", "tidy up", "remove backups") DO NOT implicitly include stash
          245: removal. Stash drops MUST be itemized and gated separately, even inside a multi-step cleanup batch.
          246: 
          247: #### 5.2. Required Pre-Drop Protocol
          248: 
          249: Before requesting authorization to drop a stash:
          250: 
          251: 1. **Inventory** — list all stashes across the repository AND its initialized submodules with
          252:    `git stash list` (parent and each submodule).
          253: 2. **Inspect** — show the user `git stash show -p <stash>` (or summarized stat) so they can decide whether the work is
          254:    recoverable elsewhere.
          255: 3. **Diff against current** — if the stash overlaps existing committed/uncommitted work, run
          256:    `git diff <stash>^1 -- <files>` to surface any unique semantic content the stash would lose on drop.
          257: 4. **Request authorization** — present the verdict ("no unique content" / "unique content present") and STOP for the
          258:    user's explicit per-stash decision.
          259: 
          260: #### 5.3. Recovery Window (When a Drop Was Made in Error)
          261: 
          262: A dropped stash remains as a dangling commit object until pruned (default ~14 days, governed by
          263: `gc.reflogExpireUnreachable`). To recover:
          264: 
          265: ```bash
          266: # Capture the SHA from the drop output BEFORE losing the terminal scrollback
          267: git stash store -m "<original or recovery message>" <dangling-sha>
          268: git stash list   # confirm restored at stash@{0}
          269: ```
          270: 
          271: If the SHA was not captured, search the dangling commits:
          272: 
          273: ```bash
          274: git fsck --unreachable --no-reflogs | awk '/commit/ {print $3}' \
          275:   | xargs -I{} git log -1 --format="%H %s" {} | grep -i "WIP\|stash\|<known-message>"
          276: ```
          277: 
          278: #### 5.4. Same-Class Protections (Cross-Reference)
          279: 
          280: Equivalent authorization gates apply to:
          281: 
          282: - **Backup branches** (`backup/*`, `bk-*`, `pre-*`) — see
          283:   [`git-history-refinement-rules.md`](git-history-refinement-rules.md) cleanup gates.
          284: - **Reflog entries** — `git reflog expire`, `git reflog delete`.
          285: - **Dangling commits reachable only via reflog** — `git gc --prune=now`, `git prune`.
          286: 
          287: For any of the above, follow the same Inventory → Inspect → Authorize → Act protocol as for stashes.

          (End of file - total 287 lines)
          </content>
