          10: category: General-Domain
          11: ---
          12: 
          13: # Scratch Artifact Naming (v1)
          14: 
          15: > **Skill ID:** `scratch-artifact-naming`<br>
          16: > **Version:** 1.0.0<br>
          17: > **Standard:** [Agent Skills (agentskills.io)](https://agentskills.io)<br>
          18: > **Layer:** Base
          19: 
          20: This is the **base** skill for the session-scoped scratch artifact scheme.
          21: Every artifact a workflow captures under `<repo>/scratch/` must live in a
          22: session-named subfolder and carry one of two machine-parsable names: a
          23: timestamp variant for command output (`<purpose>_<YYYY-MM-DD_HH-MM-SS>`) or a
          24: git-ref variant for content captured at a specific commit
          25: (`<purpose>_<ref-slug>_<full-40-hex-sha>`).
          26: 
          27: The skill resolves the session-scoped path deterministically — auto-discovering
          28: the current opencode session ID (via `opencode-current-session-id`), creating
          29: the `<repo>/scratch/<session-id>/` folder idempotently, and emitting the
          30: absolute **stem** path on stdout so callers only append the file extension.
          31: 
          32: ## Scope & Intent
          33: 
          34: *In scope:*
          35: 
          36: - Compute the session-scoped scratch path `<repo>/scratch/<session-id>/` for any artifact.
          37: - Emit the absolute **STEM** path (no extension) — callers append `.out` / `.err` / `.json` / etc.
          38: - Support the two naming variants:
          39:     - **Timestamp variant** (command output / probe / log): `<purpose>_<YYYY-MM-DD_HH-MM-SS>`
          40:     - **Git-ref variant** (content captured at a commit): `<purpose>_<ref-slug>_<full-40-hex-sha>`
          41: - Auto-discover the current opencode session ID (via `opencode-current-session-id`)
          42:   when `--session-id` is omitted; strip any `ses_` prefix from the folder name.
          43: - Create `<repo>/scratch/<session-id>/` idempotently (`--no-mkdir` to override).
          44: 
          45: *Out of scope:*
          46: 
          47: - Writing the actual file content (that belongs to the caller / composer script).
          48: - The `.out`/`.err` pairing doctrine is owned by
          49:   [`repo-scratch-output-capture`](../../../repo-scratch-output-capture/SKILL.md).
          50: - Capturing a file at a git ref (composer: `git-ref-artifact-extract`).
          51: 
          52: ## Environment & Dependencies
          53: 
          54: | Requirement | Version | Notes |
          55: | ------------- | --------- | ------- |
          56: | Python | 3.12+ | Stdlib only — no pip dependencies |
          57: | `opencode-current-session-id` skill | present | Composed only for auto-discovery (graceful fallback) |
          58: | Git repo | — | `--repo` must resolve to an existing directory |
          59: 
          60: ## CLI Contract
          61: 
          62: ```text
          63: python3 scripts/resolve-scratch-path.py --repo <path> --purpose <slug>
          64:     [--session-id <id>] [--ref-name <slug>] [--ref-sha <full-sha>]
          65:     [--timestamp <ts>] [--no-mkdir]
          66: ```
          67: 
          68: | Argument | Required | Description |
          69: | ---------- | ---------- | ------------- |
          70: | `--repo <path>` | No | Repo root (default: CWD) |
          71: | `--purpose <slug>` | Yes | Lowercase-kebab purpose slug |
          72: | `--session-id <id>` | No | Full opencode session ID (`ses_` prefix optional); auto-discovered when omitted |
          73: | `--ref-name <slug>` | No | Lower-kebab ref slug (with `--ref-sha` selects ref variant) |
          74: | `--ref-sha <sha>` | No | Full 40-hex commit SHA (with `--ref-name` selects ref variant) |
          75: | `--timestamp <ts>` | No | `YYYY-MM-DD_HH-MM-SS` override (tests) |
          76: | `--no-mkdir` | No | Print without creating the session directory |
          77: 
          78: **Output:** absolute STEM path on stdout (no extension; caller appends `.ext`).
          79: 
          80: *Exit codes:*
          81: 
          82: - `0` — success
          83: - `1` — invalid `--purpose` / unpaired or malformed ref args / repo missing / session discovery failure / mkdir failure
          84: - `2` — argparse usage error
          85: 
          86: ## Protocol
          87: 
          88: 1. Confirm the artifact is intended for session-scoped scratch under the target repo.
          89: 2. Run `python3 .agents/skills/general/file/scratch-artifact-naming/scripts/resolve-scratch-path.py --repo <repo>
          90:    --purpose <purpose-slug> [--ref-name <slug> --ref-sha <sha>]`.
          91: 3. Append the appropriate extension to the printed stem and capture output there.
          92: 
          93: ## Edge Cases
          94: 
          95: - **Timestamp collisions**: two captures within the same second collide on stem —
          96:   pass `--timestamp` explicitly or rely on the ref variant (full SHA is unique).
          97: - **Unnamed session at repo root**: a repo outside `.opencode/logs` discovery
          98:   scope has no session — pass `--session-id` explicitly.
          99: - **No `.git` in repo**: does not require git; only checks the directory exists.
          100: - **`ses_` prefix handling**: both `--session-id ses_02c6…` and
          101:   `--session-id 02c6…` resolve to folder `scratch/02c6…/`.
          102: - **Concurrent sessions in the same repo**: the composed auto-discovery is
          103:   pending-marker-first (the in-flight session wins) with newest-mtime fallback,
          104:   and can still resolve to a sibling session when multiple sessions are truly
          105:   active. NEVER pin `--session-id` from a remembered or deduced value — IDs
          106:   change on fork; omit the flag (auto-discovery) or pass only an ID resolved in
          107:   the current run or supplied by the user.
          108: 
