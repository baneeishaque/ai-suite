          2: name: repo-scratch-output-capture
          3: description: Redirect stdout and stderr of probes, builds, installs, and any long-running diagnostic command into a repo-root `scratch/` folder (gitignored) instead of suppressing output or writing to `/tmp`. Keeps the terminal clean while preserving complete, inspectable output co-located with the artifact under investigation.
          4: category: Code Hygiene & Maintenance
          5: ---
          6: 
          7: # Repo Scratch Output Capture Skill (v1)
          8: 
          9: > **Skill ID:** `repo-scratch-output-capture`<br>
          10: > **Version:** 1.0.0<br>
          11: > **Standard:** [Agent Skills (agentskills.io)](https://agentskills.io)<br>
          12: > **Layer:** Base
          13: 
          14: ## 1. When to Apply
          15: 
          16: Apply this skill whenever a command's output is too verbose for the terminal but MUST be
          17: preserved for inspection (success verdict, failure trace, install log, probe result). Specifically:
          18: 
          19: - Capability probes (DB version, network reach, schema introspection).
          20: - Package installers (`pip`, `npm`, `cargo`, `apt`, `brew`).
          21: - Long builds whose interesting signal is the last 20 lines.
          22: - Any command that runs unattended and may fail silently.
          23: 
          24: Do NOT apply for:
          25: 
          26: - Commands whose output is itself the deliverable (those go to the user directly).
          27: - One-line commands whose output already fits the terminal.
          28: 
          29: ## 2. Core Doctrine
          30: 
          31: | Forbidden | Required |
          32: | --- | --- |
          33: | `cmd > /dev/null 2>&1` (silent failure invisible) | `cmd > scratch/cmd.out 2> scratch/cmd.err` |
          34: | `cmd > /tmp/x.log` (lost on reboot, not co-located with the artifact) | `cmd > <repo-root>/scratch/x.out` |
          35: | Writing to the CWD's containing repo when the artifact lives in another repo | Resolve `<artifact-repo-root>/scratch/` first; write there |
          36: | Adding `scratch/` only to `.git/info/exclude` (local-only) | Add `scratch/` to committed `.gitignore` (team-wide) |
          37: 
          38: **Rationale:** A suppressed failure is a debugging time-bomb. `/tmp` divorces the trace from the
          39: artifact. `scratch/` next to the artifact is discoverable by every contributor and survives
          40: reboots while staying out of version control.
          41: 
          42: ## 3. Naming & Layout
          43: 
          44: Artifacts are organized **per-session** under a scratch root that is
          45: gitignored. The session folder is named by the current opencode session ID
          46: (`ses_` prefix omitted), e.g. `scratch/<session-id>/`:
          47: 
          48: ```text
          49: <repo-root>/
          50: ├── .gitignore              # contains line: scratch/
          51: └── scratch/                # gitignored
          52:     └── <session-id>/        # ses_ prefix omitted (e.g. <session-id>)
          53:         ├── <purpose>_<ts>.out      # captured stdout
          54:         ├── <purpose>_<ts>.err      # captured stderr
          55:         └── <purpose>_<ref-slug>_<ref-sha>.<ext>  # artifact captured at a git ref
          56: ```
          57: 
          58: - `<purpose>` is a short lowercase-kebab slug describing the command
          59:   (`probe-multi`, `pip-install`, `gradle-build`).
          60: - Always pair `.out` + `.err` siblings — many tools split signal unpredictably
          61:   between the two streams.
          62: - **Naming and session-folder resolution are delegated to the
          63:   [`scratch-artifact-naming`](../general/file/scratch-artifact-naming/SKILL.md)
          64:   base skill** — never re-derive the `<purpose>_<ts>` / `_<ref-slug>_<sha>`
          65:   forms yourself. Run its `resolve-scratch-path.py` and append the extension.
          66: - Sub-folders permitted for multi-step workflows
          67:   (`scratch/<session-id>/<step>.out`).
          68: 
          69: ## 4. Operational Logic
          70: 
          71: ### 4.1 Ensure-and-Capture Pattern
          72: 
          73: Idempotent one-liner pattern:
          74: 
          75: ```bash
          76: REPO="$(git rev-parse --show-toplevel)"
          77: SCRATCH_ROOT="$REPO/scratch"
          78: mkdir -p "$SCRATCH_ROOT"
          79: grep -qxF 'scratch/' "$REPO/.gitignore" 2>/dev/null \
          80:     || echo 'scratch/' >> "$REPO/.gitignore"
          81: 
          82: SESSION_DIR="$(python3 "$REPO/.agents/skills/general/file/scratch-artifact-naming/scripts/resolve-scratch-path.py" \
          83:     --repo "$REPO" --purpose my-command | xargs dirname)"
          84: 
          85: my-command --with --args \
          86:     > "$SESSION_DIR/my-command.out" \
          87:     2> "$SESSION_DIR/my-command.err"
          88: echo "Exit: $?  See $SESSION_DIR/my-command.{out,err}"
          89: ```
          90: 
          91: The **session-dir + naming** part MUST come from
          92: [`scratch-artifact-naming`](../general/file/scratch-artifact-naming/SKILL.md) —
          93: run its `resolve-scratch-path.py` (which also creates the dir) instead of
          94: computing the path by hand. Use the bundled script
          95: [`scripts/ensure-scratch-gitignored.py`](scripts/ensure-scratch-gitignored.py)
          96: to perform the setup and emit the absolute session-scoped scratch path on
          97: stdout:
          98: 
          99: ```bash
          100: REPO="$(git rev-parse --show-toplevel)"
          101: python3 "$REPO/.agents/skills/repo-scratch-output-capture/scripts/ensure-scratch-gitignored.py" >/dev/null
          102: STEM="$(python3 "$REPO/.agents/skills/general/file/scratch-artifact-naming/scripts/resolve-scratch-path.py" \
          103:     --repo "$REPO" --purpose my-command)"
          104: my-command > "$STEM.out" 2> "$STEM.err"
          105: echo "Exit: $?  See $STEM.{out,err}"
          106: ```
          107: 
          108: ### 4.2 Inspection Protocol
          109: 
          110: After the command exits:
          111: 
          112: 1. Check exit code immediately (`echo $?`).
          113: 2. If non-zero: `tail -30 scratch/<purpose>.err` first (usually has the failure summary), then `.out`.
          114: 3. If zero but result uncertain: `grep <verdict> scratch/<purpose>.out`; check `.err` for warnings.
          115: 
          116: ### 4.3 Cleanup
          117: 
          118: The `scratch/` folder is ephemeral by design — delete contents freely.
          119: Do NOT commit scratch files. If a captured file is valuable enough to keep, move it to a tracked
          120: location.
          121: 
