          1043: 
          1044: ### Step 4 — Formatting & Structural Partitioning
          1045: 
          1046: Stylistic and structural changes MUST be explicitly separated from
          1047: functional commits.
          1048: 
          1049: #### 4a — Formatting & Stylistic Consolidation
          1050: 
          1051: **Target:** Purely aesthetic changes — indentation, whitespace,
          1052: Markdown header-level corrections, single blank line adjustments.
          1053: 
          1054: **Rule:** If multiple files require these adjustments, club them into a
          1055: single dedicated commit. Commit type: `style`.
          1056: 
          1057: **Trivial hunks:** A single blank-line insertion or removal (e.g.,
