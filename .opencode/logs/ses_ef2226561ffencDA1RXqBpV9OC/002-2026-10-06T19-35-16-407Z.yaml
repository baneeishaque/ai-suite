          42: | `--state {exists,missing,any}` | No | Gate on state-file presence (default: `any`; mismatch exits 2) |
          43: | `--since ISO_TIMESTAMP` | No | Filter sessions by `st_mtime >= timestamp` (e.g. `2026-09-19T10:00:00`) |
          44: | `--pending-ttl SECONDS` | No | In-flight (`*-pending-*.yaml`) markers older than this are stale; `0` disables (default: `3600`) |
          45: | `--dry-run` | No | Print discovered paths (repo_root, log_dir, base scripts) as JSON and exit without extractors |
          46: 
