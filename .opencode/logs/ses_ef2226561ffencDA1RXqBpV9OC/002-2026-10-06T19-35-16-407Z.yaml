          120: 4. If `--dry-run`: emits discovery JSON and exits
          121: 5. Orders `ses_*/` dirs pending-marker-first then newest-mtime (filtered by `--since` if given), probes top 5 in
          122:    parallel via `ThreadPoolExecutor` (order-preserving `executor.map`), accepting the first header in that order
          123:    whose `session.id` parses; warns on stderr when multiple sessions have in-flight turns
          124: 6. Runs `sort-by-mtime.py` on `.opencode/logs/` with glob `*.yaml` and `--limit 1`
          125: 7. Parses JSON Lines output to get the newest file path
          126: 8. Runs `extract-field.py` twice: once for `session.id`, once for `title`
          127: 9. Checks for `.opencode/logs/<sid>.state.json`
          128: 10. Applies `--state` gate (exit 2 on mismatch; `--json` still prints payload)
          129: 11. Prints results (incl. the pending-marker flag)
