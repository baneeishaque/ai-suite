          68: `title` is `null` when the YAML header has no `title` key.
          69: 
          70: ## Protocol
          71: 
          72: 1. Run `python3 scripts/find-current-session.py`
          73: 2. Read stdout for session ID, title, state-file presence, and the pending-marker flag.
          74: 3. Verify before use: `Pending marker: yes` confirms the winning session has an
          75:    in-flight turn — the strongest "you are inside this session" signal.
          76:    `Pending marker: no` means selection fell back to newest-mtime; accept it only
