          37: | ---------- | ---------- | ------------- |
          38: | _(none)_ | — | Runs the full pipeline with auto-discovered repo root and log dir |
          39: | `--log-dir PATH` | No | Override `.opencode/logs/` directory (default: `<repo-root>/.opencode/logs` or `$OPENCODE_LOGS_DIR`) |
