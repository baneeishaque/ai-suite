          78:    ambiguous and surface the candidates instead of guessing.
          79: 4. Never substitute a session ID remembered from artifact filenames, scratch
          80:    folders, or earlier conversation — IDs change on fork; re-run discovery at the
          81:    point of use.
          82: 
          83: ## Edge Cases
          84: 
          85: - **No YAML logs exist**: exits 1 with "could not find newest YAML log"
          86: - **YAML header missing session.id**: exits 1 with the header path and base stderr detail
          87: - **Newest header corrupt**: next-newest `ses_*/` dir is tried before the flat fallback
          88: - **No state file**: still succeeds (reports "missing") unless `--state exists` (exits 2)
          89: - **`--since` filters all sessions**: exits 1 with "could not find newest YAML log"
          90: - **Symlinked log dir**: follows symlinks via `Path.rglob`
          91: - **Concurrent sessions in the same repo**: selection is pending-marker-first —
