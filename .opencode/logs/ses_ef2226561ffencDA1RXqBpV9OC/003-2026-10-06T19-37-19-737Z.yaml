          403: ## Pitfalls & Recovery
          404: 
          405: | Symptom | Recovery |
          406: |---|---|
          407: | `git stash push -u` returned `No local changes to save` | Sequence has nothing to snapshot — verify the §3.3 mandate even applies (≥ 2 commits AND non-empty working tree). Skip this skill if both conditions don't hold. |
