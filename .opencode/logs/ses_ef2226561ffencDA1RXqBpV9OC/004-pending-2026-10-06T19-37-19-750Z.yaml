          1: ---
          2: name: git-pre-execution-safety-stash
          3: description: Capture a verifiable working-tree safety snapshot via apply-not-pop stash before executing any multi-commit sequence, with end-of-session no-op verification and gated drop.
          4: category: Git & Repository Management
          5: ---
          6: 
          7: # Git Pre-Execution Safety Stash Skill
          8: 
          9: > **Skill ID:** `git-pre-execution-safety-stash`<br>
          10: > **Version:** 1.0.0<br>
          11: > **Standard:** [Agent Skills (agentskills.io)](https://agentskills.io)
          12: 
          13: ## Description
          14: 
          15: Before executing any multi-step Git commit sequence — atomic commit
          16: construction batches, history refinement runs, rebase chains, hunk-staged
          17: splits — capture a single high-fidelity snapshot of the full working tree
          18: (tracked modifications, staged hunks, AND untracked files), immediately
          19: re-apply it, and retain the stash entry until end-of-session verification
          20: proves every planned change reached HEAD. The retained stash is the
          21: cheapest, highest-fidelity rollback primitive available against accidental
          22: `git checkout`, `git reset`, IDE crash, interrupted rebase, or stale-disk
          23: recovery loss during long multi-commit sequences.
          24: 
          25: This skill is invoked by composer skills (atomic-commit construction,
          26: history refinement, rebase standardization) and runs in three phases:
          27: **Snapshot** (before execution), **Hold** (during execution — never
          28: dropped), **Verify-and-Release** (after execution, only on clean no-op).
          29: 
          30: ## Source Rules
          31: 
          32: | Rule File | Scope Incorporated |
          33: |---|---|
          34: | [`git-atomic-commit-construction-rules.md` §3.3](../../../ai-agent-rules/git-atomic-commit-construction-rules.md) | Pre-Execution Safety Stash mandate |
          35: | [`git-operation-rules.md` §5](../../../ai-agent-rules/git-operation-rules.md) | Stash preservation — drop / pop / clear require explicit per-stash user authorization |
          36: 
          37: ## Prerequisites
          38: 
          39: | Requirement | Minimum |
          40: |---|---|
          41: | VCS | Git 2.x+ |
          42: | Shell | PowerShell 5.1+ or Bash 4+ |
          43: | State | Working tree may be dirty (the whole point); HEAD on a real branch (not detached) |
          44: 
          45: ## When to Apply
          46: 
          47: Apply this skill when:
          48: 
          49: - About to execute a sequence of two or more commits authored under
          50:   [`git-atomic-commit-construction`](../git-atomic-commit-construction/SKILL.md).
          51: - About to execute any batch under §3.2 Batch-by-Batch Authorization.
          52: - About to run [`git-history-refinement`](../git-history-refinement/SKILL.md),
          53:   [`git-rebase-standardization`](../git-rebase-standardization/SKILL.md), or
          54:   [`git-commit-edit`](../git-commit-edit/SKILL.md) against a dirty working
          55:   tree where hunk-by-hunk staging will run.
          56: - About to run an interactive rebase across more than two pick lines.
          57: 
          58: Do NOT apply when:
          59: 
          60: - Executing a single-commit, single-file change with no hunk splitting.
          61: - The working tree has zero modifications and zero untracked files —
          62:   `git stash push` would no-op, but the apply-back verification step
          63:   becomes meaningless.
          64: - The destructive disposition of pre-existing stashes is itself the
          65:   task — invoke [`git-stash-triage`](../git-stash-triage/SKILL.md)
          66:   first; this skill creates a NEW snapshot, it does not classify
          67:   legacy ones.
          68: 
          69: ---
          70: 
          71: ## Step-by-Step Procedure
          72: 
          73: ### Phase 1 — Snapshot (before first commit of the sequence)
          74: 
          75: #### 1a — Inventory pre-existing stashes
          76: 
          77: ```powershell
          78: git -C <repo-path> --no-pager stash list
          79: ```
          80: 
          81: If the output is non-empty, each entry MUST be classified via
          82: [`git-stash-triage`](../git-stash-triage/SKILL.md) BEFORE pushing
          83: the safety stash. Pushing a safety stash on top of an unclassified
          84: stash stack creates ambiguity at verification time about which
          85: `stash@{N}` is "ours."
          86: 
          87: #### 1b — Author a descriptive snapshot message
          88: 
          89: The message MUST encode at minimum:
          90: 
          91: - Purpose token `safety:` (distinct from feature WIP, mixed work,
          92:   triage-bucket markers).
          93: - A short description of the upcoming sequence (e.g.,
          94:   `pre-batch-2 snapshot of commits 7..11 family-unit introduction`).
          95: - A change-count summary (e.g., `12 modified + 8 untracked`).
          96: - An ISO date (e.g., `2026-05-17`).
          97: 
          98: Example:
          99: 
          100: ```text
          101: safety: pre-batch-1-remainder snapshot of 14 modified + 8 untracked entries before commits 5..N land (2026-05-17)
          102: ```
          103: 
          104: The `safety:` prefix is the canonical marker that lets the verification
          105: phase (and any future triage) identify this stash entry unambiguously.
          106: 
          107: #### 1c — Push the snapshot with untracked files included
          108: 
          109: ```powershell
          110: git -C <repo-path> stash push -u -m "<message-from-1b>"
          111: ```
          112: 
          113: The `-u` flag is MANDATORY — untracked files are first-class working-tree
          114: state per the §3.3 mandate, and a snapshot without them defeats the
          115: rollback purpose for any sequence that introduces new files.
          116: 
          117: #### 1d — Immediately apply back
          118: 
          119: ```powershell
          120: git -C <repo-path> stash apply
          121: ```
          122: 
          123: **Apply, NOT pop.** Pop would drop the stash entry on success, defeating
          124: the rollback contract. `apply` leaves the entry intact on the stash stack
          125: while restoring every line to the working tree.
          126: 
          127: #### 1e — Verify post-apply parity
          128: 
          129: ```powershell
          130: git -C <repo-path> status --short | Measure-Object | Select-Object -ExpandProperty Count
          131: ```
          132: 
          133: The line count MUST equal the pre-stash status line count. Any mismatch
          134: indicates the apply was partial (typically due to an IDE file-lock —
          135: see Phase 1f).
          136: 
          137: ```powershell
          138: git -C <repo-path> stash list | Select-String '^stash@\{0\}: .* safety: '
          139: ```
          140: 
          141: The line MUST be present. If absent, the push failed silently — re-run
          142: 1c and 1d.
          143: 
          144: #### 1f — IDE File-Lock Recovery During Apply
          145: 
          146: `git stash apply` can fail mid-stream on Windows when the IDE (VS Code,
          147: Eclipse, IntelliJ) holds open file handles on a directory the apply
          148: needs to delete or restore:
          149: 
          150: ```text
          151: Deletion of directory '<path>' failed. Should I try again? (y/n)
          152: ...
          153: warning: failed to remove <path>: Permission denied
          154: ```
          155: 
          156: The stash push itself succeeded (verify with 1e step 2); only the apply
          157: is partial. Recovery options, in order of preference:
          158: 
          159: 1. **Close the indexing tool window** for the affected workspace (or
          160:    stop the JDT Language Server / Eclipse builder), then re-run
          161:    `git stash apply`. The second apply typically succeeds.
          162: 2. **Move the offending directory out of the way** (`Move-Item`), re-run
          163:    apply, then restore the moved directory by `git checkout -- <path>`
          164:    if it is tracked or by `Move-Item` back if untracked.
          165: 3. **Apply via an isolated worktree** per
          166:    [`git-dependent-branch-restack-cascade`](../git-dependent-branch-restack-cascade/SKILL.md)
          167:    §4.6 pattern, then cherry-pick the apply into the main worktree.
          168: 
          169: In all cases the stash entry MUST remain on the stack — never `pop`
          170: during recovery.
          171: 
          172: #### 1g — Stash-Apply Conflict Recovery via Selective File Extraction
          173: 
          174: When `git stash apply` fails because a live editor (VS Code, Copilot,
          175: Eclipse, IntelliJ) rewrote files between the `push` and `apply` commands,
          176: the standard recovery options in 1f (close editor → retry apply, move
          177: offending directory) may not work — the editor instantly regenerates the
          178: conflicting files. Do NOT retry `git stash apply`; each retry reproduces
          179: the same conflicts. Instead, extract files **selectively** from the intact
          180: stash entry as each commit in the planned sequence is executed.
          181: 
          182: **Prerequisite**: You MUST have an approved Arranged Commits Preview (from
          183: [`git-atomic-commit-construction`](../git-atomic-commit-construction/SKILL.md)
          184: §3 — the Verbose Display) that lists every planned commit and the files
          185: it needs. Without this plan, selective extraction has no target.
          186: 
          187: **Procedure — repeat for each planned commit in sequence:**
          188: 
          189: 1. **Identify needed files**. From the Arranged Commits Preview, list the
          190:    exact file paths the current commit requires.
          191: 
          192: 2. **Compare each file against the stash**. For every file the commit needs:
          193:    - **If tracked** (exists in HEAD): `git diff stash@{0} -- <file>` shows
          194:      whether the stash holds a different version. An empty output means the
          195:      working tree already matches the stash; skip extraction.
          196:    - **If untracked** (new file not yet in HEAD): `git ls-tree stash@{0}^3`
          197:      lists untracked files captured by the `-u` flag. Check if `<path>`
          198:      appears in that listing.
          199: 
          200: 3. **Extract the desired stash version**:
          201:    - **Tracked files**: `git checkout stash@{0} -- <file>`
          202:    - **Untracked files**: `git show stash@{0}^3:<path> > <path>`
          203:      (The `^3` suffix addresses the untracked-tree parent of a stash —
          204:      `stash@{0}^3` is the tree object that `git stash push -u` captured.)
          205: 
          206: 4. **Verify extraction**:
          207: 
          208:    ```bash
          209:    git diff <file>
          210:    # MUST show the stashed content now present in the working tree
          211:    # (no diff means the working tree already matched stash)
          212:    ```
          213: 
          214: 5. **Stage and commit** per the approved plan using normal atomic-commit
          215:    construction procedures (`git add <file>`, `git commit -m "..."`).
          216: 
          217: 6. **Repeat** for the next planned commit.
          218: 
          219: **Example** — commit 1 needs `src/foo.ts` and `src/bar.ts`:
          220: 
          221: ```bash
          222: # Compare tracked files against stash
          223: git diff stash@{0} -- src/foo.ts       # shows stash has changes
          224: git diff stash@{0} -- src/bar.ts       # empty — working tree matches
          225: 
          226: # Extract foo.ts from stash
          227: git checkout stash@{0} -- src/foo.ts
          228: 
          229: # Verify extraction
          230: git diff src/foo.ts                    # no diff = correct
          231: 
          232: # Stage and commit per plan
          233: git add src/foo.ts src/bar.ts
          234: git commit -m "feat(foo): implement core logic"
          235: ```
          236: 
          237: **Safety guarantees**:
          238: 
          239: - The stash entry (`stash@{0}`) is NEVER modified by `git checkout
          240:   stash@{0} -- <file>` or `git show stash@{0}^3:<path>` — these are
          241:   read-only operations against the stash object. The stash remains
          242:   intact for end-of-session Phase 3 verification.
          243: - Files whose working-tree version was intentionally preferred over
          244:   the stash version (e.g., because the live editor's changes are
          245:   desired) are simply skipped in step 2 — no extraction, no conflict.
          246: - After all planned commits land, proceed to **Phase 3**
          247:   (Verify-and-Release) as normal. The stash is retained for the full
          248:   verification cycle; it MUST NOT be dropped without user authorization
          249:   per Phase 3d.
          250: 
          251: **When NOT to use this procedure**:
          252: 
          253: - The stash apply succeeded (even partially). Use Phase 1e/1f instead.
          254: - You do not have an Arranged Commits Preview identifying per-commit
          255:   files. Without a plan, you cannot know which files belong to which
          256:   commit — abort and re-plan first.
          257: - The stash itself is corrupted or missing (`git stash list` shows no
          258:   `safety:` entry). A fresh Phase 1 capture is required.
          259: - The stash is **not a safety stash** (no `safety:` prefix) — it is a
          260:   stale or pre-existing stash. Delegate to
          261:   [`git-stash-triage`](../git-stash-triage/SKILL.md) §4d (Selective File
          262:   Restoration — Per-File Triage) instead, which covers the general
          263:   per-file extraction protocol for any stash.
          264: 
          265: ---
          266: 
          267: ### Phase 2 — Hold (during the commit sequence)
          268: 
          269: #### 2a — Never drop the safety stash mid-sequence
          270: 
          271: The agent MUST NOT run `git stash drop`, `git stash pop`, or
          272: `git stash clear` between Phase 1 and Phase 3. If the user requests
          273: unrelated stash work mid-sequence, route them through
          274: [`git-stash-triage`](../git-stash-triage/SKILL.md) and disambiguate
          275: by `safety:` message prefix.
          276: 
          277: #### 2b — Re-verify presence at batch boundaries
          278: 
          279: For sequences running under §3.2 batch-by-batch authorization, before
          280: emitting the next batch preview run:
          281: 
          282: ```powershell
          283: git -C <repo-path> stash list | Select-String '^stash@\{0\}: .* safety: '
          284: ```
          285: 
          286: A missing entry MUST halt the sequence — the snapshot has been lost
          287: and a fresh Phase 1 capture is required before resuming.
          288: 
          289: ---
          290: 
          291: ### Phase 3 — Verify-and-Release (after the final commit of the sequence)
          292: 
          293: #### 3a — Capture the post-execution working-tree fingerprint
          294: 
          295: ```powershell
          296: $preApplyStatus = git -C <repo-path> status --short
          297: ```
          298: 
          299: If the working tree is clean (`$preApplyStatus` empty), every planned
          300: change reached HEAD. If non-empty, classify the residue:
          301: 
          302: - **Expected**: Files deliberately left unstaged for a later batch (matches
          303:   the Master Plan Table from §3.2). These remain after release.
          304: - **Unexpected**: Files that should be in HEAD but aren't — investigate
          305:   before release. Do NOT proceed to 3b until resolved.
          306: 
          307: #### 3b — Apply the safety stash on top of the current tree
          308: 
          309: ```powershell
          310: git -C <repo-path> stash apply
          311: ```
          312: 
          313: #### 3c — Verify the apply is a clean no-op
          314: 
          315: ```powershell
          316: $postApplyStatus = git -C <repo-path> status --short
          317: # Compare line-by-line against $preApplyStatus
          318: if (Compare-Object $preApplyStatus $postApplyStatus -SyncWindow 0) {
          319:   Write-Host '[FAIL] Apply produced a delta — DO NOT drop the stash.'
          320: } else {
          321:   Write-Host '[OK] Apply was a no-op — every planned change is in HEAD.'
          322: }
          323: ```
          324: 
          325: **Interpretation**:
          326: 
          327: - **Clean no-op** → Every line in the snapshot is also in HEAD (or in
          328:   the expected residue). The stash is now redundant and safe to drop
          329:   after user authorization (Phase 3d).
          330: - **Apply produced a delta** → Some snapshot content is NOT in HEAD.
          331:   Either a planned commit was skipped or partially applied, OR the
          332:   residue analysis in 3a missed something. The stash MUST be retained
          333:   for forensic recovery. Re-investigate before any drop.
          334: - **Merge conflicts during 3b apply** → The working tree has diverged
          335:   from the snapshot in a way that would discard snapshot content.
          336:   Resolve manually using `git checkout -- <file>` from the stash, or
          337:   abort with `git checkout .` and investigate. The stash MUST be retained.
          338: 
          339: #### 3c.1 — Optional: stronger per-file content audit
          340: 
          341: The `stash apply` no-op check in 3c proves the working tree didn't *change*
          342: when the stash was re-applied — strong evidence that snapshot content is in
          343: HEAD, but it is a *delta*-level check. For higher confidence (especially
          344: when the stash captured untracked files via `-u`, where `apply` does NOT
          345: restore tracked-blob equality information), run the
          346: [`git-ref-content-audit`](../git-ref-content-audit/SKILL.md) per-file
          347: blob-equality audit:
          348: 
          349: ```bash
          350: python3 .agents/skills/git-ref-content-audit/scripts/audit-ref-content.py \
          351:     --repo <repo-path> \
          352:     --stash 0 \
          353:     --ref-b HEAD \
          354:     --show-diffs
          355: ```
          356: 
          357: A `✅ FULLY SUPERSEDED` verdict upgrades 3c from "no delta on re-apply" to
          358: "every stashed blob byte-equal at HEAD". A `⚠️ PARTIALLY SUPERSEDED`
          359: verdict surfaces deliberate post-stash refinements that the `apply` no-op
          360: would have masked silently — inspect each `DIFFERENT` file before deciding.
          361: A `❌ NOT SUPERSEDED` verdict is a HARD STOP: do not proceed to 3d.
          362: 
          363: #### 3d — Gated drop with explicit user authorization
          364: 
          365: ONLY after 3c (and, if used, 3c.1) reports clean no-op / full supersession:
          366: 
          367: ```text
          368: The safety stash has been verified as a clean no-op against HEAD. Drop
          369: stash@{0}? (yes / no / inspect-first)
          370: ```
          371: 
          372: - **yes** → `git stash drop stash@{0}`.
          373: - **no** → Retain indefinitely. Recommend re-running 3b after any
          374:   further commits to re-verify.
          375: - **inspect-first** → Run `git stash show -u stash@{0}` and `git stash
          376:   show -p stash@{0}` for full content review before deciding.
          377: 
          378: The drop MUST NOT be automated even when 3c is clean — per
          379: [`git-operation-rules.md` §5](../../../ai-agent-rules/git-operation-rules.md),
          380: every destructive stash operation requires explicit per-stash user
          381: authorization.
          382: 
          383: ---
          384: 
          385: ## Composition by Higher-Level Skills
          386: 
          387: | Composer Skill | Role of this skill in the pipeline |
          388: |---|---|
          389: | [`git-atomic-commit-construction`](../git-atomic-commit-construction/SKILL.md) §3.3 | Mandatory invocation before the first commit of any sequence of ≥ 2 commits, including every batch under §3.2 Batch-by-Batch Authorization. |
          390: | [`git-history-refinement`](../git-history-refinement/SKILL.md) | Captures the working tree before destructive history rewrites, providing a rollback path independent of the backup branch (which only covers committed history). |
          391: | [`git-rebase-standardization`](../git-rebase-standardization/SKILL.md) | Captures the working tree before any rebase that runs against a dirty tree (the rebase will otherwise refuse or stash-implicitly). |
          392: | [`git-commit-edit`](../git-commit-edit/SKILL.md) | Captures the working tree before interactive rebase with hunk-splitting. |
          393: 
          394: ## Related Skills
          395: 
          396: | Skill | Relationship |
          397: |---|---|
          398: | [`git-stash-triage`](../git-stash-triage/SKILL.md) | **Prerequisite when stash list is non-empty at Phase 1a.** Classifies pre-existing stash entries so the `safety:` push lands at a known position on the stack. Also provides §4d (Selective File Restoration — Per-File Triage) for stale stashes where Phase 1g does not apply. |
          399: | [`untracked-scratch-triage`](../untracked-scratch-triage/SKILL.md) | When Phase 3a residue includes unexpected untracked files (e.g., hunk-stage backup sidecars per §4.3), classifies them before deciding whether to drop the safety stash. |
          400: | [`git-ref-content-audit`](../git-ref-content-audit/SKILL.md) | Optional Phase 3c.1 per-file blob-equality audit between the safety stash (including its `^3` untracked tree) and HEAD — upgrades the `apply` no-op check from delta-level to byte-level supersession proof. |
          401: | [`git-worktree-state-fingerprint`](../git/basic/audit/git-worktree-state-fingerprint/SKILL.md) | Read-only byte-level worktree state capture/compare (no stash entry involved) — the complementary verification primitive when the proof requirement is "the working tree did not change" rather than "the working tree can be rolled back"; useful for bracketing any multi-commit sequence without touching the stash stack. |
          402: 
          403: ## Pitfalls & Recovery
          404: 
          405: | Symptom | Recovery |
          406: |---|---|
          407: | `git stash push -u` returned `No local changes to save` | Sequence has nothing to snapshot — verify the §3.3 mandate even applies (≥ 2 commits AND non-empty working tree). Skip this skill if both conditions don't hold. |
          408: | `git stash apply` fails with `CONFLICT` after a successful push | Working tree advanced between push and apply (rare — typically a parallel `git pull`). Resolve conflicts manually, then re-verify 1e. Never `git checkout .` here — it discards the conflict markers. |
          409: | `git stash apply` fails because a live editor (VS Code, Copilot, Eclipse, IntelliJ) rewrote files and `git checkout .` / close-editor did not resolve the conflict | Do NOT retry apply. Switch to **Phase 1g** — Selective File Extraction from Stash — to extract per-commit files from `stash@{0}` individually, working through the approved commit plan one commit at a time. The stash remains intact for end-of-session verification. |
          410: | Stale stash (not a `safety:` stash) with divergent apply that Phase 1g does not cover (no planned commit sequence) | Delegate to [`git-stash-triage`](../git-stash-triage/SKILL.md) §4d (Selective File Restoration — Per-File Triage) for general per-file extraction without a pre-planned commit sequence. |
          411: | Stash list now shows multiple `safety:` entries | A prior sequence's verification was skipped. Inspect each via `git stash show -u stash@{N}` and verify-then-drop oldest-first using Phase 3 against each. |
          412: | Phase 3c shows persistent delta on files matching `*.bak` / `*.full.bak` | Hunk-stage backup sidecars per §4.3 were not cleaned up — delete the sidecars, re-run 3b. |
          413: | End-of-session verification skipped (agent terminated mid-sequence) | The safety stash remains valid for the recovery window. Resume with Phase 2b verification, then proceed with the remaining commits OR Phase 3 directly if the sequence completed externally. |
          414: | Detached HEAD at Phase 1a | `git stash` works in detached HEAD but `stash apply` after a checkout will appear to "lose" the apply on the original commit. Checkout the intended branch first, then capture. |
          415: 
          416: ## Source Conversations
          417: 
          418: | Date | Topic |
          419: |---|---|
          420: | 2026-05-17 | First codification — extracted from the batch-1-remainder execution discipline that surfaced a `.bak` sidecar leftover and an IDE file-lock during stash apply. |

