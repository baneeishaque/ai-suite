      ## 4. Checklists, pitfalls, appendices, verification gates

      - **Scope Coverage table** (1548): functional = one logical unit/commit; formatting = dedicated `style`; refactors = dedicated `refactor`; config coupled with functional change; submodule pointer coupled with main-repo config; submodule auto-sync offer after every submodule commit; generated vs custom = Foundation + Customization commits; CI/CD managed excluded.
      - **Prohibited Behaviors** (1563–1593, 13 items): auto-committing without explicit "start"; auto-pushing; mixing concerns; staging untracked without confirmation; `git reset --hard` for sync; skipping the commit preview; excluding untracked files from initial analysis; predicting commit content in plans; editing generated files directly; generic commit messages; command chaining (`&&`) — FORBIDDEN; batching hunk responses; skipping empty commits during rebase without user confirmation; bulk-deleting directories with mixed tracked/untracked files.
      - **Related Skills** (1595–1622): git-submodule-commit-details (MANDATORY for Step 6 metadata); git-commit-metadata-extraction; git-commit-preview-verify (post-execution verification, §2d.2); git-history-refinement; claude-config-change-gate (pre-flight; BLOCKS if only trivial timestamp changes → commit SHOULD be cancelled); repo-scratch-output-capture; git-hunk-staging-primitives (base skill, 5 primitives); **git-commit-dangling-link-audit — MANDATORY pre-flight before finalizing any preview that reorders/moves paths: run the link classifier, then Gate 4 on ranges.**
      - **Composition Rationale** (1624): this skill is a composer; does NOT re-implement hunk-staging primitives; delegates to `git-hunk-staging-primitives`; adds commit-preview mandates, deferred cross-reference handling, adjacent-lines fallback, HEAD-synthesis.
      - **Common Pitfalls** (1639–1665, 24 rows). Highlights beyond those already cited: use `git ls-files` as tracked-file source of truth; `.gitignore` negation (`!dir/*.zip`) and renamed-dir references; `git mv` fails on empty dirs; `git add -p` split on adjacent lines → `stage-file-excluding-lines.py`; formatting fix during feature work → separate commit; dependency coupling (A depends on B → same commit); corrupted `rebase-merge` removal; body must add WHY; submodule pointer verify remote; submodule sync uses "Changes"/"Metadata" headers + chronological logs; IDE noise (`.project`/`.classpath`) never auto-discarded, present sample diff; `.settings/` never bulk-deleted; `.project` changes attributed to JDT Language Server (embedded m2e), not the Maven UI extension; indent drift repair before `git add` (§3g); verify `@@` headers; use `~~~diff` fences; re-run `git diff` after edits before rewriting preview.
      - **Verification gates scattered through the doc:** user "start" authorization (§2e); per-batch "start" (>5 commits, §2g); safety stash ≥2 commits (§2h); dangling-link audit before finalizing reorder/move previews; claude-config-change-gate pre-flight; redaction pre-check (§1g, after Step 1f and any new file mid-session); sidecar-empty gate (§3h); post-commit file-set verification (§9j).
      - **Redaction pre-check (§1g):** scan new/modified files for org-specific Jira IDs (`PROJ-1234` → `<TICKET-ID>`), internal repo URLs (`<org>/<repo>` → `<ORG>/<REPO>`), cross-repo `../` links (run `detect-cross-repo-links.py` from redaction-portability), org names/codenames/hostnames/usernames, project-specific skill names in base-published skills; remediation via redaction-portability placeholders; re-run audit; cite redaction-portability as a dependency in commits touching skill/rule files.

