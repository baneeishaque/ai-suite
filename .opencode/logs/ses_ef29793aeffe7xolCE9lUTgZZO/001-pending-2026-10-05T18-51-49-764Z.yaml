      ## 7. `git-commit-message-delivery` (multi-line message primitive)

      **§9i — Commit Message Delivery (Safe Pattern)** delegates entirely to [`git-commit-message-delivery`](../git-commit-message-delivery/SKILL.md) and mandates the **heredoc → `-F`** pattern (base skill §1.2) for all multi-line or special-character messages:

      ```bash
      cat > /tmp/commit_msg <<'EOF'
      <type>(<scope>): <title>

      <body>
      EOF

      git commit -F /tmp/commit_msg
      rm -f /tmp/commit_msg
      ```

      "Do NOT use `git commit -m '...'` when the message is multi-line or contains shell-special characters (`'`, `$`, `` ` ``)." See the base skill for the complete pattern reference and selection criteria.

      (Observation for the caller: this snippet writes to `/tmp/commit_msg`, which is the skill's verbatim instruction; the repo AGENTS.md scratch rule prefers session-scoped `scratch/<session-id>/`, but the skill itself does not adapt the path.)

