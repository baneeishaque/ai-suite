      - **Update:** §2d.1 — iterative fixup on user line-number feedback; fix and **re-write** `scratch/commit-preview.md`, re-present; loop until user confirms; do NOT begin execution until user says "start".
      - **Verification:** §2d.2 — after all commits execute (or resuming a session), cross-check preview vs `git log`:
        ```bash
        python3 .agents/skills/git/basic/edit/git-commit-preview-verify/scripts/verify-commit-preview.py \
            --preview scratch/commit-preview.md \
            --format text
        ```
        Parses `Commit N:` sections (any heading level), cross-references titles against `git log --oneline`; `--format json` for machine-readable. Manual fallback: read `scratch/commit-preview.md`, extract `Commit N:` titles, run `git log --oneline -20`, report done/pending.
      - **Deletion (cleanup):**
        ```bash
        # Automated (with verification gate)
        python3 .agents/skills/git/basic/edit/git-commit-preview-verify/scripts/verify-commit-preview.py \
            --preview scratch/commit-preview.md \
            --cleanup

        # Manual
        trash scratch/commit-preview.md
        ```
        **MUST NOT be deleted until all commits are confirmed executed; if any pending, retain for the next session.**
      - **Batching (>5 commits, §2g):** split preview into batches of ≤5, separate `"start"` per batch; after each batch emit `Batch N committed: SHA1, SHA2, …`; first batch must include a top-level Master Plan Table (`# | type(scope): title | files | batch`).
      - **Interleaving/deferred refs (§2f/§2f.1):** registry/index rows ship in the same commit as the artifact; cross-references to not-yet-existing artifacts must be deferred to the commit that lands the target (via `stage-file-excluding-lines.py`).

