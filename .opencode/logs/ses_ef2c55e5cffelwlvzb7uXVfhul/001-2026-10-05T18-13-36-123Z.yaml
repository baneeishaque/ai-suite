          | Parameter | Type | Default | Description |
          |---|---|---|---|
          | `separator` | String | `"/"` | Character between branch-name segments. |
          | `prefix` | String (max 50) | `"dependabot"` | Prepended to branch name. |
          | `max-length` | Integer (20–244) | `100` | Max branch-name length; over-limit names truncated with a hash suffix. |
          | `word-separator` | String | Not set | Replaces underscores `_` in content after prefix. |
          | `branch-name-case` | String | Not set | Case transform after prefix. |
          | `template` | String (max 200) | Not set | Custom format using placeholders. |

          - **`separator` supported values: `"-"`, `_`, `/`.** With `separator: "-"`: `dependabot/npm_and_yarn/lodash-4.17.21` → `dependabot-npm_and_yarn-lodash-4.17.21`. Tip: the hyphen must be escaped in YAML so it isn't read as an empty list.
          - `branch-name-case` values: `"lowercase"`, `"uppercase"`.
          - Processing order when `template` is combined with simple options: template rendering → separator replacement → word-separator replacement → case transform after prefix → max-length truncation.
