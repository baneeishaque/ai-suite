          ## 2. `directories` / `directory` (lines 257–274)

          - **Required option.** Defines location of package manifests per manager.
          - `directory` = single directory; `directories` = list of multiple directories.
          - Relative to repository root for most package managers.
          - GitHub Actions: use `/` — Dependabot searches the `/.github/workflows` directory plus `action.yml/action.yaml` from the root.
          - Dev containers: use `/` — searches `.devcontainer.json`, `.devcontainer/devcontainer.json`, and `.devcontainer/<anything>/devcontainer.json` from root.
          - Multiple blocks for one target branch/ecosystem must be unique with **no overlap in directories**.
          - Note (line 273–274): "The `directories` key supports globbing and the wildcard character `*`. These features are not supported by the `directory` key."

          ## 3. `schedule` (lines 715–803)

          Required option. Subkey table: `interval` (required), `day` (weekly only), `time`, `cronjob` (if interval is `cron`), `timezone`.

          - **`interval`** supported values: `daily`, `weekly`, `monthly`, `quarterly`, `semiannually`, `yearly`, `cron` — **cron is supported**.
            - daily = every weekday Mon–Fri; weekly = once a week, default Monday; monthly = first day of month; quarterly = first day of each quarter (Jan/Apr/Jul/Oct); semiannually = first day of Jan and Jul; yearly = first day of January; cron = cron-expression scheduling.
            - Note: `quarterly`, `semiannually`, `yearly` only on GitHub Enterprise Server from 3.19.
          - **`day`**: `monday`, `tuesday`, `wednesday`, `thursday`, `friday`, `saturday`, `sunday`.
          - **`time`**: format `hh:mm`; default interpretation UTC.
          - **`cronjob`**: "Valid cron expression in cron syntax or natural expression." 5 fields: minute 0–59, hour 0–23, day of month 1–31, month 1–12 or JAN–DEC, day of week 0–6 or SUN–SAT. Examples: `0 9 * * *`, `every day at 5pm`. Notes: timezone must be in `timezone`, not in `cronjob`; a `cronjob` is required to use the `cron` interval. Verbatim example:

          ```yaml
          version: 2
          updates:
            - package-ecosystem: "npm"
              directory: "/"
              schedule:
                interval: "cron"
                cronjob: "0 9 * * *"
          ```

          - **`timezone`**: IANA tz-database identifier; default `UTC`.

          ## 4. `open-pull-requests-limit` (lines 497–511)

          - Default behavior: if **five** version-update PRs are open, no further version-update PRs are raised until some are merged/closed.
          - Security-update PRs are **not subject to this limit and do not count toward it**; no limit on open security-update PRs.
          - Value is an integer; "A large value can be set to effectively remove the open pull request limit."
          - Setting it to **zero** temporarily disables version updates for that package manager.
          - No explicit documented maximum in this copy.

          ## 5. `groups` (lines 280–347)

          Behavior: matching updates are combined into a single PR; if a dependency matches multiple rules it goes to the **first matching group**; unmatched outdated deps get individual PRs.

          Parameters (verbatim table):

          | Parameter | Purpose |
          |---|---|
          | `IDENTIFIER` | Group identifier used in branch names and PR titles. Must start and end with a letter; may contain letters, pipes `\|`, underscores `_`, or hyphens `-`. |
          | `applies-to` | Which update type the group applies to. Default when undefined: version updates. Values: `version-updates` or `security-updates`. |
          | `dependency-type` | Limit group to a type. Values: `development` or `production`. |
          | `exclude-patterns` | One or more patterns to exclude dependencies from the group. |
          | `group-by` | Group updates across multiple directories. Supported value: `dependency-name`. |
          | `patterns` | One or more patterns to include dependencies with matching names. |
          | `update-types` | Limit to SemVer levels. Values: `minor`, `patch`, `major`. |

          Sub-details:
          - `dependency-type` (`groups`) supported by: `bundler`, `composer`, `mix`, `maven`, `npm`, `pip`. Default = all types.
          - `group-by`: used as `groups.<group-name>.group-by`; Type String; accepted `dependency-name`; applies with multiple directories. Creates one PR per dependency update across all directories. Limitations: all directories must use the same ecosystem; version updates only; incompatible version constraints cause separate PRs.
          - `patterns`/`exclude-patterns`: `*` wildcard supported; a dependency matching both is excluded from the group.
          - `update-types`: default all SemVer; `patch`/`minor`/`major` inclusive.

