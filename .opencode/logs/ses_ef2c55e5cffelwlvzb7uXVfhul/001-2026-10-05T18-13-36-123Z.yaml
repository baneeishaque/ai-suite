          ## 6. `multi-ecosystem-groups` (lines 456–495)

          Behavior: updates across multiple ecosystems in the same group are combined into one PR; "Groups have their own schedules and can inherit or override individual ecosystem settings."

          Reference mechanism: each `updates` entry declares `multi-ecosystem-group: "<GROUP>"`. Verbatim example:

          ```yaml
          # Basic `dependabot.yml` file defining a multi-ecosystem-group
          version: 2

          multi-ecosystem-groups:
            infrastructure:
              schedule:
                interval: "weekly"

          updates:
            - package-ecosystem: "docker"
              directory: "/"
              patterns: ["nginx", "redis"]
              multi-ecosystem-group: "infrastructure"

            - package-ecosystem: "terraform"
              directory: "/"
              patterns: ["aws"]
              multi-ecosystem-group: "infrastructure"
          ```

