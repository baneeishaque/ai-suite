          ## 7. `versioning-strategy` (lines 900–937)

          Supported by: `bundler`, `cargo`, `composer`, `helm`, `mix`, `npm`, `pip`, `pub`, `uv`.

          Defaults: `auto` — apps get `increase`, libraries get `widen`.

          | Value | Behavior |
          |---|---|
          | `auto` | Default behavior. |
          | `increase` | Always increase minimum version requirement to match new version; if a range exists, typically only raises the lower bound. |
          | `increase-if-necessary` | Leave requirement unchanged if it already allows the new release (resolved version still updated); otherwise widen. |
          | `lockfile-only` | Only create PRs to update lockfiles; ignore versions needing manifest changes. |
          | `widen` | Widen allowed requirements to include new and old versions; typically only raises the maximum. |

          Example (current `1.0.0`, constraint `^1.0.0`): new `1.2.0` → increase `^1.2.0`, increase-if-necessary `^1.0.0`, widen `^1.0.0`; new `2.0.0` → increase `^2.0.0`, increase-if-necessary `^2.0.0`, widen `>=1.0.0 <3.0.0`. Unsupported ecosystems are invited to submit PRs to dependabot-core.

