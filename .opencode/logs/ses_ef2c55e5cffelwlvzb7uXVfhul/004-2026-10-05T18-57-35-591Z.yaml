          1: ---
          2: name: git-commit-message-delivery
          3: description: Base primitive — safely pass multi-line commit messages containing
          4:     shell-special characters to `git commit` without escaping failures, and
          5:     verify commit contents with reliable path listing.
          6: category: Git & Repository Management
          7: ---
          8: 
          9: # Git Commit Message Delivery Skill (v1) — Base Primitive
          10: 
          11: > **Skill ID:** `git-commit-message-delivery`<br>
          12: > **Version:** 1.0.0<br>
          13: > **Standard:** [Agent Skills (agentskills.io)](https://agentskills.io)
          14: 
          15: ## Description
          16: 
          17: When constructing a commit, the agent must deliver the message to `git commit`
          18: without shell-escaping failures and verify the resulting commit contains the
          19: expected files. This skill documents three delivery patterns with clear
          20: selection criteria, plus the reliable verification technique.
          21: 
          22: ### Message Delivery Problem
          23: 
          24: `git commit -m '...'` breaks when the message contains:
          25: 
          26: | Character | Why it breaks |
          27: |-----------|---------------|
          28: | `'` (single quote) | Closes the shell quoting — `it's` becomes `git commit -m 'it'` with trailing `s'` as garbage |
          29: | `$` (dollar sign) | Triggers variable expansion — `$variable` is replaced by its value |
          30: | `` ` `` (backtick) | Starts subshell execution |
          31: | Newlines | Multi-line `-m` messages are fragile across shells |
          32: 
          33: ### Verification Problem
          34: 
          35: `git show --stat` truncates long file paths to fit terminal width:
          36: 
          37: ```
          38: .../ai-agent-rules/git-operation-rules.md
          39: ```
          40: 
          41: A `grep` or `Select-String` on the stat output may miss matches because the
          42: truncated path no longer matches the expected string. `--name-only` outputs
          43: every file path in full with no truncation.
          44: 
          45: ---
          46: 
          47: ## 1. Delivery Pattern Reference
          48: 
          49: ### 1.1 `-m` (Simple single-line messages)
          50: 
          51: Safe when the message is a single line with no `"`, `$`, or `` ` `` characters.
          52: 
          53: ```bash
          54: git commit -m "docs(rules): add widget lifecycle protocol"
          55: ```
          56: 
          57: **Limitations:**
          58: - `'` is safe inside double-quoted `-m` in bash/zsh, but `'` inside `-m '...'` breaks
          59: - `$` and `` ` `` must be escaped (`\$`, `` \` ``)
          60: - Newlines require fragile `\n` concatenation
          61: - **Forbidden for multi-line messages or any content that contains characters whose shell interaction is uncertain**
          62: 
          63: ### 1.2 Heredoc → `-F` (Safe for all content)
          64: 
          65: **RECOMMENDED for multi-line or special-character messages.** Use a heredoc to
          66: write the message to a temp file, then pass via `-F`:
          67: 
          68: ```bash
          69: cat > /tmp/commit_msg <<'EOF'
          70: feat(api): add user registration endpoint
          71: 
          72: - Implements POST /api/v1/users with validation
          73: - Adds email uniqueness check before insert
          74: - Returns 201 with user ID on success
          75: EOF
          76: 
          77: git commit -F /tmp/commit_msg
          78: ```
          79: 
          80: **Key details:**
          81: - `<<'EOF'` (quoted delimiter) prevents ALL shell interpolation — `$`, `` ` ``, and `'` are passed verbatim
          82: - Use a unique temp file path per invocation: `/tmp/commit_msg.$$` or `/tmp/commit_msg.$(date +%s)`
          83: - `git commit -F` reads the file; no shell parsing of the message occurs
          84: - Clean up: `rm -f /tmp/commit_msg` immediately after the commit succeeds
          85: 
          86: **Why not embed inside `-m` with `$()`?** `git commit -m "$(cat <<'EOF' ...)"` still
          87: exposes the message to the shell's `-m` argument parsing; any characters that
          88: interact with the outer double-quoting (`"`, `$`, `` ` ``) can still break.
          89: 
          90: ### 1.3 `GIT_EDITOR` script (Reword / Amend)
          91: 
          92: When Git invokes the editor for `reword`, `amend`, or interactive rebase, delegate
          93: message writing to a script that replaces `$1`:
          94: 
          95: ```bash
          96: cat > /tmp/commit_msg.sh <<'SCRIPT'
          97: #!/bin/sh
          98: cat > "$1" <<'MSG'
          99: feat(api): add user registration
          100: 
          101: Implementation notes:
          102: - Uses bcrypt for password hashing
          103: - Rate-limited to 10 requests/min per IP
          104: MSG
          105: SCRIPT
          106: 
          107: chmod +x /tmp/commit_msg.sh
          108: GIT_EDITOR=/tmp/commit_msg.sh git commit --amend
          109: rm -f /tmp/commit_msg.sh
          110: ```
          111: 
          112: This is the canonical pattern used by
          113: [`git-commit-message-reword`](../git-commit-message-reword/SKILL.md) and
          114: [`git-commit-message-bulk-reword`](../git-commit-message-bulk-reword/SKILL.md).
          115: 
          116: ---
          117: 
          118: ## 2. Verification Pattern
          119: 
          120: ### 2.1 Reliable file listing — `--name-only`
          121: 
          122: After a commit, verify the file set with:
          123: 
          124: ```bash
          125: git show --name-only HEAD
          126: ```
          127: 
          128: This outputs every file path in full, one per line. Pipe to `grep` for targeted
          129: checks:
          130: 
          131: ```bash
          132: git show --name-only HEAD | grep "git-operation-rules.md"
          133: ```
          134: 
          135: Use this for **programmatic path matching** — it never truncates.
          136: 
          137: ### 2.2 Full diff inspection
          138: 
          139: When you need to verify both the file set AND the content:
          140: 
          141: ```bash
          142: git show HEAD          # full diff with paths
          143: git show --stat HEAD   # summary with line counts
          144: ```
          145: 
          146: Use `--stat` only for human-readable summaries, never for programmatic path
          147: matching.
          148: 
          149: ### 2.3 Detecting stat truncation
          150: 
          151: If `--stat` output is the only data available, detect truncation by checking
          152: for leading `...`:
          153: 
          154: ```bash
          155: git show --stat HEAD | grep '\.\.\./'
          156: ```
          157: 
          158: Any match indicates path truncation. Switch to `--name-only` for reliable
          159: matching. The `.../` prefix signals Git clipped the path to fit terminal width.
          160: 
          161: ---
          162: 
          163: ## 3. When to Apply
          164: 
          165: Apply this skill whenever you need to:
          166: 
          167: - Construct a `git commit` command with a multi-line or special-character message
          168: - Verify that a commit contains the expected file paths
          169: - Debug a shell-escaping error in a commit-message command
          170: 
          171: Do NOT apply when:
          172: 
          173: - The commit message is a single short line with no special characters
          174:   (`git commit -m "..."` is sufficient)
          175: - You are inspecting commit *content* (diff hunks) rather than the file
          176:   manifest — use `git show` or `git diff` directly
          177: 
          178: ---
          179: 
          180: ## 4. Common Pitfalls
          181: 
          182: | Pitfall | Solution |
          183: |---------|----------|
          184: | `-m '...'` with `'` in message produces shell syntax error | Switch to heredoc → `-F` pattern (§1.2) |
          185: | `git show --stat | grep <file>` misses known-committed files | Use `git show --name-only` instead (§2.1) |
          186: | Temp file path collision in parallel shells | Use unique paths: include `$$` or `$(date +%s)` in the filename |
          187: | Forgetting to remove temp file after commit | Add `rm -f <file>` as the next command after `git commit -F` succeeds |
          188: 
          189: ---
          190: 
          191: ## Prohibited Behaviors
          192: 
          193: - **Using `-m` for multi-line messages** — line breaks are fragile across shells
          194: - **Using `-m '...'` when the message contains single quotes** — always switch to heredoc → `-F`
          195: - **Relying on `--stat` output for programmatic path matching** — truncation makes it unreliable; use `--name-only`
          196: 
          197: ---
          198: 
          199: ## Related Skills
          200: 
          201: - [`git-atomic-commit-construction`](../git-atomic-commit-construction/SKILL.md) — primary consumer; Step 10 references this skill's delivery and verification patterns
          202: - [`git-commit-message-reword`](../git-commit-message-reword/SKILL.md) — consumer of the `GIT_EDITOR` pattern (§1.3)
          203: - [`git-commit-message-bulk-reword`](../git-commit-message-bulk-reword/SKILL.md) — consumer of the `GIT_EDITOR` pattern (§1.3)

          (End of file - total 203 lines)
