          1: ---
          2: name: git-commit-preview-verify
          3: description: Verify whether commits listed in a commit-preview markdown file have been executed against git history, with optional cleanup.
          4: category: Git & Repository Management
          5: ---
          6: 
          7: # Git Commit Preview Verify Skill
          8: 
          9: > **Skill ID:** `git-commit-preview-verify`<br>
          10: > **Version:** 1.0.0<br>
          11: > **Standard:** [Agent Skills (agentskills.io)](https://agentskills.io)
          12: 
          13: ## Description
          14: 
          15: Provides a deterministic, domain-agnostic primitive for verifying
          16: whether the commits listed in a commit-preview markdown file have been
          17: executed against git history. It parses the standard §2d preview format
          18: produced by [`git-atomic-commit-construction`](../../../../git-atomic-commit-construction/SKILL.md),
          19: cross-references each `Commit N:` title against `git log --oneline`, and
          20: reports each arranged commit as `done` or `pending`.
          21: 
          22: The primitive supports human-readable text output and machine-readable
          23: JSON, plus an optional `--cleanup` gate that deletes the preview file
          24: ONLY when every listed commit is verified as executed — so a partially
          25: executed plan never loses its handoff artifact.
          26: 
          27: ## Environment & Dependencies
          28: 
          29: | Requirement | Minimum |
          30: | --- | --- |
          31: | Git | 2.x |
          32: | Python | 3.10+ |
          33: 
          34: Verify:
          35: 
          36: ```bash
          37: git --version
          38: python3 --version
          39: ```
          40: 
          41: ## When to Apply
          42: 
          43: Apply this skill when:
          44: 
          45: - A user points to an existing `scratch/commit-preview.md` and asks "is
          46:   this done?" or "check if these commits were made".
          47: - Resuming a session that previously generated a commit preview but may
          48:   not have executed all commits.
          49: - Auditing whether a planned commit sequence was fully executed.
          50: - Cleaning up a stale preview file after all commits are confirmed
          51:   executed.
          52: 
          53: Do NOT apply when:
          54: 
          55: - The preview has not been written yet — use
          56:   [`git-atomic-commit-construction`](../../../../git-atomic-commit-construction/SKILL.md)
          57:   §2d to generate it first.
          58: - The user wants to verify individual commit content — use
          59:   [`git-commit-metadata-extraction`](../../../../git-commit-metadata-extraction/SKILL.md).
          60: - The user wants to split or rewrite existing commits — use
          61:   [`git-history-refinement`](../../../../git-history-refinement/SKILL.md).
          62: 
          63: ## Scripts (Public CLI Contract)
          64: 
          65: The deterministic Tier-A primitive is
          66: [`scripts/verify-commit-preview.py`](scripts/verify-commit-preview.py)
          67: per `script-over-instruction-decomposition`. It is read-only by default
          68: and never mutates the working tree unless `--cleanup` is passed with all
          69: commits done.
          70: 
          71: ```bash
          72: python3 scripts/verify-commit-preview.py --preview <path> [--repo <path>] [--format text|json] [--cleanup]
          73: ```
          74: 
          75: | Flag | Meaning |
          76: | --- | --- |
          77: | `--preview PATH` | Path to the commit-preview markdown file (required) |
          78: | `--repo PATH` | Git repository root (default: auto-detect from CWD) |
          79: | `--format text\|json` | Output format (default: `text`) |
          80: | `--window N` | `git log` window size in commits (default: 50) |
          81: | `--cleanup` | Delete the preview file only when ALL commits are done |
          82: 
          83: ### Examples
          84: 
          85: ```bash
          86: # Text report (default)
          87: python3 scripts/verify-commit-preview.py --preview scratch/commit-preview.md
          88: 
          89: # Machine-readable JSON
          90: python3 scripts/verify-commit-preview.py --preview scratch/commit-preview.md --format json
          91: 
          92: # Verify, then delete the preview (only fires when all commits done)
          93: python3 scripts/verify-commit-preview.py --preview scratch/commit-preview.md --cleanup
          94: ```
          95: 
          96: ### Exit Codes
          97: 
          98: | Code | Meaning |
          99: | --- | --- |
          100: | 0 | All commits verified as executed |
          101: | 1 | One or more commits not found in git log |
          102: | 2 | Preview file not found or unreadable |
          103: | 3 | Not inside a git repository (and `--repo` not provided / invalid) |
          104: | 4 | Preview file contains no parseable commit entries |
          105: 
          106: ### Input / Output Format
          107: 
          108: The parser accepts the §2d preview's `Commit N:` section headers at any
          109: heading level (`## Commit 1: <title>` or `### Commit 1: <title>`). For
          110: each entry it records `{ index, title, status, sha }`. `status` is
          111: `done` when the title matches a line of `git log --oneline -<window>`
          112: (returning that line's SHA), otherwise `pending` with a null SHA.
          113: 
          114: Text output:
          115: 
          116: ```text
          117: Commit Preview Verification
          118: ==========================
          119: Preview: scratch/commit-preview.md
          120: Repository: /Users/dk/lab-data/ai-suite
          121: 
          122:  #  Status   SHA       Title
          123:  1  done     febd2a47  docs(gists-ai-prompts): add commit preview instruction log entries
          124: 
          125: Result: 5/5 commits executed
          126: ```
          127: 
          128: JSON output:
          129: 
          130: ```json
          131: {
          132:   "preview_file": "scratch/commit-preview.md",
          133:   "repo": "/Users/dk/lab-data/ai-suite",
          134:   "total": 5,
          135:   "done": 5,
          136:   "pending": 0,
          137:   "commits": [
          138:     { "index": 1, "title": "docs(gists-ai-prompts): ...", "status": "done", "sha": "febd2a47" }
          139:   ]
          140: }
          141: ```
          142: 
          143: ### Cleanup Semantics
          144: 
          145: - `--cleanup` deletes the preview file and prints `Cleaned up: <path>`
          146:   ONLY when `pending == 0`.
          147: - If any commit is pending, cleanup is refused with a warning and the
          148:   exit code is 1 — the preview MUST be retained for the next session.
