          730:     private fun generateSheetOfUser(
          731: 
          732:         currentUserName: String,
          733:         currentUserId: UInt,
          734:         getDesiredAccountIdsForSheetOfUser: (MultipleTransactionResponse) -> IsOkModel<MutableMap<UInt, String>>,
          735:         isNotApiCall: Boolean = true,
          736:         isConsoleMode: Boolean,
          737:         isDevelopmentMode: Boolean
          738: 
          739:     ): IsOkModel<String> {
          740: 
          741:         if (isConsoleMode && isDevelopmentMode) {
          742: 
          743:             println("currentUser : $currentUserName")
          744:         }
          745: 
          746:         val multipleTransactionDataSource = MultipleTransactionDataSource()
          747: 
          748:         if (isNotApiCall && isDevelopmentMode) {
          749: 
          750:             println("Contacting Server...")
          751:         }
          752: 
          753:         val apiResponse: Result<MultipleTransactionResponse>
          754: 
          755:         val userInitialTransactionDateFromUsernameResult: IsOkModel<LocalDate> =
          756:             DataOperations.getUserInitialTransactionDateFromUsername(username = currentUserName)
          757: 
          758:         if (userInitialTransactionDateFromUsernameResult.isOK) {
          759: 
          760:             //TODO : Only applicable for user_first_entry_date usernames
          761:             val specifiedDate: IsOkModel<String> = MysqlUtils.normalDateTextToMySqlDateText(
          762: 
          763:                 //TODO : migrate to DateTimeUtils
          764:                 normalDateText = DataOperations.getUserInitialTransactionDateFromUsername(username = currentUserName).data!!
          765:                     .minusDays(
          766:                         /* daysToSubtract = */ 1
          767:                     ).format(DateTimeUtils.normalDatePattern)
          768:             )
          769:             if (specifiedDate.isOK) {
          770: 
          771:                 //TODO : migrate to ApiUtilsCommon
          772:                 runBlocking {
          773: 
          774:                     apiResponse = multipleTransactionDataSource.selectUserTransactionsAfterSpecifiedDate(
          775: 
          776:                         userId = currentUserId,
          777:                         specifiedDate = specifiedDate.data!!
          778:                     )
          779:                 }
          780: 
          781:                 // println("Response : $apiResponse2")
          782:                 if (apiResponse.isFailure) {
          783: 
          784:                     if (isNotApiCall) {
          785: 
          786:                         println("Error : ${(apiResponse.exceptionOrNull() as Exception).localizedMessage}")
          787:                         do {
          788: 
          789:                             print("Retry (Y/N) ? : ")
          790:                             when (readln()) {
          791: 
          792:                                 "Y", "" -> {
          793: 
          794:                                     return generateSheetOfUser(
          795: 
          796:                                         currentUserName = currentUserName,
          797:                                         currentUserId = currentUserId,
          798:                                         getDesiredAccountIdsForSheetOfUser = getDesiredAccountIdsForSheetOfUser,
          799:                                         isConsoleMode = isConsoleMode,
          800:                                         isDevelopmentMode = isDevelopmentMode
          801:                                     )
          802:                                 }
          803: 
          804:                                 "N" -> {
          805: 
          806:                                     return IsOkModel(
          807: 
          808:                                         isOK = false,
          809:                                         error = ConstantsCommon.USER_CANCELED_MESSAGE
          810:                                     )
          811:                                 }
          812: 
          813:                                 else -> ErrorUtilsInteractive.printInvalidOptionMessage()
          814:                             }
          815:                         } while (true)
          816: 
          817:                     } else {
          818: 
          819:                         return IsOkModel(
          820: 
          821:                             isOK = false,
          822:                             error = Json.encodeToString(
          823: 
          824:                                 serializer = CommonDataModel.serializer(Unit.serializer()),
          825:                                 value = CommonDataModel(
          826: 
          827:                                     status = 1,
          828:                                     error = "Error : ${(apiResponse.exceptionOrNull() as Exception).localizedMessage}"
          829:                                 )
          830:                             )
          831:                         )
          832:                     }
          833:                 } else {
          834: 
          835:                     val selectUserTransactionsAfterSpecifiedDateResult: MultipleTransactionResponse =
          836:                         apiResponse.getOrNull()!!
          837:                     // TODO : migrate to ApiUtils
          838:                     if (selectUserTransactionsAfterSpecifiedDateResult.status == 1u) {
          839: 
          840:                         return IsOkModel(
          841: 
          842:                             isOK = false,
          843:                             error = Json.encodeToString(
          844: 
          845:                                 serializer = CommonDataModel.serializer(Unit.serializer()),
          846:                                 value = CommonDataModel(
          847: 
          848:                                     status = 2,
          849:                                     error = "No Transactions"
          850:                                 )
          851:                             )
          852:                         )
          853:                     } else {
          854: 
          855:                         val getDesiredAccountIdsForSheetOfUserResult = getDesiredAccountIdsForSheetOfUser(
          856:                             selectUserTransactionsAfterSpecifiedDateResult
          857:                         )
          858:                         if (getDesiredAccountIdsForSheetOfUserResult.isOK) {
          859: 
          860:                             val accounts: MutableMap<UInt, String> = getDesiredAccountIdsForSheetOfUserResult.data!!
          861: 
          862:                             val sheetDataRows: MutableList<BalanceSheetDataRowModel> = mutableListOf()
          863:                             for (account: MutableMap.MutableEntry<UInt, String> in accounts) {
          864: 
          865:                                 //TODO : migrate to ApiUtilsCommon
          866:                                 val apiResponse2: Result<MultipleTransactionResponse> =
          867:                                     ServerOperations.getUserTransactionsForAnAccount(
          868: 
          869:                                         userId = currentUserId,
          870:                                         accountId = account.key,
          871:                                         isNotFromBalanceSheet = false,
          872:                                         isDevelopmentMode = isDevelopmentMode
          873:                                     )
          874:                                 if (apiResponse2.isFailure) {
          875: 
          876:                                     if (isNotApiCall) {
          877: 
          878:                                         println("Error : ${(apiResponse2.exceptionOrNull() as Exception).localizedMessage}")
          879: //                            do {
          880: //                                print("Retry (Y/N) ? : ")
          881: //                                val input: String = readLine()!!
          882: //                                when (input) {
          883: //                                    "Y", "" -> {
          884: //                                    }
          885: //
          886: //                                    "N" -> {}
          887: //                                    else -> invalidOptionMessage()
          888: //                                }
          889: //                            } while (input != "N")
          890:                                     } else {
          891: 
          892:                                         return IsOkModel(
          893: 
          894:                                             isOK = false,
          895:                                             error = Json.encodeToString(
          896: 
          897:                                                 serializer = CommonDataModel.serializer(Unit.serializer()),
          898:                                                 value = CommonDataModel(
          899: 
          900:                                                     status = 1,
          901:                                                     error = "Error : ${(apiResponse2.exceptionOrNull() as Exception).localizedMessage}"
          902:                                                 )
          903:                                             )
          904:                                         )
          905:                                     }
          906:                                 } else {
          907: 
          908:                                     val userMultipleTransactionResponseResult: MultipleTransactionResponse =
          909:                                         apiResponse2.getOrNull()!!
          910:                                     if (userMultipleTransactionResponseResult.status == 0u) {
          911: 
          912:                                         var currentBalance = 0.0F
          913:                                         userMultipleTransactionResponseResult.transactions.forEach { currentTransaction: TransactionResponse ->
          914: 
          915:                                             if (currentTransaction.fromAccountId == account.key) {
          916: 
          917:                                                 currentBalance -= currentTransaction.amount
          918: 
          919:                                             } else {
          920: 
          921:                                                 currentBalance += currentTransaction.amount
          922:                                             }
          923:                                         }
          924:                                         if (currentBalance != 0.0F) {
          925: 
          926:                                             sheetDataRows.add(
          927: 
