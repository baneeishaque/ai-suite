          230:     These explainers MUST be pedagogical and deep, following the strict standards defined in **`code-explanation` (in the `ai-suite` repository)**.
          231: 
          232: - **Relative Links**: Documentation and explainers MUST use **Relative Links** (not absolute paths) to ensure the
          233:     rule set remains portable and functional in any local filesystem.
          234: 
          235: - **Environmental & Dependency Mandate**: Every `SKILL.md` MUST include a dedicated section for "Environmental Setup"
          236:   or "Environment & Dependencies". This section MUST instruct the agent to autonomously verify required tools
          237:   (e.g., `rclone`, `diff`) and provide installation logic for standard package managers (`brew`, `apt`, `yum`).
