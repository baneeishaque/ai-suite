          239: - **Artifact Linting Mandate**: All Markdown artifacts (Plans, Tasks, Walkthroughs, Skills, Rules) MUST be verified
          240:   with the **`markdownlint-cli2`** binary prior to user presentation. Any violations MUST be resolved.
          241:     - **Direct Execution (NO NPX)**: The agent MUST invoke the standalone binary directly (e.g.,
          242:       `markdownlint-cli2 <path>` and `markdownlint-cli2 --fix <path>`). Using `npx markdownlint-cli2` is
          243:       **FORBIDDEN** — it adds startup overhead, masks installation drift, and bypasses the project's pinned tool.
          244:     - **SSOT**: This mandate mirrors and is governed by
          245:       **[Markdown Generation Skill §5 (Validation Rules)](https://github.com/baneeishaque/ai-suite/blob/3786486bb54805fde12181bc8db34aaabede3e92/.agents/skills/markdown-generation/SKILL.md#5-validation-rules-markdownlint-cli2)**;
          246:       that section is the single source of truth for invocation, install path, and custom-rule resolution.
          247: 
          248: - **Status Traceability Mandate**: Plans used for rule-building or multi-phase tasks MUST mark completed steps with
          249:   `[DONE] [TIMESTAMP]` in the 'Proposed Changes' section to maintain execution context.
          250: 
          251: - **Multi-Project SSOT**: When providing multiple samples (e.g., CRA and Vite), the core logic MUST be extracted into
          252: 
          253:     a **Shared Library** folder. Samples MUST reference this shared core (e.g., via symbolic links or relative imports)
          254:     to maintain a Single Source of Truth and avoid code duplication.
          255: 
          256: - **Core Logic Links**: Rules defining complex logic MUST link to their respective architectural SSOT providers (e.g.,
          257: 
          258:     [Sync Logic](./zero-backend-sync-rules.md)).
          259: 
          260: - **Technology Independence & Depth**: Rules MUST be technology-independent in their core principles but MUST provide
          261: 
          262:     maximum-detail, industry-standard examples (e.g., Nostr, WASM, RxDB) that can be reused or generated as new
          263:     implementations according to the situation.
          264: 
          265: - **Inter-Document SSOT**: To maintain a Single Source of Truth across the rule
          266:     set, documentation MUST NOT duplicate content that exists in another
          267:     definitive rule file. Instead, it MUST use **Relative Section Links** to
          268:     refer the agent to the authoritative source (e.g., refer to the
          269:     `git-commit-message-rules.md` for formatting standards).
          270: - **Selection & Trade-offs**: Rules MUST clearly explain the options, trade-offs, and alternatives available for an
          271:     architectural pattern. The assistant MUST iterate with the USER to present all options (sorted by priority) and
          272:     discuss the best fit for the context before concluding with a final recommendation for approval.
          273: 
          274: - **Context Discovery Protocol**: Rules MUST mandate that the assistant:
          275:      1. **Identifies Context**: Detect build tools (Vite/CRA), frameworks (React/Vue), and identifiers (Email/PubKey).
          276:      1. **Confirms Context**: Explicitly ask the user to confirm the detected environment before proceeding.
          277: 
          278: - **SSOT (Single Source of Truth)**: Rules MUST mandate centralized Enums for any inter-process (Worker) or
          279: 
          280:     inter-component communication to prevent "magic string" typos.
          281: 
          282: - **Decoupled Configuration**: Parameters likely to change (Relays, Endpoints, feature toggles) MUST be isolated in
          283: 
          284:     machine-readable config files (JSON preferred).
          285: 
          286: - **Storage Logic Hierarchy**: Rules MUST provide a selection logic for storage (Relational -> NoSQL -> File -> Text)
          287: 
          288:     based on problem context. Priority MUST be documented (e.g., 1st, 2nd, 3rd) with clear rationale for each.
          289: 
          290: - **Git Hygiene & Rebase (Industrial Standard)**: Rules involving Git operations MUST mandate:
          291: 
          292: - **Hierarchical Rebase Mapping**: Using Mermaid diagrams for branch dependencies.
          293: 
          294: - **Commit Action Mapping (CAM)**: Standardized KEEP/REWORD/DROP/SQUASH tables.
          295: 
          296: - **Literal Exhaustive Plans**: Mandating exact CLI commands and message payloads (SSOT) to prevent execution-time
          297: 
          298:     ambiguity.
          299: 
          300: - **Performance Abstraction**: Mandate backgrounding (Workers/Threads) for all heavy logic (Crypto/Network) to ensure
          301: 
          302:     60 FPS UI stability.
          303: 
          304: - **Performance Abstraction**: Mandate backgrounding (Workers/Threads) for all heavy logic (Crypto/Network) to ensure
          305: 
          306:     60 FPS UI stability.
          307: 
          308: - **Coding Standards (SSOT & Safety)**:
          309: 
          310: - **Comment Style**: Comments MUST be placed *before* the code line or in block format. Avoid trailing comments after
          311: 
          312:     semicolons.
          313: 
          314: - **Deep Type Safety**: Implementations MUST avoid `any` and use deep typing for all data structures (e.g.,
          315: 
          316:     MessageEvent data).
          317: 
          318: - **Runtime & Type Safety**: The agent MUST prioritize both compile-time (TS) and runtime (Schema/Validation) safety.
          319: 
          320: - **Defensive Programming**: All network and I/O logic MUST implement defensive programming (e.g., try-catch, JSON
          321: 
          322:     validation, socket state checks) to prevent silent failures.
          323: 
          324: - **Real Usage Samples**: Rules for frameworks (React/Vue) MUST include a real integration sample showing
          325: 
          326:     component/hook orchestration.
          327: 
          328: - **Prohibited Behaviors**: Explicitly list actions the agent is forbidden from taking (e.g., "DO NOT hardcode keys",
          329: 
          330:     "DO NOT block UI"). These MUST be clear, non-ambiguous, and explained as the SSOT for what to avoid.
          331: 
          332: - **Traceability Portability**: Permanent records MUST be stored in the **main repository's** documentation directory
          333:     (`docs/`) using a structured hierarchy. When `ai-agent-rules/` is a Git submodule, records MUST NOT be placed
          334:     inside the submodule — use the main repo's `docs/` tree instead (e.g., `docs/implementation-plans/`,
          335:     `docs/conversations/`, `docs/walkthroughs/`).
          336:     - **Protocols**: All session or conversation logs MUST follow the protocols defined in
          337:       **[AI Agent Session Documentation Rules](./ai-agent-session-documentation-rules.md)**.
          338:     - **Relative Pathing**: For relative paths, artifact permanence, and link references, follow the
          339:       **File References** standards defined in **[Markdown Generation Skill](https://github.com/baneeishaque/ai-suite/blob/3786486bb54805fde12181bc8db34aaabede3e92/.agents/skills/markdown-generation/SKILL.md)**.
          340: 
          341: - **Redaction & Portability Mandate (SSOT)**: Every rule file, skill file (`SKILL.md`, `AGENTS.md`), session log,
          342:   case study, and committed artifact authored under these standards MUST be passed through the
          343:   **[Redaction & Portability Skill](https://github.com/Baneeishaque/ai-agents/blob/de777420fe2931e8ef43ea7a0aa9b27f7e6bf296/.agents/skills/redaction-portability/SKILL.md)**
          344:   (rules-side mirror: **[Redaction & Portability Rules](./redaction-portability-rules.md)**)
          345:   before commit. The skill is the authoritative SSOT; the rules-side mirror is the normative form referenced
          346:   by all other rules. The skill is the SSOT for: (a) the three-tier sensitivity model (Tier A identity/credentials,
          347:   Tier B machine/org topology, Tier C public/universal), (b) the canonical placeholder vocabulary
          348:   (`<workspace-root>`, `<user-home>`, `<toolbase>`, `<author>`, `<user>`, `<corp-proxy-host>`, `<corp-domain>`,
          349:   `<internal-vcs>`, `<ticket-system>`, `<customer>`, `<product-codename>`, etc.), (c) absolute-path relativization,
          350:   (d) author / username / email redaction, (e) internal-domain / proxy / ticket / customer redaction, (f) filename
          351:   hygiene, and (g) the verification-scan + encoding sanity-check audit steps. Rule files MUST NOT inline their
          352:   own redaction vocabulary or replacement tokens — they MUST defer to the Redaction skill. Ad-hoc placeholder
          353:   invention, half-redacted strings (e.g., `<corp-proxy-host>.<real-corp>.com`), and over-redaction of public
          354:   open-source identifiers (`Apache Commons`, `Eclipse`, `Maven Central`) are FORBIDDEN per Redaction §10.
          355: 
          356: - **Repository Scope Tier Mandate (SSOT, additive to Redaction)**: Every authored file lives in exactly one
          357:   publication-scope tier — **public** (e.g., the public `ai-agents` repo), **org-private** (e.g., a
          358:   `<corp>_ai_agents` sibling repo), or **personal** (e.g., a sandbox branch).
          359:   The tier is determined by the **enclosing Git repository**, not by the file's content or by any local
          360:   workspace layout. The cardinal premise — stated as the **Independence Axiom** in
          361:   [`redaction-portability-rules.md`](./redaction-portability-rules.md) §1.0 — is that the public and
          362:   org-private repos are **independent Git repositories** with separate clone URLs, separate publication
          363:   lifecycles, and separate existences; a developer may legitimately clone either one **standalone**.
          364:   Portability in this rule set is defined as **passing the Standalone-Clone Test**: "if I clone ONLY
