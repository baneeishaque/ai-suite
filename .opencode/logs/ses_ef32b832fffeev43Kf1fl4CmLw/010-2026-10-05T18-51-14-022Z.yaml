          452: 
          453: ## 4. Bash-Authoring Hygiene During Skill Creation
          454: 
          455: Skill authoring itself frequently mutates many files via bash. The same patterns that freeze the VS Code renderer during normal agent work also freeze it during skill-authoring sessions. Before any bash invocation a Factory author MUST satisfy:
          456: 
          457: 1. **One command per call.** No `;` / `&&` chaining unless required by a pipe.
          458: 2. **One path argument per call.** Iterate at the agent level, not in shell.
          459: 3. **No bash `grep -r` / `find` for searches.** Use the in-process `grep` / `glob` tools with `head_limit`.
          460: 4. **Heredoc body ≤ ~50 lines.** Split into multiple `cat >> file <<EOF` appends; for surgical insertions use Python `pathlib.Path.read_text() / write_text()` instead of `sed -i`.
          461: 5. **Bound every call's output.** Redirect unknowns to `scratch/` per [`repo-scratch-output-capture`](../repo-scratch-output-capture/SKILL.md).
          462: 
          463: The ten recurring freeze patterns, the eleven-item per-call self-audit checklist, and the post-freeze recovery protocol are owned by [`ide-renderer-freeze-prevention`](../ide-renderer-freeze-prevention/SKILL.md) — Factory authors enforce its §5 checklist on every bash call made during skill creation but do not re-document the patterns locally (SSOT).
          464: 
          465: ## 5. Skill-Doc Editing Discipline
          466: 
          467: Eight independent invariants govern in-place edits to existing skill docs (`SKILL.md`, `AGENTS.md`) so that one author's mutation does not leave broken references, duplicated sections, misplaced subsections, off-topic bloat, broken cross-reference links, too-narrow top-level headings, formatting drift, or numbering gaps for the next author to clean up.
          468: 
          469: ### 5.1 Post-Rename Cross-Reference Sweep
          470: 
          471: Whenever a skill-authoring task renames anything that other artifacts may reference:
          472: 
          473: - A heading anchor or section number (e.g., `§3c` → `§3b`)
          474: - A skill folder or skill identifier (e.g., `git-submodule-selective-init` → `git-submodule-selective-init-no-lfs`)
          475: - A file path, symbol name, or canonical placeholder
          476: 
          477: …the renamer MUST, **before reporting the task done**, sweep the entire affected tree for the OLD form and update every inbound hit in the same operation. The mechanics are Tier-A (per [`script-over-instruction-decomposition`](../script-over-instruction-decomposition/SKILL.md)) and are owned by the dedicated script — INVOKE the script, do NOT re-derive the sweep ad-hoc:
          478: 
          479: ```bash
          480: # 1. Dry-run preview (exit 1 if hits found, 0 if clean)
          481: .agents/skills/skill-factory/scripts/post-rename-sweep.py --old "<OLD>" --new "<NEW>"
          482: 
          483: # 2. Review the per-file hit listing; if all hits are legitimate inbound refs:
          484: .agents/skills/skill-factory/scripts/post-rename-sweep.py --old "<OLD>" --new "<NEW>" --apply
          485: 
          486: # 3. Verify zero residual hits (exit 0 == clean):
          487: .agents/skills/skill-factory/scripts/post-rename-sweep.py --old "<OLD>" --new "<NEW>"
          488: ```
          489: 
          490: The script auto-discovers repo root, applies safe default scopes (skill `.md`, skill `scripts/`, `ai-agent-rules/`, root `AGENTS.md`, `memories/repo/`), uses LITERAL string replacement only (no regex — per §5.1 a rename is always a literal-form change), and skips `.git/`, `node_modules/`, `__pycache__/`, `.venv/` unconditionally. Custom scope can be passed via repeatable `--scope <GLOB>`. The script is the SSOT for the sweep mechanics — do NOT fall back to bash `grep -r` (violates [`ide-renderer-freeze-prevention`](../ide-renderer-freeze-prevention/SKILL.md) §3 Pattern 2) or to inline Python re-implementation (violates [`script-over-instruction-decomposition`](../script-over-instruction-decomposition/SKILL.md) Consumer Discipline).
          491: 
          492: A rename is a refactor; every inbound reference is part of the refactor's scope. Stopping at the renamed file is an incomplete refactor and the user has to catch it.
          493: 
          494: **Insertion-induced renumbering counts.** "Rename" here includes any change that shifts the section's identifier, even when the heading TEXT is untouched. Specifically:
          495: 
          496: 1. **Insertion before**: adding a new `## N.` before an existing section bumps that section (and all successors) to `## (N+1).`. The displaced section has been renumbered — every inbound `§N` reference (whether self-referential within the same skill or cross-skill) becomes dangling and MUST be updated in the same edit.
          497: 2. **Deletion before**: removing a `## N.` shifts successors down by one. Same sweep obligation.
          498: 3. **Promotion / demotion**: moving `### N.M` up to `## (N+1).` or vice versa changes the citation form (`§N.M` ↔ `§(N+1)`). Same sweep obligation.
          499: 
          500: These no-text-change renumbers are the most-missed class because the diff looks small ("just inserted a new section, nothing else changed"). The cross-reference impact is identical to a text-rename. Apply §5.4 verification (`grep -n '^## \|^### ' <file>`) AND the inbound-sweep above on every numbered insertion / deletion / promotion.
          501: 
          502: **Self-referential references count too.** A `§N` citation inside the same skill that points to a now-renumbered sibling section is just as dangling as a cross-skill `§N`. Include the same file in the sweep target list — do not assume "the heading's just two screens above, I'd have noticed."
          503: 
          504: **Historical example**: in [`git-submodule-dead-upstream-audit`](../git-submodule-dead-upstream-audit/SKILL.md), an inbound reference *"The `curl` invocations in §2 follow…"* in §1 became dangling because the curl-introducing section is actually §3 (Upstream Reachability Probe) and §4 (Fork / Mirror Discovery) — not §2 (Pre-Audit Discovery, which uses only `git`). Whether the slip originated from an early-draft renumber or a typo, §5.4's verification step (numbering audit) combined with this §5.1 inbound-sweep would have caught it before the doc shipped.
          505: 
          506: ### 5.2 Cross-Reference Append Discipline
          507: 
          508: When adding an inbound back-link section (e.g., `## Composition by Higher-Level Skills`) to a target skill:
          509: 
          510: 1. First check whether the target already has that section (`grep -n "<section heading>" target/SKILL.md`).
          511: 2. If it does → append a **row to the existing table / bullet to the existing list**.
          512: 3. If it does NOT → create the section.
          513: 
          514: Never create a second heading of the same name. The skill-factory's "one section per topic" invariant must be preserved.
          515: 
          516: (Persisted as `permanent_discipline.post-rename-cross-reference-sweep`.)
          517: 
          518: ### 5.2.1 Composition-Table Membership & Description Discipline
          519: 
          520: The `## Composition by Higher-Level Skills` table on a base skill is NOT a catalog of "skills that mention this one" — it is the **inbound composition graph**. Three failure modes have been observed when authors append rows carelessly:
          521: 
          522: 1. **Unrelated skills listed**: a skill that neither composes nor consumes the base is added because its topic sounded adjacent. PROHIBITED — the table loses signal and downstream readers compose the wrong primitive.
          523: 2. **Merely related skills listed**: a sibling skill that shares a topic but does NOT invoke / depend on / extend the base is added. PROHIBITED in this table — such skills belong in the base's `## Related Skills` section instead. The Composition table is reserved for true composers (callers that pipe through the base's public contract) and consumers (skills that hard-depend on the base's output shape).
          524: 3. **Generic / non-contextual descriptions**: a true composer is listed but its description is a paraphrase of the composer's own one-liner ("does X with Y"). PROHIBITED — the description MUST state HOW the composer uses the base: which base section/script it invokes, what it pipes in, what it gets out, and (if applicable) at which stage of its own workflow.
          525: 
          526: **Acceptance criteria** for any new row in `## Composition by Higher-Level Skills`:
          527: 
          528: - [ ] The candidate skill ACTUALLY invokes the base skill (via script shell-out, explicit `§N` reference, or hard dependency on the base's output contract). If it merely shares a topic → move to `## Related Skills` instead.
          529: - [ ] The description names the **specific composition mechanism** — which section/script of the base is invoked, with what input, producing what output, at what stage of the composer's flow.
          530: - [ ] The description is NOT a copy of the composer's own description; it is written from the BASE skill's perspective ("Composer X feeds inputs A into §N of this skill; consumes output B at its Step M").
          531: 
          532: **Verification**: before declaring a Composition table edit done, open each newly-added row's composer and confirm a literal reference to the base skill exists (script include, `§N` citation, or relative link to the base SKILL.md). If no such reference exists, the row is misplaced — move it to `## Related Skills` or delete it.
          533: 
          534: (Persisted as `permanent_discipline.composition-table-membership-and-description-discipline`.)
          535: 
          536: ### 5.2.2 Composition Rationale Section Discipline
          537: 
          538: The `## Composition Rationale` section sits in the skill's front-matter zone (before `## 1.`) and answers a question the reader has on first arrival: **"why does this skill exist as a separate atomic unit, and how does it fit into the larger graph of skills?"** It is NOT a duplicate of `## Description` (which states what the skill does) and NOT a duplicate of `## Related Skills` (a flat list of adjacents). It is the **justification for atomicity + the upstream/downstream wiring statement**.
          539: 
          540: #### Purpose by skill role
          541: 
          542: - **Base skill** (owns a generic primitive consumed by others): Composition Rationale explains why the primitive was extracted as its own skill (typically: "multiple composers reuse it; inlining would split the SSOT") and names the known composer(s) that depend on its public contract. It MUST link to each composer.
          543: - **Composer skill** (calls one or more base skills via their public CLI / section contracts): Composition Rationale names every base skill it composes, the EXACT mechanism of composition (which script / section / CLI flag), and the domain-specific value the composer adds on top of the bases. It MUST link to each base.
          544: - **Standalone skill** (neither base nor composer): a one-paragraph statement of why the procedure is atomic and self-contained. Short. No table.
          545: 
          546: #### How a composer's Composition Rationale differs from a base's
          547: 
          548: | Aspect | Base skill | Composer skill |
          549: | --- | --- | --- |
