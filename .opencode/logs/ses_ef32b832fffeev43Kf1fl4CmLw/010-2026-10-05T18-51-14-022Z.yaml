          257: | `<repo-root>/AGENTS-github-copilot.md` | GitHub Copilot-specific instructions (delta only) | Manual |
          258: | **Per-skill bridge** `.agents/skills/<skill>/AGENTS.md` | Companion bridge for one skill | THIS subsection (§2.3) |
          259: 
          260: They are NOT the same artifact and MUST NOT be conflated. The per-skill bridge does not list other skills; the root-level files each serve their distinct roles. A failure to distinguish them has been observed where an author put per-skill bridge content into the root registry (or vice versa).
          261: 
          262: #### 2.3.2 Required Sections (Template)
          263: 
          264: The per-skill `AGENTS.md` MUST contain the following sections in this order:
          265: 
          266: 1. **`# <Skill Display Name> — Companion Bridge`** (level-1 heading; the literal suffix `— Companion Bridge` lets reviewers grep for bridges across the tree).
          267: 2. **`## Purpose`** (1–3 sentences). State that this file is the bridge for non-skill-aware runtimes and that the operational SSOT lives in [`SKILL.md`](SKILL.md).
          268: 3. **`## When This Skill Applies`** (1 short paragraph or 3–5 bullets). Plain-language trigger conditions, paraphrased from `SKILL.md`'s `## Description` and `## When to Apply` sections — NOT copy-pasted.
          269: 4. **`## Operational Procedure`** (1 sentence + the link). A single sentence directing the agent to `SKILL.md` for the procedure: *"Read [`SKILL.md`](SKILL.md) for the full operational procedure, including all mandates, scripts, and verification steps. Do NOT execute any step without first loading `SKILL.md` — this bridge is intentionally non-actionable."*
          270: 5. **`## Cross-References`** (optional bullet list). Relative links to closely-related skills and rule files. Use §5.6 (Cross-Reference Link Discipline) — proper relative markdown links, not bare code spans.
          271: 
          272: #### 2.3.3 Frontmatter Prohibition
          273: 
          274: The per-skill `AGENTS.md` MUST NOT carry YAML frontmatter (no leading triple-dash block). Frontmatter is the discriminator that distinguishes `SKILL.md` (skill-aware runtime metadata) from the bridge file. Adding frontmatter to `AGENTS.md` causes some runtimes to mis-classify it as a second skill registration and emit duplicate-name lint errors.
          275: 
          276: #### 2.3.4 Forbidden Content
          277: 
          278: The per-skill `AGENTS.md` MUST NOT contain:
          279: 
          280: 1. **Embedded scripts** (covered by §2.2.1 No-Embedded-Script Mandate — applies to ALL markdown in the skill, including the bridge).
          281: 2. **Duplicated rule content** from `SKILL.md` or from `ai-agent-rules/*.md`. The bridge paraphrases trigger conditions; operational mandates are not restated.
          282: 3. **Step-by-step procedures**. Any reader looking for the procedure MUST be sent to `SKILL.md`. The bridge is intentionally non-actionable so divergence between the two files is impossible.
          283: 4. **Long verbatim quotes** from `SKILL.md`. If the bridge starts copying paragraphs from `SKILL.md`, the bridge has overstepped its role and will drift on the next `SKILL.md` edit.
          284: 
          285: #### 2.3.5 Size Guidance
          286: 
          287: A correctly-scoped per-skill `AGENTS.md` is typically **40–120 lines** (Purpose + When + Operational pointer + Cross-References). Sub-40 lines suggests missing sections (e.g., no When-This-Applies); over-120 lines suggests content duplication that should be deleted and replaced with a pointer to `SKILL.md`. The size is a smell test, not a hard cap.
          288: 
          289: #### 2.3.6 Audience Clarification
          290: 
          291: The bridge serves **two audiences**:
          292: 
          293: 1. **Non-skill-aware agent runtimes** that auto-load `AGENTS.md` by filename convention. The bridge ensures these runtimes discover the skill and know to load `SKILL.md` for operational details.
          294: 2. **Human reviewers** browsing the skill folder who haven't yet opened `SKILL.md`. The bridge gives them a one-minute orientation before they commit to reading the full SSOT.
          295: 
          296: It is NOT for skill-aware runtimes — those load `SKILL.md` directly via the `agentskills.io` discovery contract and ignore the bridge.
          297: 
          298: #### 2.3.7 Audit Step
          299: 
          300: A bridge audit row is added to §3 Post-Drafting Checklist verifying that `<skill>/AGENTS.md` exists, has no frontmatter, contains the five required sections from §2.3.2, and is within the 40–120 line size guidance from §2.3.5. A skill with no bridge file is INCOMPLETE and MUST NOT be marked done.
          301: 
          302: ### 2.4 Registration
          303: 
          304: - Update the `AGENTS-legacy.md` skills table to register the new skill with its absolute path and description.
          305:     Use the shared registration helper instead of hand-editing the table:
          306: 
          307:     ```bash
          308:     python3 .agents/skills/git-hunk-staging-primitives/scripts/agents-md-stage-row.py \
          309:         --target AGENTS-legacy.md \
          310:         --mode worktree \
          311:         --row "| Skill Name | [\`.agents/skills/<skill-name>/SKILL.md\`](.agents/skills/<skill-name>/SKILL.md) | One-line description |"
          312:     ```
          313: 
          314:     `--mode worktree` reads the working-tree `AGENTS-legacy.md`, inserts the row at the alphabetically correct position,
          315:     and writes the result back to the working tree for normal `git add` review. The default `--mode staged`
          316:     is reserved for the Atomic Commit Construction §2f Interleaving Mandate when `AGENTS-legacy.md` already carries
          317:     unrelated pending hunks.
          318: - **Alphabetical Order Mandate**: The `AGENTS-legacy.md` skills table MUST remain sorted alphabetically (case-insensitive)
          319:   by the **Skill** column. New entries MUST be inserted at the correct sorted position \u2014 NEVER appended to the end.
          320:   After insertion, the Agent MUST visually verify that the row above and below the new entry maintain the sort order.
          321: - For layered pairs: register **both** the base and the composer in the same change at their respective sorted
          322:   positions, with the composer's row explicitly noting *"Composer — feeds X into the base Y skill"* so the dependency
          323:   is visible at the index level.
          324: - Registration is the LAST registration step: the §2.1 taxonomy-placement update (domain-grouping tree + changelog)
          325:   MUST be completed before the `AGENTS-legacy.md` row is added, so the index never advertises a skill the taxonomy
          326:   does not yet register.
          327: 
