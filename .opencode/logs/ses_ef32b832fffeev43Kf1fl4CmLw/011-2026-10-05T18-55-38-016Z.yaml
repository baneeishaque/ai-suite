          158: 
          159: Generic deletion rules (branch a):
          160: 
          161: 1. **User must initiate or explicitly confirm**: Never delete artifacts
          162:    without the user saying "yes", "delete", or "clean up".
          163: 2. **Batch deletions**: When user confirms cleanup, delete ALL stale
