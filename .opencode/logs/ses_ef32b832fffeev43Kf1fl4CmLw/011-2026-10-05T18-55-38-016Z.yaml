          13: ## Description
          14: 
          15: Before editing source code under any Git working tree, classify the
          16: enclosing repository as **canonical-source**, **workflow-backup**, or
          17: **mirror**. The audit blocks the "edited the wrong repo" mistake
          18: common in ecosystems where a workflow / backup / CI repo coexists with
          19: the canonical source repo and shares a similar name pattern.
