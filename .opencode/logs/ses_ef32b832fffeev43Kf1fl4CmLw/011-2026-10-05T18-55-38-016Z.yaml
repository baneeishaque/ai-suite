          544: - **Standalone skill** (neither base nor composer): a one-paragraph statement of why the procedure is atomic and self-contained. Short. No table.
          545: 
          546: #### How a composer's Composition Rationale differs from a base's
          547: 
          548: | Aspect | Base skill | Composer skill |
          549: | --- | --- | --- |
          550: | Direction of wiring | Downstream (lists who depends on me) | Upstream (lists what I depend on) |
          551: | Mandatory link targets | Every known composer | Every base skill composed |
          552: | Typical mechanism phrasing | "Composers shell out to `scripts/<base>.sh` and consume its stdout JSON contract" | "Pipes `<input-discovery-output>` into `<base>/scripts/<x>` via `$(dirname "$0")/../../<base>/scripts/<x>`" |
          553: | What it justifies | Why the primitive was extracted (SSOT) | Why the composer adds value beyond the base (domain knowledge, multi-base orchestration) |
          554: | Failure mode if missing | Composers re-implement the primitive (inline-duplication) | Base is invoked redundantly or the wrong base is chosen |
          555: 
          556: #### Quick decision rule (which section does a cross-skill link belong in?)
          557: 
          558: ```
          559: Is the OTHER skill INVOKED by this skill (script call / CLI / hard contract dep)?
          560: ├── YES → ## Composition Rationale (and the base lists me back under ## Composition by Higher-Level Skills)
          561: └── NO  → Is it topic-adjacent (same domain area but no invocation)?
          562:           ├── YES → ## Related Skills (one-line bullet, no mechanism prose)
          563:           └── NO  → Do NOT link it. Topic vagueness is not a reason to cross-link.
          564: ```
          565: 
          566: #### Example: a composer's Composition Rationale (maximum-detail template)
          567: 
          568: For a hypothetical `git-submodule-selective-init-no-lfs` skill that composes two bases — `git-submodule-selective-init` (the generic selective-init primitive) and `git-lfs-skip-smudge-env` (sets `GIT_LFS_SKIP_SMUDGE=1` in a scoped subshell) — the Composition Rationale would read:
          569: 
          570: ```markdown
          571: ## Composition Rationale
          572: 
          573: This skill is a composer: it does NOT re-implement selective submodule init logic, nor does it re-implement the LFS skip-smudge environment manipulation. It orchestrates two atomic base skills:
          574: 
          575: 1. **[`git-lfs-skip-smudge-env`](../git-lfs-skip-smudge-env/SKILL.md)** — invoked FIRST. The composer sources its `scripts/enter-skip-smudge.sh` via `source "$(dirname "$0")/../../git-lfs-skip-smudge-env/scripts/enter-skip-smudge.sh"` to export `GIT_LFS_SKIP_SMUDGE=1` for the current shell. This ensures any subsequent `git submodule update` invocation will fetch submodule trees without triggering LFS smudge filters (saves bandwidth + disk on repos with multi-GB LFS objects the caller does not need).
          576: 2. **[`git-submodule-selective-init`](../git-submodule-selective-init/SKILL.md)** — invoked SECOND. The composer shells out to its `scripts/init-selected-submodules.sh <path-glob>...` passing the user-supplied submodule path globs. The base script's stdout (one initialized submodule path per line) is consumed by this composer to confirm the selection matched and to surface progress.
          577: 
          578: The composer's domain-specific value-add over either base alone: a single CLI surface that guarantees the LFS-skip environment is active BEFORE the submodule update runs (ordering is critical — setting the env after the update is a no-op). Inlining either base would duplicate logic that other composers (`git-submodule-selective-init-shallow`, `git-lfs-mirror-skip-blobs`) also consume.
          579: 
          580: Bidirectional discoverability: both bases list this composer in their respective `## Composition by Higher-Level Skills` tables.
          581: ```
          582: 
          583: And the corresponding base-side entry (on `git-submodule-selective-init/SKILL.md`):
          584: 
          585: ```markdown
          586: ## Composition by Higher-Level Skills
          587: 
          588: | Composer | Composition Mechanism |
          589: |---|---|
          590: | [`git-submodule-selective-init-no-lfs`](../git-submodule-selective-init-no-lfs/SKILL.md) | Calls `scripts/init-selected-submodules.sh <glob>...` AFTER sourcing `git-lfs-skip-smudge-env`'s env-setter; consumes the one-path-per-line stdout to surface progress to the user. |
          591: | [`git-submodule-selective-init-shallow`](../git-submodule-selective-init-shallow/SKILL.md) | Calls `scripts/init-selected-submodules.sh <glob>...` with `GIT_SUBMODULE_DEPTH=1` pre-exported; relies on the base's exit code only (does not parse stdout). |
          592: ```
          593: 
          594: Note how each composer-table row names the EXACT script invoked, the input contract, the output contract consumed, and any ordering / env constraints. Generic descriptions like "uses selective init for the no-LFS variant" are FORBIDDEN per §5.2.1.
          595: 
          596: (Persisted as `permanent_discipline.composition-rationale-section-discipline`.)
          597: 
          598: ### 5.3 Subsection Insertion Position
          599: 
          600: When adding a new numbered subsection (e.g., `### 4.7`, `#### 3b`) to an existing skill, insert it at the **correct logical position by section number** — between the existing predecessor and successor — **never append at file end**.
          601: 
          602: The default `cat >> file <<EOF` heredoc pattern is fast but appends at end-of-file; for mid-file insertions use Python `pathlib.Path.read_text() / write_text()` with a string-anchor replacement instead:
          603: 
          604: ```python
          605: import pathlib
          606: p = pathlib.Path("path/to/SKILL.md")
          607: s = p.read_text(encoding="utf-8")
          608: target = "\n***\n\n## 5. Next Section"   # the successor
          609: new_block = "\n### 4.7 New Subsection\n\nBody…\n\n***\n"
          610: p.write_text(s.replace(target, new_block + "\n## 5. Next Section", 1), encoding="utf-8")
          611: ```
