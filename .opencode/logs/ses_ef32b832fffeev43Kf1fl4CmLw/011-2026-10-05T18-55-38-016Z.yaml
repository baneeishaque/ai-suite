          90: ### Step 3 — CAM §7.1 Enforcement (Verbatim-Superset Construction + Verification)
          91: 
          92: The Verbatim-Superset Construction mandate (CAM §7.1) is STRICTER than
          93: the historical restore-or-rationalize rule: vN+1 MUST be vN's text kept
          94: verbatim with vN+1's deltas appended — never rewritten, reworded,
          95: reordered, or selectively dropped (even with a Change History rationale).
          96: The construction is deterministic; the audit is post-hoc verification.
          97: 
          98: **BEFORE** presenting vN+1, do BOTH:
