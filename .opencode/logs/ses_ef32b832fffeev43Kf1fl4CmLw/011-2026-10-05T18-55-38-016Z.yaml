          31: was caught by review, soft-reset, and re-applied in the canonical repo.
          32: This skill exists to **stop that mistake at pre-edit time**.
          33: 
          34: ## When to Apply
          35: 
          36: - Before the first `cat > <file>` / `edit` call in any repository the
          37:   session has not previously edited.
          38: - Whenever two repository names share a common prefix or suffix that
          39:   hints at related-but-distinct roles.
