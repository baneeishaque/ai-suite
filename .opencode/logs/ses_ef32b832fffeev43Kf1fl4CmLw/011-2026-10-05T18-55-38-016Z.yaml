          330: ## 3. Post-Drafting Checklist
          331: 
          332: Every skill generated via the Factory MUST automatically undergo the final verification:
          333: 
          334: - **Portability, Redaction & PII Audit (MANDATORY — SSOT delegation)**: Every file produced by the Factory MUST be
          335:   put through the full **[Redaction & Portability Skill](../redaction-portability/SKILL.md)** protocol before the
          336:   skill is considered complete. The Factory MUST NOT inline its own redaction rules — the redaction skill is the SSOT.
          337:   Specifically, the Factory MUST execute, in order:
          338:     1. **Tier Classification** (Redaction §1): Walk every string in every generated artifact (`SKILL.md`,
          339:        `AGENTS.md`, every `docs/conversations/*.md`, every `docs/cases/*.md`, every script header) and classify
          340:        each candidate string as Tier A (identity/credentials), Tier B (machine/org topology), or Tier C
          341:        (public/universal).
          342:     2. **Canonical Placeholder Substitution** (Redaction §2): Replace every Tier-A and Tier-B match with the
          343:        canonical placeholder vocabulary (`<workspace-root>`, `<user-home>`, `<toolbase>`, `<author>`, `<user>`,
          344:        `<corp-proxy-host>`, `<corp-domain>`, `<internal-vcs>`, `<ticket-system>`, `<customer>`,
          345:        `<product-codename>`, etc.). Ad-hoc placeholder invention is FORBIDDEN — extend Redaction §2 first.
          346:     3. **Path Handling** (Redaction §3): All absolute Windows / POSIX paths are converted to workspace-relative,
          347:        user-home-relative (`~`), or placeholder form. Angle-bracket placeholders in `[text](target)` link targets
          348:        are converted to inline-code symbolic references per Redaction §3.3 to avoid broken navigation.
          349:     4. **Identity Handling** (Redaction §4): Author trailers, reviewer names, OS usernames, and email addresses are
          350:        redacted. Commit SHAs are preserved.
          351:     5. **Network & Org Handling** (Redaction §5): Internal proxy hosts, internal domains, internal repository URLs,
          352:        ticket IDs, customer names, and product codenames are redacted; the `nonProxyHosts` and analogous wildcards
          353:        use `<corp-domain>` / `<corp-cloud-domain>` placeholders.
          354:     6. **File Naming Hygiene** (Redaction §6): Conversation and case-study filenames MUST encode topics, never
          355:        organization or identity strings.
          356:     7. **Verification Scan** (Redaction §8 Step 4): Re-run the regex inventory scans for absolute paths, emails,
          357:        IPv4, and internal hostnames. The terminal output MUST be empty (or contain only Tier-C universally-true
          358:        matches) before the audit passes.
          359:     8. **Encoding Sanity Check** (Redaction §8 Step 5): Scan for mojibake markers (`Ã`, `â€`, `Â`, `ï¿½`) that
          360:        redaction edits frequently introduce, and fix them before considering the audit complete.
          361:     9. **Directory Depth Audit**: Verify the correct directory depth (e.g., `../../../` from a 3-level deep skill).
          362:    10. **Repository Independence Audit** (Redaction §1.0 + §1.4): When the new skill mentions ANY other repository
          363:        (whether by Markdown link or by prose), run the Pre-Commit Checklist from Redaction §1.4 and apply the
          364:        Standalone-Clone Test from §1.0 — "if I clone ONLY the enclosing repo into a fresh empty directory, does
          365:        every relative link resolve and does every prose reference still make sense?" Reject any relative-path link
          366:        whose target escapes the enclosing repo (count `../` segments) regardless of how it resolves on the author's
          367:        disk. Multi-root VS Code layouts are inadmissible defences. The Worked Example in Redaction §1.5
          368:        (a public-skill ↔ org-private-skill pair) is the reference pattern.
          369: - **Prohibited Behavior**: The Factory MUST NOT publish a skill that has not passed the Redaction & Portability audit.
          370:   Half-redacted strings (e.g., `<corp-proxy-host>.<real-corp>.com`) and over-redacted public identifiers
          371:   (e.g., redacting `Apache Commons`, `Eclipse`, `Maven Central`) are both audit failures per Redaction §10.
          372: - **Contextual Hosting**: Documentation (logs, artifacts) MUST reside in the component's `docs/` folder.
