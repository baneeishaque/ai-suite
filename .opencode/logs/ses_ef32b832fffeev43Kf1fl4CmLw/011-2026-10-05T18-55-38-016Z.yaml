          8: # Git Submodule Addition Skill (v1)
          9: 
          10: This skill automates the integration of external repositories as Git submodules, ensuring consistent naming,
          11: initialization, and compliance with the project's branch-tracking standards.
          12: 
          13: ***
          14: 
          15: ## 1. Environment & Dependencies
          16: 
          17: Before execution, the agent MUST verify:
          18: 
          19: - **git**: Core tool for submodule operations.
