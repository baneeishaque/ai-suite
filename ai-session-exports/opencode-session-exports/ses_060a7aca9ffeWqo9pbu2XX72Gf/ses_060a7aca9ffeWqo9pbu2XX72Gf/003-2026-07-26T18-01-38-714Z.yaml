            with open(src) as f:
                data = json.load(f)

            def is_free(model):
                c = model.get("cost")
                if not c:
                    return False
                return all(v == 0 for v in c.values())

            def knowledge_sort_key(item):
                m = item[1]
                k = m.get("knowledge")
                if k is None:
                    return (1, "")
                return (0, str(k))

            generated = []
            skipped_no_free = []

            for pid, pdata in data.items():
                models = pdata.get("models", {})
                free_models = {k: v for k, v in models.items() if is_free(v)}
                
                if not free_models:
                    skipped_no_free.append(pid)
                    continue
                
                sorted_free = dict(sorted(free_models.items(), key=knowledge_sort_key, reverse=True))
                
                doc = {}
                for k in ["api", "doc", "env", "id", "name", "npm", "models"]:
                    if k == "models":
                        doc["models"] = sorted_free
                    elif k in pdata:
                        doc[k] = pdata[k]
                
                fname = f"{pid}-provider-free-knowledge-sorted.yaml"
                path = os.path.join(outdir, fname)
                with open(path, "w") as f:
                    yaml.dump(doc, f, default_flow_style=False, allow_unicode=True, sort_keys=False)
                generated.append((pid, len(sorted_free)))

            print(f"Generated {len(generated)} files:")
