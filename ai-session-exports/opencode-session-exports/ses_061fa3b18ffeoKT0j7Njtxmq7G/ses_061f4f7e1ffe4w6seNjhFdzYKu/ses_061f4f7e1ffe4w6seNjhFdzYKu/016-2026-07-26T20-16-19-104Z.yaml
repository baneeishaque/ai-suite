            def _yaml_text(files: list[Path], dirs: dict[str, Path], sid: str) -> str:
                """Collect YAML content for a session: from .yaml file(s) and/or turn dir."""
                parts: list[str] = []
                for p in files:
                    if p.suffix == ".yaml":
                        try:
                            parts.append(p.read_text(errors="replace"))
                        except Exception:
                            pass
                if sid in dirs:
                    for child in sorted(dirs[sid].iterdir()):
                        if child.suffix == ".yaml":
                            try:
                                parts.append(child.read_text(errors="replace"))
                            except Exception:
                                pass
                return "\n".join(parts)


            def find_sub_agents(
                files: dict[str, list[Path]], dirs: dict[str, Path]
            ) -> dict[str, set[str]]:
                parent_map: dict[str, str] = {}
                for sid in files:
                    yaml_text = _yaml_text(files[sid], dirs, sid)
                    for m in re.finditer(
                        r"task_session_id:\s*ses_([a-zA-Z0-9]+)", yaml_text
                    ):
                        child = "ses_" + m.group(1)
                        if child == sid:
                            continue
                        # Find the line containing this match
                        line_start = yaml_text.rfind("\n", 0, m.start()) + 1
                        line_end = yaml_text.find("\n", m.end())
                        line = yaml_text[line_start:line_end] if line_end != -1 else yaml_text[line_start:]
                        # Skip diff/patch context lines (lines starting with < after whitespace)
                        stripped = line.lstrip()
                        if stripped.startswith("<") or stripped.startswith(">"):
                            continue
                        parent_map[child] = sid
                children: dict[str, set[str]] = {}
                for child, parent in parent_map.items():
                    children.setdefault(parent, set()).add(child)
                return children
