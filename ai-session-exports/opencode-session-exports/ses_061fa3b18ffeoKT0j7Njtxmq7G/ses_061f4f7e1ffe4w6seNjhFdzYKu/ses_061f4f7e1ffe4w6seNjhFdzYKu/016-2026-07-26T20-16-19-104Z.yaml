c, writeFileSync, existsSync, readFileSync), `node:path` (join), `js-yaml` (dump, loadAll).\n\n- **Log Output Directory**: `.opencode/logs` (relative to the CWD).\n\n- **Output Formats**:\n  - **JSONL** (`<sessionID>.jsonl`) -- every event is written as one JSON line.\n  - **YAML** (`<sessionID>.yaml`) -- a multi-document YAML file with one `---` document for the session header and one per turn.\n  - **State JSON** (`<sessionID>.state.json`) -- persists `created` timestamp for session resume detection.\n  - **Turns JSONL** (`<sessionID>.turns.jsonl`) -- appended turn-by-turn for crash recovery.\n\n- **Data Models**:\n  - `Step` -- represents one assistant interaction segment (model, agent, thinking text, tool calls, response text, timing).\n  - `Turn` -- represents one user message + 1+ assistant `Step`s (userText, timing, steps list).\n  - `SessionState` -- per-session map tracking `turn`, `turns[]`, `model`, `title`, `compactedAt`, `created`, `updated`.\n\n- **Event Handling (the `switch` block)**:\n  - `session.created` -- initializes session state, resets `msgStore`, writes JSONL entry.\n  - `session.updated` -- updates title/updated timestamp.\n  - `message.updated` -- stores message metadata (role, sessionID, model, agent, userTime) in `msgStore`. For assistant messages, creates a new `Step`.\n  - `message.part.updated` -- the core handler. Processes `text`, `reasoning`, `tool_call`/`tool`, `tool_result`, and `step-finish` part types. Accumulates thinking text, response text, tool calls (with pending/completion logic). When a new user text part arrives with a different `messageID`, saves the current turn to `turns[]` and starts a new one.\n  - `session.status(idle)` -- finalizes the current turn, pushes it to `turns[]`, rewrites the YAML file from scratch with header + all accumulated turns.\n  - `session.compacted` -- sets `compactedAt` timestamp, writes JSONL entry.\n  - `session.deleted` / `server.instance.disposed` -- finalizes current turn, writes YAML, w