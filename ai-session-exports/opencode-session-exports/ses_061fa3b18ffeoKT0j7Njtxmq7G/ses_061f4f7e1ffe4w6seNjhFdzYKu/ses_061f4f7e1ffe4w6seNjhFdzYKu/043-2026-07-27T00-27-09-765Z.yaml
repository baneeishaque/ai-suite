            #!/usr/bin/env python3
            """Fix turn YAML numbering: deduplicate files that were duplicated by a logging plugin bug."""

            import json, re, subprocess, sys
            from pathlib import Path
            from datetime import datetime

            def trash(path):
                subprocess.run(["trash", str(path)], capture_output=True)

            def norm_ts(s):
                date_part, rest = s.split('T', 1)
                parts = rest.rsplit('-', 3)
                return date_part + 'T' + ':'.join(parts[:2]) + ':' + parts[2] + '.' + parts[3].rstrip('Z')

            def load_turns(jsonl_path):
                events = []
                with open(jsonl_path) as f:
                    for line in f:
                        obj = json.loads(line)
                        if obj.get('type') == 'turn.complete':
                            events.append((obj['turnIndex'], obj['timestamp']))
                return events

            def fix_session(sid, log_dir, dry_run=True):
                turn_dir = log_dir / sid
                if not turn_dir.is_dir():
                    print(f"  SKIP: no turn dir for {sid}")
                    return

                jsonl = log_dir / f"{sid}.jsonl"
                if not jsonl.exists():
                    print(f"  SKIP: no JSONL for {sid}")
                    return

                turns = load_turns(jsonl)
                if not turns:
                    print(f"  SKIP: no turn.complete events in JSONL")
                    return

                turn_dts = [(ti, datetime.fromisoformat(ts.rstrip('Z'))) for ti, ts in turns]
                matched = 0
                deleted = 0
                rename_ops = []

                for y in sorted(turn_dir.glob('*.yaml')):
                    if y.name.startswith('000-header'):
                        continue
                    m = re.match(r'(\d+)-(.+)\.yaml', y.name)
                    if not m:
                        continue
                    y_num = int(m.group(1))
                    y_raw_ts = m.group(2)

                    y_dt = datetime.fromisoformat(norm_ts(y_raw_ts).rstrip('Z'))
                    best_idx = min(range(len(turn_dts)), key=lambda i: abs((y_dt - turn_dts[i][1]).total_seconds()))
                    ti, t_dt = turn_dts[best_idx]
                    diff = abs((y_dt - t_dt).total_seconds())

                    expected_num = ti + 1  # 1-indexed

                    if diff < 2.0:
                        matched += 1
                        if y_num != expected_num:
                            new_name = f"{expected_num:03d}-{y_raw_ts}.yaml"
                            rename_ops.append((y.name, new_name))
                    else:
                        if not dry_run:
                            trash(str(y))
                        print(f"    DELETE {y.name}")
                        deleted += 1

                for old, new in rename_ops:
                    old_path = turn_dir / old
                    new_path = turn_dir / new
                    if new_path.exists():
                        print(f"    ERROR: {new} already exists, cannot rename {old}")
                    else:
                        if not dry_run:
                            old_path.rename(new_path)
                        print(f"    RENAME {old} → {new}")

                print(f"  {sid}: {matched} matched, {deleted} deleted, {len(rename_ops)} renamed")

            if __name__ == "__main__":
                log_dir = Path(__file__).resolve().parent.parent / ".opencode" / "logs"
                dry_run = "--dry-run" in sys.argv
                sids = [a for a in sys.argv[1:] if not a.startswith("--")]

                if not sids:
                    print("Usage: fix-turn-numbering.py [--dry-run] <ses_id_1> [ses_id_2 ...]")
                    sys.exit(1)

                for sid in sids:
                    print(f"  Fixing {sid}...")
                    fix_session(sid, log_dir, dry_run=dry_run)
            PYEOF
            echo "Script written"
