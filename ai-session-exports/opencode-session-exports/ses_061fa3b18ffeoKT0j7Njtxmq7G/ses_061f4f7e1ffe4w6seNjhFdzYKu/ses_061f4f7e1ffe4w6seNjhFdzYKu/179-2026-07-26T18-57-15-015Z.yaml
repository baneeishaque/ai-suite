    response: |-
      For each session in `.opencode/logs/`:

      1. **Classify** — check if session ID exists in opencode's SQLite DB (`session` table). In DB = ACTIVE, not in DB = DEAD.
      2. **Collect** — gather all files belonging to that session:
         - `.jsonl` (main log), `.state.json`, `.turns.jsonl`, `.yaml` (export)
         - Directory with turn-by-turn YAML files (format 3)
      3. **Act** — ACTIVE → `shutil.copy2` (leave originals), DEAD → `shutil.move` (remove from logs)
      4. **Folderize** — place everything into `exports/ses_XXXX/`. If the turn directory already exists there (previous backup), merge new files into it rather than overwrite.

