            def deep_diff_keys(a, b, path=""):
                """Compare two dicts/lists and report differing leaf values vs missing keys"""
                all_keys = set()
                if isinstance(a, dict) and isinstance(b, dict):
                    all_keys = set(a.keys()) | set(b.keys())
                    for k in sorted(all_keys):
