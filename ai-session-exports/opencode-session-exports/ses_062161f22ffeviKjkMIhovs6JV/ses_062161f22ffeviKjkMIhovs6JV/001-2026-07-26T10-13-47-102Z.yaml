                  "Loading...\n\nIndex your code with Devin\n\nDeepWiki\n\nDeepWiki\n\n[julianromli/opencode-template](https://github.com/julianromli/opencode-template \"Open repository\")\n\nIndex your code with\n\nDevin Edit Wiki Share\n\nLoading...\n\nMenu\n\n# Tool Permissions and Security\n\nRelevant source files\n\n* [opencode.json](https://github.com/julianromli/opencode-template/blob/c4555cce/opencode.json)\n\n## Purpose and Scope\n\nThis document explains the tool permission system and security model used in the opencode-template. It covers how tools are enabled, how permissions are granted or restricted, and the security implications of different configurations. The permission system controls what operations AI agents can perform during execution, providing a critical security boundary between AI-driven automation and system access.\n\nFor information about configuring AI model providers, see AI Provider Configuration . For MCP integration security, see MCP Integrations .\n\n## Tool Permission Model\n\n...\n\n|`bash` |`true` |`allow` |Execute shell commands |**High** \\- Full system command execution |\n|`read` |`true` |`allow` |Read file contents |**Low** \\- Read-only file access |\n|`write` |`true` |`allow` |Create or overwrite files |**Medium** \\- File system modification |\n|`edit` |`true` |`allow` |Modify existing files |**Medium** \\- File system modification |\n|`glob` |`true` |`allow` |Pattern-based file matching |**Low** \\- File system enumeration |\n|`grep` |`true` |`allow` |Search file contents |**Low** \\- Content search |\n|`list` |`true` |`allow` |List directory contents |**Low** \\- Directory enumeration |\n|`lsp` |`true` |`allow` |Language Server Protocol operations |**Low** \\- Code intelligence |\n|`patch` |`true` |`allow` |Apply unified diff patches |**Medium** \\- File system modification |\n|`skill` |`true` |`allow` |Invoke skills from repository |**Variable** \\- Depends on skill content |\n|`webfetch` |`true` |`deny` |Fetch content from URLs |**High** \\- Network access |\n|`task` |`true` |N/A |Task management operations |**Low** \\- Metadata only |\n|`todowrite` |`true` |`allow` |Write TODO items |**Low** \\- Metadata only |\n|`todoread` |`true` |`allow` |Read TODO items |**Low** \\- Metadata only |\n|`question` |`true` |`allow` |Ask user questions |**Low** \\- User interaction |\n\n### Tool Categories\n\n**Sources:** [opencode.json 21-53](https://github.com/julianromli/opencode-template/blob/c4555cce/opencode.json)\n\n## Permission Configuration\n\n### Configuration Structure\n\nThe permission configuration in [opencode.json 38-53](https://github.com/julianromli/opencode-template/blob/c4555cce/opencode.json) follows this structure:\n\n### Permission Values\n\n|Value |Behavior |Use Case |\n| --- | --- | --- |\n|`\"allow\"` |Tool is accessible to AI agents |Standard operational tools |\n|`\"deny\"` |Tool is blocked from AI agents |Security-sensitive operations |\n\n### Permission Enforcement Flow\n\n**Sources:** [opencode.json 38-53](https://github.\ncom/julianromli/opencode-template/blob/c4555cce/opencode.json)\n\n## Security Considerations\n\n### High-Risk Tool: bash\n\nThe `bash` tool [opencode.json 22-39](https://github.com/julianromli/opencode-template/blob/c4555cce/opencode.json) is permitted with `\"allow\"` status, granting AI agents full shell command execution capabilities. This is the highest-risk permission in the configuration.\n\n**Security Implications:**\n\n* Can execute arbitrary system commands\n* Can modify file system outside workspace boundaries\n* Can access environment variables\n* Can invoke network tools via shell commands\n* Can modify system state\n\n**Mitigation Strategies:**\n\n1. Rely on AI agent alignment and skill instructions to prevent misuse\n2. Monitor bash command execution in logs\n3. Consider sandboxing the runtime environment\n4. Use workspace-scoped execution when possible\n\n### Denied Tool: webfetch\n\nThe `webfetch` tool [opencode.json 32-51](https://github.com/julianromli/opencode-template/blob/c4555cce/opencode.\n\n...\n\n* Skills are loaded dynamically from file system\n\n**Trust Model:**\n\n* Skills in the repository are presumed trusted\n* Skills follow the invocation protocol (see Skill Invocation Protocol )\n* Skills are version-controlled and auditable\n\n### File System Modification Tools\n\nMultiple tools provide file system write access:\n\n**Best Practices:**\n\n* Tools should operate within workspace boundaries\n* Critical system files should be protected by OS-level permissions\n* Configuration files ( `opencode.json` , `AGENTS.md` ) should be version-controlled\n* Regular backups recommended for critical projects\n\n**Sources:** [opencode.json 21-53](https://github.com/julianromli/opencode-template/blob/c4555cce/opencode.json)\n\n## Platform-Specific Security Behavior\n\nThe permission configuration in `opencode.json` applies across multiple AI coding platforms. Each platform may implement additional security layers:\n\n### Cross-Platform Permission Matrix\n\n...\n\n### Restricting bash Access\n\nTo restrict the `bash` tool:\n\n**Impact:** Many skills rely on `bash` for complex operations. Denying bash may break:\n\n* Build automation workflows\n* File system operations beyond tool capabilities\n* Git operations\n* Package manager operations\n\n**Sources:** [opencode.json 21-53](https://github.com/julianromli/opencode-template/blob/c4555cce/opencode.json)\n\n## Security Best Practices\n\n### Recommended Configuration\n\nThe default configuration in [opencode.json 38-53](https://github.com/julianromli/opencode-template/blob/c4555cce/opencode.json) represents a balanced security posture:\n\n**Allowed:** File operations, development tools, workflow tools  \n**Denied:** Direct network access ( `webfetch` )  \n**High-Risk but Allowed:** Shell execution ( `bash` )\n\n### Hardening Checklist\n\n|Security Control |Status |Configuration |\n| --- | --- | --- |\n|Network access blocked |✓ |`webfetch: \"deny\"` |\n|File system access controlled |⚠ |All file tools allowed |\n|Shell execution controlled |⚠ |`bash: \"allow\"` |\n|Skill invocation allowed |✓ |`skill: \"allow\"` |\n|MCP integrations reviewed |✓ |Selective enablement |\n|API keys secured |⚠ |Stored in config |\n\n### API Key Security\n\nAPI keys in [opencode.json 150-529](https://github.com/julianromli/opencode-template/blob/c4555cce/opencode.json) should be protected:\n\n**Recommendations:**\n\n* Replace hardcoded keys with environment variable references: `\"{env:FIRECRAWL_API_KEY}\"`\n* Use `.gitignore` to prevent committing sensitive configurations\n* Rotate keys regularly\n* Use least-privilege API keys when possible\n\n**Sources:** [opencode.json 38-53](https://github.com/julianromli/opencode-template/blob/c4555cce/opencode.json) [opencode.json 54-148](https://github.com/julianromli/opencode-template/blob/c4555cce/opencode.json) [opencode.json 150-529](https://github.com/julianromli/opencode-template/blob/c4555cce/opencode.json)"
