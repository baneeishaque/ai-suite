        result: |-
          {
            "search_id": "search_ccf99cc29897ff88872698d95854b2f7",
            "results": [
              {
                "url": "https://opencodex.cc/en/tutorials/security-config",
                "title": "Opencode Permissions and Security Configuration - Let AI Work ...",
                "publish_date": "2026-03-25",
                "excerpts": [
                  "OpenCode Tutorials\n\nHome\n\nTutorials\n\nEcosystem\n\nFAQ\n\nComparisons\n\nPosts\n\nOpencode Official Opencode Official\n\nMore More\n\nLanguage Language\n\n# Permissions and Security Configuration\n\nThe powerful capabilities of AI programming tools also bring security risks. This article will teach you how to configure Opencode's permission system to let AI work efficiently without misoperations or leaking sensitive information.\n\n## Why Permission Configuration is Needed?\n\nProduction environments fear two things most:\n\n1. **Reading Sensitive Information** : `.env` files, private keys, API tokens\n2. **Executing Dangerous Commands** : `rm -rf` , batch replacements, incorrect database operations\n\nThrough proper permission configuration, you can:\n\n* Prevent AI from reading sensitive files\n* Control AI's file modification permissions\n* Limit AI's command execution scope\n* Set different permissions for different Agents\n\n## Permission Configuration Basics\n\nOpencode's permission system includes three levels:\n1. **read** \\- File read permissions\n2. **edit** \\- File modification permissions\n3. **bash** \\- Command execution permissions\n\nEach permission can be set to:\n\n* `\"allow\"` \\- Direct pass, no asking\n* `\"ask\"` \\- Ask for user confirmation each time\n* `\"deny\"` \\- Direct deny\n\n## Recommended Security Configuration\n\n### Basic Security Configuration\n\nSuitable for individual developers:\n\n```\n{   \"permission\": {     // File read permissions     \"read\": {       \"*\": \"allow\",       \"*.env\": \"deny\",       \"*.env.*\": \"deny\",       \"*.env.example\": \"allow\",       \"*.key\": \"deny\",       \"*.pem\": \"deny\",       \"id_rsa*\": \"deny\"     },     // File modification permissions     \"edit\": \"ask\",     // Command execution permissions     \"bash\": {       \"*\": \"ask\",       \"git status\": \"allow\",       \"git diff\": \"allow\",       \"npm test\": \"allow\",       \"npm run lint\": \"allow\"     }   } }\n```\n\n### Strict Security Configuration\n\nSuitable for team collaboration or production environments:\n\n```\n\n...\n\n{   \"permission\": {     \"bash\": {       \"*\": \"ask\",       // Git read-only commands       \"git status\": \"allow\",       \"git diff\": \"allow\",       \"git log\": \"allow\",       // File viewing       \"ls\": \"allow\",       \"cat\": \"allow\",       \"pwd\": \"allow\",       // Testing and checking       \"npm test\": \"allow\",       \"npm run lint\": \"allow\",       \"pytest\": \"allow\"     }   } }\n```\n\n### Dangerous Command Blacklist\n\n```\n{   \"permission\": {     \"bash\": {       // File deletion       \"rm -rf\": \"deny\",       \"rm -fr\": \"deny\",       // Permission modification       \"chmod 777\": \"deny\",       // System-level operations       \"sudo\": \"deny\",       \"su\": \"deny\",       // Disk operations       \"dd\": \"deny\",       // Database operations       \"DROP DATABASE\": \"deny\",       \"TRUNCATE\": \"ask\",       \"DELETE FROM\": \"ask\"     }   } }\n```\n\n## Agent-Level Permissions\n\nSet different permissions for different Agents:\n\n### Read-Only Agent\n\nSuitable for code review, documentation generation:\n\n```\n{   \"agent\": {     \"code-reviewer\": {       \"description\": \"Code review expert\",       \"model\": \"anthropic/claude-sonnet-4-5\",       \"permission\": {         \"read\": {           \"*\": \"allow\"         },         \"edit\": \"deny\",         \"bash\": \"deny\"       }     }   } }\n```\n\n### Restricted Agent\n\nAllow read/write, but commands need confirmation:\n\n```\n{   \"agent\": {     \"junior-dev\": {       \"description\": \"Junior developer\",       \"model\": \"deepseek/deepseek-coder\",       \"permission\": {         \"read\": {           \"*\": \"allow\",           \"*.env\": \"deny\"         },         \"edit\": \"ask\",         \"bash\": {           \"*\": \"ask\",           \"git status\": \"allow\"         }       }     }   } }\n```\n\n## Security Best Practices\n\n### 1\\. Principle of Least Privilege\n\nDefault deny, open as needed:\n\n```\n{   \"permission\": {     \"read\": {       \"*\": \"ask\",       \"src/**\": \"allow\",       \"docs/**\": \"allow\"     },     \"edit\": \"ask\",     \"bash\": \"deny\"   } }\n```\n\n### 2\\. Layered Defense"
                ]
