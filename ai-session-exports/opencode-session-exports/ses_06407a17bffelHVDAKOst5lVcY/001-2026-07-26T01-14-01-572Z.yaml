            | Django Syntax | Tortoise ORM | SQLAlchemy 2.0 |
            |--------------|-------------|----------------|
            | `models.CharField(max_length=255)` | `fields.CharField(max_length=255)` | `db.Column(db.String(255))` |
            | `models.IntegerField()` | `fields.IntField()` | `db.Column(db.Integer)` |
            | `models.FloatField()` | `fields.FloatField()` | `db.Column(db.Float)` |
            | `models.DecimalField(max_digits=10, decimal_places=2)` | `fields.DecimalField(max_digits=10, decimal_places=2)` | `db.Column(db.Numeric(10,2))` |
            | `models.BooleanField(default=False)` | `fields.BooleanField(default=False)` | `db.Column(db.Boolean, default=False)` |
            | `models.JSONField()` | `fields.JSONField()` | `db.Column(db.JSON)` |
            | `models.ForeignKey(Model, on_delete=CASCADE)` | `fields.ForeignKeyField("models.Model", related_name="name")` | `db.Column(db.Integer, db.ForeignKey("model.id"))` + `relationship()` |
            | `models.ManyToManyField(Model)` | `fields.ManyToManyField("models.Model", related_name="name")` | `db.Table("assoc")` + `relationship(secondary=) ` |
            | `models.UUIDField(primary_key=True, default=uuid4)` | `fields.UUIDField(pk=True)` | `db.Column(db.UUID, primary_key=True, default=uuid4)` |
            | `models.DateTimeField(auto_now_add=True)` | `fields.DatetimeField(auto_now_add=True)` | `db.Column(db.DateTime, server_default=db.func.now())` |
            | `models.DateField()` | `fields.DateField()` | `db.Column(db.Date)` |
            | `models.TextField()` | `fields.TextField()` | `db.Column(db.Text)` |
            | `models.Choices` | Same Python tuple pattern | Same, with `db.Column(db.String)` or enum |
            | `models.Index(fields=["name"])` | `Meta indexes = [Index(fields=["name"])]` | `db.Index("idx_name", "name")` |
            | `class Meta: db_table = "xxx"` | `class Meta: table = "xxx"` | `__tablename__ = "xxx"` |
            | Custom model methods | Same (instance methods on Model) | Same (instance methods on Model) |
            | Custom Manager | `class Manager(ModelManager)` | `@declared_attr def objects(cls)` or custom Query class |

