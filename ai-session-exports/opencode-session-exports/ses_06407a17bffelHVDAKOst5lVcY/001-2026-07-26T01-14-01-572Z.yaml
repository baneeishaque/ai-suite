                  "Sitemap\n\n[Open in app](https://play.google.com/store/apps/details?id=com.medium.reader&referrer=utm_source%3DmobileNavBar&source=post_page---top_nav_layout_nav-----------------------------------------)\n\nGet app\n\n[Write](https://medium.com/m/signin?operation=register&redirect=https%3A%2F%2Fmedium.com%2Fnew-story&source=---top_nav_layout_nav-----------------------new_post_topnav------------------)\n\n[Search](https://medium.com/search?source=post_page---top_nav_layout_nav-----------------------------------------)\n\nUnknown user\n\n# Incremental Migration Strategy for Django 6.0\n\n[Arif Rahman](https://medium.com/@arif.rahman.rhm?source=post_page---byline--ce95ba6141cc---------------------------------------)\n\n[Arif Rahman](https://medium.com/@arif.rahman.rhm?source=post_page---byline--ce95ba6141cc---------------------------------------)\n\n3 min read\n\n·\n\nFeb 8, 2026\n\n\\--\n\n[Listen](https://medium.com/m/signin?actionUrl=https%3A%2F%2Fmedium.\ncom%2Fplans%3Fdimension%3Dpost_audio_button%26postId%3Dce95ba6141cc&operation=register&redirect=https%3A%2F%2Fmedium.com%2F%40arif.rahman.rhm%2Fincremental-migration-strategy-for-django-6-0-ce95ba6141cc&source=---header_actions--ce95ba6141cc---------------------post_audio_button------------------)\n\nShare\n\n## (Multi-App, Django-Native Structure)\n\n## Context\n\nMost real Django codebases look like this:\n\n```\nproject/  \n├── users/  \n│   ├── models.py  \n│   ├── views.py  \n│   ├── services.py  \n│   ├── apps.py  \n│   └── migrations/  \n├── orders/  \n├── payments/  \n└── settings/\n```\n\n**Not** a single global domain folder.\n\nSo the migration strategy must:\n\n* Respect Django’s **app boundaries**\n* Allow **per-app migration**\n* Avoid cross-app refactors\n\n## Core Principle (Adjusted for Django Apps)\n\n> **_Each Django app owns its own domain logic and infrastructure._** _  \n> Migration happens_ **_inside one app at a time_** _, file by file._\n> \n>\n## Target Structure (Per Django App)\n\nExample: `users` app **after preparation**\n\n```\nusers/  \n├── domain/  \n│   └── ports/  \n│       └── user_repository.py  \n├── application/  \n│   └── usecases/  \n│       └── find_user.py  \n├── infrastructure/  \n│   └── django/  \n│       └── user_repository.py  \n├── views.py  \n├── models.py  \n└── migrations/\n```\n\nKey rule:\n\n* **No shared global layers**\n* Each app is internally layered\n\n## Phase 0 — Prepare the App (No Behavior Change)\n\nInside `users/` :\n\n```\nusers/  \n├── domain/  \n├── application/  \n├── infrastructure/  \n├── views.py        ← legacy code still runs\n```\n\n✅ App works exactly the same  \n✅ No Django 6 upgrade yet\n\n## Phase 1 — Choose One File in One App\n\nPick a **high-risk file** in that app:\n\n* Uses `force_text` / `smart_str`\n* Uses `.get()` on ambiguous queries\n* On a hot path (auth, profile, permissions)\n\nExample:\n\n```\nusers/views.py\n```\n\n...\n\nasync def find_by_email_like(self, email: str):  \n        pass\n```\n\nWhy this matters:\n\n* Domain logic no longer imports Django\n* Future Django changes stop here\n\n## Phase 4 — Django Adapter (Infrastructure Layer)\n\n```\n# users/infrastructure/django/user_repository.py  \nfrom django.contrib.auth import get_user_model  \nfrom users.domain.ports.user_repository import UserRepository  \n  \nUser = get_user_model()  \nclass DjangoUserRepository(UserRepository):  \n    async def find_by_email_like(self, email):  \n        user = await User.objects.filter(  \n            email__icontains=email  \n        ).afirst()  \n        if not user:  \n            return None  \n        return {  \n            \"id\": user.id,  \n            \"email\": user.email,  \n        }\n```\n\n✅ Django 6–ready  \n✅ ORM strict-safe  \n✅ Async-first\n\n## Phase 5 — Switch the View (One File Only)\n\n```\n# users/views.py  \nfrom django.http import JsonResponse  \nfrom users.application.usecases.find_user import FindUser  \nfrom users.infrastructure.django.\nuser_repository import DjangoUserRepository  \n  \nasync def get_user(request):  \n    usecase = FindUser(DjangoUserRepository())  \n    user = await usecase.execute(request.GET.get(\"email\"))  \n    if not user:  \n        return JsonResponse({\"error\": \"not found\"}, status=404)  \n    return JsonResponse(user)\n```\n\n📌 Only **this view** changed  \n📌 Other views in `users/` still legacy\n\n## Phase 6 — Remove Deprecated APIs (Locally)\n\n```\n- from django.utils.encoding import force_text  \n- User.objects.get(...)\n```\n\nThe removal is:\n\n* **Scoped to one app**\n* **Scoped to one fil**\n\n## Phase 7 — Repeat Per App, Not Globally\n\nMigration order example:\n\n```\nusers/  \n  ✔ views.py  \n  ✔ services.py  \norders/  \n  ✔ checkout.py  \n  ✔ pricing.py  \npayments/  \n  ✔ webhooks.py\n```\n\nEach app can be migrated:\n\n* Independently\n* By different engineers\n* In parallel\n\n## When to Upgrade Django Itself\n\n## Safe Upgrade Signal\n\nYou are ready to install Django 6 when:\n\n* Most apps route DB access through adapters\n* Deprecated imports exist only in infrastructure\n* Views are thin\n\nThen:\n\n```\npip install django==6.0\n```\n\nResult:\n\n* Errors point to **specific app adapters**\n* Fixes are localized\n\n## Impact of This Strategy (Realistic)\n\nAspectBig-Bang UpgradeIncremental Per-AppDowntimeHigh riskNoneCode freezeRequiredNot neededTeam scalingHardEasyDjango 7 prepPainfulAlmost free\n\n## Mental Model (Django-Specific)\n\n* **Django app = bounded context**\n* **Models = data**\n* **Use cases = behavior**\n* **Infrastructure = disposable**\n\nFrameworks change.  \nYour app logic shouldn’t.\n\n[Django](https://medium.com/tag/django?source=post_page-----ce95ba6141cc---------------------------------------)\n\n[Migration](https://medium.com/tag/migration?source=post_page-----ce95ba6141cc---------------------------------------)\n\n[Breaking Changes](https://medium.com/tag/breaking-changes?source=post_page-----ce95ba6141cc---------------------------------------)\n\n[Coding](https://medium.com/tag/coding?"
