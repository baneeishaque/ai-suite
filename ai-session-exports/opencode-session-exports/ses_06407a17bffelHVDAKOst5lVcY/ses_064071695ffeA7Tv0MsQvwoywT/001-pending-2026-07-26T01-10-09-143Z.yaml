                  "Sitemap\n\n[Open in app](https://play.google.com/store/apps/details?id=com.medium.reader&referrer=utm_source%3DmobileNavBar&source=---top_nav_layout_nav-----------------------------------------)\n\nGet app\n\n[Write](https://medium.com/m/signin?operation=register&redirect=https%3A%2F%2Fmedium.com%2Fnew-story&source=---top_nav_layout_nav-----------------------new_post_topnav------------------)\n\n[Search](https://medium.com/search?source=---top_nav_layout_nav-----------------------------------------)\n\nUnknown user\n\n# How to generate Swagger (OpenAPI) documentation for Django app\n\n[Vivek Pemawat](https://medium.com/@vivekpemawat?source=post_page---byline--ed7c4e196069---------------------------------------)\n\n[Vivek Pemawat](https://medium.com/@vivekpemawat?source=post_page---byline--ed7c4e196069---------------------------------------)\n\n1 min read\n\n·\n\nJan 15, 2024\n\n\\--\n\n[Listen](https://medium.com/m/signin?actionUrl=https%3A%2F%2Fmedium.\ncom%2Fplans%3Fdimension%3Dpost_audio_button%26postId%3Ded7c4e196069&operation=register&redirect=https%3A%2F%2Fmedium.com%2F%40vivekpemawat%2Fhow-to-generate-swagger-openapi-documentation-for-django-app-ed7c4e196069&source=---header_actions--ed7c4e196069---------------------post_audio_button------------------)\n\nShare\n\nTo generate Swagger (OpenAPI) documentation for your Django REST Framework API, you can use the `drf-yasg` package. Here's how you can integrate it into your project:\n\nInstall `drf-yasg` :\n\nYou can install it using pip:\n\n```\npip install drf-yasg\n```\n\nUpdate `INSTALLED_APPS` : Add `drf_yasg` to your `INSTALLED_APPS` in your `settings.py` :\n\n```\n# settings.py  \n  \nINSTALLED_APPS = [  \n    # ... other apps  \n    'drf_yasg',  \n]\n```\n\nUpdate `urlpatterns` : Modify your `urlpatterns` in `urls.py` to include the Swagger UI:\n\n```\n  \n  \nfrom django.contrib import admin  \nfrom django.urls import path, re_path, include  \nfrom rest_framework import permissions  \nfrom drf_yasg.\nviews import get_schema_view  \nfrom drf_yasg import openapi  \n  \nschema_view = get_schema_view(  \n    openapi.Info(  \n        title=\"Your API\",  \n        default_version='v1',  \n        description=\"Your API description\",  \n        terms_of_service=\"https://www.yourapp.com/terms/\",  \n        contact=openapi.Contact(email=\"contact@yourapp.com\"),  \n        license=openapi.License(name=\"Your License\"),  \n    ),  \n    public=True,  \n    permission_classes=(permissions.AllowAny,),  \n)  \n  \nurlpatterns = [  \n    path('admin/', admin.site.urls),  \n    path('api/', include('yourapp.urls')),  # Replace 'yourapp' with your app's name  \n    path('swagger/', schema_view.with_ui('swagger', cache_timeout=0), name='schema-swagger-ui'),  \n]\n```\n\nRun Your Server: Start your Django development server:\n\n```\npython manage.py runserve\n```\n\n[Django](https://medium.com/tag/django?source=post_page---footer_tags--ed7c4e196069---------------------------------------)\n\n[Swagger](https://medium.com/tag/swagger?\nsource=post_page---footer_tags--ed7c4e196069---------------------------------------)\n\n\\-- \n\n\\--\n\n[Vivek Pemawat](https://medium.com/@vivekpemawat?source=post_page---post_author_info--ed7c4e196069---------------------------------------)\n\n[Vivek Pemawat](https://medium.com/@vivekpemawat?source=post_page---post_author_info--ed7c4e196069---------------------------------------)\n\n[## Written by Vivek Pemawat](https://medium.com/@vivekpemawat?source=post_page---post_author_info--ed7c4e196069---------------------------------------)\n\n[70 followers](https://medium.com/@vivekpemawat/followers?source=post_page---post_author_info--ed7c4e196069---------------------------------------)\n\n· [34 following](https://medium.com/@vivekpemawat/following?source=post_page---post_author_info--ed7c4e196069---------------------------------------)\n\nPrinciple Engineer at Acceldata"
