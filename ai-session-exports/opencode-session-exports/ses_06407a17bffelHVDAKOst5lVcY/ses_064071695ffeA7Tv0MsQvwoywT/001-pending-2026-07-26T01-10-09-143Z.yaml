                  "Django Forum\n\n# New package: Django REST - Typed (FastAPI-esque features for DRF)\n\nShow & Tell\n\n[rsinger86](https://forum.djangoproject.com/u/rsinger86) January 16, 2022, 5:17pm 1\n\nHi there, just wanted to share a package I made to enable use of type annotations for automatic validation of view parameters in Django REST Framework, as well as auto-generation of serializer fields.\n\n**Github repo/docs** : [GitHub - rsinger86/drf-typed: Type hints for enhanced API views and serializers.](https://github.com/rsinger86/drf-typed)\n\nI’ve borrowed ideas from [FastAPI](https://fastapi.tiangolo.com/) .\n\n1 Like\n\n### Related topics\n\n|Topic |Replies |Views |Activity |\n| --- | --- | --- | --- |\n|[Types to validate/deserialize - community need/interest?](https://forum.djangoproject.com/t/types-to-validate-deserialize-community-need-interest/2366)\n\nDjango Internals |5 |900 |May 13, 2020 |\n|[Shopping for a REST API stack, what do you guys use?](https://forum.djangoproject.\ncom/t/shopping-for-a-rest-api-stack-what-do-you-guys-use/6235)\n\nUsing Django |2 |1125 |January 25, 2021 |\n|[Revisiting types in Django / DEP-14](https://forum.djangoproject.com/t/revisiting-types-in-django-dep-14/37832)\n\nDjango Internals |17 |1290 |March 24, 2025 |\n|[Announcing api-response-shaper package](https://forum.djangoproject.com/t/announcing-api-response-shaper-package/35943)\n\nShow & Tell |0 |33 |October 25, 2024 |\n|[drf-api-action - A new way of testing web development in Python](https://forum.djangoproject.com/t/drf-api-action-a-new-way-of-testing-web-development-in-python/26106)\n\nShow & Tell |0 |310 |December 12, 2023 |\n\n* Home\n* Categories\n* Guidelines\n* Terms of Service\n* Privacy Policy\n\nPowered by [Discourse](https://www.discourse.org) , best viewed with JavaScript enabled"
