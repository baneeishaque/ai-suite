                "excerpts": [
                  "com%2Fmigrating-a-legacy-django-rest-api-to-fastapi-step-by-step-refactor-strategy-a24258e73b16&source=---header_actions--a24258e73b16---------------------bookmark_footer------------------)\n\n[Listen](https://medium.com/m/signin?actionUrl=https%3A%2F%2Fmedium.com%2Fplans%3Fdimension%3Dpost_audio_button%26postId%3Da24258e73b16&operation=register&redirect=https%3A%2F%2Fshiladityamajumder.medium.com%2Fmigrating-a-legacy-django-rest-api-to-fastapi-step-by-step-refactor-strategy-a24258e73b16&source=---header_actions--a24258e73b16---------------------post_audio_button------------------)\n\nShare\n\nPress enter or click to view image in full size\n\n> **Subtitle:** How to perform a safe, incremental migration from Django/DRF to FastAPI — partial migrations, hybrid setups, async DB drivers, DRF interoperability, testing and rollout patterns.\n> \n>\n\n## Why migrate (and why not to rush)\nDjango + Django REST Framework (DRF) is a proven stack: batteries-included admin, mature ORM, auth and a large ecosystem. FastAPI offers strong advantages when your needs include high throughput, async I/O, automatic OpenAPI, and a smaller, type-safe surface for microservices.\n\nA migration usually aims to gain:\n\n* Better async I/O (high concurrency without more workers)\n* Cleaner type hints & generated OpenAPI docs\n* Reduced latency in I/O heavy flows\n* Easier microservices decomposition\n\nBut migrations cost time and risk. The pragmatic approach is incremental: keep the working Django system, introduce FastAPI for new/high-value endpoints, then migrate pieces using a controlled plan.\n\n## High level strategy\n\n1. **Inventory & prioritize** — catalog endpoints, traffic, latency, error rates, dependencies (DB, cache, external APIs).\n2. **Pick the first migration candidate(s)** — small, IO-heavy endpoints; endpoints that will benefit from async or clearer API contracts.\n3.\n**Choose an integration strategy** — sidecar service, reverse proxy routing, single monorepo hybrid, or mount apps under a single ASGI process.\n4. **Select DB strategy** — share the same DB (common), or move a bounded context into its own schema/service (advanced).\n5. **Start with read-only or shadow traffic** — validate behavior, test performance, collect metrics.\n6. **Gradual cutover** — traffic split, monitoring, rollback plan.\n\n## Two pragmatic integration patterns\n\n## Option A — Separate services + reverse proxy (recommended for safety)\n\nRun Django and FastAPI as independent services, each with its own workers and backend. Use Nginx/Traefik/Ingress to route requests:\n\n* `/api/v1/*` → DRF (legacy)\n* `/api/v2/*` → FastAPI (new)\n* `/payments/*` → FastAPI microservice\n\n**Pros:** clear isolation, independent deployments, simpler runtime differences (WSGI vs ASGI), separate scaling.\n\n...\n\nPrefer creating a **new async data access layer** (SQLAlchemy 1.4+ async engine with `asyncpg` ) for newly migrated services that need high concurrency.\n\n**Example — calling Django ORM safely from async FastAPI:**\n\n```\nfrom asgiref.sync import sync_to_async  \n  \n@sync_to_async  \ndef get_user_from_django(user_id: int):  \n    from myapp.models import User  \n    return User.objects.get(pk=user_id)  \n  \n@app.get(\"/users/{id}\")  \nasync def read_user(id: int):  \n    user = await get_user_from_django(id)  \n    return {\"username\": user.username}\n```\n\n**Better for high concurrency:** reimplement the DB access in async (SQLAlchemy async + `asyncpg` ) and use it only in the new FastAPI service, leaving legacy code on Django ORM.\n\n## Extracted bounded context (advanced)\n\nIf a domain is self-contained (e.g., billing, or notifications), migrate it to its own service with its own DB (or schema) to decouple and scale independently.\nThis is a more significant change: requires careful data sync and possibly events to maintain consistency.\n\n## DRF interoperability and migration of schemas\n\n## Reuse or convert serializers?\n\n* DRF serializers are rich and tied to Django models. For FastAPI, you’ll want to use **Pydantic** models for validation and documentation.\n* You can keep DRF serializers in the legacy app and define Pydantic DTOs for FastAPI endpoints. Convert between ORM and Pydantic via `from_orm` .\n\n**Example Pydantic model from Django model:**\n\n```\n# app/schemas.py  \nfrom pydantic import BaseModel  \n  \nclass UserSchema(BaseModel):  \n    id: int  \n    username: str  \n    email: str  \n    class Config:  \n        orm_mode = True  \n  \n# Use it in FastAPI  \n@app.get(\"/users/{id}\", response_model=UserSchema)  \nasync def get_user(id: int):  \n    user = await get_user_from_django(id)  # returns ORM instance  \n    return user  # FastAPI will use pydantic.from_orm\n```\n\n## Sharing auth / sessions across frameworks\nDecide on a single auth mechanism for both systems. Common choices:\n\n* **JWT** for stateless APIs (recommended for microservices). Both Django and FastAPI can validate the same tokens.\n* **OAuth2 / OpenID Connect** via an identity provider (Auth0, Keycloak). Both apps become resource servers.\n* **Session cookie** sharing is possible but trickier: requires shared session storage and same cookie domain; WSGI vs ASGI differences make it complex.\n\nIf you adopt JWT:\n\n* Replace Django session endpoints with token issue endpoints (or use `djangorestframework-simplejwt` ).\n* Configure FastAPI to use the same `SECRET_KEY` and token format.\n\n## Step-by-step migration plan\n\n## Phase 0 — Preparation\n\n* Add telemetry: request traces, latency, DB query times, error rates.\n* Run a code inventory: map endpoints, data flows, third-party calls.\n* Add comprehensive tests (unit + integration) for the existing system.\n\n## Phase 1 — Prototype & Dev setup\n* Create a FastAPI project skeleton in the same repo or separate repo.\n* Implement one or two non-critical endpoints that mimic DRF behavior.\n* Add Pydantic schemas mirroring DRF serializers for parity tests.\n\n## Phase 2 — Hybrid deployment & shadow testing\n\n* Deploy FastAPI alongside Django. Route a copy of production traffic (shadow) to FastAPI; compare responses.\n* Monitor divergence: serialization, business logic parity, performance.\n\n## Phase 3 — Canary / Partial cutover\n\n* Route a small percentage of real traffic (canary) to FastAPI for selected endpoints.\n* Observe metrics and errors. If stable, increase percentage.\n\n## Phase 4 — Migrate stateful or critical endpoints\n\n* Migrate endpoints that benefit most (high latency external calls, streaming, websockets).\n* For endpoints touching same DB rows, ensure concurrency control (optimistic locking, DB transactions).\n\n## Phase 5 — Cleanup\n\n* Remove legacy DRF endpoints after full validation and cutover.\n* Migrate tests, CI jobs, and update docs.\n* Archive or decommission legacy code carefully.\n\n## Example code snippets and recipes\n\n## 1) Mounting DRF routes at `/legacy` while exposing new APIs\n\n```\n# fastapi_app.py  \nfrom fastapi import FastAPI  \nfrom django.core.asgi import get_asgi_application  \nimport os  \n  \nos.environ.setdefault(\"DJANGO_SETTINGS_MODULE\", \"myproject.settings\")  \nimport django  \ndjango.setup()  \n  \ndjango_app = get_asgi_application()  \napp = FastAPI()  \napp.mount(\"/legacy\", django_app)   # Django URLs are reachable at /legacy/*\n```\n\n## 2) Convert Django model instances to Pydantic (response\\_model)\n\n```\n# app/pydantic_schemas.py  \nfrom pydantic import BaseModel  \n  \nclass ProductSchema(BaseModel):  \n    id: int  \n    name: str  \n    price: float  \n    class Config:  \n        orm_mode = True  \n# use in FastAPI endpoint  \n@app.get(\"/products/{id}\", response_model=ProductSchema)  \nasync def get_product(id: int):  \n    product = await sync_to_async(Product.objects.\n\n...\n\n* **Blocking the event loop** : don’t call synchronous DB/IO directly from async endpoints; use `sync_to_async` or run in threads.\n* **Different serialization semantics** : Pydantic defaults differ from DRF’s serializers — write parity tests.\n* **Auth mismatch** : tokens, cookies, CSRF — design unified auth early and test across both systems.\n* **DB migrations** : if splitting DB ownership, be careful about schema migrations and backward compatibility.\n* **Too big a first migration** : avoid “big bang” migrations; start with isolated endpoints.\n\n## Folder structure recommendations\n\n## Monorepo hybrid (keep Django + FastAPI together)\n\n```\n/repo  \n  /services  \n    /django_app/          # legacy  \n    /fastapi_services/  \n       /payments_service/  \n       /notifications_service/  \n  /shared_libs  \n    /models/              # pydantic models shared (or DTOs)  \n    /auth/                # shared auth helpers  \n  /infra  \n    k8s manifests / terraform  \n  /tests\nintegration/  \n    contract/\n```\n\n## Separate repos (clear service ownership)\n\n```\nmyproject-legacy-django/  \nmyproject-payments-fastapi/  \nshared-libs/\n```\n\n## Migration checklist (quick)\n\n* Inventory endpoints and traffic profile\n* Add tracing & monitoring to legacy app\n* Implement shared auth strategy (JWT/OAuth2)\n* Add Pydantic schemas for endpoint parity\n* Create FastAPI skeleton and dev CI\n* Shadow test FastAPI with production traffic copy\n* Canary deploy and compare metrics\n* Migrate DB access (sync→async) or isolate service DB\n* Replace routing or update API gateway\n* Remove legacy endpoints and clean code\n\n## Final thoughts\n\nMigrating from Django/DRF to FastAPI is rarely an all-or-nothing decision. The most robust ap"
