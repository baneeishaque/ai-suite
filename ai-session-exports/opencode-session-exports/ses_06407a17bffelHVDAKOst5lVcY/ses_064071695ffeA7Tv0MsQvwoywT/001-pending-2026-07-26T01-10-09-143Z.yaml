                  "com/e801a66299d2c15286fe0fee660d9ffa666c1c5576e5e1536acc07b49ce8ac8f/68747470733a2f2f696d672e736869656c64732e696f2f62616467652f707974686f6e2d332e31302532422d626c7565) [License](https://camo.githubusercontent.com/85276c5c2089565c053ac5af0e633ba86d690907955da75a7339cee7f8e3ecf1/68747470733a2f2f696d672e736869656c64732e696f2f6769746875622f6c6963656e73652f686f6f7368656d6164686f6f73682f46617374445246)\n\n# FastDRF\n\nFastDRF: Migrating from Django Rest Framework to FastAPI template with even more flexibility.\n\n**FastDRF** is a clean and powerful FastAPI project template for developers migrating from Django REST Framework (DRF) to FastAPI. It provides:\n\n* ✅ JWT authentication fully compatible with Django\n* ✅ DRF-style `ViewSet` classes with automatic routing\n* ✅ Modular permissions via `BasePermission` subclasses\n* ✅ Automatic Pydantic schema generation from SQLAlchemy models\n* ✅ PostgreSQL support\n* ✅ Auto-generated Swagger and ReDoc API docs\n\n* * *\n\n## 🚀 Features\n\n...\n\nFastDRF: Migrating from Django Rest Framework to FastAPI template with even more flexibility.\n\n### Resources\n\nReadme\n\nActivity\n\n### Stars\n\n**3** stars\n\n### Watchers\n\n**1** watching\n\n### Forks\n\n**0** forks\n\n[Report repository](https://github.com/contact/report-content?content_url=https%3A%2F%2Fgithub.com%2Fhooshemadhoosh%2FFastDRF&report=hooshemadhoosh+%28user%29)\n\n## Releases\n\nNo releases published\n\n## [Packages](https://github.com/users/hooshemadhoosh/packages?repo_name=FastDRF)\n\n## Contributors\n\n* \n* \n*\n\n## Languages\n\n* [Python 97\\.9%](https://github.com/hooshemadhoosh/FastDRF/search?l=python)\n* [Mako 2\\.1%](https://github.com/hooshemadhoosh/FastDRF/search?l=mako)\n\n## Footer"
