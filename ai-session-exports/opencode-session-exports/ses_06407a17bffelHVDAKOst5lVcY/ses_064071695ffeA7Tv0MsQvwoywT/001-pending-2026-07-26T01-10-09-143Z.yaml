                  "logo\n\nDjango REST framework\n\nSchemas\n\nInitializing search\n\nlogo Django REST framework\n  Tutorial\n    + 5 - Relationships and hyperlinked APIs\n    + 6 - Viewsets and routers\n* API Guide\n  \n  API Guide\n  \n    + Requests\n    + Responses\n    + Views\n    + Generic views\n    + Viewsets\n    + Routers\n    + Parsers\n    + Renderers\n    + Serializers\n    + Serializer fields\n    + Serializer relations\n    + Validators\n    + Authentication\n    + Permissions\n    + Caching\n    + Throttling\n    + Filtering\n    + Pagination\n    + Versioning\n    + Content negotiation\n    + Metadata\n    + Schemas Schemas\n        \n        Table of contents\n        \n        - Overview\n        - Generating an OpenAPI Schema\n                  \n            * Install dependencies\n            * Generating a static schema with the generateschema management command\n            * Generating a dynamic schema with SchemaView\n                                \n                + get\\_schema\\_view()\n        - SchemaGenerator\n\n...\n\n* Community\n  \n  Community\n  \n    + Tutorials and Resources\n    + Third Party Packages\n    + Contributing to REST framework\n    + Project management\n    + Release Notes\n    + 3\\.16 Announcement\n    + 3\\.15 Announcement\n    + 3\\.14 Announcement\n    + 3\\.13 Announcement\n    + 3\\.12 Announcement\n    + 3\\.11 Announcement\n    + 3\\.10 Announcement\n    + 3\\.9 Announcement\n    + 3\\.8 Announcement\n    + 3\\.7 Announcement\n    + 3\\.6 Announcement\n    + 3\\.5 Announcement\n    + 3\\.4 Announcement\n    + 3\\.3 Announcement\n    + 3\\.2 Announcement\n    + 3\\.1 Announcement\n    + 3\\.0 Announcement\n    + Kickstarter Announcement\n    + Mozilla Grant\n    + Jobs\n\nTable of contents\n\n* Overview\n* Generating an OpenAPI Schema\n  \n    + Install dependencies\n    + Generating a static schema with the generateschema management command\n    + Generating a dynamic schema with SchemaView\n        \n        - get\\_schema\\_view()\n* SchemaGenerator\n  \n    + get\\_schema(self, request=None, public=False)\n* AutoSchema\n\n...\n\nThe built-in support will be moved into a separate\npackage and then subsequently retired over the next releases.\n\nAs a full-fledged replacement, we recommend the [drf-spectacular](https://drf-spectacular.readthedocs.io/en/latest/readme.html) package.\nIt has extensive support for generating OpenAPI 3 schemas from\nREST framework APIs, with both automatic and customizable options available.\nFor further information please refer to Documenting your API .\n\n* * *\n\nAPI schemas are a useful tool that allow for a range of use cases, including\ngenerating reference documentation, or driving dynamic client libraries that\ncan interact with your API.\n\nDjango REST Framework provides support for automatic generation of [OpenAPI](https://github.com/OAI/OpenAPI-Specification) schemas.\n\n## Overview ¶\n\nSchema generation has several moving parts. It's worth having an overview:\n\n* `SchemaGenerator` is a top-level class that is responsible for walking your\nconfigured URL patterns, finding `APIView` subclasses, enquiring for their\n  schema representation, and compiling the final schema object.\n* `AutoSchema` encapsulates all the details necessary for per-view schema\n  introspection. Is attached to each view via the `schema` attribute. You\n  subclass `AutoSchema` in order to customize your schema.\n* The `generateschema` management command allows you to generate a static schema\n  offline.\n* Alternatively, you can route `SchemaView` to dynamically generate and serve\n  your schema.\n* `settings.DEFAULT_SCHEMA_CLASS` allows you to specify an `AutoSchema` subclass to serve as your project's default.\n\nThe following sections explain more.\n\n## Generating an OpenAPI Schema ¶\n\n### Install dependencies ¶\n\n```\npip install pyyaml uritemplate inflection\n```\n\n* `pyyaml` is used to generate schema into YAML-based OpenAPI format.\n* `uritemplate` is used internally to get parameters in path.\n\n...\n\nThis option is not required unless the schema is included under path prefix.\n* `patterns` : A list of URLs to inspect when generating the schema. Defaults to the project's URL conf.\n* `urlconf` : A URL conf module name to use when generating the schema. Defaults to `settings.ROOT_URLCONF` .\n\nIn order to customize the top-level schema, subclass `rest_framework.schemas.openapi.SchemaGenerator` and provide your subclass\nas an argument to the `generateschema` command or `get_schema_view()` helper\nfunction.\n\n### get\\_schema(self, request=None, public=False) ¶\n\nReturns a dictionary that represents the OpenAPI schema:\n\n```\ngenerator = SchemaGenerator(title='Stock Prices API')\nschema = generator.get_schema()\n```\n\nThe `request` argument is optional, and may be used if you want to apply\nper-user permissions to the resulting schema generation.\n\nThis is a good point to override if you want to customize the generated\ndictionary For example you might wish to add terms of service to the [top-level `info` object](https://swagger.io/specification/) :\n\n```\nclass TOSSchemaGenerator(SchemaGenerator):\n    def get_schema(self, *args, **kwargs):\n        schema = super().get_schema(*args, **kwargs)\n        schema[\"info\"][\"termsOfService\"] = \"https://example.com/tos.html\"\n        return schema\n```\n\n## AutoSchema ¶\n\n**Per-View Customization**\n\n```\nfrom rest_framework.schemas.openapi import AutoSchema\n```\n\nBy default, view introspection is performed by an `AutoSchema` instance\naccessible via the `schema` attribute on `APIView` .\n\n```\nauto_schema = some_view.schema\n```\n\n`AutoSchema` provides the OpenAPI elements needed for each view, request method\nand path:\n\n* A list of [OpenAPI components](https://github.com/OAI/OpenAPI-Specification/blob/main/versions/3.0.2.md) . In DRF terms these are\n  mappings of serializers that describe request and response bodies.\n\n...\n\nrather than being spread around the already extensive view, serializer and\nfield APIs.\n\nKeeping with this pattern, try not to let schema logic leak into your own\nviews, serializers, or fields when customizing the schema generation. You might\nbe tempted to do something like this:\n\n```\nclass CustomSchema ( AutoSchema ): \"\"\"     AutoSchema subclass using schema_extra_info on the view.     \"\"\" ... class CustomView ( APIView ): schema = CustomSchema () schema_extra_info = ... # some extra info\n```\n\nHere, the `AutoSchema` subclass goes looking for `schema_extra_info` on the\nview. This is _OK_ (it doesn't actually hurt) but it means you'll end up with\nyour schema logic spread out in a number of different places.\n\nInstead try to subclass `AutoSchema` such that the `extra_info` doesn't leak\nout into the view:\n\n```\nclass BaseSchema ( AutoSchema ): \"\"\"     AutoSchema subclass that knows how to use extra_info.     \"\"\" ... class CustomSchema ( BaseSchema ): extra_info = ..."
