                  "com%2Fplans%3Fdimension%3Dpost_audio_button%26postId%3Dc4084d06d7c1&operation=register&redirect=https%3A%2F%2Fmedium.com%2F%40shashikantrbl123%2Fhow-can-django-rest-framework-developers-switch-to-fastapi-easily-c4084d06d7c1&source=---header_actions--c4084d06d7c1---------------------post_audio_button------------------)\n\nShare\n\nDjango-Rest-Framework, being one of the oldest frameworks in Python, has an unmatchable community and many of them will definitely wishing to learn FastAPI, a rising framework in Python. If not, they will need to learn it in near future because of its unmatchable performance and speed. In this blog, I will draw some important similarities between both the frameworks by creating a simple create API and will suggest an ORM similar to that of Django-ORM so that any developer coming from Django-Rest-Framework can easily learn FastAPI. For that create a folder /sample and go to this directory.\n\n...\n\nAlthough SQLAlchemy is best ORM in Python but I will recommend Tortoise-ORM because of its simplicity and similarity in syntax with Django-ORM. Now going ahead, I will use this ORM to provide further insights.\n2. **Models:** Tortoise-ORM is very similar to Django-ORM and models are defined similar as in Django. Similar to Django, import Model and fields from tortoise and inherit Model to create a model. In models.py:\n\n```\nfrom tortoise.models import Model  \nfrom tortoise import fields  \n  \nclass Student(Model):  \n  id = fields.IntField(pk=True)  \n  name = fields.CharField(max_length=25, null=False)  \n  dob = fields.DateField(null=False)\n```\n\nBy looking to above model, any Django developer can see how similar it is with Django-Models.\n\n3\\. **Serializer:** In Django-Rest-Framework, we define serializers to serialize and deserialize json data but in FastAPI, we use Pydantic for that which is easier than than serializers.\n\n...\n\n\"dob\" : student_data.dob  \n  } #This is the response which will be automatically validated by StudentDataType.  \n  \n#These StudentDataType and StudentDataTypeIn can be created by using pydantic_model_creator() function of tortoise.  \n#Which provide some special methods to directly validate student_data instead of creating dictionary\n```\n\n6\\. **Migrations:** Migrations with tortoise are possible with aerich command line tool. In above file, we have mentioned aerich.models in app\\_modules because aerich manages our models. To migrate first we need to install aerich using _pip install aerich_ and now run the following commands for the first time migrations.\n\n```\naerich init -t main.dbconfig  \naerich init-db\n```\n\nFor later migrations, use:\n\n```\naerich migrate --name \"migration_name\"  \naerich upgrade\n```\n\n7\\. **Running Server:** FastAPI uses uvicorn to provide server. So we can start our server using uvicorn command line tool or can write an python script. To start by command line use:\n```\nuvicorn main:app --host 127.0.0.8 --port 8080\n```\n\nThe server will start running at localhost:8080 . There are few other ways to start server. For that please refer to documention of fastapi. Now going to <http://localhost:8080/docs> and find the beautiful documentation to test our API.\n\nI hope that Django developers will be able to easily understand the similarities and differences in both the frameworks in terms of syntax and will find their way to FastAPI easily.\n\n[Python](https://medium.com/tag/python?source=post_page-----c4084d06d7c1---------------------------------------)\n\n[Fastapi](https://medium.com/tag/fastapi?source=post_page-----c4084d06d7c1---------------------------------------)\n\n[Django](https://medium.com/tag/django?source=post_page-----c4084d06d7c1---------------------------------------)\n\n[Django Rest Framework](https://medium.com/tag/django-rest-framework?source=post_page-----c4084d06d7c1---------------------------------------)\n\n[Pydantic](https://medium."
