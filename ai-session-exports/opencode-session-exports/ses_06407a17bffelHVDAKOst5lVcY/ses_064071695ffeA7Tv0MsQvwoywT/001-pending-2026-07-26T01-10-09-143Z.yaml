#fastapi-views)\n\n[![Tests](https://github.com/asynq-io/fastapi-views/workflows/Tests/badge.svg)](https://github.com/asynq-io/fastapi-views/workflows/Tests/badge.svg) [![Build](https://github.com/asynq-io/fastapi-views/workflows/Publish/badge.svg)](https://github.com/asynq-io/fastapi-views/workflows/Publish/badge.svg) [![License](https://camo.githubusercontent.com/7b99375f611f80ad67a12d36e29d038954820313ffdd85a140a90f1c5133eb74/68747470733a2f2f696d672e736869656c64732e696f2f6769746875622f6c6963656e73652f6173796e712d696f2f666173746170692d7669657773)](https://camo.githubusercontent.com/7b99375f611f80ad67a12d36e29d038954820313ffdd85a140a90f1c5133eb74/68747470733a2f2f696d672e736869656c64732e696f2f6769746875622f6c6963656e73652f6173796e712d696f2f666173746170692d7669657773) [![Mypy](https://camo.githubusercontent.com/bb9404fcdb58a323eb20121827036de34979e5d96ec9f11a377f574060c9c65e/68747470733a2f2f696d672e736869656c64732e696f2f62616467652f6d7970792d636865636b65642d626c7565)](https://camo.githubusercontent.com/bb9404fcdb58a323eb20121827036de34979e5d96ec9f11a377f574060c9c65e/68747470733a2f2f696d672e736869656c64732e696f2f62616467652f6d7970792d636865636b65642d626c7565) [![Ruff](https://camo.githubusercontent.com/91c88326d4ac953fd09247768fe73035dee02b2cee3c58c830016aee9631a344/68747470733a2f2f696d672e736869656c64732e696f2f656e64706f696e743f75726c3d68747470733a2f2f7261772e67697468756275736572636f6e74656e742e636f6d2f636861726c6965726d617273682f727566662f6d61696e2f6173736574732f62616467652f76322e6a736f6e)](https://github.com/charliermarsh/ruff)) [![Pydantic v2](https://camo.githubusercontent.com/225cfe67be4e841d9763753ec947434ef7a9469f9723474322e3818d3272e333/68747470733a2f2f696d672e736869656c64732e696f2f656e64706f696e743f75726c3d68747470733a2f2f7261772e67697468756275736572636f6e74656e742e636f6d2f707964616e7469632f707964616e7469632f6d61696e2f646f63732f62616467652f76322e6a736f6e)](https://docs.pydantic.dev/latest/contributing/#badges) [![security: bandit](https://camo.githubusercontent.com/72849879894d56b38c7aeb5ec1bc884d8ce94357a06ad01e4343b07988dddadf/68747470733a2f2f696d672e736869656c64732e696f2f62616467652f73656375726974792d62616e6469742d79656c6c6f772e737667)](https://github.com/PyCQA/bandit) [![Python](https://camo.githubusercontent.com/c169d22871e3915e663b83d5afdc574a279e1f8f25c0b71fa1f793b093ef9022/68747470733a2f2f696d672e736869656c64732e696f2f707970692f707976657273696f6e732f666173746170692d7669657773)](https://camo.githubusercontent.com/c169d22871e3915e663b83d5afdc574a279e1f8f25c0b71fa1f793b093ef9022/68747470733a2f2f696d672e736869656c64732e696f2f707970692f707976657273696f6e732f666173746170692d7669657773) [![Format](https://camo.githubusercontent.com/ef56917a363d326e5ed1d65bc71015db04cbc59b2d7b5edfffd3740254d56828/68747470733a2f2f696d672e736869656c64732e696f2f707970692f666f726d61742f666173746170692d7669657773)](https://camo.githubusercontent.com/ef56917a363d326e5ed1d65bc71015db04cbc59b2d7b5edfffd3740254d56828/68747470733a2f2f696d672e736869656c64732e696f2f707970692f666f726d61742f666173746170692d7669657773) [![PyPi](https://camo.githubusercontent.com/4448667b35c75e6eb1ca72e53725b2967d66415b4a3362de179283d00d7270ee/68747470733a2f2f696d672e736869656c64732e696f2f707970692f762f666173746170692d7669657773)](https://camo.githubusercontent.com/4448667b35c75e6eb1ca72e53725b2967d66415b4a3362de179283d00d7270ee/68747470733a2f2f696d672e736869656c64732e696f2f707970692f762f666173746170692d7669657773)\n\n**Class-based views, CRUD utilities, and production-ready patterns for FastAPI.**\n\nFastAPI Views brings Django REST Framework-style class-based views to FastAPI — without giving up type safety or dependency injection. Define a full CRUD resource by inheriting one class; routes, status codes, and OpenAPI docs are wired up automatically.\n\n## Features\n\n[](#features)\n\n-   **Class-based views** — `View`, `APIView`, `ViewSet`, and `GenericViewSet` at three levels of abstraction; mix-in only the actions you need\n-   **Full CRUD in one class** — `list`, `create`, `retrieve`, `update`, `partial_update`, `destroy` with correct HTTP semantics out of the box (`201 Created`, `204 No Content`, `Location` header, etc.)\n-   **Generic views with the repository pattern** — plug in any data source (SQLAlchemy, Motor, plain dicts) via a simple protocol; no ORM dependency\n-   **DRF-style filters** — `ModelFilter`, `OrderingFilter`, `SearchFilter`, `PaginationFilter`, `TokenPaginationFilter`, `FieldsFilter`, and a combined `Filter` class; built-in SQLAlchemy and Python object resolvers\n-   **RFC 9457 Problem Details** — every error response is machine-readable; built-in classes for the most common cases; custom errors auto-register in the OpenAPI spec\n-   **Fast Pydantic v2 serialization** — `TypeAdapter` cached per schema type avoids the double validation/model instantiation that FastAPI does by default, reducing per-request overhead\n-   **Server-Sent Events** — `ServerSentEventsAPIView` and `@sse_route` handle framing, content-type, and Pydantic validation automatically\n-   **WebSockets** — `WebSocketAPIView` handles connection lifecycle, per-class connection tracking, broadcast helpers, and Pydantic validation of binary frames; disconnects are handled gracefully\n-   **Authentication & authorization** — JWT bearer auth (`JWTAuth`), OAuth2 scope enforcement with hierarchical scopes (`OAuth2JWTAuth`), Auth0 integration, and constant-time API-key auth (`require_api_key`); protected routers and JWKS publishing included (optional extras)\n-   **Internationalization (i18n)** — per-request locale detection (query param, cookie, `Accept-Language`), pluggable translation managers (JSON files, in-memory, or custom), `str.format`/Jinja2 formatters, and `Translatable[str]` model fields; built-in error messages are translatable out of the box (optional extra)\n-   **Async and sync support** — every class ships an `Async` and a synchronous variant; sync endpoints run in a thread pool\n-   **One-call setup** — `configure_app(app)` registers error handlers, Prometheus middleware, OpenTelemetry instrumentation, locale detection, request logging, and a request-size limit\n-   **Prometheus metrics** — `/metrics` endpoint with request count, latency histogram, and in-flight requests (optional extra)\n-   **OpenTelemetry tracing** — `correlation_id` injected into every error response for easy trace correlation (optional extra)\n-   **Structured request logging** — opt-in `console` or `json` request logging via `configure_app(log_config=...)` (optional extra)\n-   **Readable OpenAPI operation IDs** — `list_item`, `create_item`, `retrieve_item` instead of FastAPI's long path-derived defaults\n-   **CLI** — export a static `openapi.json` / `openapi.yaml` without starting a server\n\n---\n\nDocumentation: [https://asynq-io.github.io/fastapi-views/](https://asynq-io.github.io/fastapi-views/)\n\nRepository: [https://github.com/asynq-io/fastapi-views](https://github.com/asynq-io/fastapi-views)\n\n---\n\n## Installation\n\n[](#installation)\n\npip install fastapi-views\n\n## Optional dependencies\n\n[](#optional-dependencies)\n\nAvailable extensions: `uvloop`, `uvicorn`, `prometheus`, `opentelemetry`, `cli`, `logging`, `websockets`, `jose` (JWT auth), `auth0` (Auth0 auth), `i18n`, and `standard` (a curated bundle).\n\npip install 'fastapi-views\\[all\\]'\n\n## Quick start\n\n[](#quick-start)\n\nfrom typing import ClassVar, Optional\nfrom uuid import UUID\n\nfrom fastapi import FastAPI\nfrom pydantic import BaseModel\n\nfrom fastapi\\_views import ViewRouter, configure\\_app\nfrom fastapi\\_views.views.viewsets import AsyncAPIViewSet\n\nclass ItemSchema(BaseModel):\n    id: UUID\n    name: str\n    price: int\n\nclass ItemViewSet(AsyncAPIViewSet):\n    api\\_component\\_name \\= \"Item\"\n    response\\_schema \\= ItemSchema\n\n    \\# In-memory store — swap for a real repository in production\n    items: ClassVar\\[dict\\[UUID, ItemSchema\\]\\] \\= {}\n\n    async def list(self) \\-> list\\[ItemSchema\\]:\n        return list(self.items.values())\n\n    async def create(self, item: ItemSchema) \\-> ItemSchema:\n        self.items\\[item.id\\] \\= item\n        return item\n\n    async def retrieve(self, id: UUID) \\-> Optional\\[ItemSchema\\]:\n        return self.items.get(id)\n\n    async def update(self, id: UUID, item: ItemSchema) \\-> ItemSchema:\n        self.items\\[id\\] \\= item\n        return item\n\n    async def destroy(self, id: UUID) \\-> None:\n        self.items.pop(id, None)\n\nrouter \\= ViewRouter(prefix\\=\"/items\")\nrouter.register\\_view(ItemViewSet)\n\napp \\= FastAPI(title\\=\"My API\")\napp.include\\_router(router)\n\nconfigure\\_app(app)\n\nThis registers the following routes automatically:\n\nMethod\n\nPath\n\nAction\n\nStatus code\n\n`GET`\n\n`/items`\n\n`list`\n\n200\n\n`POST`\n\n`/items`\n\n`create`\n\n201\n\n`GET`\n\n`/items/{id}`\n\n`retrieve`\n\n200\n\n`PUT`\n\n`/items/{id}`\n\n`update`\n\n200\n\n`DELETE`\n\n`/items/{id}`\n\n`destroy`\n\n204\n\n## About\n\nFastAPI Class Views and utilities\n\n[asynq-io.github.io/fastapi-views/](https://asynq-io.github.io/fastapi-views/)\n\n### Topics\n\n[api](/topics/api)[asyncio](/topics/asyncio)[fastapi](/topics/fastapi)[python](/topics/python)[rest](/topics/rest)\n\n### Resources\n\n[Readme](#readme-ov-file)\n\n[Apache-2.0 license](#Apache-2.0-1-ov-file)\n\n[Activity](/asynq-io/fastapi-views/activity)\n\n[Custom properties](/asynq-io/fastapi-views/custom-properties)\n\n### Stars\n\n[**23** stars](/asynq-io/fastapi-views/stargazers)\n\n### Watchers\n\n[**0** watching](/asynq-io/fastapi-views/watchers)\n\n### Forks\n\n[**0** forks](/asynq-io/fastapi-views/forks)\n\n[Report repository](/contact/report-content?content_url=https%3A%2F%2Fgithub.com%2Fasynq-io%2Ffastapi-views&report=asynq-io+%28user%29)\n\n## Releases\n\n## Packages\n\n## Used by\n\n## Contributors\n\n## Languages\n\n## Footer\n\n[](https://github.com)© 2026 GitHub,\_Inc.\n\n### Footer navigation\n\n-   [Terms](https://docs.github.com/site-policy/github-terms/github-terms-of-service)\n-   [Privacy](https://docs.github.com/site-policy/privacy-policies/github-privacy-statement)\n-   [Security](https://github.com/security)\n-   [Status](https://www.githubstatus.com/)\n-   [Community](https://github.community/)\n-   [Docs](https://docs.github.com/)\n-   [Contact](https://support.github.com?tags=dotcom-footer)\n-   Manage cookies\n-   Do not share my personal information\n\nYou can’t perform that action at this time."
