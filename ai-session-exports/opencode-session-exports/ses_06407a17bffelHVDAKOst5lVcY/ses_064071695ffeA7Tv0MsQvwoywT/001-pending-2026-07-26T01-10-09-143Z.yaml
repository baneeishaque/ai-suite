                  "utm_medium=referral&utm_source=stackoverflow-community&utm_campaign=side-bar&utm_content=explore-teams)\n3. Stack Internal\n4. Bring the best of human thought and AI automation together at your work. [Learn more](https://stackoverflow.co/internal/?utm_medium=referral&utm_source=stackoverflow-community&utm_campaign=side-bar&utm_content=explore-teams-compact)\n\n##### Collectives™ on Stack Overflow\n\nFind centralized, trusted content and collaborate around the technologies you use most.\n\nLearn more about Collectives\n\n**Stack Internal**\n\nKnowledge at work\n\nBring the best of human thought and AI automation together at your work.\n\n[Explore Stack Internal](https://stackoverflow.co/internal/?utm_medium=referral&utm_source=stackoverflow-community&utm_campaign=side-bar&utm_content=explore-teams-compact-popover)\n\n# migrate from django migrations to fastapi alembic\n\nAsk Question\n\nAsked 2 years, 1 month ago\n\nModified [2 years, 1 month ago](https://stackoverflow.\ncom/questions/78225447/migrate-from-django-migrations-to-fastapi-alembic?lastactivity \"2024-03-26 12:50:18Z\")\n\nViewed 462 times\n\n0\n\nI had a Django service which had an app called \"User\". This app has 2 tables in, which are being migrated to the database using Django migration system. In order to change the architecture from monolith to micro-service, I broke down User app and add the models and APIs in another Fastapi project. But I didn't separate the database and during this time, I was changing User tables in database using my previous Django project migration system. But now I want to break down tables in the database and move them to the new database. What is the best practices of doing this? And how can I change migrations from Django to alembic?\n\n* django\n* microservices\n* fastapi\n\nShare\n\nImprove this question\n\nFollow\n\nasked Mar 26, 2024 at 12:50\n\nMaedeh Sh's user avatar\n\nMaedeh Sh\n\n5 6 6 bronze badges\n\n3\n\n* How many changes are we talking about?\nIt's probably easier to update your SQLAlchemy models and then create alembic migrations from that instead of trying to do some sort of django vs alembic conversions. In the future you'll work with the SQLAlchemy database, so you'll create alembic migrations as necessary.\n  \n  MatsLindh\n  \n  – MatsLindh\n  \n  2024-03-26 13:12:04 +00:00\n  \n  Commented Mar 26, 2024 at 13:12\n* @MatsLindh Thanks. Actually my question is that how can I start using alembic from the middle of my migrations? not from scratch. Is that possible? I couldn't find any solution.\n  \n  Maedeh Sh\n  \n  – Maedeh Sh\n  \n  2024-03-30 12:35:21 +00:00\n  \n  Commented Mar 30, 2024 at 12:35\n* I'm not sure if that's doable in any sensible way - the migrations are based on the underlying model classes and library, and Django model classes aren't compatible with SQLAlchemy model classes.\nSo my suggestion is to use the django migrations to get the database up to a certain level, then define the SQLAlchemy model classes as representing that point in time, and then use alembic for future migrations (i.e. any changes from that point in time).\n  \n  MatsLindh\n  \n  – MatsLindh\n  \n  2024-03-30 22:50:24 +00:00\n  \n  Commented Mar 30, 2024 at 22:50\n\nAdd a comment | \n\nRelated questions\n\n151 How to migrate back from initial migration in Django 1.7?\n\n132 Django migrate --fake and --fake-initial explained\n\n1429 What is the difference between null=True and blank=True in Django?\n\nRelated questions\n\n151 How to migrate back from initial migration in Django 1.7?\n\n132 Django migrate --fake and --fake-initial explained\n\n1429 What is the difference between null=True and blank=True in Django?\n\n100 How to reset migrations in Django 1.7\n\n0 Running database migrations using fastapi, alembic, docker, lambda\n\n223 Django migration strategy for renaming a model and relationship fields\n315 How do I make many-to-many field optional in Django?\n\n93 How to simplify migrations in Django 1.7?