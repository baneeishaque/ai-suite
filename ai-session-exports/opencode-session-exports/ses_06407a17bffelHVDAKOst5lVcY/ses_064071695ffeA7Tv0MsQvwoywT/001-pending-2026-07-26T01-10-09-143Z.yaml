879487f7115b9afa53a667d52da25c5869193/68747470733a2f2f776f726b736f6c7574696f6e732e72752f75706c6f6164732f6c617267655f445f76735f465f613662656361666633382e6a7067)\n\n [![GitHub Stars](https://camo.githubusercontent.com/e1df148cf3c5ad254fc3cde9a1c1d2775b12682e1d360772b36d9703ac2ffea0/68747470733a2f2f696d672e736869656c64732e696f2f6769746875622f73746172732f686f6f7368656d6164686f6f73682f466173744452463f7374796c653d736f6369616c)](https://github.com/hooshemadhoosh/FastDRF)[![Python Version](https://camo.githubusercontent.com/e801a66299d2c15286fe0fee660d9ffa666c1c5576e5e1536acc07b49ce8ac8f/68747470733a2f2f696d672e736869656c64732e696f2f62616467652f707974686f6e2d332e31302532422d626c7565)](https://camo.githubusercontent.com/e801a66299d2c15286fe0fee660d9ffa666c1c5576e5e1536acc07b49ce8ac8f/68747470733a2f2f696d672e736869656c64732e696f2f62616467652f707974686f6e2d332e31302532422d626c7565) [![License](https://camo.githubusercontent.com/85276c5c2089565c053ac5af0e633ba86d690907955da75a7339cee7f8e3ecf1/68747470733a2f2f696d672e736869656c64732e696f2f6769746875622f6c6963656e73652f686f6f7368656d6164686f6f73682f46617374445246)](https://camo.githubusercontent.com/85276c5c2089565c053ac5af0e633ba86d690907955da75a7339cee7f8e3ecf1/68747470733a2f2f696d672e736869656c64732e696f2f6769746875622f6c6963656e73652f686f6f7368656d6164686f6f73682f46617374445246)\n\n# FastDRF\n\n[](#fastdrf)\n\nFastDRF: Migrating from Django Rest Framework to FastAPI template with even more flexibility.\n\n**FastDRF** is a clean and powerful FastAPI project template for developers migrating from Django REST Framework (DRF) to FastAPI. It provides:\n\n-   ✅ JWT authentication fully compatible with Django\n-   ✅ DRF-style `ViewSet` classes with automatic routing\n-   ✅ Modular permissions via `BasePermission` subclasses\n-   ✅ Automatic Pydantic schema generation from SQLAlchemy models\n-   ✅ PostgreSQL support\n-   ✅ Auto-generated Swagger and ReDoc API docs\n\n---\n\n## 🚀 Features\n\n[](#-features)\n\n-   🔐 **JWT Auth (Access + Refresh)**: Shared token structure between Django and FastAPI. Users created in Django can log in via FastAPI and vice versa.\n-   ⚙️ **Custom ViewSets**: Automatically handle `GET`, `POST`, `PATCH`, `DELETE` with just a target query.\n-   🛡️ **Permissions**: Create powerful and composable permissions just like in DRF.\n-   📦 **Modular Structure**: Easily extensible and production-ready base architecture.\n-   📄 **OpenAPI Docs**: Fully documented API via Swagger (`/docs`) and ReDoc (`/redoc`).\n\n---\n\n## 🧱 Requirements\n\n[](#-requirements)\n\n-   Python 3.10+\n-   PostgreSQL\n-   `.env` file (see below)\n\nDependencies are listed in [`requirements.txt`](/hooshemadhoosh/FastDRF/blob/main/requirements.txt), including:\n\n-   `fastapi`, `uvicorn`, `sqlalchemy`, `pydantic`, `asyncpg`\n-   `alembic`, `python-dotenv`, `passlib[bcrypt]`, etc.\n\n---\n\n## ⚙️ Installation\n\n[](#️-installation)\n\n### 1\\. Clone and enter the project:\n\n[](#1-clone-and-enter-the-project)\n\ngit clone https://github.com/hooshemadhoosh/FastDRF.git\ncd FastDRF\n\n### 2\\. Create and activate a virtual environment:\n\n[](#2-create-and-activate-a-virtual-environment)\n\npython -m venv venv\nsource venv/bin/activate  # or venv/Scripts/activate on Windows\n\n### 3\\. Install dependencies:\n\n[](#3-install-dependencies)\n\npip install -r requirements.txt\n\n### 4\\. Set up `.env` file:\n\n[](#4-set-up-env-file)\n\nCreate a `.env` file in the root with:\n\nDB\\_USER\\=postgres\nDB\\_PASS\\=your\\_db\\_password\nDB\\_HOST\\=localhost\nDB\\_PORT\\=5432 #Or your custom port\nDB\\_NAME\\=dbname\nSECRET\\_KEY\\=your\\_super\\_secret\\_key\\_in\\_django\\_project\n\n### 5\\. Start PostgreSQL and create your database (if not done).\n\n[](#5-start-postgresql-and-create-your-database-if-not-done)\n\n### 6\\. Run the development server:\n\n[](#6-run-the-development-server)\n\nYou can easily run the server via main.py file just like a normal python program.\n\npython main.py\n\n---\n\n## 🔑 Authentication\n\n[](#-authentication)\n\n-   `POST /auth/login`: Login using username/password\n-   `POST /auth/refresh`: Get new access token using refresh token\n-   `POST /auth/logout`: Blacklist a refresh token\n-   `GET /me`: Get current user info\n\nTokens and password hashing are fully compatible with Django:\n\n-   Uses Django-compatible hashers (`pbkdf2_sha256`)\n-   Auth tokens created in one framework work in the other\n\n---\n\n## 🧠 Usage\n\n[](#-usage)\n\n### Create a new ViewSet\n\n[](#create-a-new-viewset)\n\n\\# views/product.py\nclass ProductViewSet(BaseViewSet):\n    target\\_query \\= select(Product)\n    search\\_fields \\= \\[\"name\", \"description\"\\]\n    ordering\\_fields \\= \\[\"price\", \"created\\_at\"\\]\n    default\\_ordering \\= \\[\"-created\\_at\"\\]\n    protect\\_by \\= IsAuthenticated & AllowAll\n\nThen add it to your `views` list in `config.py`:\n\nviews \\= \\[\n    UserViewSet('/user',tags\\=\\[\"User Views\"\\]),\n    ProductViewSet('/product',tags\\=\\[\"Product management\"\\])\n\\]\n\n### Define permissions\n\n[](#define-permissions)\n\nclass IsAdmin(BasePermission):\n    @classmethod\n    async def has\\_permission(self, user, method, \\*\\*kwargs):\n        return user and user.is\\_staff\n\nUse it like:\n\nprotect\\_by \\= IsAuthenticated & IsAdmin\n\n---\n\n## 🔍 API Docs\n\n[](#-api-docs)\n\n-   Swagger: [http://localhost:8080/docs](http://localhost:8080/docs)\n-   ReDoc: [http://localhost:8080/redoc](http://localhost:8080/redoc)\n\n---\n\n## 🧪 Example Endpoints\n\n[](#-example-endpoints)\n\nMethod\n\nPath\n\nDescription\n\nGET\n\n`/user`\n\nList users\n\nGET\n\n`/user/{id}`\n\nRetrieve single user\n\nPUT\n\n`/user`\n\nCreate new user\n\nPATCH\n\n`/user/{id}`\n\nUpdate user\n\nDELETE\n\n`/user/{id}`\n\nDelete user\n\nPOST\n\n`/auth/login`\n\nLogin with credentials\n\nPOST\n\n`/auth/refresh`\n\nRefresh access token\n\nPOST\n\n`/auth/logout`\n\nLogout / blacklist token\n\n---\n\n## ✨ Project Structure\n\n[](#-project-structure)\n\n```\n.\n├── config.py          # App config & FastAPI app instance\n├── database.py        # Async SQLAlchemy setup\n├── models/            # SQLAlchemy models\n├── permissions/       # DRF-style permission classes\n├── routers/           # Auth routes, test routes\n├── schemas/           # Pydantic schemas\n├── views/             # DRF-like ViewSets\n├── utils/             # Reusable helpers\n└── requirements.txt\n```\n\n---\n\n## 💠 Contributing\n\n[](#-contributing)\n\nPull requests are welcome! Feel free to fork and improve the template.\n\n## About\n\nFastDRF: Migrating from Django Rest Framework to FastAPI template with even more flexibility.\n\n### Resources\n\n[Readme](#readme-ov-file)\n\n[Activity](/hooshemadhoosh/FastDRF/activity)\n\n### Stars\n\n[**3** stars](/hooshemadhoosh/FastDRF/stargazers)\n\n### Watchers\n\n[**1** watching](/hooshemadhoosh/FastDRF/watchers)\n\n### Forks\n\n[**0** forks](/hooshemadhoosh/FastDRF/forks)\n\n[Report repository](/contact/report-content?content_url=https%3A%2F%2Fgithub.com%2Fhooshemadhoosh%2FFastDRF&report=hooshemadhoosh+%28user%29)\n\n## Releases\n\n## Packages\n\n## Contributors\n\n## Languages\n\n## Footer\n\n[](https://github.com)© 2026 GitHub,\_Inc.\n\n### Footer navigation\n\n-   [Terms](https://docs.github.com/site-policy/github-terms/github-terms-of-service)\n-   [Privacy](https://docs.github.com/site-policy/privacy-policies/github-privacy-statement)\n-   [Security](https://github.com/security)\n-   [Status](https://www.githubstatus.com/)\n-   [Community](https://github.community/)\n-   [Docs](https://docs.github.com/)\n-   [Contact](https://support.github.com?tags=dotcom-footer)\n-   Manage cookies\n-   Do not share my personal information\n\nYou can’t perform that action at this time."
