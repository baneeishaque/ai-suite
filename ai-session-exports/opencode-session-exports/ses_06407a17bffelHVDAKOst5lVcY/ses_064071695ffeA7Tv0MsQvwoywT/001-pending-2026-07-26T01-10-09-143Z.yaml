                "url": "https://www.jaimedcsilva.com/hello-world/13-django-rest-api-api-documentation-with-swaggeropenapi/",
                "title": "13. Django REST API: API Documentation with Swagger/OpenAPI",
                "publish_date": "2026-05-05",
