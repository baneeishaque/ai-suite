                  "On this page\n\n* The normal process\n* Overriding the defaults\n  \n    + Normal **FastAPI**\n    + Generate the OpenAPI schema\n    + Modify the OpenAPI schema\n    + Cache the OpenAPI schema\n    + Override the method\n    + Check it\n\n1. FastAPI\n2. Learn\n3. How To - Recipes\n\n# Extending OpenAPI ¶\n\nThere are some cases where you might need to modify the generated OpenAPI schema.\n\nIn this section you will see how.\n\n## The normal process ¶\n\nThe normal (default) process, is as follows.\n\nA `FastAPI` application (instance) has an `.openapi()` method that is expected to return the OpenAPI schema.\n\nAs part of the application object creation, a _path operation_ for `/openapi.json` (or for whatever you set your `openapi_url` ) is registered.\n\nIt just returns a JSON response with the result of the application's `.openapi()` method.\n\nBy default, what the method `.openapi()` does is check the property `.openapi_schema` to see if it has contents and return them.\n\n...\n\nFastAPI will traverse that route tree to collect the effective path operations.\n\nNote\n\nThe parameter `summary` is available in OpenAPI 3.1.0 and above, supported by FastAPI 0.99.0 and above.\n\n## Overriding the defaults ¶\n\nUsing the information above, you can use the same utility function to generate the OpenAPI schema and override each part that you need.\n\nFor example, let's add [ReDoc's OpenAPI extension to include a custom logo](https://github.com/Rebilly/ReDoc/blob/master/docs/redoc-vendor-extensions.md) .\n\n### Normal **FastAPI** ¶\n\nFirst, write all your **FastAPI** application as normally:\n\nPython 3.10+\n\n```\nfrom fastapi import FastAPI from fastapi.openapi.utils import get_openapi app = FastAPI () @app . get ( \"/items/\" ) async def read_items (): return [{ \"name\" : \"Foo\" }] def custom_openapi (): if app . openapi_schema : return app . openapi_schema openapi_schema = get_openapi ( title = \"Custom title\" , version = \"2.5.\n0\" , summary = \"This is a very custom OpenAPI schema\" , description = \"Here's a longer description of the custom **OpenAPI** schema\" , routes = app . routes , ) openapi_schema [ \"info\" ][ \"x-logo\" ] = { \"url\" : \"https://fastapi.tiangolo.com/img/logo-margin/logo-teal.png\" } app . openapi_schema = openapi_schema return app . openapi_schema app . openapi = custom_openapi\n```\n\n### Generate the OpenAPI schema ¶\n\nThen, use the same utility function to generate the OpenAPI schema, inside a `custom_openapi()` function:\n\nPython 3.10+\n\n```\nfrom fastapi import FastAPI from fastapi.openapi.utils import get_openapi app = FastAPI () @app . get ( \"/items/\" ) async def read_items (): return [{ \"name\" : \"Foo\" }] def custom_openapi (): if app . openapi_schema : return app . openapi_schema openapi_schema = get_openapi ( title = \"Custom title\" , version = \"2.5.\n\n...\n\n0\" , summary = \"This is a very custom OpenAPI schema\" , description = \"Here's a longer description of the custom **OpenAPI** schema\" , routes = app . routes , ) openapi_schema [ \"info\" ][ \"x-logo\" ] = { \"url\" : \"https://fastapi.tiangolo.com/img/logo-margin/logo-teal.png\" } app . openapi_schema = openapi_schema return app . openapi_schema app . openapi = custom_openapi\n```\n\n### Cache the OpenAPI schema ¶\n\nYou can use the property `.openapi_schema` as a \"cache\", to store your generated schema.\n\nThat way, your application won't have to generate the schema every time a user opens your API docs.\n\nIt will be generated only once, and then the same cached schema will be used for the next requests.\n\nPython 3.10+\n\n```\nfrom fastapi import FastAPI from fastapi.openapi.utils import get_openapi app = FastAPI () @app . get ( \"/items/\" ) async def read_items (): return [{ \"name\" : \"Foo\" }] def custom_openapi (): if app . openapi_schema : return app ."
