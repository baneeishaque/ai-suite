          1056:         today = datetime.fromtimestamp(int(time.time()))
          1057:         purchase_date = datetime.fromtimestamp(current_plan.purchase_date)
          1058:         remaining_days = (expiry_date - today).days
          1059:         plans_total_date = (expiry_date-purchase_date).days
          1060:         return remaining_days
