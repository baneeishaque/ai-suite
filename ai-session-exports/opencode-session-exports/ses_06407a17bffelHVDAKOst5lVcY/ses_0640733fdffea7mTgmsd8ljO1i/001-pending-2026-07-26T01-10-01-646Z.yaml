          1028:     def calulate_upgrade_cost(self,purchase_history:PlanPurchaseHistory):
          1029:         """ this method calulates the organizations plans with added users if 
          1030:         the organization has plan for 3 more months remaining then they want to add 5 more user and their user limit exceeds
          1031:         then we will add and calculate the cost of adding 5 user for the remianing 3 months cost """
          1032: 
          1033:         remaining_days:dict = self.get_remaining_days(purchase_history)
          1034:         plan:PricingPlan = purchase_history.plan
          1035: 
          1036:         # find one persons cost for the plan 
          1037:         single_user_cost = plan.price/plan.max_users
          1038:         single_user_per_day_cost = round(single_user_cost / plan.days, 2)
          1039:         final_cost = remaining_days*single_user_per_day_cost
          1040: 
          1041:         return {
          1042:             "remaining_days":remaining_days,
          1043:             "single_user_cost":single_user_cost,
          1044:             "single_user_per_day_cost":single_user_per_day_cost,
          1045:             "final_cost":final_cost,
          1046:             "price_of_the_plan":plan.price,
          1047:             "max_user":plan.max_users,
          1048:             "days":plan.days,
          1049:             "currency":CountryDetails.objects.get(country=plan.country).currency_symbol 
          1050: 
          1051:         }
