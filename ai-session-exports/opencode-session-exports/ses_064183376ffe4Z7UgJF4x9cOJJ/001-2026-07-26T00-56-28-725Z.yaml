                            "success": False,
                            "error": {
                                "code": status.HTTP_400_BAD_REQUEST,
                                "message": "Validation error",
                                "details": _flatten_django_validation_error(exc),
                            },
                        },
                        status=status.HTTP_400_BAD_REQUEST,
                    )

                logger.error(
