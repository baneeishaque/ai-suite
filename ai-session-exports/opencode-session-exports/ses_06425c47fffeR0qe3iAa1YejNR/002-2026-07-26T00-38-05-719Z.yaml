          search_vector = SearchVectorField(null=True, editable=False)
          
          class Meta:
              indexes = [
                  GinIndex(fields=['search_vector']),
                  GinIndex(fields=['trader_name', 'commodity_name'], name='trigram_idx', 
                           opclasses=['gin_trgm_ops', 'gin_trgm_ops']),
              ]

      # signals.py - Auto-update search vector
      from django.db.models.signals import pre_save
      from django.dispatch import receiver
      from django.contrib.postgres.search import SearchVector

      @receiver(pre_save, sender=PaperTrading)
      def update_search_vector(sender, instance, **kwargs):
          instance.search_vector = (
              SearchVector('exec_id', weight='A') +
              SearchVector('derivative', weight='A') +
              SearchVector('trader__name', weight='B') +
              SearchVector('commodity__contract_name', weight='B') +
