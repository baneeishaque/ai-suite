      # views.py - Search endpoint
      from django.contrib.postgres.search import SearchQuery, SearchRank, TrigramSimilarity
      from django.db.models import Q

      class PaperTradingSearchView(ListAPIView):
          def get_queryset(self):
              q = self.request.query_params.get('q', '')
              if not q:
                  return PaperTrading.objects.none()
              
              query = SearchQuery(q, search_type='websearch')  # supports "quotes", -exclude, OR
              
              # Full-text search with ranking
              qs = PaperTrading.objects.annotate(
                  rank=SearchRank('search_vector', query),
                  trigram_sim=TrigramSimilarity('exec_id', q) + 
