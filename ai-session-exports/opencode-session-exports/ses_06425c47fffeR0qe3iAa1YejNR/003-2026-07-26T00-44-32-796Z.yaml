            ```python
            # search/services.py
            from elasticsearch_dsl import Document, Text, Keyword, Date, Double, Index, connections
            from elasticsearch_dsl.analysis import analyzer, token_filter

            trading_synonyms = token_filter('trading_synonyms', 'synonym_graph', synonyms=[
                "WTI, crude, cl, texas light sweet",
                "BRENT, brent crude, co, north sea",
                # ...
            ])

            trading_analyzer = analyzer('trading_analyzer', tokenizer='standard', 
                                        filter=['lowercase', 'asciifolding', trading_synonyms])

            class PaperTradingDoc(Document):
                id = Keyword()
                organization_id = Keyword()
                exec_id = Text(analyzer=trading_analyzer, fields={
                    'keyword': Keyword(), 'autocomplete': Text(analyzer='autocomplete')
                })
                derivative = Text(analyzer=trading_analyzer)
                trader_name = Text(analyzer=trading_analyzer)
                commodity_name = Text(analyzer=trading_analyzer)
                book_name = Keyword()
                strategy_name = Keyword()
                broker_name = Keyword()
                clearer_name = Keyword()
                trade_type = Keyword()
                contract_type = Keyword()
                buy_sell = Keyword()
                date = Date(format='epoch_second')
                pricing_from = Date(format='epoch_second')
                pricing_to = Date(format='epoch_second')
                quantity = Double()
                price = Double()
                volume = Double()
                created_at = Date()
                
                class Index:
                    name = 'paper_trading'
                    settings = {'number_of_shards': 3, 'number_of_replicas': 1}

            # Sync signal
            from django.db.models.signals import post_save, post_delete
            from django.dispatch import receiver

            @receiver(post_save, sender=PaperTrading)
            def sync_to_elasticsearch(sender, instance, **kwargs):
                doc = PaperTradingDoc(
                    meta={'id': str(instance.id)},
                    id=str(instance.id),
                    organization_id=str(instance.organization_id),
                    exec_id=instance.exec_id,
                    derivative=instance.derivative,
                    trader_name=instance.trader.name if instance.trader else '',
                    commodity_name=instance.commodity.contract_name if instance.commodity else '',
                    book_name=instance.book.name if instance.book else '',
                    strategy_name=instance.strategy.name if instance.strategy else '',
                    broker_name=instance.broker.name if instance.broker else '',
                    clearer_name=instance.clearer_rate.clearer.name if instance.clearer_rate else '',
                    trade_type=instance.trader_type,
                    contract_type=instance.contract_type.name if instance.contract_type else '',
                    buy_sell=instance.buy_sell,
                    date=instance.date,
                    pricing_from=instance.pricing_from,
                    pricing_to=instance.pricing_to,
                    quantity=float(instance.quantity) if instance.quantity else 0,
                    price=float(instance.price) if instance.price else 0,
                    volume=float(instance.volume) if instance.volume else 0,
                )
                doc.save()

            @receiver(post_delete, sender=PaperTrading)
            def delete_from_elasticsearch(sender, instance, **kwargs):
                try:
                    PaperTradingDoc.get(id=str(instance.id)).delete()
                except: pass
            ```

