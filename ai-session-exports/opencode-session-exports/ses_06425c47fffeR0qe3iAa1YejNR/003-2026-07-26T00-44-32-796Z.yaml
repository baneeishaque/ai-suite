            ## 2. Search Mechanism Comparison (Detailed)

            ### 2.1 Ranking Criteria

            | Criterion | Weight | Description |
            |-----------|--------|-------------|
            | **Query Latency (p99)** | 30% | Sub-10ms for autocomplete, sub-100ms for full search |
            | **Index Size Overhead** | 15% | Storage cost of search indexes |
            | **Write Latency Impact** | 15% | Overhead on INSERT/UPDATE of trade records |
            | **Fuzzy/Typo Tolerance** | 15% | Handles "crde" → "crude", "WTI " → "WTI" |
            | **Relevance Ranking Quality** | 15% | BM25/tf-idf + business logic boosting |
            | **Operational Complexity** | 10% | New services, sync jobs, monitoring |

