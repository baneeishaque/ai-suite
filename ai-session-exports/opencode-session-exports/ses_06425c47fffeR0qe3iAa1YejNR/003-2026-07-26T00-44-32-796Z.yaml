            # paper_app/search/serializers.py
            from rest_framework import serializers
            from apps.paper_app.models import PaperTrading


            class PaperTradingSearchSerializer(serializers.ModelSerializer):
                """Serializer with search highlights and relevance score."""
                
                rank = serializers.FloatField(read_only=True)
                headline_exec_id = serializers.CharField(source='headline_exec', read_only=True)
                headline_derivative = serializers.CharField(source='headline_deriv', read_only=True)
                trigram_scores = serializers.SerializerMethodField()
                
                class Meta:
                    model = PaperTrading
                    fields = [
                        'id', 'exec_id', 'derivative', 'trader_type', 'buy_sell',
                        'date', 'pricing_from', 'pricing_to', 'quantity', 'price', 'volume',
                        'trader', 'commodity', 'book', 'strategy', 'broker', 'contract_type',
                        'clearer_rate', 'trade_status', 'leg_id', 'physical_code',
                        'rank', 'headline_exec_id', 'headline_derivative', 'trigram_scores',
                    ]
                
                def get_trigram_scores(self, obj):
                    """Include trigram similarity scores if annotated."""
                    scores = {}
                    for field in ['exec_id', 'derivative', 'trader_name', 'commodity_name', 
                                 'book_name', 'strategy_name']:
                        attr = f'trigram_{field}'
                        if hasattr(obj, attr):
                            scores[field] = round(getattr(obj, attr), 4)
                    return scores if scores else None
            ```

