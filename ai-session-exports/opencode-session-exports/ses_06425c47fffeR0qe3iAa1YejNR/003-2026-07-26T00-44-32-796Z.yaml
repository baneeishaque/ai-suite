            #### **Rank 4: PostgreSQL pg_trgm Only**

            **Simpler fuzzy search without full-text ranking.**

            ```sql
            -- Enable
            CREATE EXTENSION pg_trgm;

            -- Indexes
            CREATE INDEX idx_paper_trading_exec_trgm 
            ON paper_app_papertrading 
            USING GIN (exec_id gin_trgm_ops);

            CREATE INDEX idx_paper_trading_derivative_trgm 
            ON paper_app_papertrading 
            USING GIN (derivative gin_trgm_ops);

            -- Query: similarity search
            SELECT *, similarity(exec_id, 'CLZ24') AS sim
            FROM paper_app_papertrading
            WHERE exec_id % 'CLZ24'  -- default threshold 0.3
            ORDER BY sim DESC;

            -- Query: word similarity (better for partial)
            SELECT *, word_similarity('WTI', commodity_name) AS wsim
            FROM paper_app_papertrading
            WHERE word_similarity('WTI', commodity_name) > 0.4
            ORDER BY wsim DESC;

            -- Set threshold per session
            SET pg_trgm.similarity_threshold = 0.4;
            ```

