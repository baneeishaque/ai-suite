            ### 2.2 Detailed Mechanism Comparison

            #### **Rank 1: PostgreSQL Full-Text Search + pg_trgm (RECOMMENDED)**

            ```sql
            -- Enable extensions (one-time)
            CREATE EXTENSION IF NOT EXISTS pg_trgm;
            CREATE EXTENSION IF NOT EXISTS fuzzystrmatch;  -- optional: soundex, dmetaphone
            ```

            **Architecture:**
            ```
            ┌─────────────────────────────────────────────────────────────┐
            │                    POSTGRESQL CLUSTER                        │
            │  ┌──────────────┐  ┌──────────────┐  ┌──────────────────┐  │
            │  │ paper_trading│  │   GIN Index  │  │   GIN Index      │  │
            │  │   table      │──▶│ (tsvector)   │  │ (pg_trgm)        │  │
            │  │              │  │ search_vector│  │ trader_name,     │  │
            │  │ search_vector│  │              │  │ commodity_name,  │  │
            │  │ (tsvector)   │  │              │  │ exec_id,         │  │
            │  └──────────────┘  └──────────────┘  │ derivative       │  │
            │         ▲                              └──────────────────┘  │
            │         │ UPDATE search_vector via                            │
            │         │ trigger (same transaction)                          │
            │  ┌──────┴──────┐                                              │
            │  │  TRIGGER    │  BEFORE INSERT/UPDATE                        │
            │  │  FUNCTION   │  SET NEW.search_vector =                     │
            │  └─────────────┘  setweight(to_tsvector('english',             │
            │                   COALESCE(exec_id,'')), 'A') ||               │
            │                   setweight(to_tsvector('english',             │
            │                   COALESCE(derivative,'')), 'A') ||            │
            │                   setweight(to_tsvector('english',             │
            │                   COALESCE(trader_name,'')), 'B') ||           │
            │                   ...                                          │
            └─────────────────────────────────────────────────────────────┘
            ```

            **Query Examples:**

            ```sql
            -- 1. Full-text search with ranking (websearch syntax: quotes, -, OR)
            SELECT *, ts_rank_cd(search_vector, query) AS rank
            FROM paper_trading, 
                 plainto_tsquery('english', 'crude oil') query
            WHERE search_vector @@ query
            ORDER BY rank DESC
            LIMIT 20;

            -- 2. Fuzzy trigram similarity (typo tolerance)
            SELECT *, similarity(exec_id, 'CLZ24') AS sim
            FROM paper_trading
            WHERE exec_id % 'CLZ24'  -- % operator = similarity > 0.3 (default)
            ORDER BY sim DESC
            LIMIT 10;

            -- 3. HYBRID: FTS + Trigram (best of both)
            SELECT *, 
                   ts_rank_cd(search_vector, query) * 0.7 + 
                   similarity(exec_id, 'CLZ24') * 0.3 AS combined_score
            FROM paper_trading,
                 websearch_to_tsquery('english', 'crude oil') query
            WHERE search_vector @@ query 
               OR exec_id % 'CLZ24'
            ORDER BY combined_score DESC;
            ```

            **Django ORM Equivalent:**

            ```python
            # views.py
            from django.contrib.postgres.search import (
                SearchVector, SearchQuery, SearchRank, 
                TrigramSimilarity, TrigramWordSimilarity
            )
            from django.db.models import Q, F, Value
            from django.db.models.functions import Coalesce

            class PaperTradingSearchView(ListAPIView):
                serializer_class = PaperTradingSearchSerializer
                pagination_class = StandardResultsSetPagination
                
                def get_queryset(self):
                    q = self.request.query_params.get('q', '').strip()
                    if not q:
                        return PaperTrading.objects.none()
                    
                    # Parse websearch syntax: "exact phrase" -exclude OR term
                    query = SearchQuery(q, search_type='websearch', config='english')
                    
                    # Vector weights: A=highest, D=lowest
                    vector = (
                        SearchVector('exec_id', weight='A', config='english') +
                        SearchVector('derivative', weight='A', config='english') +
                        SearchVector('trader__name', weight='B', config='english') +
                        SearchVector('commodity__contract_name', weight='B', config='english') +
                        SearchVector('book__name', weight='C', config='english') +
                        SearchVector('strategy__name', weight='C', config='english') +
                        SearchVector('broker__name', weight='C', config='english') +
                        SearchVector('clearer_rate__clearer__name', weight='D', config='english')
                    )
                    
                    qs = PaperTrading.objects.annotate(
                        # Full-text rank (0.0 - 1.0+)
                        rank=SearchRank(vector, query, cover_density=True),
                        # Trigram similarity for fuzzy matching (0.0 - 1.0)
                        exec_sim=TrigramSimilarity('exec_id', q),
                        trader_sim=TrigramSimilarity('trader__name', q),
                        commodity_sim=TrigramSimilarity('commodity__contract_name', q),
                        # Combined score
                        combined_score=(
                            F('rank') * 0.6 + 
                            Coalesce(F('exec_sim'), Value(0.0)) * 0.2 +
                            Coalesce(F('trader_sim'), Value(0.0)) * 0.1 +
                            Coalesce(F('commodity_sim'), Value(0.0)) * 0.1
                        )
                    ).filter(
                        Q(search_vector=query) | 
                        Q(exec_sim__gt=0.3) | 
                        Q(trader_sim__gt=0.3) |
                        Q(commodity_sim__gt=0.3)
                    ).order_by('-combined_score', '-rank')
                    
                    # Apply existing org scoping
                    return qs.filter(organization=self.request.user.organization)
            ```

