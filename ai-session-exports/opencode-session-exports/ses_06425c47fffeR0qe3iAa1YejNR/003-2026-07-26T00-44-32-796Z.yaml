            ## 3. Fuzzy Search Deep Dive

            ### 3.1 What "Fuzzy" Means in Each System

            | System | Algorithm | Typical Threshold | Example: "crde" → "crude" |
            |--------|-----------|-------------------|---------------------------|
            | **pg_trgm** | Trigram Jaccard similarity | 0.3 (default) | ✅ sim=0.4 |
            | **pg_trgm word_sim** | Word-level trigram overlap | 0.4 | ✅ wsim=0.5 |
            | **Elasticsearch** | Levenshtein edit distance | AUTO (1-2 edits) | ✅ fuzziness=AUTO |
            | **Meilisearch** | Levenshtein + prefix | Configurable | ✅ 1 typo for 4+ chars |
            | **Postgres FTS** | None (stemming only) | N/A | ❌ No match |
            | **Vector (semantic)** | Cosine similarity | 0.7-0.8 | ✅ "oil" ≈ "crude" (0.78) |

            ### 3.2 Trading-Specific Fuzzy Requirements

            ```python
            # Typical trading typos & variations to handle:
            TRADING_FUZZY_CASES = {
                # Symbol typos
                'CLZ4': 'CLZ24',           # Missing digit
                'CLZ224': 'CLZ24',         # Extra digit
                'CL Z24': 'CLZ24',         # Space
                'CL-Z24': 'CLZ24',         # Hyphen
                
                # Commodity aliases
                'WTI': 'CL',               # Common alias
                'BRENT': 'CO',             # Common alias
                'CRUDE': 'CL',             # Generic term
                'LIGHT SWEET': 'CL',       # Quality descriptor
                
                # Trader name typos
                'Jhon Smith': 'John Smith',
                'Smith J': 'John Smith',   # Initial
                
                # Strategy/Book abbreviations
                'HEDGE': 'HEDGING',
                'ARB': 'ARBITRAGE',
                'PROP': 'PROPRIETARY',
            }
            ```

            ### 3.3 Recommended Fuzzy Configuration for Trading

            **PostgreSQL pg_trgm:**
            ```sql
            -- Lower threshold for trading symbols (short, precise)
            SET pg_trgm.similarity_threshold = 0.3;
            SET pg_trgm.word_similarity_threshold = 0.4;

            -- Or per-query:
            SELECT *, similarity(exec_id, 'CLZ24') 
            FROM paper_trading 
            WHERE similarity(exec_id, 'CLZ24') > 0.35;  -- Custom threshold
            ```

            **Elasticsearch:**
            ```json
            {
              "query": {
                "multi_match": {
                  "query": "CLZ24",
                  "fields": ["exec_id^10", "derivative^3", "commodity_name^2"],
                  "fuzziness": "AUTO",           // 0-2 edits based on length
                  "prefix_length": 2,            // First 2 chars must match
                  "max_expansions": 50,
                  "fuzzy_transpositions": true   // Allow "CLZ24" ↔ "CLZ42"
                }
              }
            }
            ```

