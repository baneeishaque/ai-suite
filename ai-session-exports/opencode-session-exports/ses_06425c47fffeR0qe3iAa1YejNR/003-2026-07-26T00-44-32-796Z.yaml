            #### **Rank 2: Elasticsearch / OpenSearch**

            **When to Choose:**
            - Multi-tenant with strict index isolation per organization
            - Need geo-spatial search (trading desk locations)
            - Complex aggregations (histograms, percentiles, significant terms)
            - >50M documents requiring horizontal scaling
            - Cross-cluster search (dev/staging/prod)

            **Architecture:**
            ```
            ┌─────────────┐     ┌──────────────────┐     ┌──────────────────┐
            │   Django    │────▶│  Logstash /      │────▶│  Elasticsearch   │
            │  (writes)   │     │  Kafka Connect   │     │  Cluster         │
            └─────────────┘     │  (CDC pipeline)  │     │  (3+ data nodes) │
                                └──────────────────┘     └──────────────────┘
                                       │                        │
                                ┌──────┴──────┐         ┌──────┴──────┐
                                │  Sync Lag   │         │  Relevance  │
                                │  ~1-5 sec   │         │  BM25 +     │
                                │  (eventual  │         │  custom     │
                                │  consistency)│        │  scripts    │
                                └─────────────┘         └─────────────┘
            ```

            **Sync Options:**

            | Method | Latency | Complexity | Consistency |
            |--------|---------|------------|-------------|
            | **Django signals → Logstash** | ~100ms | Medium | Eventual |
            | **PostgreSQL WAL → Kafka → ES** | ~1s | High | Eventual |
            | **pg_logical → Kafka Connect** | ~500ms | Medium | Eventual |
            | **Direct ES indexing in view** | ~50ms | Low | Strong (but couples) |

