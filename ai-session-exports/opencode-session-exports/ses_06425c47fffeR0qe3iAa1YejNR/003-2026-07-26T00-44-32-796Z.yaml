            #### **Rank 5: Django SearchVector (Postgres FTS Wrapper)**

            **Pure Django ORM, no raw SQL, but no fuzzy by default.**

            ```python
            # models.py
            from django.contrib.postgres.search import SearchVectorField
            from django.contrib.postgres.indexes import GinIndex

            class PaperTrading(SoftDeleteModel, AbstractOrganization):
                search_vector = SearchVectorField(null=True, editable=False)
                
                class Meta:
                    indexes = [
                        GinIndex(fields=['search_vector']),
                    ]

            # views.py
            from django.contrib.postgres.search import SearchVector, SearchQuery, SearchRank

            class PaperTradingSearchView(ListAPIView):
                def get_queryset(self):
                    q = self.request.query_params.get('q', '')
                    if not q:
                        return PaperTrading.objects.none()
                    
                    vector = SearchVector(
                        'exec_id', weight='A',
                        'derivative', weight='A',
                        'trader__name', weight='B',
                        'commodity__contract_name', weight='B',
                        'book__name', weight='C',
                        'strategy__name', weight='C',
                    )
                    query = SearchQuery(q, config='english', search_type='websearch')
                    
                    return PaperTrading.objects.annotate(
                        rank=SearchRank(vector, query)
                    ).filter(search_vector=query).order_by('-rank')
            ```

