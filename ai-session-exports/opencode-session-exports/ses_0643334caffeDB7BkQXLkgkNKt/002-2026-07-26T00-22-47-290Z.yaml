      ## Kafka Cache (Not Present)

      **Your project has NO Kafka integration.** I searched for:
      - `kafka` / `confluent-kafka` / `aiokafka` → **not in requirements**
      - Kafka settings → **none in settings files**
      - Celery broker → **Redis**, not Kafka

      **Kafka ≠ Cache.** Kafka is a **distributed log/stream processor**, not a cache. You'd use it for:
      - Event sourcing / audit trails
      - Inter-service messaging
      - Stream processing (e.g., real-time pricing feeds)

      **If you need Kafka later**, you'd add it alongside Redis (not replace it):
      - `confluent-kafka` for producers/consumers
      - Redis remains the cache; Kafka handles event streaming

      ---

