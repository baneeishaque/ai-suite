      | **Use `django-redis` native features** (tag-based invalidation, scan_iter) | Medium |
      | **Monitor Redis memory** (set `maxmemory-policy allkeys-lru`) | Medium |
      | **Skip Kafka** unless you need event streaming | N/A - not needed for caching |
