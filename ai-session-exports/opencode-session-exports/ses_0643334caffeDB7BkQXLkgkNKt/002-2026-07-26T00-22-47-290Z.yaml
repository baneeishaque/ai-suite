      ## Redis Cache (Currently Configured for Production)

      **Pros:**
      - ✅ **Already configured** in `production.py:30-41`
      - ✅ **Sub-millisecond latency** (in-memory)
      - ✅ **TTL/expiration** built-in
      - ✅ **Pub/Sub** for cache invalidation across workers
      - ✅ **Shared across** Django, Celery, Channels
      - ✅ **django-redis** supports native Django cache API

      **Cons:**
      - Requires Redis server (you have `redis://redis:6379/0` in docker-compose)
      - Memory-limited (plan capacity accordingly)

      **To enable locally:** Add to `local.py`:
      ```python
      CACHES = {
          "default": {
              "BACKEND": "django_redis.cache.RedisCache",
              "LOCATION": "redis://localhost:6379/1",
              "OPTIONS": {"CLIENT_CLASS": "django_redis.client.DefaultClient"},
          }
      }
      ```

