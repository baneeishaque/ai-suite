    time: 7/25/2026, 7:52:10.334 PM GMT+5:30
    response: |-
      Great question. Here are the best enhancements, ranked by impact:

      ---

      ## 1. Shell completions

      Three tiers:

      **Static** — generate a completion script from YAML refs once:
      ```bash
      # _commit_prompt
      #compdef commit-prompt
      _arguments '1: :((preview-hunks fix-commit-2 audit-hunks ...))'
      ```
      Pro: fast. Con: out of date when YAML changes.

      **Dynamic** — fetch refs on the fly:
      ```zsh
      #_commit_prompt() {
      #  local -a refs
      #  refs=($(commit-prompt --list-refs 2>/dev/null))
      #  _describe 'refs' refs
      #}
      ```
      Pro: always current. Con: shell fork per tab-complete.

      **fzf-based** — pop fzf TUI when you hit `<TAB>`:
      ```zsh
      # fzf-complete
      _commit_prompt() { compadd -- $(commit-prompt --list-refs | fzf) }
      ```
      Pro: fuzzy filtering + visual selection. Con: pops TUI.

      **Best**: Dynamic for scripted use, fzf-based for interactive. Both can coexist — fzf-complete overrides when terminal is interactive.

      ---

      ## 2. fzf preview window (interactive mode)

      When running `commit-prompt` with no args, show the full reconstructed prompt in fzf's preview pane as you scroll:

      ```bash
      # Inside pick_tui_fzf(), add --preview
      fzf --with-nth=1,2 --delimiter=\t \
          --preview 'echo {1}: {2} | ...' \
          --preview-window=up:3:wrap
      ```

      This lets you see the full prompt before selecting. High impact, low effort.

      ---

      ## 3. `--list-refs` flag

      A machine-parseable output for completions, scripting, and pipelines:

      ```bash
      commit-prompt --list-refs
      # preview-hunks
      # fix-commit-2
      # audit-hunks
      ```

      Used by shell completions, CI scripts, and `for ref in $(commit-prompt --list-refs); do ...`.

      ---

      ## 4. `--copy` / clipboard mode

      Auto-copy the output to clipboard without printing:

      ```bash
      commit-prompt preview-hunks --copy
      # → pbcopy on macOS
      # → xclip on Linux
      # → clip.exe on Windows (via PowerShell)
      ```

      Saves the `| pbcopy` step — one less pipe to type.

      ---

      ## 5. `--json` output

      Emit the entry as JSON for programmatic consumption:

      ```bash
      commit-prompt preview-hunks --json
      # {"ref": "preview-hunks", "add_on": "...", "full_prompt": "..."}
      ```

      Useful for further processing by other tools.

      ---

      ## 6. Tag/filter system

      Add `tags` to YAML entries for filtering:

      ```yaml
      entries:
        - ref: preview-hunks
          tags: [preview, review, verification]
          add_on: "..."
      ```

      Then:
      ```bash
      commit-prompt --tag preview
      commit-prompt --tag review
      ```

      Implemented as `fzf --filter` applied to the tags column.

      ---

      ## 7. Search history / recent

      Track which prompts you've used recently. `~/.local/share/commit-prompt/history`:

      ```bash
      commit-prompt --recent
      # Most recently used entries, ranked by recency × frequency
      ```

      Saved to a JSONL file appended on each use.

      ---

      ## Recommendation matrix

      | Enhancement | Effort | Impact | Do first? |
      |---|---|---|---|
      | `--list-refs` | 5 min | Enables completions + scripting | ✅ Yes |
      | Dynamic shell completions | 15 min | Tab-complete for refs | ✅ Yes |
      | fzf preview window | 10 min | Better TUI, see full prompt | ✅ Yes |
      | `--copy` flag | 5 min | Fewer keystrokes | ✅ Yes |
      | Tag/filter | 20 min | Group entries by category | Optional |
      | History/recent | 20 min | Track usage | Optional |
      | `--json` output | 5 min | Programmatic use | Optional |

      **First batch** (30 min total): `--list-refs` + dynamic completions + fzf preview + `--copy`.

      Want me to start implementing these?
