      Let me focus on the most practical ones and explain them in detail.

      For shell completions specifically:

      **Option 1: Static completion (refs are hardcoded)**
      - Generate completion script from the YAML refs at install time
      - Updates when YAML changes

      **Option 2: Dynamic completion (refs are fetched on the fly)**
      - `_commit_prompt() { compadd $(commit-prompt --list-refs) }`
      - Always up-to-date, no regeneration needed

      **Option 3: fzf-based completion**
      - Same as above but uses fzf for visual filtering
