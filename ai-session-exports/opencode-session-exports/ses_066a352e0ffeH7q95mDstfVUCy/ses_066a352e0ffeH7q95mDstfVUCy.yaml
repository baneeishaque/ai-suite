nges\"`, `\"more atomic\"`).\n\n**Context regex** — you can simulate ranked search by combining multiple patterns:\n```bash\nrg -i \"preview|hunks|atomic\" commit.yml | sort | uniq -c | sort -rn\n# Counts how many patterns each line matches → crude relevance indicator\n```\n\n### Why NOT ripgrep for your use case\n\n| Requirement | ripgrep | What you need |\n|---|---|---|\n| Fuzzy match (typos) | ❌ regex only | ✅ |\n| Ranking by relevance | ❌ binary match/no-match | ✅ |\n| Semantic match | ❌ literal text only | ✅ |\n| Score thresholds | ❌ | ✅ |\n| Formatted output (full prompt) | ❌ raw line match | ✅ |\n\nripgrep searches files. You search prompts. Different abstractions.\n\n### When to use ripgrep\n- Searching source code for identifiers, function names, error strings\n- Finding files by content\n- Log analysis\n- Code review grep\n- Any scenario where regex precision is the requirement\n\n### When NOT to use ripgrep\n- You need ranked results\n- You need fuzzy/approximate matching\n- The data is structured (YAML, JSON, DB) — use the structure, don't grep the raw file\n- You need to compute or transform results, not just display matching lines\n\n---\n\n## 5. skim (sk)\n\n### What it is\nAn **interactive fuzzy finder** — same class as fzf. Written in Rust. When you run it, it opens a TUI, reads lines from stdin, and lets the user type to filter.\n\n### Relationship to fzf\n\n```\nfzf (Go)  ──── fzf-cli ──── 40K+ GitHub stars, the standard\n                            features: --filter, --preview, --multi, --bind\n                            maintainer: junegunn (very active)\n\nskim (Rust) ──── sk ──── ~5K stars, Rust reimplementation\n                            features: nearly identical CLI\n                            maintainer: lotabout (less active, PRs stall)\n```\n\nThe key difference: **fzf is actively maintained, skim is not**. skim's last release was 2022, with open PRs unanswered since 2021. The README itself says: *\"skim is a command-line fuzzy finder written in Rust. It aims to be a drop-in replacement for fzf.\"*\n\n### What skim adds over fzf\n\n- **Rust ecosystem** — embeddable as a library (`skim` crate), not just a CLI tool\n- **Slightly faster** for very large inputs (millions of lines) — fzf is Go GC-bound at that scale\n- **Multi-selection UI** slightly different (arguably worse — no preview window toggle by default)\n\n### What skim lacks vs fzf\n\n- **Preview window** — fzf has rich preview (syntax highlighting, scrolling, `--preview-window follow`); skim's preview is basic\n- **`--bind` key remapping** — fzf has extensive key bindings; skim less\n- **`--filter` mode** — fzf has `--filter=QUERY` that outputs matches non-interactively (fully scriptable); skim supports this but with fewer options\n- **Maintenance** — skim is effectively archived; fzf gets weekly releases\n\n### `--filter` mode (scripted usage)\n\nThis is the key feature for your use case — both support it:\n\n```bash\n# fzf\necho -e \"preview-hunks\\tpreview with hunks\\nfix-commit-2\\tmake commit 2 atomic\" \\\n  | fzf --filter=\"hunks\" --delimiter=\\t --with-nth=1,2\n# → preview-hunks\tpreview with hunks\n# (non-interactive, returns matches to stdout)\n\n# skim (same interface)\necho -e \"preview-hunks\\tpreview with hunks\\nfix-commit-2\\tmake commit 2 atomic\" \\\n  | sk --filter=\"hunks\" --delimiter=\\t --with-nth=1,2\n# → same result\n```\n\nThis is what makes fzf/skim usable in automated contexts — it's not just a TUI.\n\n### Concrete against your use case\n\n```python\nimport subprocess\n\nlines = [\"\\t\".join([e[\"ref\"], e[\"add_on\"]]) for e in data[\"entries\"]]\nproc = subprocess.run(\n    [\"fzf\", \"--filter\", query, \"--delimiter=\\t\", \"--with-nth=1,2\"],\n    input=\"\\n\".join(lines),\n    capture_output=True, text=True\n)\nmatches = proc.stdout.strip().split(\"\\n\") if proc.stdout else []\n```\n\nThis is **fzf as a pure matching engine** — no TUI needed. It returns all lines that match above its internal threshold, ranked by match quality. The algorithm is its own variant of scoring (Damerau-Levenshtein derivative with gap penalty).\n\n### When to use\n\n**fzf (not skim)** is the right choice:\n- Interactive: TUI filtering with real-time feedback\n- Scriptable: `--filter` mode returns ranked matches to stdout\n- Mature, maintained, well-documented\n- Pre-installed on many dev machines (brew, apt, etc.)\n\nskim is only relevant if you need a Rust embeddable library or are in a Rust-only environment. For CLI usage, always pick fzf.\n\n---\n\n## Summary: where each fits in your decision tree\n\n```\nNeed interactive pick? ──yes──→ fzf (use sk only if Rust dep req'd)\n                          │\n                          no\n                          ↓\nNeed ranked results? ────yes──→ Need stemming/semantics?\n                          │         │\n                          │        yes──→ Need server?\n                          │         │         │\n                          │         │        yes──→ Bayard (or Elasticsearch)\n                          │         │         │\n                          │         │         no────→ Tantivy (or SQLite FTS)\n                          │         │\n                          │         no───→ Need embedded?\n                          │                │\n                          │               yes──→ RapidFuzz (token_sort_ratio)\n                          │                │\n                          │                no────→ fzf --filter\n                          │\n                          no\n                          ↓\nNeed regex precision? ──yes──→ ripgrep\n                          │\n                          no\n                          ↓\n         ──→ KeyBERT / SentenceTransformers (last resort, semantic overkill)\n```\n\nFor your specific case (< 200 short prompts): **fzf --filter > RapidFuzz > rest**."
