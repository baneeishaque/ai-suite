      ## Option A: Editable pipx install (`pipx install -e`)

      ### What happens

      `pipx install -e /path/to/dir/` does:

      1. Reads `pyproject.toml` in that directory
      2. Creates a venv at `~/.local/pipx/venvs/commit-prompt/` (or platform-equivalent)
      3. Installs the Python dependencies (`pyyaml`, `rapidfuzz`) into that venv
      4. **Instead of copying** the project code into the venv, pipx creates a **symlink** pointing back to your source directory
      5. Creates a CLI wrapper at `~/.local/bin/commit-prompt` with shebang pointing to the venv's Python

      ### File layout after install

      ```
      ~/.local/pipx/venvs/commit-prompt/
      ├── bin/
      │   ├── python3          → /opt/homebrew/opt/python@3.14/bin/python3
      │   └── commit-prompt    → #!/.../bin/python3
      │                           from prompt import main; main()
      ├── lib/python3.14/site-packages/
      │   ├── pyyaml/          (installed dep)
      │   ├── rapidfuzz/       (installed dep)
      │   └── prompt.py        → symlink to /Users/dk/lab-data/ai-suite/gists-ai-prompts/prompt.py
      └── pyvenv.cfg

      ~/.local/bin/commit-prompt  (shell wrapper)
      ```

      ### Why the YAML path works

      Because of the **symlink**. When you run `commit-prompt`, Python resolves `__file__` to the real path (`/Users/dk/lab-data/.../prompt.py`), not the venv copy. So:

      ```python
      YAML_PATH = os.path.join(os.path.dirname(__file__), "commit.yml")
      ```

      correctly finds `/Users/dk/lab-data/ai-suite/gists-ai-prompts/commit.yml` — always.

      ### What's needed

      A `pyproject.toml` alongside the script:

      ```toml
      [project]
      name = "commit-prompt"
      version = "1.0.0"
      description = "Fuzzy prompt selector from commit.yml"
      requires-python = ">=3.10"
      dependencies = [
          "pyyaml>=6.0",
          "rapidfuzz>=3.0",
      ]

      [project.scripts]
      commit-prompt = "prompt:main"
      ```

      ### Install once, use forever

      ```bash
      pipx install -e /Users/dk/lab-data/ai-suite/gists-ai-prompts/
      # One-time. After that:
      commit-prompt                         # interactive TUI
      commit-prompt preview-hunks           # exact ref
      commit-prompt preview                 # fuzzy match
      commit-prompt --no-fzf preview        # rapidfuzz backend
      ```

      ### Upgrade / modify

      ```bash
      # If you add new deps to pyproject.toml:
      pipx reinstall /Users/dk/lab-data/ai-suite/gists-ai-prompts/

      # If you only edit prompt.py or commit.yml (no new deps):
      # → Nothing needed. The symlink means changes are live immediately.
      ```

      ### When the editable approach breaks

      Only if you **move** or **delete** the source directory. Then `__file__` resolves through a dangling symlink, and `commit.yml` is gone. Fix: `pipx reinstall` from the new location.

      ---

      ## Option B: uv run (PEP 723)

      ### What is uv

      `uv` is a Rust-based Python package manager (by Astral, the Ruff team). It's a drop-in replacement for pip + pipx + venv, **10-100x faster**. It also **fully supports PEP 723** — parsing inline metadata from a Python script, creating a venv, installing deps, and running — in one command.

      ### How it works

      ```
      uv run prompt.py preview
      ```

      Behind the scenes:

      1. Read `prompt.py`
      2. Parse the `# /// pyproject.toml` block for `dependencies`
      3. Create a **temporary cached venv** at `~/.cache/uv/...` (or the system equivalent)
      4. Install `pyyaml`, `rapidfuzz` into that venv
      5. Run `python prompt.py preview` using the venv's Python
      6. The venv is **cached** — next call reuses it (sub-second startup)

      ```
      Cache location: ~/.cache/uv/python/.../<sha-of-script-and-deps>/.venv/
      ```

      The cache key is a hash of the script's inline metadata + dependency resolution. If you change deps, uv detects it and rebuilds automatically.

      ### No install step

      ```bash
      uv run /Users/dk/lab-data/ai-suite/gists-ai-prompts/prompt.py preview-hunks
      ```

      This is the **entire workflow**. No `pipx install`, no manual dependency management, no `reinstall-all` on Python upgrades.

      ### First run vs subsequent runs

      | Attempt | Timeline |
      |---|---|
      | 1st `uv run` | ~2-5 seconds (download deps + build venv) |
      | 2nd `uv run` | ~0.3 seconds (cached venv, just run) |
      | After dep change | ~2-5 seconds again (detects hash mismatch, rebuilds) |

      ### Adding to PATH (optional)

      ```bash
      uv run -- python3 -c "..."

      # Or add an alias to .zshrc:
      alias commit-prompt='uv run /Users/dk/lab-data/ai-suite/gists-ai-prompts/prompt.py'
      ```

      ### Python management

      If you specify `requires-python = ">=3.10"` in the inline metadata, uv automatically:
      - Checks if the current Python meets the requirement
      - If not, downloads and caches a compatible Python from the **Astral Python download server** (no manual install needed)

      This means uv decouples from your system/mise/brew Python entirely. It manages its own Python versions in `~/.cache/uv/python/`.

      ### Installing uv

      ```bash
      brew install uv
      ```

      ---

      ## Comparison table

      | | **Option A: pipx install -e** | **Option B: uv run** |
      |---|---|---|
      | **Setup** | `pipx install -e /path/` (one-time) | `brew install uv` (one-time) + `uv run` (every time) |
      | **Daily command** | `commit-prompt <args>` | `uv run prompt.py <args>` |
      | **Dep install** | At install time, into dedicated venv | At first run, into cached venv |
      | **Dep changes** | `pipx reinstall` | Automatic (hash detects change) |
      | **YAML path** | ✅ `__file__` symlink → source dir | ✅ `__file__` is the original path |
      | **Python upgrades** | `pipx reinstall-all` after major brew Python upgrade | ✅ Handled by uv's self-managed Python |
      | **Script edits** | ✅ Instant (symlink) | ✅ Instant (no copy) |
      | **Moving source dir** | ❌ Must reinstall | ✅ Works (path is per-invocation) |
      | **Overall maintenance** | Low (one-time install + reinstall on dep changes) | **Zero** (everything is automatic) |

      ---

      ## My recommendation

      **If you want a global command**: Option A — `pipx install -e`. You type `commit-preview preview` from anywhere. Only needs reinstall when deps change.

      **If you want zero maintenance**: Option B — `uv run`. No install/reinstall steps at all. uv handles Python management, dep caching, everything. But you type `uv run /path/to/prompt.py <args>` each time (or alias it).

      Both are equally reliable. Pick whichever daily ergonomics you prefer.

