      ### 5. JSON Schema: `session-yaml-schema.json`

      Defines the formal structure of the YAML output with three main schema definitions:
      1. **`sessionHeader`** -- requires `session` (id, created, updated, optional compacted) and `model` (id, provider), optional `title`.
      2. **`userTurn`** -- a YAML document with a `user` object (required text, optional time) and optional `assistant` array of steps.
      3. **`step`** -- each step can have `agent`, `model`, `thinking`, `thinking_duration`, `thinking_duration_ms`, `time`, `tool_calls` (array of `{tool, args, result?}`), `response`, `duration`, `duration_ms`.

      The schema uses `localTimestamp` pattern (`M/D/YYYY, H:MM:SS.fff AM/PM TZ`) and `durationString` pattern (`Nms` or `Ns`).

