          18: counter = 0
          19: 
          20: def request(flow: http.HTTPFlow):
          21:     global counter
          22:     try:
          23:         body = json.loads(flow.request.get_text())
          24:         messages = body.get("messages", [])
          25:         for msg in messages:
          26:             if msg.get("role") == "system":
          27:                 flow.marked = True
          28:                 os.makedirs("flows", exist_ok=True)
          29:                 counter += 1
          30:                 filename = f"flows/{flow.request.host}_{int(time.time())}_{counter}.json"
          31:                 flow.metadata["saved_filename"] = filename
          32:                 with open(filename, "w") as f:
          33:                     json.dump({"request": body}, f, indent=2)
          34:                 break
          35:     except (json.JSONDecodeError, AttributeError):
          36:         pass
          37: 
          38: def response(flow: http.HTTPFlow):
          39:     filename = flow.metadata.get("saved_filename")
          40:     if filename and flow.response:
          41:         try:
          42:             with open(filename, "r") as f:
          43:                 data = json.load(f)
          44:             data["response"] = {
          45:                 "status_code": flow.response.status_code,
          46:                 "headers": dict(flow.response.headers),
