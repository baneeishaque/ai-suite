      ## 7. Summary of the Proxy Setup and Logging Mechanism

      ### What was done:
      1. **mitmproxy** was installed and run on port **9453** with a custom Python addon script (`mitm_custom_script_ag.py`)
      2. **OpenCode** was configured to route all HTTP/HTTPS traffic through the mitmproxy via `HTTPS_PROXY` and `HTTP_PROXY` environment variables
      3. The **mitmproxy CA certificate** was trusted via `NODE_EXTRA_CA_CERTS` to avoid SSL errors
      4. The addon script intercepted requests containing a `system` role message (identifying LLM API calls), saved the JSON request body to a file, then appended the response (status code, headers, full SSE body) to the same file when the response arrived
      5. The captured flows were saved to the `flows/` directory with filenames encoding the hostname, unix timestamp, and sequence counter

      ### What was captured:
      - Full request bodies (system prompt + user message, model name, parameters)
      - Full response streams (SSE chunks with reasoning tokens, final content, usage stats, cost)
      - Response headers (including Cloudflare routing details)

      ### What was processed/extracted:
      After capture, the raw SSE response bodies were parsed into structured YAML formats (per-chunk, deduplicated, merged, extracted), and human-readable Markdown reports were generated -- likely through the LLM itself (the `big-pickle` model appears to have been asked to beautify the data, as seen in flow #107's response).

