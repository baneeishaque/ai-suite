          The left side bar graph in Figure 1 shows that the WER of the baseline model is significantly high for languages other than English and Finnish, with values of 86.9% for Hindi, 93.3% for Tamil, and 287.4% for Malayalam. The baseline ASR model exhibits a WER exceeding 100% for Malayalam due to a high number of insertion errors, leading to the combined total of substitutions, deletions, and insertions surpassing the total word count in the reference transcript. While the application of Whisper’s normalization results in modest WER improvements for English and Finnish, with an absolute reduction of 5.1% and 3.2% respectively, Indic languages experience suspicious absolute WER reductions: 21.9% for Hindi, 41.5% for Tamil, and a substantial 152.2% for Malayalam.
