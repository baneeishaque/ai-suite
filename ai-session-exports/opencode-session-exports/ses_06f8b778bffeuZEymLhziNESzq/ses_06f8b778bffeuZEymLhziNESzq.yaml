          | Available on NVIDIA free tier | ✅ Yes | ✅ Yes (but useless for Malayalam) |

          **Numerical takeaway:** The best Malayalam ASR accuracy available through NVIDIA's free tier comes from fine-tuned Whisper variants, with `whisper-medium-ml` achieving **11.49% WER** (with normalization) on Common Voice Malayalam — comparable to the accuracy Canary achieves on high-resource European languages. For production use, either use `whisper-large-v3` via the NVIDIA API for zero-shot (with expected degraded accuracy) or deploy a Malayalam-fine-tuned Whisper model (e.g., `thennal/whisper-medium-ml`) self-hosted.
