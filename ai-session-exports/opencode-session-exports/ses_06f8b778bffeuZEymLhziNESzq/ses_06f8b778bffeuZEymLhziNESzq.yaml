      | **MiniMax** | 2 | M2.7, M3 |
      | **Others (1 each)** | 13 | GLM-5.1, Kimi K2.6, Seed-OSS, Sarvam-M, Solar, etc. |

      **B2. Pricing:** NVIDIA NIM has **no published per-model price list**. All 144 models are **free on the Developer tier** (build.nvidia.com, ~40 RPM rate limit). Production shifts to custom per-token pricing for hosted endpoints or ~$4,500/GPU/year for self-hosted AI Enterprise. The free tier is a consumption model, not a per-model selection — every model costs $0 to try.

      **B3. Key observation:** The only per-model licensing caveat is FLUX.1-dev (non-commercial on free tier). All other models are fully available under free Developer terms.

      ---

      ### Section C — Malayalam ASR: Free Model Support & Accuracy

      **C1. Models supporting Malayalam from the 144 free models:**

      | Model | Provider | Type |
      |---|---|---|
      | `whisper-large-v3` | OpenAI | Dedicated ASR (99 langs) |
      | `gemma-3n-e4b-it` | Google | Multimodal LLM (140+ langs) |
      | `gemma-3n-e2b-it` | Google | Multimodal LLM (140+ langs) |

      **Notably excluded:** `canary-1b-asr` (25 European langs only, no Malayalam), `parakeet-*` (25 langs, Dravidian coverage: Tamil only), `nemotron-asr-streaming` (English only).

      **C2. Whisper vs Canary Malayalam accuracy:**

      **Canary does not support Malayalam** — it covers exactly 25 Eurasian languages, no Dravidian language other than Hindi. A direct comparison is impossible.

      Whisper Malayalam accuracy:
      - **Zero-shot:** Poor (>100% WER on Whisper-small/medium for Common Voice Malayalam, ~30%+ estimated for large-v3)
      - **Fine-tuned:** Best result is `thennal/whisper-medium-ml` at **11.49% WER** (Common Voice 11.0, with normalization) — comparable to Canary's accuracy on high-resource European languages

      **C3. Verdict:** `whisper-large-v3` on NVIDIA's free tier is the only viable choice for Malayalam ASR. For production accuracy, deploy a Malayalam-fine-tuned variant like `thennal/whisper-medium-ml` (available on HuggingFace, 11.49% WER) self-hosted.
