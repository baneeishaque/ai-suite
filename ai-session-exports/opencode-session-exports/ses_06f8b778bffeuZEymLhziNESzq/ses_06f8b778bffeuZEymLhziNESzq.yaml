        result: "Title: NVD - CVE-2020-14193\nURL: https://nvd.nist.gov/vuln/detail/CVE-2020-14193\nPublished: N/A\nAuthor: N/A\nHighlights:\nAffected versions of Automation for Jira - Server allowed remote attackers to read and render files as mustache templates in files inside the WEB-INF/classes & /jira/bin directories via a template injection vulnerability in Jira smart values using mustache partials. The affected versions are those before version 7.1.15.\n...\n| CWE-ID | CWE Name | Source |\n| --- | --- | --- |\n| CWE-74 | Improper Neutralization of Special Elements in Output Used by a Downstream Component ('Injection') | NIST |\n...\n```\n[{\"vendor\":\"Atlassian\",\"product\":\"Automation for Jira\",\"versions\":[{\"version\":\"unspecified\",\"lessThan\":\"7.1.15\",\"versionType\":\"custom\",\"status\":\"affected\"}]}]\n```\n...\n```\nOR\n     *cpe:2.3:a:atlassian:jira:*:*:*:*:*:*:*:* versions up to (excluding) 7.1.15\n...\n```\nOR\n     *cpe:2.3:a:atlassian:automation_for_jira:*:*:*:*:*:*:*:* versions up to (excluding) 7.1.15\n```\n...\n```\nOR\n     *cpe:2.3:a:atlassian:jira:*:*:*:*:*:*:*:* versions up to (excluding) 7.1.15\n\n---\n\nTitle: Loading...\nURL: https://jira.atlassian.com/browse/JIRAAUTOSERVER-185\nPublished: N/A\nAuthor: N/A\nHighlights:\nAffected versions of Automation for Jira - Server allowed remote attackers to read and render files as mustache templates in files inside the WEB-INF/classes & /jira/bin directories via a template injection vulnerability in Jira smart values using mustache partials.\n...\nThe affected versions are those before version 7.1.15.\n...\n- 7.1.15 & later\n\n---\n\nTitle: Automation smart values - security | Cloud automation Cloud | Atlassian Support\nURL: https://support.atlassian.com/cloud-automation/docs/jira-smart-values-security/\nPublished: 2023-05-31T01:30:04.000Z\nAuthor: N/A\nHighlights:\nSmart values let you access data in Automation. Check out how we use smart values in our Jira automation template library.\n...\nTo return data from these smart values, you need a security tool connected to your project. Learn more about integrating security tools\n...\n## Description modifiers\n...\nThe description from security tool providers is sent in markdown format. The create issue action only accepts plain text or wiki text, and the send email action requires HTML, so modifiers are used to convert the markdown text to these formats.\n...\n### {{vulnerability.description.\n...\n### {{vulnerability.description.wiki}}\n...\nReturns the vulnerability description as wiki text. Can be used with the create issue action to enter the vulnerability description in the issue’s description field.\n...\n### {{vulnerability.description.html}}\n...\nReturns the vulnerability description as HTML. Can be used in email templates if creating an automation with the send email action.\n\n---\n\nTitle: Find and Replace Automation Help\nURL: https://community.atlassian.com/forums/Jira-questions/Find-and-Replace-Automation-Help/qaq-p/3118620\nPublished: 2025-09-26T10:26:06.000Z\nAuthor: N/A\nHighlights:\nHi, Please can anyone help with this problem it's driving me crazy.Background - I'm using Jira Cloud, Team Managed Board, I am the admin of the board but not the jira admin.What I want to do - we have book titles that change through production as a name becomes signed off. The book title exists in the Epic Summary, Work Type (Task) Summary, Sub Task Summary and a Book Title Field which is on all of the work Types. Here is the start of my Automation: The Create Variable doesn't work: {{issue.summary.replaceAll(\"(?i)\\\\Q{{oldT}}\\\\E\",\"{{newT}}\")}} Here is the set up within my board: So I want to be able to Find all Instances of : A Garden for Grandad Graham in the epic, task, sub task and update it to another name: Gardening Graham. I want to run the manual trigger from the epic. I can't even get the Epic Summary to change. I have this Log: Please please can someone help. I just am stuck on\n...\nfirst bit and haven't even got to updating the custom field or the children of the epic. thank you\n...\nAdding to the suggestions from@Valerie Knapp and I agree a manually triggered rule may not be a sustainable approach to solve your scenario. And also...\n...\nFor smart value expressions, once inside a set of double, curly brackets, additional ones are not needed.\n...\nNext, automation rule regular expressions cannot include smart values directly. Instead, one needs to create a variable for the regex and then use that in the functions. For example:\n...\naction: create variable\n...\n- name: varRegExString\n- smart value: your regular expression, with no surrounding quotation marks\n...\naction: create variable\n...\n- name: varRegExReplacement\n- smart value: your regular expression, with no surrounding quotation marks\n...\naction: something that needs to use the results...\n...\n- {{issue.someField.replaceAll(varRegExString, varStringExReplacement)}}\n...\nFinally, and most importantly, there is no documentation of what is and is not supported for regular expressions in automation rules. Instead, the docs state the implementation is based on Java's Pattern class. This means one needs to experiment to confirm the behavior, such as by:\n...\n- create the simplest expression that can solve your case\n- test that fully, perhaps just writing the results to the audit log rather than changing work items\n- when that works, incrementally add to the regex for edge cases, again testing\n- when an expression does not work, pause to understand why, and perhaps consider alternatives to using regex in the rule, such as other text functions\n...\nI would suggest to you that an automation isn't the best solution for this requirement. I think a listener would be better. A listener works as it sounds like it would, it is 'listening' for some change and then you can update other related objects https://www.scriptrunnerhq.com/help/example-scripts/update-multiple-fields-cloud\n...\nI have understood that when the title of the book is updated, you want to update it everywhere it has been referenced. However, I think it is important that you define a process for in which object the title should be updated, otherwise, I don't see how you wouldn't just be constantly overwriting different titles without any quality control. I appreciate you have this rule as a manual trigger but I think for your internal processes it would make sense to define, ok, this title is outdated, I will update it (as a rule) in the Epic and then the update of the Epic would be the event that triggers the change in the other related objects.\n...\nIf the goal is to replace the text with the user-provided value, wouldn’t it be simpler to just update the fields directly with that value? For example:\n...\nLooking at the sample data provided by the author, in some cases the text to be replaced is only a portion of the full text in the field.\n...\nFrom what I understood, the problem to be solved is the need to edit the book title in multiple places. Since handling partial text is more complex than replacing the entire text, the simpler approach would be to:\n...\nCopy the summary once\n...\nPaste the current summary into the manual trigger field and make the necessary edits\n...\nRun the automation\n\n---\n\nTitle: Jira Automation Rule: How to use a smart value in a regex match pattern\nURL: https://community.atlassian.com/t5/Jira-questions/Jira-Automation-Rule-How-to-use-a-smart-value-in-a-regex-match/qaq-p/1672724\nPublished: 2021-04-23T14:17:14.000Z\nAuthor: N/A\nHighlights:\nI'm writing a Jira Automation Rule that is making a web request to gitlab. In the next step of the rule, I am trying to perform a regex match on the data using a pattern which needs to contain the value of another string variable I saved earlier. I want to save the matching string to a new variable I can use later.\n...\n**Save the result of this regex match to a new variable:**\n...\n```\n{{apiData.match(\"(id=\\\\d+[\\\\w ,\\\\n/\\\\-.=]\\*?path\\_with\\_namespace={{myJiraSmartValue}})\")}}\n```\n...\n**When I try this though, I get back the below error:**\n...\n```\nError rendering smart-values when executing this rule:Failed to get value for apiData.match(\"(id=\\\\d+[\\\\w ,\\\\n/\\\\-.=]\\*?path\\_with\\_namespace={{myJiraSmartValue: {{apiData.match(\"(id=\\\\d+[\\\\w ,\\\\n/\\\\-.=]\\*?path\\_with\\_namespace={{myJiraSmartValue}})\")}}\n```\n...\nIt looks like my syntax is incorrect when I do the above, the first pair of closing braces }} causes the evaluation of the whole expression to short circuit.\n...\n**To get around the above, I tries saving the entire regex to a new smart value variable called myRegexPattern like so:**\n...\n```\n{{\"(id=\\\\d+[\\\\w ,\\\\n/\\\\-.=]\\*?path\\_with\\_namespace=myJiraSmartValue}\"}}\n```\n...\n**Finally, when I try to perform the regex match by passing in the myRegexPattern variable, I get back zero results:**\n...\n```\n{{apiData.match(myRegexPattern)}}\n```\n...\nI KNOW that my regex pattern is correct because I've tested this scenario by replacing the variable with a hard-coded value. I can't just do this though because I won't always know what the value of the variable is... which is why I am using the variable in the first place! Does anyone know how I can pass in a variable to the regex string match function??\n...\nIn addition nesting smart value issues, I believe another issue you are encountering is that created variables cannot consistently be used as parameters in function calls for other smart values. For example: {{issue.summary.match(myCreatedVariable)}} I put in a support ticket for that a while ago and heard back: not intended to work that way...yet.\n...\nYou do not show how you are determining {{myJiraSmartValue}} and I wonder if:\n...\n* You incrementally search/reduce the string in steps, and\n...\n* Always have the created variable as the first expression if that will help. For example, {{myCreatedVar.somefunction(...\n...\nMy other work-around was to parse the response calls into name/value pairs, split the lists, and the match on what I need with RegEx.\n...\nYes that seems to be my exact issue, I cannot consistently use my created variable as a parameter in a function call for another smart value. The inconsistency is extremely frustrating because I had based my whole logic for my Jira Automation rule around the fact that I would be able to pass in {{myCreatedVariable}} to the .match() function. It doesn't make sense that I can pass in a variable to something like .plus() but not the regex function. And there's no documentation to explain this is the case!\n...\nTo get off my soapbox though... The way I am storing the {{myJiraSmartValue}} is that my Jira Rule triggers whenever a Pull Request on a Jira ID has been merged. I am grabbing the pullRequest.url value, and doing a .match() on that to strip part of the URL path away and just leave me with the unique section of the URL that would take me to the gitlab project where the Pull Request was merged. Then I am storing that stripped value in the {{myJiraSmartValue}}.\n...\n, I then make a call to the below API:\n...\ngitlab.com/api/v4/projects?membership=true&&last\\_activity\\_after={{48 hrs ago}}\n...\nThen I am storing the json list of projects that I get back in response to another variable (call it gitbabRecentlyUpdatedProjects). Then I am trying to perform gitlabRecentlyUpdatedProjects.match(partial regex pattern + myJiraSmartValue), to get back another strip of information nested in the json response that I need.\n...\nAlthough you cannot consistently use the created variable in a function, they do seem to consistently work as the left-most expression: {{myCreatedVar.aFunction(asdfasds).anotherFunction(asfdasfasdfa)...}} So if you can organize your rule that way it might work.\n...\nThe other alternative is one from performance improvement: in-line the expression. Once you believe you have the pieces working, try to perform that match in one single operation, without using any created variables. I cannot tell if that is possible from your use case.\n...\nPlease note: for this second alternative, save your work as you incrementally build the rule. If you have an error in complex RegEx, the rule builder can hang during publish. I often work in a text editor to build up my rule's expression...just in case the rule editor hangs and loses my changes.\n...\n[@Bill Sheboy](https://community.atlassian.com/t5/user/viewprofilepage/user-id/1685313)Thanks for the additional suggestions! Fortunately I was able to work around this issue entirely from the perspective of the API WebRequest I was sending.\n...\nI was able to narrow down the API response data to just the specific gitlab project that I know had changed. Because of this, I was able to update the regex I was using so that it didn't need to make use of a variable.\n...\nI definitely still think the use of variables as parameters within functions called by another smart value should be more consistent - I stick by my previous remark thatit doesn't make sense I can pass in a variable to something like .plus() but not .match(). There should at least be documentation that makes this clear.\n...\nOf note, here are a suggestion and a defect related to improving the issues you note for created variables. Resolving either one of these would have made your use case much easier to implement.\n...\n[https://jira.atlassian.com/browse/JRACLOUD-75019](https://jira.atlassian.com/browse/JRACLOUD-75019)\n...\n[https://codebarrel.atlassian.net/browse/AUT-2022](https://codebarrel.atlassian.net/browse/AUT-2022)\n...\nFound this post, has a bit of discussion about this -[https://community.atlassian.com/t5/Jira-Core-questions/Is-there-a-way-to-concatenate-or-nest-smart-values/qaq-p/1374187](https://community.atlassian.com/t5/Jira-Core-questions/Is-there-a-way-to-concatenate-or-nest-smart-values/qaq-p/1374187)\n...\nAnd it ended up with a feature request:[https://codebarrel.atlassian.net/browse/AUT-2086](https://codebarrel.atlassian.net/browse/AUT-2086)\n...\nSo it looks that nesting smart values is just not possible - so this would need to be likely a few ugly .matches() AND .matches() AND .matches() or something to that extent.\n...\nI see... unfortunately I don't think doing a .matches() AND .matches() AND .matches() will work, because without passing in my variable, the regex will potentially have multiple results. The only way to narrow it down from there is to make use of the variable I have, and if I can't pass it in as part of the .matches() function then I don't know how else I will be able to get just the one match I'm looking for.\n\n---\n\nTitle: Smart values in Atlassian Automation | Cloud automation Cloud | Atlassian Support\nURL: https://support.atlassian.com/cloud-automation/docs/smart-values-in-jira-automation/\nPublished: 2026-06-29T01:24:15.000Z\nAuthor: N/A\nHighlights:\nAutomation smart values - securitySee all smart values that access data from security vulnerabilities sent to Jira by a connected security tool.View topic\n\n---\n\nTitle: Automation: Evaluating smart variable inside smart...\nURL: https://community.atlassian.com/forums/Jira-questions/Automation-Evaluating-smart-variable-inside-smart-variable/qaq-p/2756227\nPublished: 2024-07-16T14:24:56.000Z\nAuthor: N/A\nHighlights:\nI have a\n...\nTokens as project keys (entity properties) for\n...\nwe are responsible for.\n...\ndon't have Bitbucket premium\n...\nproject keys I'm afraid\n...\nI'm on the last step of my workflow, and I want to get the Repo Api Token for a certain {{repository}} based on the {{webResponse.body}} of my call to get Project Entities. Are you with me still?\n...\nSo basically I'm creating a new variable where the path to access it is\n...\n```\n {{webResponse.body.value.{{repository}}}}\n```\n...\nApparently JIRA Automation is not happy with this and mostly evaluates the whole thing to\n...\n```\n}}\_\n```\n...\nkey as an\n...\nwanted to keep it central.\n...\nAlthough it would be interesting, and quite risky, if automation rules supported dynamic smart value expressions, they do not.\n...\nWhat you could do instead is use your variable to build a regular expression and then use the match() function, passing that expression as the parameter, to get the data needed.\n...\nWhen using this technique, some things to note:\n...\n- Your regular expression variable should not have surrounding quotation marks; they are implied\n- If your search expression contains reserved tokens for regular expressions, first use text replacement functions to add escape characters. If you need more guidance on that technique, please let me know.\n...\nBased on the format my guess is that you get multiple repositories back in the web response correct? In that case you would have to use the Advanced branching so that you can iterate over the returned result.\n\n---\n\nTitle: Solved: Using smart values within regular expression\nURL: https://community.atlassian.com/forums/Jira-questions/Using-smart-values-within-regular-expression/qaq-p/2346376\nPublished: 2023-04-30T12:17:07.000Z\nAuthor: N/A\nHighlights:\n# Using smart values within regular expression\n...\n- I am trying to evaluate an automation rule which uses regular expression and was wondering if I can insert a smart value to be evaluated as part of the regex.\n- Trying to ensure the ticket's summary that is created matches the format needed including current date, trying to pull it from a smart value.\n...\nRegex string being evaluated:\n...\n\\w{3}-\\w{7,12}-(EKS|ECS|Lambda|Dynamodb|DynamoDB)-\\w+-{{issue.created.format(\"mmddyyyy\")}}-\\d{1,2}\n...\nOften the challenge is when there are nested quotation marks, as it seems you are trying: one set for the format() and another wrapping the regular expression.\n...\nI believe a work-around is to create the regular expression as a variable using Create Variable, and reference that as the expression. For example: match(varMyCreatedVariableName)\n...\nAnd also...the regular expression parser is documented as based upon the Java one, and there are several posts showing it does not match. When using a more complex expression, I recommend testing your expression by building it up in pieces, including a hard-coded date value, to confirm it works as you expect.\n...\nI only have one set of quotations for my regex and that is for the format(). I'm not too familiar with your workaround but you think it'll allow my regex to contain the smart value I've provided? Very interesting.\n...\nI know the rest of my regex works and I've tested the portion with the date using some regex with just \\d{6} so it's just the question as to if you can pair smart values inside of regex.\n...\nOne workaround is to add a step to do simple matching and see if the summary contains {{issue.created.format(\"mmddyy\")}}\n...\nI thought you were trying to use this regular expression in an automation rule, in which case the entire expression would be enclosed in quotation marks...unless it is already in a created variable.\n...\nIf not in a rule, how are you using this regular expression?"
