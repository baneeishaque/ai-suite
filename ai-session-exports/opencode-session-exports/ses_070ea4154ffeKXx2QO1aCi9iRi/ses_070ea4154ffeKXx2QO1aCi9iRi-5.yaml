                  "pip  install  djangorestframework --user\n\n # 👇️ If you don't have pip in your PATH environment variable \npython -m pip  install  djangorestframework\n\n # 👇️ For Python 3 (could also be pip3.10 depending on your version) \npython3 -m pip  install  djangorestframework\n\n # 👇️ Using py alias (Windows) \npy -m pip  install  djangorestframework\n\n # 👇️ For Anaconda \nconda  install  -c conda-forge djangorestframework\n\n # 👇️ For Jupyter Notebook ! pip  install  djangorestframework\n```\n\nAfter you install the [djangorestframework](https://pypi.org/project/djangorestframework/) package,\nadd `rest_framework` to your `INSTALLED_APPS` .\n\nsettings.py\n\n```\nCopied!\n\nINSTALLED_APPS  = [ # ... 'rest_framework' , ]\n```\n\nMake sure to add the trailing comma after the entry because if you don't, a `ModuleNotFoundError` occurs.\n\nMake sure you haven't mistyped `rest_framework` in your import statements (it's\nan underscore, not a hyphen).\n\nmain.py\n\n```\nCopied!\n\n...\n\n4` , so I would install the `djangorestframework` package with `pip3.10 install djangorestframework` .\n\nshell\n\n```\nCopied!\n\npip3.10  install  djangorestframework\n\n # 👇️ If you get a permissions error use pip3 (NOT pip3.X) sudo  pip3  install  djangorestframework\n```\n\nNotice that the version number corresponds to the version of `pip` I'm using.\n\nIf the PATH for `pip` is not set up on your machine, replace `pip` with `python3 -m pip` :\n\nshell\n\n```\nCopied!\n\n# 👇️ Make sure to use your version of Python, e.g. 3.10 \npython3 -m pip  install  djangorestframework\n```\n\nIf the error persists, try restarting your IDE and development server/script.\n\n## \\# Check if the package is installed\n\nYou can check if you have the `djangorestframework` package installed by running the `pip show djangorestframework` command.\n\nshell\n\n```\nCopied!\n\n# 👇️ Check if you have djangorestframework installed \npip show djangorestframework\n\n # 👇️ If you don't have pip set up in PATH\n\n...\n\npython -m pip  install  djangorestframework\n\n # 👇️ For Python 3 \npython3 -m pip  install  djangorestframework\n\n # 👇️ Using py alias \npy -m pip  install  djangorestframework\n\n # 👇️ If you get a permissions error \npip  install  djangorestframework --user\n\n # 👇️ For Anaconda \nconda  install  -c conda-forge djangorestframework\n```\n\npip install django-rest-framework windows\n\nAfter you install the [djangorestframework](https://pypi.org/project/djangorestframework/) package,\nadd `rest_framework` to your `INSTALLED_APPS` .\n\nsettings.py\n\n```\nCopied!\n\nINSTALLED_APPS  = [ # ... 'rest_framework' , ]\n```\n\nMake sure to add the trailing comma after the entry because if you don't, a `ModuleNotFoundError` occurs.\n\nMake sure you haven't mistyped `rest_framework` in your import statements (it's\nan underscore not a hyphen).\n\nmain.py\n\n```\nCopied!\n\nfrom  rest_framework  import  routers ,  serializers ,  viewsets\n```\n\nIf the installation command doesn't succeed, try running CMD as an\nadministrator.\n\n...\n\n## \\# Install Django REST framework on macOS or Linux\n\n**To install djangorestframework on macOS or Linux:**\n\n1. Search for \"terminal\" and start the application.\n2. Type `pip install djangorestframework` and press Enter.\n\nsearch for terminal\n\nterminal\n\n```\nCopied!\n\npip  install  djangorestframework\n\n # 👇️ For Python 3 \npip3  install  djangorestframework\n\n # 👇️ If you get a permissions error sudo  pip3  install  djangorestframework\n\n # 👇️ If you don't have pip in your PATH environment variable \npython -m pip  install  djangorestframework\n\n # 👇️ For Python 3 \npython3 -m pip  install  djangorestframework\n\n # 👇️ Alternative if you get a permissions error \npip  install  djangorestframework --user\n\n # 👇️ For Anaconda \nconda  install  -c conda-forge djangorestframework\n```\n\nmacos linux install django-rest-framework\n\nAfter you install the [djangorestframework](https://pypi.org/project/djangorestframework/) package,\nadd `rest_framework` to your `INSTALLED_APPS` .\n\nsettings.py\n\n...\n\nIf you are on Windows, search for **\"Anaconda Prompt\"** and open the\napplication.\n\nIf you are on macOS or Linux, open your terminal.\n\nRun the following command to install the `djangorestframework` package.\n\nshell\n\n```\nCopied!\n\n# 👇️ Using conda \nconda  install  -c conda-forge djangorestframework\n\n # 👇️ Alternatively use `pip` \npip  install  djangorestframework\n\n # 👇️ For Python 3 \npip3  install  djangorestframework\n\n # 👇️ If you get a permissions error sudo  pip3  install  djangorestframework\n\n # 👇️ If you don't have pip in your PATH environment variable \npython -m pip  install  djangorestframework\n\n # 👇️ For Python 3 \npython3 -m pip  install  djangorestframework\n\n # 👇️ Using py alias \npy -m pip  install  djangorestframework\n\n # 👇️ Alternative if you get a permissions error \npip  install  djangorestframework --user\n```\n\nAfter you install the [djangorestframework](https://pypi.org/project/djangorestframework/) package,\n\n...\n\npip3  install  djangorestframework\n\n # 👇️ If you get a permissions error sudo  pip3  install  djangorestframework\n\n # 👇️ If you don't have pip in your PATH environment variable \npython -m pip  install  djangorestframework\n\n # 👇️ For Python 3 \npython3 -m pip  install  djangorestframework\n\n # 👇️ Using py alias \npy -m pip  install  djangorestframework\n\n # 👇️ Using conda \nconda  install  -c conda-forge djangorestframework\n\n # 👇️ Alternative if you get a permissions error \npip  install  djangorestframework --user\n```\n\nAfter you install the [djangorestframework](https://pypi.org/project/djangorestframework/) package,\nadd `rest_framework` to your `INSTALLED_APPS` .\n\nsettings.py\n\n```\nCopied!\n\nINSTALLED_APPS  = [ # ... 'rest_framework' , ]\n```\n\nMake sure to add the trailing comma after the entry because if you don't, a `ModuleNotFoundError` occurs.\n\nMake sure you haven't mistyped `rest_framework` in your import statements (it's\nan underscore not a hyphen).\n\nmain.py\n\n```\nCopied!"
