                  "utm_medium=referral&utm_source=stackoverflow-community&utm_campaign=side-bar&utm_content=explore-teams-compact-popover)\n\n# [Should conda, or conda-forge be used for Python environments? [closed]](/questions/39857289/should-conda-or-conda-forge-be-used-for-python-environments)\n\nAsk Question\n\nAsked 9 years, 9 months ago\n\nModified [1 year, 8 months ago](https://stackoverflow.com/questions/39857289/should-conda-or-conda-forge-be-used-for-python-environments?lastactivity \"2024-10-17 14:17:37Z\")\n\nViewed 171k times\n\n242\n\n**Closed** . This question is opinion-based . It is not currently accepting answers.\n\n* * *\n\n**Want to improve this question?** Because this question may lead to opinionated discussion, debate, and answers, it has been closed. You may edit the question if you feel you can improve it so that it requires answers that include facts and citations or a detailed explanation of the proposed solution. If edited, the question will be reviewed and might be reopened.\n\nClosed last year .\nThe community reviewed whether to reopen this question last year and left it closed:\n\n> Original close reason(s) were not resolved\n> \n>\n\nImprove this question\n\n`Conda` and `conda-forge` are both Python package managers. What is the appropriate choice when a package exists in both repositories? Django, for example, can be installed with either, but the difference between the two is several dependencies (conda-forge has many more). There is no explanation for these differences, not even a simple README.\n\nWhich one should be used? Conda or conda-forge? Does it matter?\n\n* python\n* anaconda\n* conda\n\nShare\n\nImprove this question\n\nFollow\n\nedited Apr 6, 2018 at 12:41\n\nasked Oct 4, 2016 at 16:19\n\nuser6536435\n\n1\n\n* 29\n  \n  \"Conda and conda-forge are both Python package managers.\" I don't think that's true. I don't think those are even in the same category of thing. `conda` is a package manager and `conda-forge` is a channel. Maybe it was true when this question was asked?\n  \n  endolith\n– endolith\n  \n  2019-06-25 20:32:38 +00:00\n  \n  Commented Jun 25, 2019 at 20:32\n\nAdd a comment | \n\n## 5 Answers 5\n\nSorted by: [Reset to default](https://stackoverflow.com/questions/39857289/should-conda-or-conda-forge-be-used-for-python-environments?answertab=scoredesc)\n\nHighest score (default) Trending (recent votes count more) Date modified (newest first) Date created (oldest first)\n\n379\n\nThe short answer is that, in my experience generally, it doesn't matter which you use, with one exception. If you work for a company with more than 200 employees then the `default` conda channel is [not free as of 2020.](https://www.anaconda.com/blog/is-conda-free)\n\nThe long answer:\n\nSo `conda-forge` is an additional channel from which packages may be installed. In this sense, it is not any more special than the default channel, or any of the other hundreds (thousands?) of channels that people have posted packages to. You can add your own channel if you sign up at <https://anaconda.\norg> and upload your own Conda packages.\n\nHere we need to make the distinction, which I think you're not clear about from your phrasing in the question, between `conda` , the cross-platform package manager, and `conda-forge` , the package channel. Anaconda Inc. (formerly Continuum IO), the main developers of the `conda` software, also maintain a separate channel of packages, which is the default when you type `conda install packagename` without changing any options.\n\nThere are three ways to change the options for channels. The first two are done every time you install a package and the last one is persistent. The first one is to specify a channel every time you install a package:\n\n```\nconda install -c some-channel packagename\n```\n\nOf course, the package has to exist on that channel. This way will install `packagename` and all its dependencies from `some-channel` . Alternately, you can specify:\n\n```\nconda install some-channel::packagename\n```\nThe package still has to exist on `some-channel` , but now, only `packagename` will be pulled from `some-channel` . Any other packages that are needed to satisfy dependencies will be searched for from your default list of channels.\n\nTo see your channel configuration, you can write:\n\n```\nconda config --show channels\n```\n\nYou can control the order that channels are searched with `conda config` . You can write:\n\n```\nconda config --add channels some-channel\n```\n\nto add the channel `some-channel` to the top of the `channels` configuration list. This gives `some-channel` the highest priority. Priority determines ( [in part](http://conda.pydata.org/docs/channels.html) ) which channel is selected when more than one channel has a particular package. To add the channel to the end of the list and give it the lowest priority, type\n\n```\nconda config --append channels some-channel\n```\n\nIf you would like to remove the channel that you added, you can do so by writing\n\n```\nconda config --remove channels some-channel\n```\n\nSee\n\n```\nconda config -h\n```\n\nfor more options.\n\nWith all of that said, there are five main reasons to use the `conda-forge` channel instead of the `defaults` channel maintained by Anaconda:\n\n1. Packages on `conda-forge` _may_ be more up-to-date than those on the `defaults` channel\n2. There are packages on the `conda-forge` channel that aren't available from `defaults`\n3. You would prefer to use a dependency such as `openblas` (from `conda-forge` ) instead of `mkl` (from `defaults` ).\n4. If you are installing a package that requires a compiled library (e.g., a C extension or a wrapper around a C library), it _may_ reduce the chance of incompatibilities if you install all of the packages in an environment from a single channel due to binary compatibility of the base C library (but this advice may be out of date/change in the future). For reference, see [the Conda Forge post on mixing channels](https://conda-forge.\norg/docs/user/tipsandtricks.html) .\n5. conda-forge is free to use even in large companies, while the default conda channel is not. [See here.](https://www.anaconda.com/blog/is-conda-free)\n\nShare\n\nImprove this answer\n\nFollow\n\nedited Apr 22, 2024 at 13:27\n\nanswered Oct 4, 2016 at 22:28\n\ndarthbith's user avatar\n\ndarthbith\n\n19\\.9k 11 11 gold badges 65 65 silver badges 81 81 bronze badges\n\nSign up to request clarification or add additional context in comments.\n\n56\n\nAnaconda has changed their [Terms of Service](https://www.anaconda.com/blog/sustaining-our-stewardship-of-the-open-source-data-science-community) so that \"heavy commercial users\" would have to pay, which doesn't include `conda-forge` channel. That includes most organisations, including research organisations who are over 200 people.\n\nThe `main` channel is maintained by Anaconda, while `conda-forge` is maintained by the maintainers of the packages themselves. Each have their pros and cons.\nPackages on the `main` channel are usually compatible with one another, meaning you can install almost as many as you want, and you won't have dependency conflicts. On the other hand, packages on the `conda-forge` channel receive the updates much faster than the `main` channel since the maintainers themselves push the updates to the channel. From time to time, there are also patches done by Anaconda on packages available on the `main` channel which are not supported and done by the maintainers of the package, which can be good or bad, but definitely out of hands of the maintainers and not supported by them.\n\nYou probably would want to stick to `conda-forge` if you don't want to pay for the usage and you would be okay with the versions available on [`pypi`](https://pypi.org/) . As stated in the [docs](https://conda-forge.org/) :\n\n```\nconda config --add channels conda-forge\nconda config --set channel_priority strict\nconda install <package-name>\n```\nYou could also use [miniforge](https://github.com/conda-forge/miniforge/) which has `conda-forge` as the default channel, and supports ppc64le and aarch64 platforms as well as the other usual ones.\n\nIf you have `conda` installed and would like to remove the default channels, you can use\n\n```\nconda config --show channels\n```\n\nto see your channels, and can use\n\n```\nconda config --remove channels channel-name\n```\n\nto remove a channel.\n\nShare\n\nImprove this answer\n\nFollow\n\nedited Oct 17, 2024 at 14:17\n\nanswered May 5, 2020 at 20:39\n\nadrin's user avatar\n\nadrin\n\n4,996 5 5 gold badges 40 40 silver badges 54 54 bronze badges\n\n9\n\nThe conda-forge channel is where you can find packages that have been built for conda but yet to be part of the official Anaconda distribution.\n\nGenerally, you can use any of them.\n\nShare\n\nImprove this answer\n\nFollow\n\nanswered Jul 16, 2019 at 15:08\n\nAshiq Imran's user avatar\n\nAshiq Imran\n\n2,381 22 22 silver badges 18 18 bronze badges\n\n3\nIn my experience the **channel** `conda-forge` provides more packages and they are also more up-to-date. That is why I use it as my default channel which can be done like so\n\n```\nconda config --add channels conda-forge\nconda config --set channel_priority strict\n```\n\nShare\n\nImprove this answer\n\nFollow\n\nanswered Feb 1, 2023 at 11:25\n\nffrosch's user avatar\n\nffrosch\n\n1,523 12 12 silver badges 22 22 bronze badges\n\n\\-5\n\nThere are some Python libraries that you cannot install with a simple `conda install` since their channel is not available unless you apply conda-forge. From my experience, pip is more generic to look into different channel sources than conda. For instance, if you want to install `python-constraint` you can do it via `pip install` but to install it via \\*\\*cond \\*\\*. you have to specify the channel - `conda-forge` .\n\n```\nconda install -c conda-forge python-constraint // works\n```\n\nbut not\n\n```\nconda install python-constraint\n```\n\nShare\n\nImprove this answer\n\nFollow\nedited Oct 22, 2018 at 8:02\n\nanswered Jun 22, 2018 at 16:35\n\newalel's user avatar\n\newalel\n\n2,096 24 24"
