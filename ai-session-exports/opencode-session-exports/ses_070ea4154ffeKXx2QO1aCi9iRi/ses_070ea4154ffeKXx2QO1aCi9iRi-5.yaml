                  "utm_medium=referral&utm_source=stackoverflow-community&utm_campaign=side-bar&utm_content=explore-teams-compact-popover)\n\n# Older versions of Python not found in conda-forge\n\nAsk Question\n\nAsked 3 years, 11 months ago\n\nModified [3 years, 11 months ago](https://stackoverflow.com/questions/73313653/older-versions-of-python-not-found-in-conda-forge?lastactivity \"2022-08-11 18:24:59Z\")\n\nViewed 1k times\n\n3\n\nI am trying to install Python 3.6.15 in a Conda virtual environment using `conda install -c conda-forge python=3.6.15` but keep getting the following error:\n\n```\nPackagesNotFoundError: The following packages are not available from current channels:\n\n  - python=3.6.15\n\nCurrent channels:\n\n  - https://conda.anaconda.org/conda-forge/osx-arm64\n  - https://conda.anaconda.org/conda-forge/noarch\n  - https://repo.anaconda.com/pkgs/main/osx-arm64\n  - https://repo.anaconda.com/pkgs/main/noarch\n  - https://repo.anaconda.com/pkgs/r/osx-arm64\n  - https://repo.anaconda.com/pkgs/r/noarch\n```\nI've tried appending conda-forge to my channels, to no avail. Also, creating a new virtual environment with `conda create -n OldTest python=3.6.15 anaconda` gives the same error. How might I install my desired version of Python using Conda?\n\n* python\n* anaconda\n* conda\n* arm64\n* conda-forge\n\nShare\n\nImprove this question\n\nFollow\n\nedited Aug 11, 2022 at 18:24\n\nasked Aug 10, 2022 at 23:11\n\nborndeft's user avatar\n\nborndeft\n\n75 9 9 bronze badges\n\n3\n\n* Older versions are deprecated!\n  \n  Elis Byberi\n  \n  – Elis Byberi\n  \n  2022-08-10 23:59:11 +00:00\n  \n  Commented Aug 10, 2022 at 23:59\n* \n* Ah, that's unfortunate. I'd avoid deprecated Python releases, but I'm trying to run an older version of TensorFlow for compatibility with a repo I'm working on. Is there a possible workaround?\n  \n  borndeft\n  \n  – borndeft\n  \n  2022-08-11 04:13:50 +00:00\n  \n  Commented Aug 11, 2022 at 4:13\n* 1\n  \n  There are no conda packages for M1 for that python version."
