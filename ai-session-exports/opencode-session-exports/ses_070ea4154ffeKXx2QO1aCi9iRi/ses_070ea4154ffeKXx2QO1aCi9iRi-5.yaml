stframework-feedstock/commits/main/)\n\n 160 Commits |\n|.azure-pipelines |.\nazure-pipelines | | |\n|.ci\\_support |.ci\\_support | | |\n|.circleci |.circleci | | |\n|.github |.github | | |\n|.scripts |.scripts | | |\n|recipe |recipe | | |\n|.gitattributes |.gitattributes | | |\n|.gitignore |.gitignore | | |\n|LICENSE.txt |LICENSE.txt | | |\n|README.md |README.md | | |\n|azure-pipelines.yml |azure-pipelines.yml | | |\n|build-locally.py |build-locally.py | | |\n|conda-forge.yml |conda-forge.yml | | |\n|View all files |\n\n## Repository files navigation\n\n* README\n* Contributing\n* BSD-3-Clause license\n\n# About djangorestframework-feedstock\n\nFeedstock license: [BSD-3-Clause](https://github.com/conda-forge/djangorestframework-feedstock/blob/main/LICENSE.txt)\n\nHome: <https://www.django-rest-framework.org/>\n\nPackage license: BSD-3-Clause\n\nSummary: Web APIs for Django, made easy.\n\nDevelopment: <https://github.com/encode/django-rest-framework>\n\n# Current build status\n\n|All platforms: |[](https://dev.azure.com/conda-forge/feedstock-builds/_build/latest?\ndefinitionId=3874&branchName=main) |\n| --- | --- |\n\n# Current release info\n\n|Name |Downloads |Version |Platforms |\n| --- | --- | --- | --- |\n|[](https://anaconda.org/conda-forge/djangorestframework) |[](https://anaconda.org/conda-forge/djangorestframework) |[](https://anaconda.org/conda-forge/djangorestframework) |[](https://anaconda.org/conda-forge/djangorestframework) |\n\n# Installing djangorestframework\n\nInstalling `djangorestframework` from the `conda-forge` channel can be achieved by adding `conda-forge` to your channels with:\n\n```\nconda config --add channels conda-forge\nconda config --set channel_priority strict\n```\n\nOnce the `conda-forge` channel has been enabled, `djangorestframework` can be installed with `conda` :\n\n```\nconda install djangorestframework\n```\n\nor with `mamba` :\n\n```\nmamba install djangorestframework\n```\n\nIt is possible to list all of the versions of `djangorestframework` available on your platform with `conda` :\n\n```\nconda search djangorestframework --channel conda-forge\n```\n\nor with `mamba` :\n\n```\nmamba search djangorestframework --channel conda-forge\n```\n\nAlternatively, `mamba repoquery` may provide more information:\n\n```\n# Search all versions available on your platform:\nmamba repoquery search djangorestframework --channel conda-forge\n\n# List packages depending on `djangorestframework`:\nmamba repoquery whoneeds djangorestframework --channel conda-forge\n\n# List dependencies of `djangorestframework`:\nmamba repoquery depends djangorestframework --channel conda-forge\n```\n\n# About conda-forge\n\n[](https://numfocus.org)\n\nconda-forge is a community-led conda channel of installable packages.\nIn order to provide high-quality builds, the process has been automated into the\nconda-forge GitHub organization. The conda-forge organization contains one repository\nfor each of the installable packages. Such a repository is known as a _feedstock_ .\nA feedstock is made up of a conda recipe (the instructions on what and how to build\nthe package) and the necessary configurations for automatic building using freely\navailable continuous integration services. Thanks to the awesome service provided by [Azure](https://azure.microsoft.com/en-us/services/devops/) , [GitHub](https://github.com/) , [CircleCI](https://circleci.com/) , [AppVeyor](https://www.appveyor.com/) , [Drone](https://cloud.drone.io/welcome) , and [TravisCI](https://travis-ci.com/) it is possible to build and upload installable packages to the [conda-forge](https://anaconda.org/conda-forge) [anaconda.org](https://anaconda.org/) channel for Linux, Windows and OSX respectively.\n\nTo manage the continuous integration and simplify feedstock maintenance, [conda-smithy](https://github.com/conda-forge/conda-smithy) has been developed.\nUsing the `conda-forge.yml` within this repository, it is possible to re-render all of\nthis feedstock's supporting files (e.g.\nthe CI configuration files) with `conda smithy rerender` .\n\nFor more information, please check the [conda-forge documentation](https://conda-forge.org/docs/) .\n\n# Terminology\n\n**feedstock** \\- the conda recipe (raw material), supporting scripts and CI configuration.\n\n**conda-smithy** \\- the tool which helps orchestrate the feedstock.\nIts primary use is in the construction of the CI `.yml` files\nand simplify the management of _many_ feedstocks.\n\n**conda-forge** \\- the place where the feedstock and smithy live and work to\nproduce the finished article (built conda distributions)\n\n# Updating djangorestframework-feedstock\n\nIf you would like to improve the djangorestframework recipe or build a new\npackage version, please fork this repository and submit a PR. Upon submission,\nyour changes will be run on the appropriate platforms to give the reviewer an\nopportunity to confirm that the changes result in a successful build. Once\nmerged, the recipe will be re-built and uploaded automatically to the `conda-forge` channel, whereupon the built conda packages will be available for\neverybody to install and use from the `conda-forge` channel.\nNote that all branches in the conda-forge/djangorestframework-feedstock are\nimmediately built and any created packages are uploaded, so PRs should be based\non branches in forks, and branches in the main repository should only be used to\nbuild distinct package versions.\n\nIn order to produce a uniquely identifiable distribution:\n\n* If the version of a package **is not** being increased, please add or increase\n  the [`build/number`](https://docs.conda.io/projects/conda-build/en/latest/resources/define-metadata.html) .\n* If the version of a package **is** being increased, please remember to return\n  the [`build/number`](https://docs.conda.io/projects/conda-build/en/latest/resources/define-metadata.html) back to 0.\n\n# Feedstock Maintainers\n\n* [@kwilcox](https://github.com/kwilcox/)\n* [@ocefpaf](https://github.com/ocefpaf/)\n\n## About\n\nA conda-smithy repository for djangorestframework.\n\n### Resources\n\nReadme\n\n### License\n\nBSD-3-Clause license\n\n### Contributing\n\nContributing\n\n### Uh oh!\n\nThere was an error while loading. Please reload this page .\n\nActivity\n\nCustom properties\n\n### Stars\n\n**0** stars\n\n### Watchers\n\n**1** watching\n\n### Forks\n\n**7** forks\n\n[Report repository](https://github.com/contact/report-content?content_url=https%3A%2F%2Fgithub.com%2Fconda-forge%2Fdjangorestframework-feedstock&report=conda-forge+%28user%29)\n\n## Releases\n\nNo releases published\n\n## Sponsor this project\n\n* \n\n### Uh oh!\n\nThere was an error while loading. Please reload this page .\n\n* <https://numfocus.org/donate-to-conda-forge>\n\nLearn more about GitHub Sponsors\n\n## [Packages 0](https://github.com/orgs/conda-forge/packages?repo_name=djangorestframework-feedstock)\n\n### Uh oh!\n\nThere was an error while loading. Please reload this page .\n\n### Uh oh!\n\nThere was an error while loading."
