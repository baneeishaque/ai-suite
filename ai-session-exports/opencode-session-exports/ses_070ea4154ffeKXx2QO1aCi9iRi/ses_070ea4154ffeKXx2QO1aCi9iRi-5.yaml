                  "# conda-forge/pillow-feedstock\n\n- Page: GitHub repository\n- URL: https://github.com/conda-forge/pillow-feedstock\n- Description: A conda-smithy repository for pillow\n- Stars: 2\n- Forks: 29\n- License: BSD-3-Clause license\n- Default branch: main\n- Created: 2016-04-20T07:37:35.000Z\n- Commits: 441\n\n## Top-level files\n\n- .azure-pipelines/\n- .ci_support/\n- .circleci/\n- .github/\n- .scripts/\n- recipe/\n- .gitattributes\n- .gitignore\n- .recipe_maintainers.json\n- LICENSE.txt\n- README.md\n- azure-pipelines.yml\n- build-locally.py\n- conda-forge.yml\n\n## README.md\n\n# About pillow-feedstock\n\nFeedstock license: [BSD-3-Clause](https://github.com/conda-forge/pillow-feedstock/blob/main/LICENSE.txt)\n\nHome: <https://pillow.readthedocs.io/>\n\nPackage license: HPND\n\nSummary: Pillow is the friendly PIL fork by Alex Clark and Contributors\n\nDevelopment: <https://github.com/python-pillow/Pillow/>\n\n# Current build status\n\nAzure\n\n|Variant |Status |\n| --- | --- |\n|linux\\_64 |[variant](https://dev.azure.\ncom/conda-forge/feedstock-builds/_build/latest?definitionId=784&branchName=main) |\n|linux\\_aarch64 |[variant](https://dev.azure.com/conda-forge/feedstock-builds/_build/latest?definitionId=784&branchName=main) |\n|linux\\_ppc64le |[variant](https://dev.azure.com/conda-forge/feedstock-builds/_build/latest?definitionId=784&branchName=main) |\n|osx\\_64 |[variant](https://dev.azure.com/conda-forge/feedstock-builds/_build/latest?definitionId=784&branchName=main) |\n|osx\\_arm64 |[variant](https://dev.azure.com/conda-forge/feedstock-builds/_build/latest?definitionId=784&branchName=main) |\n|win\\_64 |[variant](https://dev.azure.com/conda-forge/feedstock-builds/_build/latest?definitionId=784&branchName=main) |\n\n# Current release info\n\n|Name |Downloads |Version |Platforms |\n| --- | --- | --- | --- |\n|[Conda Recipe](https://anaconda.org/conda-forge/pillow) |[Conda Downloads](https://anaconda.org/conda-forge/pillow) |[Conda Version](https://anaconda.\norg/conda-forge/pillow) |[Conda Platforms](https://anaconda.org/conda-forge/pillow) |\n|[Conda Recipe](https://anaconda.org/conda-forge/pillow-tests) |[Conda Downloads](https://anaconda.org/conda-forge/pillow-tests) |[Conda Version](https://anaconda.org/conda-forge/pillow-tests) |[Conda Platforms](https://anaconda.org/conda-forge/pillow-tests) |\n\n# Installing pillow\n\nInstalling `pillow` from the `conda-forge` channel can be achieved by adding `conda-forge` to your channels with:\n\n```\nconda config --add channels conda-forge\nconda config --set channel_priority strict\n```\n\nOnce the `conda-forge` channel has been enabled, `pillow, pillow-tests` can be installed with `conda` :\n\n```\nconda install pillow pillow-tests\n```\n\nor with `mamba` :\n\n```\nmamba install pillow pillow-tests\n```\n\nIt is possible to list all of the versions of `pillow` available on your platform with `conda` :\n\n```\nconda search pillow --channel conda-forge\n```\n\nor with `mamba` :\n\n```\nmamba search pillow --channel conda-forge\n```\n\nAlternatively, `mamba repoquery` may provide more information:\n\n```\n# Search all versions available on your platform:\nmamba repoquery search pillow --channel conda-forge\n\n# List packages depending on `pillow`:\nmamba repoquery whoneeds pillow --channel conda-forge\n\n# List dependencies of `pillow`:\nmamba repoquery depends pillow --channel conda-forge\n```\n\n# About conda-forge\n\n[Powered by NumFOCUS](https://numfocus.org/)\n\nconda-forge is a community-led conda channel of installable packages.\nIn order to provide high-quality builds, the process has been automated into the\nconda-forge GitHub organization. The conda-forge organization contains one repository\nfor each of the installable packages. Such a repository is known as a _feedstock_ .\n\nA feedstock is made up of a conda recipe (the instructions on what and how to build\nthe package) and the necessary configurations for automatic building using freely\navailable continuous integration services.\n\n...\n\n**feedstock** \\- the conda recipe (raw material), supporting scripts and CI configuration.\n\n**conda-smithy** \\- the tool which helps orchestrate the feedstock.\nIts primary use is in the construction of the CI `.yml` files\nand simplify the management of _many_ feedstocks.\n\n**conda-forge** \\- the place where the feedstock and smithy live and work to\nproduce the finished article (built conda distributions)\n\n# Updating pillow-feedstock\n\nIf you would like to improve the pillow recipe or build a new\npackage version, please fork this repository and submit a PR. Upon submission,\nyour changes will be run on the appropriate platforms to give the reviewer an\nopportunity to confirm that the changes result in a successful build. Once\nmerged, the recipe will be re-built and uploaded automatically to the `conda-forge` channel, whereupon the built conda packages will be available for\neverybody to install and use from the `conda-forge` channel.\nNote that all branches in the conda-forge/pillow-feedstock are\nimmediately built and any created packages are uploaded, so PRs should be based\non branches in forks, and branches in the main repository should only be used to\nbuild distinct package versions.\n\nIn order to produce a uniquely identifiable distribution:\n\n* If the version of a package **is not** being increased, please add or increase\n  the [`build/number`](https://docs.conda.io/projects/conda-build/en/latest/resources/define-metadata.html) .\n* If the version of a package **is** being increased, please remember to return\n  the [`build/number`](https://docs.conda.io/projects/conda-build/en/latest/resources/define-metadata.html) back to 0.\n\n# Feedstock Maintainers\n\n* [@h-vetinari](https://github.com/h-vetinari/)\n* [@jakirkham](https://github.com/jakirkham/)\n* [@ocefpaf](https://github.com/ocefpaf/)\n* [@patricksnape](https://github.com/patricksnape/)\n* [@pelson](https://github.com/pelson/)"
