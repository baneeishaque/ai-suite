    time: 7/23/2026, 2:20:18 PM GMT+5:30
    response: |-
      ```rust
      // 1. Entry point — every Rust program starts here
      fn main() {
          // 2. Declare two variables; Rust infers they are integers (i32)
          let a = 10;
          let b = 20;

          // 3. Add them. The `+` operator returns a new value, stored in `sum`
          let sum = a + b;

          // 4. Print the result. `{}` is a placeholder filled by `sum`
          println!("The sum is: {}", sum);
      }
      ```

      **Line by line:**

      1. **`fn main() {`** — Every Rust program needs a `main` function. When you run the program, this is the first code that executes. `fn` declares a function, `main` is the name.

      2. **`let a = 10;`** — `let` creates a variable named `a` and gives it the value `10`. Same for `b = 20`. Rust automatically figures out the type (`i32`, a 32-bit integer) — you don't have to write it.

      3. **`let sum = a + b;`** — `a + b` adds the two values together. The result (30) is stored in a new variable called `sum`.

      4. **`println!("The sum is: {}", sum);`** — `println!` prints text to the terminal. The `{}` acts like a blank — Rust replaces it with the value of `sum`.

      **To run this:**
      - Save it as `add.rs`
      - Compile: `rustc add.rs`
      - Run: `./add` (Linux/macOS) or `add.exe` (Windows)

      The output will be: `The sum is: 30`
