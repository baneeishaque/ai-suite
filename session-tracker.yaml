        - id: L0T8
          title: auto-approve permissions for autonomous AI operation
          desc: Enable auto-pilot mode via TUI command palette (Ctrl+P) or --auto flag so AI works continuously without interruptions; disable when supervision needed
          status: done
          notes:
            - note: "Three ways to enable: (1) CLI --auto flag, (2) TUI command palette Ctrl+P -> 'Enable auto-approve permissions', (3) per-prompt 'always' in ask dialog"
            - note: "CLI: `opencode --auto` or `opencode run --auto 'task'` — deny rules still enforced; shows muted 'auto' indicator next to agent name"
            - note: "TUI toggle: Ctrl+P opens command palette, search 'auto' -> Enable/Disable auto-approve permissions — instant toggle, no restart needed"
            - note: "Per-prompt always: when ask dialog appears, select 'always' to approve matching patterns for rest of session"
            - note: "Disable: Ctrl+P -> 'Disable auto-approve permissions' — returns to normal supervised ask/deny mode"
            - note: "Danger variant: `--dangerously-skip-permissions` bypasses everything including deny — use only in throwaway VMs"
            - note: "Keybinding reference: Ctrl+Alt+K opens Which Key overlay showing all available keybinds"
            - note: "Command palette is ctrl+p in terminal TUI (not Cmd+K — macOS Cmd does not apply in terminal)"
            - note: "Ctrl+K is bound to input_delete_to_line_end (kill to end of line) — not command palette"
            - note: "Auto mode only affects would-ask permissions; explicit deny rules in permission config still enforced"
            - note: "Config at ~/.config/opencode/opencode.json has granular permission rules (bash, edit, read, etc.) with last-match-wins pattern ordering"
          references:
            - paths:
                - path: https://opencode.ai/docs/permissions
                - path: https://opencode.ai/docs/keybinds

