        - id: L0T4
          title: replace json for data transfer
          status: pending
          notes:
            - note: LLM provider APIs (Anthropic, OpenAI, Google, etc.) all use JSON — OpenCode cannot change their protocol; the provider dictates the API format
            - note: binary formats (protobuf/msgpack/flatbuffers) are faster — smaller payloads, zero-copy parse, no text parsing overhead
            - note: for local self-hosted LLMs (Ollama, llama.cpp, vLLM), inference latency dominates (seconds) vs JSON serialization (microseconds) — the gain is ~0.001% of total latency
            - note: worth exploring only if self-hosting multiple small models at high throughput where request volume per second is high enough for parse overhead to matter
            - note: "two implementation approaches — fork inference server to add binary protocol support, or run a local proxy that translates binary to JSON for provider APIs"
          follow_up_tasks:
            - id: L1T1
              title: evaluate fork inference server for binary protocol
              notes:
                - note: modify Ollama / llama.cpp-server / vLLM to accept protobuf or msgpack on a separate port
                - note: OpenCode sends protobuf requests then server deserializes, runs inference, returns protobuf-encoded response
                - note: pros — no extra hop, lowest latency, full control over schema
                - note: cons — must maintain a fork that diverges from upstream, rebase effort on each release, protocol stability burden
                - note: viable only for a dedicated team managing a custom deployment
            - id: L1T2
              title: evaluate build local proxy binary to JSON translator
              notes:
                - note: small local daemon that receives protobuf/msgpack from OpenCode, deserializes, forwards as JSON HTTP to the LLM server, reads JSON response, serializes back to binary
                - note: pros — zero changes to the inference server, works with any existing Ollama/llama.cpp/vLLM setup, easy to deploy as sidecar
                - note: cons - extra network hop adds ~0.1-0.5ms latency per request, both sides still do serialization (binary to JSON to binary), proxy becomes a single point of failure
                - note: can be extended to add caching, rate-limiting, request logging, or model routing in the future
            - id: L1T3
              title: benchmark actual gain before committing
              notes:
                - note: set up self-hosted model via Ollama and a simple proxy measuring round-trip time with JSON vs msgpack/protobuf
                - note: key metrics — request serialization time, response deserialization time, payload size reduction, total RTT for single vs batch requests
                - note: only proceed with L1T1 or L1T2 if benchmark shows meaningful latency improvement for expected throughput

